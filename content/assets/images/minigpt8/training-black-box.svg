<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="One training step from the outside, with real numbers for the first practice snippet. A snippet of 128 letters, starting First Ci, goes into the readable model, drawn as a closed black box that makes a guess for every letter from 826,433 trained numbers and is never opened by training. Out come the chances it gave the right answers. After 3,000 steps: F to i 11.7%, i to r 15.7%, r to s 45.7%, s to t 91.0%; at step 0 they were all between 1 and 1.5 percent; and 124 more questions. Training acts here, outside the box: the surprise score, minus log of each chance, averaged, 4.23 at step 0 and 1.20 after training; the slopes, found by working backwards, one per number; and the nudge, AdamW, which moves each number at most about 0.0003. The changed numbers go back into the box, and the next 32 snippets follow, 3,000 steps in all. Training never looks inside the black box; it reads the guesses that come out, and nudges the numbers stored in it." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="430" fill="#ffffff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">Training, from the outside: one step</text><text x="40" y="50" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Real numbers for the first practice snippet, before training and after 3,000 steps.</text><rect x="40" y="80" width="84" height="130" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="82" y="104" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">a snippet</text><text x="82" y="146" font-size="15" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">First</text><text x="82" y="166" font-size="15" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">Ci…</text><text x="82" y="196" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">128 letters</text><line x1="124" y1="145" x2="138.0" y2="145.0" stroke="#6b7280" stroke-width="1.8"/><path d="M146 145 L138.0 149.5 L138.0 140.5 Z" fill="#6b7280"/><rect x="148" y="80" width="196" height="130" rx="10" fill="#111827" stroke="#111827" stroke-width="1"/><text x="246" y="112" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">the readable model</text><text x="246" y="136" font-size="10" fill="#d1d5db" text-anchor="middle" font-weight="normal">a guess for every letter</text><text x="246" y="156" font-size="10" fill="#d1d5db" text-anchor="middle" font-weight="normal">826,433 trained numbers</text><text x="246" y="188" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-style="italic">never opened by training</text><line x1="344" y1="145" x2="358.0" y2="145.0" stroke="#6b7280" stroke-width="1.8"/><path d="M366 145 L358.0 149.5 L358.0 140.5 Z" fill="#6b7280"/><rect x="368" y="80" width="312" height="130" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="524" y="100" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">the chances it gave the right answers</text><text x="586" y="116" font-size="9" fill="#2563eb" text-anchor="end" font-weight="normal">after 3,000 steps</text><text x="664" y="116" font-size="9" fill="#9ca3af" text-anchor="end" font-weight="normal">at step 0</text><text x="384" y="134" font-size="11" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">F→i</text><rect x="430" y="125" width="11.7" height="10" rx="2" fill="#2563eb"/><text x="586" y="134" font-size="10" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">11.7%</text><text x="664" y="134" font-size="10" fill="#9ca3af" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">1.1%</text><text x="384" y="150" font-size="11" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">i→r</text><rect x="430" y="141" width="15.7" height="10" rx="2" fill="#2563eb"/><text x="586" y="150" font-size="10" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">15.7%</text><text x="664" y="150" font-size="10" fill="#9ca3af" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">1.0%</text><text x="384" y="166" font-size="11" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">r→s</text><rect x="430" y="157" width="45.7" height="10" rx="2" fill="#2563eb"/><text x="586" y="166" font-size="10" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">45.7%</text><text x="664" y="166" font-size="10" fill="#9ca3af" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">1.0%</text><text x="384" y="182" font-size="11" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">s→t</text><rect x="430" y="173" width="91.0" height="10" rx="2" fill="#2563eb"/><text x="586" y="182" font-size="10" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">91.0%</text><text x="664" y="182" font-size="10" fill="#9ca3af" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">1.4%</text><text x="384" y="199" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">… and 124 more questions</text><line x1="626" y1="210" x2="626.0" y2="254.0" stroke="#6b7280" stroke-width="1.8"/><path d="M626 262 L621.5 254.0 L630.5 254.0 Z" fill="#6b7280"/><rect x="322" y="240" width="368" height="140" rx="10" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/><text x="330" y="256" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">training acts here, outside the box</text><rect x="572" y="266" width="108" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="626" y="290" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">surprise</text><text x="626" y="314" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">−log(chance),</text><text x="626" y="328" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">averaged</text><text x="626" y="350" font-size="9" fill="#9ca3af" text-anchor="middle" font-weight="normal">4.23 at step 0,</text><text x="626" y="362" font-size="9" fill="#9ca3af" text-anchor="middle" font-weight="normal">1.20 after training</text><line x1="572" y1="318" x2="570.0" y2="318.0" stroke="#6b7280" stroke-width="1.8"/><path d="M562 318 L570.0 313.5 L570.0 322.5 Z" fill="#6b7280"/><rect x="452" y="266" width="108" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="506" y="290" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">the slopes</text><text x="506" y="314" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">work backwards:</text><text x="506" y="328" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">one per number</text><text x="506" y="356" font-size="9" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">backward()</text><line x1="452" y1="318" x2="450.0" y2="318.0" stroke="#6b7280" stroke-width="1.8"/><path d="M442 318 L450.0 313.5 L450.0 322.5 Z" fill="#6b7280"/><rect x="332" y="266" width="108" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="386" y="290" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">the nudge</text><text x="386" y="314" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">each number moves</text><text x="386" y="328" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">at most ~0.0003</text><text x="386" y="356" font-size="9" fill="#9ca3af" text-anchor="middle" font-weight="normal">AdamW</text><path d="M332 318 L246 318 L246 218" fill="none" stroke="#2563eb" stroke-width="1.8"/><path d="M246 210 L241.5 219 L250.5 219 Z" fill="#2563eb"/><text x="240" y="300" font-size="10" fill="#2563eb" text-anchor="end" font-weight="600">the changed numbers</text><text x="240" y="314" font-size="10" fill="#2563eb" text-anchor="end" font-weight="600">go back in</text><text x="40" y="354" font-size="11" fill="#374151" text-anchor="start" font-weight="normal">Then the next 32 snippets:</text><text x="40" y="370" font-size="11" fill="#374151" text-anchor="start" font-weight="normal">3,000 steps in all</text><text x="40" y="410" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">Training never looks inside the black box. It reads the guesses that come out, and nudges the numbers stored in it.</text></svg>
