ly="ui-monospace, Menlo, Consolas, monospace">␣</text><rect x="300.0" y="126" width="34" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="317.0" y="144" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">C</text><rect x="340.0" y="90" width="34" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="357.0" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">C</text><rect x="340.0" y="126" width="34" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="357.0" y="144" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">i</text><rect x="380.0" y="90" width="34" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="397.0" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">i</text><rect x="380.0" y="126" width="34" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="397.0" y="144" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">t</text><text x="420.0" y="125" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal">…</text><text x="220.0" y="168" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">the answers are the same text, one letter further on</text><line x1="220.0" y1="176" x2="220.0" y2="193" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 200 L215.0 192 L225.0 192 Z" fill="#6b7280"/><rect x="60" y="204" width="320" height="66" rx="10" fill="#374151" stroke="#111827" stroke-width="1"/><text x="220.0" y="230" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">The readable model: a black box</text><text x="220.0" y="250" font-size="12" fill="#e5e7eb" text-anchor="middle" font-weight="normal">826,433 numbers, all random at first</text><line x1="220.0" y1="272" x2="220.0" y2="289" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 296 L215.0 288 L225.0 288 Z" fill="#6b7280"/><text x="20" y="312" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Chances it gave the right answers</text><text x="90.0" y="335" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">step 0</text><text x="90.0" y="355" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">step 3,000</text><text x="117.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">1%</text><text x="117.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">12%</text><text x="157.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">1%</text><text x="157.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">16%</text><text x="197.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">1%</text><text x="197.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">46%</text><text x="237.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">1%</text><text x="237.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">91%</text><text x="277.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">2%</text><text x="277.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">63%</text><text x="317.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">2%</text><text x="317.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">1%</text><text x="357.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">1%</text><text x="357.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">6%</text><text x="397.0" y="335" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal">1%</text><text x="397.0" y="355" font-size="11" fill="#111827" text-anchor="middle" font-weight="bold">88%</text><line x1="220.0" y1="366" x2="220.0" y2="383" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 390 L215.0 382 L225.0 382 Z" fill="#6b7280"/><rect x="14" y="394" width="412" height="62" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/><text x="28" y="416" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">The surprise score: −log(chance), averaged</text><text x="28" y="436" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">for this snippet: 4.23 at step 0, 1.20 at 3,000</text><line x1="220.0" y1="458" x2="220.0" y2="475" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 482 L215.0 474 L225.0 474 Z" fill="#6b7280"/><rect x="14" y="486" width="412" height="62" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="28" y="508" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">The slopes: PyTorch works backwards</text><text x="28" y="528" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">one slope for each of the 826,433 numbers</text><line x1="220.0" y1="550" x2="220.0" y2="567" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 574 L215.0 566 L225.0 566 Z" fill="#6b7280"/><rect x="14" y="578" width="412" height="62" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="28" y="600" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">The nudge (AdamW)</text><text x="28" y="620" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">every number moves at most about 0.0003, against its slope</text><path d="M426 609 L434 609 L434 237.0 L388 237.0" fill="none" stroke="#2563eb" stroke-width="1.8"/><path d="M380 237.0 L389 232.0 L389 242.0 Z" fill="#2563eb"/><text x="220.0" y="666" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">Then the next 32 snippets: 3,000 steps in all</text></svg>
