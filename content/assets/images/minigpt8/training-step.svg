<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 682" role="img" aria-label="One training step: 32 snippets of practice text go into the model, which is treated as a black box; it gives chances for what comes after every letter; the chances of the right answers become one surprise score; PyTorch works backwards to a slope for each of the 826,433 numbers; AdamW nudges every number a little; and the step repeats 3,000 times." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="440" height="682" fill="#ffffff"/><text x="220.0" y="26" font-size="16" fill="#111827" text-anchor="middle" font-weight="bold">One training step</text><text x="20" y="60" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Pick 32 snippets of practice text</text><text x="20" y="77" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">every letter is a question: what comes next?</text><text x="90.0" y="107" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">letters</text><text x="90.0" y="143" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal">answers</text><rect x="100.0" y="90" width="34" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="117.0" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">F</text><rect x="100.0" y="126" width="34" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/><text x="117.0" y="144" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">i</text><rect x="140.0" y="90" width="34" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/><text x="157.0" y="108" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">i</text><rect x="140.0" y="126" width=