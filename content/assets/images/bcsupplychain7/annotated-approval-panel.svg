<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 778" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The approval panel version, line by line. If there is no approval service the tool fails closed and posts nothing. The request carries the tool call id so the panel attaches to the call already shown in the chat. The reason is plain text, and the harness logs it as approval asked. A rejection and a missing channel give the AI different messages. Allowed once is the only yes; everything else is no."><rect width="690" height="778" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">The same question through the harness's own approval panel</text><text x="24" y="52" font-size="12" fill="#6b7280">From bc-posting/index.js, trimmed. Used when approvalMode is native</text><rect x="16" y="66" width="658" height="696" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="90" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">const approval = ctx.get('approval')</text><text x="30" y="116" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">if (approval === undefined)</text><path d="M57.7 121 L210.2 121" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M63.7 138 L63.7 132" stroke="#c2410c" stroke-width="1.6"/><path d="M63.7 124 L67.4 132.2 L60.0 132.2 Z" fill="#c2410c"/><text x="57.7" y="153" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">fails closed: no approval service,</text><text x="57.7" y="172" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">no posting</text><text x="30" y="206" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  return { status: 'refused', reason: 'no approval channel, so nothing was posted' }</text><text x="30" y="232" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"></text><text x="30" y="258" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">const outcome = await approval.request({</text><text x="30" y="284" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  agent: exec.agent, toolName: 'request_posting', callId: exec.callId,</text><path d="M376.5 289 L508.2 289" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M382.5 306 L382.5 300" stroke="#c2410c" stroke-width="1.6"/><path d="M382.5 292 L386.2 300.2 L378.8 300.2 Z" fill="#c2410c"/><text x="376.5" y="321" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">ties the panel to the tool call</text><text x="376.5" y="340" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">already shown in the chat</text><text x="30" y="374" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  reason: buildReason(chk), signal: exec.signal })</text><path d="M43.9 379 L210.2 379" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M49.9 396 L49.9 390" stroke="#c2410c" stroke-width="1.6"/><path d="M49.9 382 L53.6 390.2 L46.2 390.2 Z" fill="#c2410c"/><text x="43.9" y="411" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">plain text only. The harness logs</text><text x="43.9" y="430" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">this text as approval/asked</text><text x="30" y="464" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"></text><text x="30" y="490" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">if (outcome === 'rejected')</text><path d="M57.7 495 L210.2 495" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M63.7 512 L63.7 506" stroke="#c2410c" stroke-width="1.6"/><path d="M63.7 498 L67.4 506.2 L60.0 506.2 Z" fill="#c2410c"/><text x="57.7" y="527" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">a person's no and a missing channel</text><text x="57.7" y="546" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">give the AI different messages</text><text x="30" y="580" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  return { status: 'not-posted', reason: 'the person rejected it' }</text><text x="30" y="606" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">if (outcome !== 'allowed-once')</text><path d="M147.8 611 L231.0 611" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M153.8 628 L153.8 622" stroke="#c2410c" stroke-width="1.6"/><path d="M153.8 614 L157.5 622.2 L150.1 622.2 Z" fill="#c2410c"/><text x="147.8" y="643" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the only yes the harness has.</text><text x="147.8" y="662" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">Everything else is no</text><text x="30" y="696" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  return { status: 'refused', reason: 'nothing was posted' }</text><text x="30" y="722" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">return doPost(cfg, chk, orderNumber)</text></svg>