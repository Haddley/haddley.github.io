<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" font-family="Arial, Helvetica, sans-serif"><title>Animated diagram: the path of one order through the checking screen: draft, checks, approval panel, posted, then verified</title><style>.a{animation-duration:16.0s;animation-iteration-count:infinite;animation-timing-function:linear;opacity:0}@keyframes st{0%{opacity:0}2%{opacity:1}18.00%{opacity:1}20.00%{opacity:0}100%{opacity:0}}.a{animation-name:st}.d0{animation-delay:0.0s}.d1{animation-delay:3.2s}.d2{animation-delay:6.4s}.d3{animation-delay:9.600000000000001s}.d4{animation-delay:12.8s}.flow{stroke-dasharray:7 7}.stat{display:none}@media (prefers-reduced-motion:reduce){.a{animation:none!important;opacity:1}.cap{display:none}.stat{display:block}}</style><rect width="960" height="420" rx="20" fill="#0f1b2d"/><rect x="40" y="90" width="160" height="86" rx="10" fill="#16273d" stroke="#5bb4ea" stroke-width="2"/><text x="120.0" y="131.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Draft</text><text x="120.0" y="149.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">made by the AI</text><rect x="215" y="90" width="160" height="86" rx="10" fill="#16273d" stroke="#fbbf24" stroke-width="2"/><text x="295.0" y="131.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Checks</text><text x="295.0" y="149.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">rules in code</text><rect x="390" y="90" width="160" height="86" rx="10" fill="#16273d" stroke="#fbbf24" stroke-width="2"/><text x="470.0" y="131.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Decision</text><text x="470.0" y="149.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">Approval panel</text><rect x="565" y="90" width="160" height="86" rx="10" fill="#16273d" stroke="#4ade80" stroke-width="2"/><text x="645.0" y="131.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Posted</text><text x="645.0" y="149.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">ship and invoice</text><rect x="740" y="90" width="160" height="86" rx="10" fill="#16273d" stroke="#4ade80" stroke-width="2"/><text x="820.0" y="131.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Verified</text><text x="820.0" y="149.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">stock and balance</text><line x1="200" y1="133" x2="215" y2="133" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="375" y1="133" x2="390" y2="133" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="550" y1="133" x2="565" y2="133" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="725" y1="133" x2="740" y2="133" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line class="a d0 flow" x1="200" y1="133" x2="215" y2="133" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><line class="a d1 flow" x1="375" y1="133" x2="390" y2="133" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><line class="a d2 flow" x1="550" y1="133" x2="565" y2="133" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><line class="a d4 flow" x1="725" y1="133" x2="740" y2="133" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d2"><path d="M262 205 l8 9 l16 -18" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="296" y="215" font-size="13" fill="#e6eef7">value</text><path d="M262 232 l8 9 l16 -18" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="296" y="242" font-size="13" fill="#e6eef7">price</text></g><g class="a d3"><rect x="400" y="205" width="140" height="44" rx="8" fill="#16273d" stroke="#fbbf24" stroke-width="2"/><text x="470" y="233" text-anchor="middle" font-size="15" fill="#e6eef7">Code  ● ● ● ●</text></g><g class="a d4"><path d="M780 205 l8 9 l16 -18" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="215" font-size="13" fill="#e6eef7">stock</text><path d="M780 232 l8 9 l16 -18" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="242" font-size="13" fill="#e6eef7">balance</text></g><g class="a d3"><rect x="230" y="260" width="200" height="30" rx="8" fill="none" stroke="#f87171" stroke-width="2"/><text x="330" y="280" text-anchor="middle" font-size="12.5" fill="#f87171">a rule fails: no panel at all</text></g><g class="cap a d0"><text x="480" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">1. The AI prepares a draft</text><text x="480" y="361" text-anchor="middle" font-size="14" fill="#9db0c3">It can create and change drafts. It cannot post.</text></g><g class="cap a d1"><text x="480" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">2. The checker reads the draft afresh</text><text x="480" y="361" text-anchor="middle" font-size="14" fill="#9db0c3">Straight from Business Central, so nothing can be hidden from it.</text></g><g class="cap a d2"><text x="480" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">3. It runs every check in code</text><text x="480" y="361" text-anchor="middle" font-size="14" fill="#9db0c3">Order value, price against list, stock, credit, dates, daily totals. No AI in here.</text></g><g class="cap a d3"><text x="480" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">4. If one fails: no panel</text><text x="480" y="361" text-anchor="middle" font-size="14" fill="#9db0c3">If all pass: a person allows once in the panel.</text></g><g class="cap a d4"><text x="480" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">5. It ships and invoices, then checks</text><text x="480" y="361" text-anchor="middle" font-size="14" fill="#9db0c3">Stock fell by the quantity? The customer balance rose by the total? Recorded in the log.</text></g><g class="stat"><text x="40" y="320" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">1. The AI prepares a draft</tspan><tspan fill="#9db0c3"> It can create and change drafts. It cannot post.</tspan></text><text x="40" y="337" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">2. The checker reads the draft afresh</tspan><tspan fill="#9db0c3"> Straight from Business Central, so nothing can be hidden from it.</tspan></text><text x="40" y="354" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">3. It runs every check in code</tspan><tspan fill="#9db0c3"> Order value, price against list, stock, credit, dates, daily totals. No AI in here.</tspan></text><text x="40" y="371" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">4. If one fails: no panel</tspan><tspan fill="#9db0c3"> If all pass: a person allows once in the panel.</tspan></text><text x="40" y="388" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">5. It ships and invoices, then checks</tspan><tspan fill="#9db0c3"> Stock fell by the quantity? The customer balance rose by the total? Recorded in the log.</tspan></text></g></svg>