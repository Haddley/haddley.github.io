<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 946" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The request_posting tool, line by line. The name, description and one argument are what the AI sees. The only thing the AI controls is the order number. The render function is what the AI reads back, the tool result as JSON. presentationMeta saves data with the call so the person card can be rebuilt on replay, and presentResult is what the person sees when the call finishes. The execute body is one function that checks, asks and posts."><rect width="690" height="946" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">Registering the tool: request_posting</text><text x="24" y="52" font-size="12" fill="#6b7280">From bc-posting/index.js. Long strings shortened; the notes are mine</text><rect x="16" y="66" width="658" height="864" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="90" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">ctx.tools.register(defineTool({</text><text x="30" y="116" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  name: 'request_posting',</text><path d="M43.9 121 L203.2 121" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M49.9 138 L49.9 132" stroke="#c2410c" stroke-width="1.6"/><path d="M49.9 124 L53.6 132.2 L46.2 132.2 Z" fill="#c2410c"/><text x="43.9" y="153" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">what the AI sees: a name, a plain</text><text x="43.9" y="172" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">description, and one argument</text><text x="30" y="206" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  description: 'Ask a person to approve posting ONE draft sales order. If a rule fails you</text><text x="30" y="232" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    get the reasons back. You can never post by any other route.',</text><text x="30" y="258" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  parameters: { orderNumber: { type: 'string', required: true } },</text><path d="M140.9 263 L217.1 263" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M146.9 280 L146.9 274" stroke="#c2410c" stroke-width="1.6"/><path d="M146.9 266 L150.6 274.2 L143.2 274.2 Z" fill="#c2410c"/><text x="140.9" y="295" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the only thing the AI controls:</text><text x="140.9" y="314" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">an order number, nothing else</text><text x="30" y="348" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  output: {</text><text x="30" y="374" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    render: (_args, value) =&gt; [{ type: 'text', text: JSON.stringify(value) }],</text><path d="M397.3 379 L542.8 379" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M403.3 396 L403.3 390" stroke="#c2410c" stroke-width="1.6"/><path d="M403.3 382 L407.0 390.2 L399.6 390.2 Z" fill="#c2410c"/><text x="397.3" y="411" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">what the AI reads:</text><text x="397.3" y="430" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the tool's result, as JSON</text><text x="30" y="464" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    presentationMeta: (_args, v) =&gt; ({ status: v.status, explanation: v.explanation }),</text><path d="M57.7 469 L168.6 469" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M63.7 486 L63.7 480" stroke="#c2410c" stroke-width="1.6"/><path d="M63.7 472 L67.4 480.2 L60.0 480.2 Z" fill="#c2410c"/><text x="57.7" y="501" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">data saved with the call, so the</text><text x="57.7" y="520" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">person's card can be rebuilt on replay</text><text x="30" y="554" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  },</text><text x="30" y="580" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  presentResult(_args, result) {</text><path d="M43.9 585 L133.9 585" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M49.9 602 L49.9 596" stroke="#c2410c" stroke-width="1.6"/><path d="M49.9 588 L53.6 596.2 L46.2 596.2 Z" fill="#c2410c"/><text x="43.9" y="617" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">what the PERSON sees when the call</text><text x="43.9" y="636" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">finishes: a card, not the JSON</text><text x="30" y="670" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    if (result.meta?.status === 'blocked')</text><text x="30" y="696" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      return { card: 'generic', title: 'Not posted: blocked', content: [...] }</text><text x="30" y="722" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  },</text><text x="30" y="748" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  async execute(args, exec) {</text><text x="30" y="774" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    return reviewApproveAndPost(ctx, cfg, exec, String(args.orderNumber).trim())</text><path d="M106.2 779 L244.8 779" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M112.2 796 L112.2 790" stroke="#c2410c" stroke-width="1.6"/><path d="M112.2 782 L115.9 790.2 L108.5 790.2 Z" fill="#c2410c"/><text x="106.2" y="811" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the body: one function checks,</text><text x="106.2" y="830" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">asks and posts. Nothing else can post</text><text x="30" y="864" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  },</text><text x="30" y="890" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">}))</text></svg>