<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A draft moves toward the gate, the gate lifts, and the posted document turns green</title>
<style>.a{animation-duration:4.5s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out}
.dr{animation-name:dr}.gt{animation-name:gt}.ok{animation-name:ok;transform-box:fill-box;transform-origin:center}
@keyframes dr{0%{transform:translateX(0)}35%,100%{transform:translateX(0)}}
@keyframes gt{0%,30%{transform:translateY(0)}55%,80%{transform:translateY(-26px)}100%{transform:translateY(-26px)}}
@keyframes ok{0%,60%{opacity:.25;transform:scale(.9)}80%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style>
<rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="10" y="40" width="28" height="38" rx="4" fill="#e0f2fe"/><g fill="#7dd3fc"><rect x="15" y="48" width="18" height="3" rx="1.5"/><rect x="15" y="55" width="14" height="3" rx="1.5"/><rect x="15" y="62" width="16" height="3" rx="1.5"/></g>
<g class="a ok"><rect x="82" y="40" width="28" height="38" rx="4" fill="#16a34a"/><g fill="#fff"><rect x="87" y="48" width="18" height="3" rx="1.5"/><rect x="87" y="55" width="14" height="3" rx="1.5"/><rect x="87" y="62" width="16" height="3" rx="1.5"/></g></g>
<g class="a gt"><rect x="50" y="34" width="20" height="52" rx="4" fill="#fbbf24"/><rect x="53" y="52" width="14" height="12" rx="2" fill="#0f1b2d"/><path d="M55 52 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#0f1b2d" stroke-width="2.5"/></g>
<path d="M40 59 h8 M72 59 h8" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/></svg>
