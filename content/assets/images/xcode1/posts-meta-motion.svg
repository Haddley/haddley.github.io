<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A first C++ hello world command line project in Xcode</title><style>@keyframes fade{0%{opacity:0}17.5%,50%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}30%,50%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}17.5%,50%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><g><rect x="8" y="18" width="104" height="70" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><path d="M15,26 l5,4 l-5,4" stroke="#2f9e4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:0.5s"><text x="60" y="46" text-anchor="middle" font-size="10" fill="#2f9e4a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">Hello, World!</text></g>
<path class="d" style="animation-delay:1.2s" pathLength="1" d="M22,66 H70" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.0s"><g><rect x="66" y="94" width="40" height="12" rx="4" fill="#5bb4ea"/><text x="86" y="103" text-anchor="middle" font-size="8" fill="#0f1b2d" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">C++</text></g></g>
</svg>
