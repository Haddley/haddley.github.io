<g class="p" style="animation-delay:0.4s"><g><rect x="92" y="60" width="22" height="38" rx="7" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><path d="M99.0,65 H107.0" stroke="#5bb4ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:1.0s"><g><rect x="42" y="14" width="36" height="24" rx="5" fill="#1c2a3d" stroke="#ffb43a" stroke-width="1.5"/><text x="60" y="31" text-anchor="middle" font-size="8" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">STUN</text></g></g>
<path class="d" style="animation-delay:1.6s" pathLength="1" d="M20,58 L48,38 M100,58 L72,38" stroke="#ffb43a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:2.4s" pathLength="1" d="M30,82 H90" stroke="#2f9e4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:3.0s"><g><rect x="44" y="70" width="32" height="12" rx="6" fill="#2f9e4a"/><text x="60" y="79" text-anchor="middle" font-size="7.5" fill="#fff" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">P2P</text></g></g>
</svg>
