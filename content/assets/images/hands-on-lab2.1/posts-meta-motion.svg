<g><rect class="f" style="animation-delay:0s" x="26" y="34" width="52" height="62" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.6s" fill="#5bb4ea"><rect x="34" y="44" width="10" height="9" rx="1.5"/><rect x="52" y="44" width="10" height="9" rx="1.5"/><rect x="34" y="60" width="10" height="9" rx="1.5"/><rect x="52" y="60" width="10" height="9" rx="1.5"/></g>
<rect class="p" style="animation-delay:1.2s" x="45" y="78" width="12" height="18" rx="2" fill="#ffb43a"/>
<g><path class="p" style="animation-delay:1.9s" d="M26,34 L52,18 L78,34" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5" stroke-linejoin="round"/></g>
<g><circle class="p" style="animation-delay:2.7s" cx="88" cy="34" r="12" fill="#2f9e4a"/><path d="M82.0,34 H94.0 M88,28.0 V40.0" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
