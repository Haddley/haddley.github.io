<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Creating and configuring a new company</title><style>@keyframes fade{0%{opacity:0}15.91%,45.45%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}27.27%,45.45%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15.91%,45.45%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.7s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.7s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.7s ease-out both infinite alternate}
