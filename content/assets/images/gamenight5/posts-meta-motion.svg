<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Testing a project with no build step and checking that the game is fun</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="16" width="56" height="88" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.4s"><text x="36" y="36" text-anchor="middle" font-size="12" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">&lt;/&gt;</text></g>
<path class="d" style="animation-delay:1.0s" pathLength="1" d="M16,52 H56 M16,64 H50 M16,76 H56" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.6s"><g><circle cx="80" cy="40" r="7" fill="#2f9e4a"/><path d="M76.85,40 L79.3,42.8 L83.5,37.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:2.1s"><g><circle cx="80" cy="60" r="7" fill="#2f9e4a"/><path d="M76.85,60 L79.3,62.8 L83.5,57.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:2.6s"><g><circle cx="80" cy="80" r="7" fill="#2f9e4a"/><path d="M76.85,80 L79.3,82.8 L83.5,77.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:3.1s"><g><circle cx="98" cy="96" r="10" fill="#ffb43a"/><circle cx="94" cy="93" r="1.8" fill="#0f1b2d"/><circle cx="102" cy="93" r="1.8" fill="#0f1b2d"/><path d="M92,98 q6,6 12,0" stroke="#0f1b2d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
