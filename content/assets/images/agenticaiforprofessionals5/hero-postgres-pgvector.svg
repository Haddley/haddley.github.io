<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><style>@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}@keyframes shine{0%,52%{transform:translateX(-80px)}100%{transform:translateX(200px)}}.tw{animation:tw 3.4s ease-in-out infinite}.shine{animation:shine 9s ease-in-out infinite;animation-delay:-8s}@media (prefers-reduced-motion: reduce){.tw,.shine{animation:none}.shine-g{display:none}}</style><defs><clipPath id="tile-clip"><rect width="120" height="120" rx="22"/></clipPath><linearGradient id="tile-shine" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <!-- Background circle -->
  <rect width="120" height="120" rx="22" fill="#1a2b4b"/>

  <!-- Database cylinder -->
  <ellipse cx="60" cy="38" rx="28" ry="9" fill="#80deea" opacity="0.95"/>
  <path d="M32 38 L32 82 A28 9 0 0 0 88 82 L88 38" fill="none" stroke="#80deea" stroke-width="3" opacity="0.85"/>
  <ellipse cx="60" cy="60" rx="28" ry="9" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>
  <ellipse cx="60" cy="82" rx="28" ry="9" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.6"/>

  <!-- Embedding vector dots scattered inside the cylinder -->
  <g class="tw" style="animation-delay:1.55s"><circle cx="48" cy="50" r="3" fill="#ffffff" opacity="0.9"/></g>
  <g class="tw" style="animation-delay:1.98s"><circle cx="66" cy="46" r="2.4" fill="#ffffff" opacity="0.75"/></g>
  <g class="tw" style="animation-delay:2.41s"><circle cx="56" cy="60" r="2.8" fill="#ffffff" opacity="0.85"/></g>
  <g class="tw" style="animation-delay:2.84s"><circle cx="72" cy="62" r="2.4" fill="#ffffff" opacity="0.7"/></g>
  <g class="tw" style="animation-delay:3.27s"><circle cx="44" cy="68" r="2.6" fill="#ffffff" opacity="0.8"/></g>
  <g class="tw" style="animation-delay:0.30s"><circle cx="64" cy="74" r="2.4" fill="#ffffff" opacity="0.75"/></g>

  <!-- Nearest-neighbour connections -->
  <line x1="48" y1="50" x2="56" y2="60" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="56" y1="60" x2="66" y2="46" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <line x1="56" y1="60" x2="44" y2="68" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="56" y1="60" x2="64" y2="74" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <line x1="64" y1="74" x2="72" y2="62" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
<g class="shine-g" clip-path="url(#tile-clip)"><g transform="rotate(20 60 60)"><rect class="shine" x="0" y="-30" width="38" height="180" fill="url(#tile-shine)"/></g></g></svg>