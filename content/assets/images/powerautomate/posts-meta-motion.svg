<path class="d" style="animation-delay:0.9s" pathLength="1" d="M42,54 H56 M52,50.5 L56,54 L52,57.5" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.5s"><g><circle cx="66" cy="54" r="10" fill="#ffb43a"/><path d="M68,47 L62,55 H67 L64,62 L71,53 H66 Z" fill="#0f1b2d"/></g></g>
<path class="d" style="animation-delay:2.2s" pathLength="1" d="M78,54 H90 M86,50.5 L90,54 L86,57.5" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.8s"><g><g><circle cx="96" cy="44" r="6" fill="#5bb4ea"/><path d="M86,64 a10,9 0 0 1 20,0 z" fill="#5bb4ea"/></g><g><circle cx="104" cy="48" r="6" fill="#2f9e4a"/><path d="M94,68 a10,9 0 0 1 20,0 z" fill="#2f9e4a"/></g></g></g>
</svg>
