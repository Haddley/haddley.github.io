<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A purchase invoice paid with a check from a payment journal</title><style>@keyframes fade{0%{opacity:0}15.31%,43.75%,100%{opacity:1}}
