<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Copilot on top, calling a Fabric data agent, which reads the data: a chain of three layers with a tick</title><style>.d{animation:df 6s ease-in-out infinite}.l1{opacity:0;animation:l1f 6s ease-out infinite}.a{opacity:0;animation:af 6s ease-out infinite}.l2{opacity:0;animation:l2f 6s ease-out infinite}.b{opacity:0;animation:bf 6s ease-out infinite}.t{opacity:0;animation:tf 6s ease-out infinite}@keyframes df{0%,100%{opacity:.85}50%{opacity:1}}@keyframes l1f{0%,15%{opacity:0}28%,100%{opacity:1}}@keyframes af{0%,28%{opacity:0}42%,100%{opacity:1}}@keyframes l2f{0%,42%{opacity:0}52%,100%{opacity:1}}@keyframes bf{0%,52%{opacity:0}64%,100%{opacity:1}}@keyframes tf{0%,72%{opacity:0}84%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.d{animation:none}.l1,.a,.l2,.b,.t{animation:none;opacity:1}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="d"><rect x="26" y="82" width="68" height="22" rx="7" fill="#38bdf8"/><g stroke="#0f1b2d" stroke-width="1.6" opacity=".6"><path d="M26 93 h68 M49 82 v22 M72 82 v22"/></g></g><g class="l1"><rect x="57" y="70" width="6" height="12" fill="#9db0c3"/></g><g class="a"><rect x="26" y="48" width="68" height="22" rx="7" fill="#a78bfa"/><g fill="#0f1b2d"><circle cx="48" cy="58" r="3"/><circle cx="72" cy="58" r="3"/></g><path d="M52 64 h16" stroke="#0f1b2d" stroke-width="2.6" stroke-linecap="round"/></g><g class="l2"><rect x="57" y="36" width="6" height="12" fill="#9db0c3"/></g><g class="b"><rect x="26" y="14" width="68" height="22" rx="7" fill="#fb923c"/><g stroke="#0f1b2d" stroke-width="2.6" stroke-linecap="round"><path d="M36 21 h40 M36 28 h28"/></g></g><g class="t"><circle cx="98" cy="16" r="9" fill="#16a34a"/><path d="M93.5 16 l3 3 l5 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>