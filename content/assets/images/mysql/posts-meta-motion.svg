<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Node.js connecting to a MySQL database</title><style>@keyframes fade{0%{opacity:0}16.55%,47.3%,100%{opacity:1}}
