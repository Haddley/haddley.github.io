<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A deposition transcript turned into a page and line summary table</title><style>@keyframes fade{0%{opacity:0}15.91%,45.45%,100%{opacity:1}}
