<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A llama.cpp model called from Python in a chat app</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="6" y="34" width="36" height="40" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><text x="24" y="60" text-anchor="middle" font-size="11" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">py</text></g></g>
<path class="d" style="animation-delay:0.8s" pathLength="1" d="M44,54 H56 M52,50.5 L56,54 L52,57.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.4s"><g><path d="M60,38 L78,32 L96,38 V62 L78,70 L60,62 Z" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><path d="M60,38 L78,46 L96,38 M78,46 V70" stroke="#5bb4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:2.4s"><g><rect x="14" y="80" width="50" height="20" rx="6" fill="#2f9e4a"/><path d="M22,99 l-6,8 l10,-2 z" fill="#2f9e4a"/></g></g>
<path class="d" style="animation-delay:2.9s" pathLength="1" d="M22,90 H56" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
