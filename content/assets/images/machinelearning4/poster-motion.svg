<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A notebook whose cells run one after another with ticks, beside a GPU chip: Colab</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="20" y="20" width="80" height="80" rx="8" fill="#e0f2fe"/><rect x="28" y="28" width="46" height="16" rx="3" fill="#bae6fd"/><circle cx="36" cy="36" r="5" fill="#0f1b2d"/><path d="M34.5 33.5 l5 2.5 l-5 2.5z" fill="#e0f2fe"/><g class="p" style="animation-delay:0.5s"><circle cx="86" cy="36" r="7" fill="#16a34a"/><path d="M82.5 36 l2.5 3 l4.5 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="28" y="52" width="46" height="16" rx="3" fill="#bae6fd"/><circle cx="36" cy="60" r="5" fill="#0f1b2d"/><path d="M34.5 57.5 l5 2.5 l-5 2.5z" fill="#e0f2fe"/><g class="p" style="animation-delay:1.2s"><circle cx="86" cy="60" r="7" fill="#16a34a"/><path d="M82.5 60 l2.5 3 l4.5 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="28" y="76" width="46" height="16" rx="3" fill="#bae6fd"/><circle cx="36" cy="84" r="5" fill="#0f1b2d"/><path d="M34.5 81.5 l5 2.5 l-5 2.5z" fill="#e0f2fe"/><g class="p" style="animation-delay:1.9s"><circle cx="86" cy="84" r="7" fill="#16a34a"/><path d="M82.5 84 l2.5 3 l4.5 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(78 82)"><rect width="30" height="22" rx="4" fill="#fbbf24"/><rect x="8" y="6" width="14" height="10" rx="2" fill="#0f1b2d"/></g></svg>