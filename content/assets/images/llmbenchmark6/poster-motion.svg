<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Two bars: the model alone is taller than the same model given notes</title><style>@keyframes g1{0%,10%{transform:scaleY(0)}34%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}@keyframes g2{0%,40%{transform:scaleY(0)}56%{transform:scaleY(1.12)}68%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}@keyframes cd{0%,30%{opacity:0;transform:translateY(-8px)}44%,88%{opacity:1;transform:none}100%{opacity:0}}.b1,.b2{transform-box:fill-box;transform-origin:bottom}.b1{animation:g1 6s ease-out infinite}.b2{animation:g2 6s ease-out infinite}.cd{animation:cd 6s ease-out infinite}@media (prefers-reduced-motion: reduce){.b1,.b2,.cd{animation:none}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect class="b1" x="22" y="38" width="30" height="66" rx="4" fill="#5bb4ea"/><rect class="b2" x="66" y="50" width="30" height="54" rx="4" fill="#f59e0b"/><g class="cd"><rect x="64" y="26" width="28" height="12" rx="3" fill="#16304f" stroke="#f59e0b" stroke-width="1.5"/><rect x="68" y="30" width="20" height="4" rx="2" fill="#f59e0b" opacity=".8"/><rect x="72" y="22" width="28" height="12" rx="3" fill="#16304f" stroke="#f59e0b" stroke-width="1.5" opacity=".7"/></g><rect x="14" y="106" width="92" height="3" rx="1.5" fill="#5bb4ea" opacity=".6"/></svg>