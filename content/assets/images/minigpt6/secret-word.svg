<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The secret-word test. Right answers against how far back the word was. The 256-position row is right every time at 100 and 200 pieces back, and right only about 1 time in 24 beyond 256. Full attention over 1,024 positions is right every time, even 970 pieces back. The 1,024-position row with a 256-position window behaves like the 256-position row: right every time inside its window, and only by chance beyond it."><rect width="720" height="450" fill="#fff"/><text x="24.0" y="30.0" font-size="15" fill="#111827" text-anchor="start" font-weight="600">How far back can each machine find the secret word?</text><text x="24.0" y="50.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Right answers out of 400, at each distance. Real results; chance is 1 in 24</text><rect x="70" y="80" width="158.7" height="250" fill="#f0f9ff"/><text x="149.4" y="300.0" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="600">within 256</text><text x="149.4" y="314.0" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="600">pieces back</text><line x1="70" y1="330.0" x2="690" y2="330.0" stroke="#e5e7eb"/><text x="62.0" y="334.0" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="normal">0%</text><line x1="70" y1="267.5" x2="690" y2="267.5" stroke="#e5e7eb"/><text x="62.0" y="271.5" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="normal">25%</text><line x1="70" y1="205.0" x2="690" y2="205.0" stroke="#e5e7eb"/><text x="62.0" y="209.0" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="normal">50%</text><line x1="70" y1="142.5" x2="690" y2="142.5" stroke="#e5e7eb"/><text x="62.0" y="146.5" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="normal">75%</text><line x1="70" y1="80.0" x2="690" y2="80.0" stroke="#e5e7eb"/><text x="62.0" y="84.0" font-size="10.5" fill="#6b7280" text-anchor="end" font-weight="normal">100%</text><text x="70.0" y="348.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0</text><text x="228.7" y="348.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">256</text><text x="380.0" y="348.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">500</text><text x="535.0" y="348.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">750</text><text x="690.0" y="348.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">1,000</text><text x="380.0" y="366.0" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">how many pieces back the secret word was</text><line x1="70" y1="319.6" x2="690" y2="319.6" stroke="#9ca3af" stroke-dasharray="2 3"/><text x="690.0" y="313.6" font-size="10" fill="#9ca3af" text-anchor="end" font-weight="normal">guessing</text><polyline points="132.0,77.0 194.0,77.0 318.0,316.4 504.0,316.4 671.4,316.4" fill="none" stroke="#d97706" stroke-width="3"/><circle cx="132.0" cy="77.0" r="4.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/><circle cx="194.0" cy="77.0" r="4.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/><circle cx="318.0" cy="316.4" r="4.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/><circle cx="504.0" cy="316.4" r="4.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/><circle cx="671.4" cy="316.4" r="4.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/><line x1="70" y1="392" x2="96" y2="392" stroke="#d97706" stroke-width="3"/><text x="104.0" y="396.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">256-position row</text><polyline points="132.0,80.0 194.0,80.0 318.0,80.0 504.0,80.0 671.4,80.0" fill="none" stroke="#16a34a" stroke-width="3"/><circle cx="132.0" cy="80.0" r="4.5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><circle cx="194.0" cy="80.0" r="4.5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><circle cx="318.0" cy="80.0" r="4.5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><circle cx="504.0" cy="80.0" r="4.5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><circle cx="671.4" cy="80.0" r="4.5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><line x1="70" y1="410" x2="96" y2="410" stroke="#16a34a" stroke-width="3"/><text x="104.0" y="414.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">1,024-position row, full attention</text><polyline points="132.0,83.0 194.0,83.0 318.0,323.6 504.0,323.6 671.4,323.6" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4"/><circle cx="132.0" cy="83.0" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><circle cx="194.0" cy="83.0" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><circle cx="318.0" cy="323.6" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><circle cx="504.0" cy="323.6" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><circle cx="671.4" cy="323.6" r="4.5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><line x1="70" y1="428" x2="96" y2="428" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4"/><text x="104.0" y="432.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">1,024-position row, 256-position window</text></svg>
