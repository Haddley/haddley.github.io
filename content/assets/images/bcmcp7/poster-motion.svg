<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A card with an approve button appears, then a blocked card with a cross</title><style>.a{animation-duration:6s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}.c1{animation-name:c1}.c2{animation-name:c2}.xx{animation-name:xx}@keyframes c1{0%,4%{opacity:0;transform:translateY(8px)}22%,90%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}@keyframes c2{0%,26%{opacity:0;transform:translateY(8px)}44%,90%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(0)}}@keyframes xx{0%,48%{opacity:0;transform:scale(.3)}62%,90%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="a c1"><rect x="12" y="18" width="96" height="40" rx="7" fill="#16a34a"/><rect x="22" y="26" width="40" height="5" rx="2.5" fill="#fff"/><rect x="22" y="38" width="28" height="5" rx="2.5" fill="#dcfce7"/><rect x="72" y="32" width="28" height="16" rx="8" fill="#fff"/></g><g class="a c2"><rect x="12" y="64" width="96" height="40" rx="7" fill="#7f1d1d"/><rect x="22" y="72" width="40" height="5" rx="2.5" fill="#fecaca"/><rect x="22" y="84" width="28" height="5" rx="2.5" fill="#fecaca"/></g><path class="a xx" d="M78 76 l16 16 M94 76 l-16 16" stroke="#f87171" stroke-width="5" stroke-linecap="round"/></svg>