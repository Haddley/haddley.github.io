<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 778" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The review card, line by line. If a check failed, the whole card is swapped for one with a single Understood button and no Approve. The detail is a Markdown report built from the checker. The plan-review intent makes the harness show a scrolling document with Approve, Refuse and Chat about it. The answer comes back to this code and never to the AI, and it is read strictly: exactly one choice, exactly Approve, and no typed text."><rect width="690" height="778" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">The review card</text><text x="24" y="52" font-size="12" fill="#6b7280">From bc-posting/index.js, trimmed</text><rect x="16" y="66" width="658" height="696" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="90" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">const q = blocked</text><text x="30" y="116" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  ? { id: 'blocked', header: 'Blocked by policy', detail: buildBlockedReview(chk),</text><path d="M71.6 121 L161.7 121" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M77.6 138 L77.6 132" stroke="#c2410c" stroke-width="1.6"/><path d="M77.6 124 L81.3 132.2 L73.9 132.2 Z" fill="#c2410c"/><text x="71.6" y="153" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">a failed check swaps the whole card:</text><text x="71.6" y="172" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">one button, Understood, no Approve</text><text x="30" y="206" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      options: [{ label: 'Understood', description: 'Nothing was posted' }] }</text><text x="30" y="232" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  : { id: 'review', header: 'Post order', detail: buildReview(chk),</text><path d="M321.1 237 L487.4 237" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M327.1 254 L327.1 248" stroke="#c2410c" stroke-width="1.6"/><path d="M327.1 240 L330.8 248.2 L323.4 248.2 Z" fill="#c2410c"/><text x="321.1" y="269" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the report. Markdown: tables, ✅ ⚠️ ❌,</text><text x="321.1" y="288" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">what posting will change. Built from the checker</text><text x="30" y="322" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      options: [{ label: 'Approve and post' }, { label: 'Do not post' }],</text><text x="30" y="348" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      intent: { kind: 'plan-review', approve: 'Approve and post' } }</text><path d="M140.9 353 L272.5 353" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M146.9 370 L146.9 364" stroke="#c2410c" stroke-width="1.6"/><path d="M146.9 356 L150.6 364.2 L143.2 364.2 Z" fill="#c2410c"/><text x="140.9" y="385" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the harness's review card: a scrolling</text><text x="140.9" y="404" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">document with Approve, Refuse, Chat about it</text><text x="30" y="438" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"></text><text x="30" y="464" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">const answer = await ctx.userQuestions.ask({ agent, signal, questions: [q] })</text><path d="M175.5 469 L321.1 469" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M181.5 486 L181.5 480" stroke="#c2410c" stroke-width="1.6"/><path d="M181.5 472 L185.2 480.2 L177.8 480.2 Z" fill="#c2410c"/><text x="175.5" y="501" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the answer comes back to this code,</text><text x="175.5" y="520" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">never to the AI</text><text x="30" y="554" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"></text><text x="30" y="580" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">const one = answer.answers.find((a) =&gt; a.id === 'review')</text><text x="30" y="606" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">return one &amp;&amp; one.selected.length === 1</text><path d="M127.0 611 L300.3 611" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M133.0 628 L133.0 622" stroke="#c2410c" stroke-width="1.6"/><path d="M133.0 614 L136.7 622.2 L129.3 622.2 Z" fill="#c2410c"/><text x="127.0" y="643" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">read strictly: exactly one choice,</text><text x="127.0" y="662" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">exactly Approve, and no typed text</text><text x="30" y="696" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  &amp;&amp; one.selected[0] === 'Approve and post' &amp;&amp; one.custom === undefined</text><text x="30" y="722" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  ? 'approved' : 'declined'</text></svg>