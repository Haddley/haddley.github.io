<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A signed in visitor chats to a copilot on a website without signing in again</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><circle cx="18" cy="44" r="6" fill="#5bb4ea"/><path d="M8,64 a10,9 0 0 1 20,0 z" fill="#5bb4ea"/></g></g>
<g class="p" style="animation-delay:0.5s"><g><g><circle cx="22" cy="78" r="5" fill="none" stroke="#ffb43a" stroke-width="2"/><path d="M27,78 H39 M34,78 V82 M39,78 V82" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g></g>
<path class="d" style="animation-delay:1.2s" pathLength="1" d="M44,52 H56 M52,48.5 L56,52 L52,55.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="f" style="animation-delay:1.6s"><g><rect x="58" y="20" width="52" height="64" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><rect x="58" y="20" width="52" height="9" rx="5" fill="#5bb4ea"/><circle cx="65" cy="24.5" r="1.5" fill="#0f1b2d"/><circle cx="70" cy="24.5" r="1.5" fill="#0f1b2d"/></g></g>
<g class="p" style="animation-delay:2.3s"><g><rect x="64" y="38" width="34" height="16" rx="6" fill="#2f9e4a"/><path d="M72,53 l-6,8 l10,-2 z" fill="#2f9e4a"/></g></g>
<path class="d" style="animation-delay:2.8s" pathLength="1" d="M70,46 H92" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:3.1s"><g><circle cx="100" cy="34" r="6" fill="#2f9e4a"/><path d="M97.3,34 L99.4,36.4 L103.0,31.6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
