<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Static generation at build time compared with server rendering on each request</title><style>@keyframes fade{0%{opacity:0}14.94%,42.68%,100%{opacity:1}}
