<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A row of data cells with two cells split off below: training and test sets</title><style>@keyframes fade{0%{opacity:0}24.5%,70%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}24.5%,70%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}42%,70%,100%{stroke-dashoffset:0}}
