<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>An SD card carrying a settings gear: Raspberry Pi Imager advanced options</title><style>@keyframes fade{0%{opacity:0}24.5%,70%,100%{opacity:1}}
