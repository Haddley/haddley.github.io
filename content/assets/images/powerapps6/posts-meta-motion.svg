<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A canvas app calling Microsoft Graph through a custom connector</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="4" y="32" width="34" height="48" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><path d="M10,46 H32 M10,56 H28" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<path class="d" style="animation-delay:0.7s" pathLength="1" d="M40,56 H50 M46,52.5 L50,56 L46,59.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.2s"><g><rect x="52" y="44" width="14" height="24" rx="3" fill="#ffb43a"/><path d="M56,44 V36 M62,44 V36" stroke="#ffb43a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<path class="d" style="animation-delay:1.9s" pathLength="1" d="M68,56 H78 M74,52.5 L78,56 L74,59.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.4s"><g><circle cx="94" cy="56" r="11" fill="#ffb43a"/><circle cx="94" cy="56" r="4" fill="#0f1b2d"/></g></g>
<g class="p" style="animation-delay:3.0s"><g><circle cx="70" cy="92" r="5" fill="none" stroke="#ffb43a" stroke-width="2"/><path d="M75,92 H87 M82,92 V96 M87,92 V96" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
</svg>
