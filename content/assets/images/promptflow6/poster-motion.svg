<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A question entering a three-step workflow and an answer leaving it: a multi-step chat workflow</title><style>@keyframes fade{0%{opacity:0}17.5%,50%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}17.5%,50%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}30%,50%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}22.5%,50%,100%{transform:scaleY(1)}}
.f{animation:fade 7s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7s ease-out both infinite alternate}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 7s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="p" style="animation-delay:0.0s"><rect x="14" y="56" width="26" height="18" rx="4" fill="#1e3a5a" stroke="#7dd3fc" stroke-width="2"/></g><g class="p" style="animation-delay:0.4s"><rect x="48" y="56" width="26" height="18" rx="4" fill="#3b2f10" stroke="#fbbf24" stroke-width="2"/></g><g class="p" style="animation-delay:0.8s"><rect x="82" y="56" width="26" height="18" rx="4" fill="#12351f" stroke="#22c55e" stroke-width="2"/></g><path class="d" style="animation-delay:0.5s" pathLength="1" d="M40 65 H48" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round"/><path class="d" style="animation-delay:0.9s" pathLength="1" d="M74 65 H82" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round"/><g class="p" style="animation-delay:1.4s"><rect x="16" y="26" width="30" height="16" rx="6" fill="#e0f2fe"/><path d="M22 42 l-2 7 9 -7z" fill="#e0f2fe"/></g><g class="p" style="animation-delay:2.0s"><rect x="74" y="82" width="30" height="16" rx="6" fill="#7dd3fc"/><path d="M98 98 l2 7 -9 -7z" fill="#7dd3fc"/></g></svg>