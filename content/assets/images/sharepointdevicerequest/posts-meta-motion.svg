<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A SharePoint list with a custom Power Apps form that locks the status field</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="14" width="104" height="92" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M16,28 H60" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.0s"><rect x="16" y="40" width="88" height="12" rx="3" fill="#0f1b2d" stroke="#5bb4ea"/></g>
<g class="p" style="animation-delay:1.5s"><rect x="16" y="58" width="88" height="12" rx="3" fill="#0f1b2d" stroke="#5bb4ea"/></g>
<g class="p" style="animation-delay:2.0s"><g><rect x="16" y="76" width="50" height="12" rx="3" fill="#333a47" stroke="#c9d3dd"/></g></g>
<g class="p" style="animation-delay:2.5s"><g><rect x="73" y="76" width="14" height="11" rx="2" fill="#ffb43a"/><path d="M76,76 V73 a4,4 0 0 1 8,0 V76" stroke="#ffb43a" stroke-width="2" fill="none"/></g></g>
<g class="p" style="animation-delay:3.0s"><rect x="70" y="92" width="32" height="10" rx="4" fill="#2f9e4a"/></g>
</svg>
