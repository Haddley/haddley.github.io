<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>An interactive map made of tiles with a marker</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><g><rect x="10" y="16" width="100" height="88" rx="6" fill="#c9d3dd"/></g></g>
<path class="d" style="animation-delay:0.5s" pathLength="1" d="M10,46 L60,38 L110,50 M10,76 L50,70 L110,82 M40,16 V104 M80,16 V104" stroke="#5bb4ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.6s"><g><path d="M60,32 C48,32 46,50 60,66 C74,50 72,32 60,32 Z" fill="#d9483b"/><circle cx="60" cy="43" r="4.5" fill="#fff"/></g></g>
<g class="p" style="animation-delay:2.4s"><path d="M86,90 q10,-14 20,-12 q-4,12 -20,12 z" fill="#2f9e4a"/></g>
</svg>
