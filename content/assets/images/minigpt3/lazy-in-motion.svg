<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The same four lines on two engines, along a timeline. PyTorch calculates each line the moment it runs, so the GPU does a small job for line 1 and another for line 2. MLX only writes lines 1 and 2 down; at mx.eval it sees the whole list and the GPU does all of it as one job. Compiling goes further and packs a whole training step into one job, which is where MLX&#x27;s 16 to 20 percent speed-up came from."><rect width="720" height="410" fill="#fff"/><style>@media (prefers-reduced-motion: reduce){.a{animation:none!important}}.a{transform-box:fill-box}@keyframes k0{0%,11.67%{opacity:0;transform:scale(.3)}15.00%,92.00%{opacity:1;transform:scale(1)}96.00%,100%{opacity:0;transform:scale(.3)}}.k0{animation:k0 12s ease-out infinite;transform-origin:50% 50%}@keyframes k1{0%,30.00%{opacity:0;transform:scale(.3)}33.33%,92.00%{opacity:1;transform:scale(1)}96.00%,100%{opacity:0;transform:scale(.3)}}.k1{animation:k1 12s ease-out infinite;transform-origin:50% 50%}@keyframes k2{0%,11.67%{opacity:0;transform:scale(.3)}15.00%,92.00%{opacity:1;transform:scale(1)}96.00%,100%{opacity:0;transform:scale(.3)}}.k2{animation:k2 12s ease-out infinite;transform-origin:50% 50%}@keyframes k3{0%,30.00%{opacity:0;transform:scale(.3)}33.33%,92.00%{opacity:1;transform:scale(1)}96.00%,100%{opacity:0;transform:scale(.3)}}.k3{animation:k3 12s ease-out infinite;transform-origin:50% 50%}@keyframes k4{0%,45.00%{opacity:0;transform:scale(.3)}49.17%,92.00%{opacity:1;transform:scale(1)}96.00%,100%{opacity:0;transform:scale(.3)}}.k4{animation:k4 12s ease-out infinite;transform-origin:50% 50%}@keyframes sweep{0%,4%{transform:translateX(0);opacity:1}70%{transform:translateX(400px);opacity:1}76%,100%{transform:translateX(400px);opacity:0}}.clock{animation:sweep 12s linear infinite;transform-box:view-box}@media (prefers-reduced-motion: reduce){.clock{display:none}}@keyframes k5{0%,77.50%{opacity:0}82.50%,92.00%{opacity:1}96.00%,100%{opacity:0}}.k5{animation:k5 12s ease-out infinite;transform-origin:50% 50%}</style><text x="24" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >When does the GPU do the arithmetic?</text><text x="24" y="50" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >The same lines, two engines. Watch the clock move along.</text><text x="24" y="84" font-size="15" font-weight="700" fill="#c2410c" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >PyTorch</text><text x="24" y="102" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >calculate each line as it runs</text><line x1="290" y1="128" x2="690" y2="128" stroke="#d1d5db" stroke-width="2"/><text x="24" y="224" font-size="15" font-weight="700" fill="#059669" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >MLX</text><text x="24" y="242" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >write the steps down, then run</text><line x1="290" y1="268" x2="690" y2="268" stroke="#d1d5db" stroke-width="2"/><text x="24" y="128" font-size="11" font-weight="400" fill="#111827" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" >line 1  logits = model(x)</text><text x="24" y="144" font-size="11" font-weight="400" fill="#111827" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" >line 2  loss = cross_entropy(…)</text><text x="24" y="268" font-size="11" font-weight="400" fill="#111827" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" >line 1, 2  written down</text><text x="24" y="284" font-size="11" font-weight="400" fill="#111827" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" >line 3  mx.eval(loss)</text><g class="a k0"><rect x="330" y="112" width="60" height="30" rx="5" fill="#c2410c"/><text x="360" y="131" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">GPU job 1</text></g><g class="a k1"><rect x="440" y="112" width="60" height="30" rx="5" fill="#c2410c"/><text x="470" y="131" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">GPU job 2</text></g><g class="a k2"><rect x="330" y="252" width="60" height="30" rx="5" fill="#fff" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 3"/><text x="360" y="271" font-size="11" fill="#059669" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">noted</text></g><g class="a k3"><rect x="440" y="252" width="60" height="30" rx="5" fill="#fff" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 3"/><text x="470" y="271" font-size="11" fill="#059669" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">noted</text></g><g class="a k4"><rect x="520" y="252" width="170" height="30" rx="5" fill="#059669"/><text x="605" y="271" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">one GPU job: lines 1 and 2</text></g><text x="690" y="160" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >print(loss.item()) just reads the number</text><text x="690" y="300" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >print(loss.item()) just reads the number</text><g class="a clock"><line x1="290" y1="70" x2="290" y2="316" stroke="#374151" stroke-width="2" stroke-dasharray="5 4"/></g><g class="a k5"><text x="24" y="350" font-size="12" font-weight="400" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Compiling goes one step further: mx.compile packs a whole training step</text><text x="24" y="368" font-size="12" font-weight="400" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >(the trip forward, the trip back and the nudge) into one job, every step.</text><text x="24" y="390" font-size="12" font-weight="600" fill="#059669" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >That, not the waiting on its own, is where MLX's 16 to 20% speed-up came from.</text></g></svg>