<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="Two engines running the same four lines. PyTorch calculates each line the moment it runs: the GPU does a small job for line 1, another for line 2, and so on. MLX only writes lines 1 and 2 down; at line 3, mx.eval, it sees the whole list of steps and the GPU does all of them as one job. Compiling goes further, and packs a whole training step into one job, which is where MLX's 16 percent speed-up came from."><rect width="720" height="400" fill="#fff"/><text x="24.0" y="30.0" font-size="15" fill="#111827" text-anchor="start" font-weight="600">Same four lines, two engines</text><text x="24.0" y="50.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">When does the GPU actually do the arithmetic?</text><text x="24.0" y="86.0" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">PyTorch: calculate each line as it runs</text><rect x="24" y="104" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="34.0" y="127.0" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">logits = model(x)</text><rect x="248" y="108" width="100" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="298.0" y="126.0" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="700">GPU job now</text><rect x="24" y="156" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="34.0" y="179.0" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">loss = cross_entropy(logits, y)</text><rect x="248" y="160" width="100" height="28" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="298.0" y="178.0" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="700">GPU job now</text><rect x="24" y="208" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="34.0" y="231.0" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">(no such line)</text><rect x="24" y="260" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="34.0" y="283.0" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">print(loss.item())</text><text x="250.0" y="283.0" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">just reads the number</text><text x="372.0" y="86.0" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">MLX: write the steps down, then run</text><rect x="372" y="104" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="382.0" y="127.0" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">logits = model(x)</text><rect x="372" y="156" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="382.0" y="179.0" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">loss = cross_entropy(logits, y)</text><rect x="372" y="208" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="382.0" y="231.0" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">mx.eval(loss)</text><rect x="596" y="104" width="100" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="646.0" y="132.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="normal">lines 1 and 2</text><text x="646.0" y="146.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="normal">are only</text><text x="646.0" y="160.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="normal">written down</text><text x="646.0" y="190.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="normal">here, the GPU</text><text x="646.0" y="204.0" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="normal">runs them as</text><text x="646.0" y="222.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">one job</text><rect x="372" y="260" width="214" height="36" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="382.0" y="283.0" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">print(loss.item())</text><text x="598.0" y="283.0" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">just reads the number</text><rect x="24" y="328" width="672" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/><text x="40.0" y="350.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">Compiling goes one step further: mx.compile packs a whole training step (the trip forward, the trip back, and the nudge)</text><text x="40.0" y="368.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">into one job, every step. That, not the waiting on its own, is where MLX's 16 to 20% speed-up came from.</text></svg>
