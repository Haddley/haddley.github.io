<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Mirror below 25 km/h, double above 25 km/h</title>
<rect width="720" height="470" rx="16" fill="#0f1b2d"/>
<text x="24" y="36" fill="#e6edf3" font-size="17" font-weight="600">Below 25 km/h: mirror</text>
<text x="24" y="56" fill="#8fa3b8" font-size="13">15 km/h. The output copies the input, so the period stays the same.</text>
<text x="24" y="114" fill="#7cc6f0" font-size="14">Input (PB2)</text>
<text x="24" y="189" fill="#ffb43a" font-size="14">Output (PB3)</text>
<path d="M150.0,96 L177.0,96 L177.0,122 L222.1,122 L222.1,96 L427.0,96 L427.0,122 L472.1,122 L472.1,96 L677.0,96 L677.0,122 L690.0,122 L690.0,122" fill="none" stroke="#7cc6f0" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M150.0,171 L177.0,171 L177.0,197 L222.1,197 L222.1,171 L427.0,171 L427.0,197 L472.1,197 L472.1,171 L677.0,171 L677.0,197 L690.0,197 L690.0,197" fill="none" stroke="#ffb43a" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M177.0,86 H427.0 M183.0,82 L177.0,86 L183.0,90 M421.0,82 L427.0,86 L421.0,90" stroke="#7cc6f0" stroke-width="1.5" fill="none"/><text x="302.0" y="80" fill="#7cc6f0" font-size="13" text-anchor="middle">92.6 ms</text>
<path d="M177.0,161 H427.0 M183.0,157 L177.0,161 L183.0,165 M421.0,157 L427.0,161 L421.0,165" stroke="#ffb43a" stroke-width="1.5" fill="none"/><text x="302.0" y="155" fill="#ffb43a" font-size="13" text-anchor="middle">92.6 ms (same)</text>
<line x1="24" y1="222" x2="696" y2="222" stroke="#24364d" stroke-width="1"/>
<text x="24" y="254" fill="#e6edf3" font-size="17" font-weight="600">Above 25 km/h: double</text>
<text x="24" y="274" fill="#8fa3b8" font-size="13">30 km/h. The pulse rate is doubled, so the period is halved.</text>
<text x="24" y="332" fill="#7cc6f0" font-size="14">Input (PB2)</text>
<text x="24" y="407" fill="#ffb43a" font-size="14">Output (PB3)</text>
<path d="M150.0,314 L177.0,314 L177.0,340 L199.4,340 L199.4,314 L302.0,314 L302.0,340 L324.4,340 L324.4,314 L427.0,314 L427.0,340 L449.4,340 L449.4,314 L552.0,314 L552.0,340 L574.4,340 L574.4,314 L677.0,314 L677.0,340 L690.0,340 L690.0,340" fill="none" stroke="#7cc6f0" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M150.0,389 L177.0,389 L177.0,415 L188.3,415 L188.3,389 L239.5,389 L239.5,415 L250.8,415 L250.8,389 L302.0,389 L302.0,415 L313.4,415 L313.4,389 L364.5,389 L364.5,415 L375.9,415 L375.9,389 L427.0,389 L427.0,415 L438.4,415 L438.4,389 L489.5,389 L489.5,415 L500.9,415 L500.9,389 L552.0,389 L552.0,415 L563.4,415 L563.4,389 L614.5,389 L614.5,415 L625.9,415 L625.9,389 L677.0,389 L677.0,415 L688.4,415 L688.4,389 L690.0,389" fill="none" stroke="#ffb43a" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M177.0,304 H302.0 M183.0,300 L177.0,304 L183.0,308 M296.0,300 L302.0,304 L296.0,308" stroke="#7cc6f0" stroke-width="1.5" fill="none"/><text x="239.5" y="298" fill="#7cc6f0" font-size="13" text-anchor="middle">46.3 ms</text>
<path d="M177.0,379 H239.5 M183.0,375 L177.0,379 L183.0,383 M233.5,375 L239.5,379 L233.5,383" stroke="#ffb43a" stroke-width="1.5" fill="none"/><text x="208.3" y="373" fill="#ffb43a" font-size="13" text-anchor="middle">23.1 ms (half)</text>
<line x1="150" y1="448" x2="690.0" y2="448" stroke="#8fa3b8" stroke-width="1"/>
<line x1="150.0" y1="444" x2="150.0" y2="452" stroke="#8fa3b8"/>
<line x1="285.0" y1="444" x2="285.0" y2="452" stroke="#8fa3b8"/>
<line x1="420.0" y1="444" x2="420.0" y2="452" stroke="#8fa3b8"/>
<line x1="555.0" y1="444" x2="555.0" y2="452" stroke="#8fa3b8"/>
<line x1="690.0" y1="444" x2="690.0" y2="452" stroke="#8fa3b8"/>
<text x="690.0" y="440" fill="#8fa3b8" font-size="12" text-anchor="end">200 ms</text>
<text x="150" y="440" fill="#8fa3b8" font-size="12">0</text>
</svg>