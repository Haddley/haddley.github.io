<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A React app with a navbar published to a static web app that requires sign in</title><style>@keyframes fade{0%{opacity:0}16.33%,46.67%,100%{opacity:1}}
