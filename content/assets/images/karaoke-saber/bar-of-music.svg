<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1d2433">One bar of Desert Rose: where the music is and where I tapped</text>

  <!-- beat columns -->
  <g stroke="#cbd5e0" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="230" y1="52" x2="230" y2="222"/>
    <line x1="400" y1="52" x2="400" y2="222"/>
    <line x1="570" y1="52" x2="570" y2="222"/>
    <line x1="740" y1="52" x2="740" y2="222"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#1d2433" text-anchor="middle">
    <text x="230" y="50">Beat 1</text>
    <text x="400" y="50">Beat 2</text>
    <text x="570" y="50">Beat 3</text>
    <text x="740" y="50">Beat 4</text>
  </g>

  <!-- row labels -->
  <g font-size="14" fill="#1d2433">
    <text x="20" y="104">Kick drum</text>
    <text x="20" y="154">Snare</text>
    <text x="20" y="204">My taps</text>
  </g>

  <!-- kick: strong on beat 1 -->
  <circle cx="230" cy="100" r="19" fill="#2d3748"/>
  <circle cx="570" cy="100" r="7" fill="#a0aec0"/>

  <!-- snare: strong on beats 2 and 4 -->
  <circle cx="400" cy="150" r="19" fill="#e0a100"/>
  <circle cx="740" cy="150" r="19" fill="#e0a100"/>

  <!-- my taps: beats 1 and 3, blue then red -->
  <circle cx="230" cy="200" r="19" fill="#3aa6c9" stroke="#1d6f8c" stroke-width="2"/>
  <circle cx="570" cy="200" r="19" fill="#e0527a" stroke="#a82a4f" stroke-width="2"/>

  <g font-size="12.5" fill="#4a5568" text-anchor="middle">
    <text x="230" y="240">blue (right hand)</text>
    <text x="570" y="240">red (left hand)</text>
  </g>
  <text x="400" y="278" font-size="14" fill="#1d2433" text-anchor="middle">The loud snares on beats 2 and 4 fall between my blocks, so the song answers every swing.</text>
</svg>
