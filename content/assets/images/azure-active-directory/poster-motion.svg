<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A person beside a shield with a tick: authenticating users with Microsoft identity</title><style>@keyframes fade{0%{opacity:0}21.88%,62.5%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}21.88%,62.5%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}37.5%,62.5%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}28.12%,62.5%,100%{transform:scaleY(1)}}
