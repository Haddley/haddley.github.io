<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A timeline of accounting software growing into Dynamics and Dataverse</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<path class="d" style="animation-delay:0s" pathLength="1" d="M8,64 H112" stroke="#5bb4ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle class="p" style="animation-delay:0.5s" cx="16" cy="64" r="5" fill="#c9d3dd"/>
<circle class="p" style="animation-delay:1.2s" cx="46" cy="64" r="7" fill="#ffb43a"/>
<circle class="p" style="animation-delay:1.9s" cx="76" cy="64" r="9" fill="#5bb4ea"/>
<g><path class="p" style="animation-delay:2.6s" d="M94,28 V51 A9.0,5 0 0 0 112,51 V28" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5"/><ellipse cx="103.0" cy="28" rx="9.0" ry="5" fill="#2f9e4a" stroke="#7cc6f0" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:3.0s" pathLength="1" d="M16,58 V40 M46,56 V30 M76,54 V20" stroke="#c9d3dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
