<path class="d" style="animation-delay:0.6s" pathLength="1" d="M16,36 H40 M16,56 H40" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g><rect class="f" style="animation-delay:1.0s" x="46" y="31" width="58" height="10" rx="3" fill="#0f1b2d" stroke="#5bb4ea"/><rect x="46" y="51" width="58" height="10" rx="3" fill="#0f1b2d" stroke="#5bb4ea"/></g>
<path class="d" style="animation-delay:1.6s" pathLength="1" d="M50,36 H80 M50,56 H70" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g><rect class="p" style="animation-delay:2.4s" x="62" y="76" width="42" height="16" rx="5" fill="#2f9e4a"/><path d="M72,84 L77,88 L90,79" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
