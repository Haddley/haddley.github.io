<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A permission prompt with a do not ask again choice</title><style>@keyframes fade{0%{opacity:0}15.71%,44.87%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}26.92%,44.87%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15.71%,44.87%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.8s ease-out both infinite alternate}
