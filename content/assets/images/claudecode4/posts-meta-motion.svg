<g class="p" style="animation-delay:1.2s"><rect x="20" y="62" width="34" height="14" rx="4" fill="#2f9e4a"/></g>
<g class="p" style="animation-delay:1.6s"><rect x="60" y="62" width="34" height="14" rx="4" fill="#d9483b"/></g>
