<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 558 336" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The blink program line by line, with a handwritten note beside each line: PB0 is physical pin 5; DDRB sets PB0 as an output; for(;;) runs forever; PORTB XOR flips the LED on and off; delay of 500 ms is only true when the clock is 1 MHz."><rect width="558" height="336" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">Blink, line by line</text><text x="24" y="52" font-size="12" fill="#6b7280">From blink.c in this post; the handwritten notes are my own reading of each line</text><rect x="16" y="66" width="202" height="240" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="96" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">#define LED_PIN PB0</text><text x="30" y="142" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">DDRB |= _BV(LED_PIN);</text><text x="30" y="188" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">for (;;) {</text><text x="30" y="234" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">PORTB ^= _BV(LED_PIN);</text><text x="30" y="280" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">_delay_ms(500);</text><path d="M140.9 101 L161.7 101" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="246" y="82" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">PB0 is physical</text><text x="246" y="100" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">pin 5 on the chip</text><path d="M240.5 86.0 C 208.6 86.0, 201.5 92.0, 174.7 92.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M169.7 92.0 L177.9 88.3 L177.9 95.7 Z" fill="#c2410c"/><path d="M30.0 147 L168.6 147" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="246" y="128" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">DDRB sets direction: 1 = output,</text><text x="246" y="146" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">so PB0 drives the LED</text><path d="M240.5 132.0 C 214.8 132.0, 209.1 138.0, 188.5 138.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M183.5 138.0 L191.7 134.3 L191.7 141.7 Z" fill="#c2410c"/><path d="M30.0 193 L85.4 193" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="246" y="174" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">run forever, so the</text><text x="246" y="192" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">blink never stops</text><path d="M240.5 178.0 C 180.5 178.0, 167.2 184.0, 112.3 184.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M107.3 184.0 L115.5 180.3 L115.5 187.7 Z" fill="#c2410c"/><path d="M30.0 239 L175.5 239" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="246" y="220" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">flip the LED: on</text><text x="246" y="238" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">becomes off, and back</text><path d="M240.5 224.0 C 218.0 224.0, 213.0 230.0, 195.5 230.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M190.5 230.0 L198.7 226.3 L198.7 233.7 Z" fill="#c2410c"/><path d="M30.0 285 L127.0 285" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="246" y="266" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">half a second, but only</text><text x="246" y="284" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">true if the clock is 1 MHz</text><path d="M240.5 270.0 C 196.1 270.0, 186.3 276.0, 146.9 276.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M141.9 276.0 L150.2 272.3 L150.2 279.7 Z" fill="#c2410c"/></svg>
