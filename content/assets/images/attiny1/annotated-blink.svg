<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="The blink program line by line, with a handwritten note beside each line: PB0 is physical pin 5; DDRB sets PB0 as an output; for(;;) runs forever; PORTB XOR flips the LED on and off; delay of 500 ms is only true when the clock is 1 MHz." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="360" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">Blink, line by line</text><text x="24" y="52" font-size="12" fill="#6b7280">From blink.c in this post; the handwritten notes are my own reading of each line</text><rect x="16" y="62" width="436" height="282" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="24" y="92" font-size="12" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">#define LED_PIN PB0</text><text x="470" y="88" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">PB0 is physical</text><text x="470" y="106" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">pin 5 on the chip</text><path d="M464 92 C 430 84, 200 84, 168 92" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M168 92 l8 -5 M168 92 l9 3" stroke="#c2410c" stroke-width="1.6" fill="none"/><text x="24" y="142" font-size="12" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">DDRB |= _BV(LED_PIN);</text><text x="470" y="134" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">DDRB sets direction:</text><text x="470" y="152" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">1 = output, so PB0</text><text x="470" y="170" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">drives the LED</text><path d="M464 142 C 430 134, 240 134, 178 142" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M178 142 l8 -5 M178 142 l9 3" stroke="#c2410c" stroke-width="1.6" fill="none"/><text x="24" y="192" font-size="12" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">for (;;) {</text><text x="470" y="186" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">run forever, so the</text><text x="470" y="204" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">blink never stops</text><path d="M464 192 C 430 184, 160 184, 100 192" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M100 192 l8 -5 M100 192 l9 3" stroke="#c2410c" stroke-width="1.6" fill="none"/><text x="24" y="242" font-size="12" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">PORTB ^= _BV(LED_PIN);</text><text x="470" y="236" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">flip the LED: on</text><text x="470" y="254" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">becomes off, and back</text><path d="M464 242 C 430 234, 240 234, 190 242" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M190 242 l8 -5 M190 242 l9 3" stroke="#c2410c" stroke-width="1.6" fill="none"/><text x="24" y="292" font-size="12" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">_delay_ms(500);</text><text x="470" y="286" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">half a second, but only</text><text x="470" y="304" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">true if the clock is 1 MHz</text><path d="M464 292 C 430 284, 170 284, 146 292" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M146 292 l8 -5 M146 292 l9 3" stroke="#c2410c" stroke-width="1.6" fill="none"/></svg>
