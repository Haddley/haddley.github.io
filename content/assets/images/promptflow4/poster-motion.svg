<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A goal broken into ordered plugin steps by a planner: Semantic Kernel planner</title><style>@keyframes fade{0%{opacity:0}18.28%,52.24%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}18.28%,52.24%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}31.34%,52.24%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}23.51%,52.24%,100%{transform:scaleY(1)}}
.f{animation:fade 6.7s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 6.7s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 6.7s ease-out both infinite alternate}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 6.7s ease-out both infinite alternate}
