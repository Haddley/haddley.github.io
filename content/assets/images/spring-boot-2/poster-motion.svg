<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A generated project zip running locally and then up in a cloud: start.spring.io and Azure App Service</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="14" y="34" width="26" height="34" rx="4" fill="#fbbf24"/><path d="M27 34 v34" stroke="#0f1b2d" stroke-width="2.5" stroke-dasharray="3 3"/><path class="d" style="animation-delay:0.4s" pathLength="1" d="M44 52 H62" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="p" style="animation-delay:0.9s"><rect x="64" y="40" width="26" height="22" rx="3" fill="#1e3a5a" stroke="#7dd3fc" stroke-width="2"/><rect x="70" y="64" width="14" height="4" fill="#7dd3fc"/><path d="M71 51 l5 4 -5 4" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round"/></g><path class="d" style="animation-delay:1.4s" pathLength="1" d="M96 42 q6 -14 -4 -16" stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="p" style="animation-delay:1.9s"><g fill="#bae6fd"><circle cx="74" cy="28" r="9"/><circle cx="88" cy="22" r="13"/><circle cx="102" cy="29" r="8"/><rect x="64" y="28" width="46" height="11" rx="5"/></g></g></svg>