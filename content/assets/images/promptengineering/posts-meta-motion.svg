<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A prompt built from a role, a task and a format to get a better reply</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="8" y="20" width="50" height="16" rx="3" fill="#5bb4ea"/><text x="33.0" y="30.88" text-anchor="middle" font-size="8" fill="#0f1b2d" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">role</text></g></g>
<g class="p" style="animation-delay:0.5s"><g><rect x="8" y="42" width="50" height="16" rx="3" fill="#ffb43a"/><text x="33.0" y="52.88" text-anchor="middle" font-size="8" fill="#0f1b2d" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">task</text></g></g>
<g class="p" style="animation-delay:1.0s"><g><rect x="8" y="64" width="50" height="16" rx="3" fill="#2f9e4a"/><text x="33.0" y="74.88" text-anchor="middle" font-size="8" fill="#fff" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">format</text></g></g>
<path class="d" style="animation-delay:1.8s" pathLength="1" d="M60,28 C70,28 70,56 80,56 M60,50 H80 M60,72 C70,72 70,56 80,56" stroke="#7cc6f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.4s"><g><rect x="80" y="38" width="34" height="34" rx="6" fill="#2f9e4a"/><path d="M88,71 l-6,8 l10,-2 z" fill="#2f9e4a"/></g></g>
<g class="p" style="animation-delay:3.0s"><path d="M98,45 L100.7,51.3 L107,54 L100.7,56.7 L98,63 L95.3,56.7 L89,54 L95.3,51.3 Z" fill="#fff"/></g>
</svg>
