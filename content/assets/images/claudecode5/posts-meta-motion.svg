<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Plan mode lists a read-only plan which is approved before any edit</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="10" y="14" width="100" height="92" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.4s"><g><circle cx="24" cy="34" r="3" fill="#7cc6f0"/><circle cx="24" cy="52" r="3" fill="#7cc6f0"/><circle cx="24" cy="70" r="3" fill="#7cc6f0"/></g></g>
<path class="d" style="animation-delay:0.7s" pathLength="1" d="M34,34 H96" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:1.2s" pathLength="1" d="M34,52 H88" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:1.7s" pathLength="1" d="M34,70 H92" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.5s"><g><rect x="60" y="82" width="42" height="16" rx="5" fill="#2f9e4a"/><path d="M72,90 l4,4 l10,-9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
</svg>
