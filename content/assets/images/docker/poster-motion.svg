<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Containers dropping onto a ship hull: Docker</title><style>@keyframes fade{0%{opacity:0}19.6%,56%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}19.6%,56%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}33.6%,56%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}25.2%,56%,100%{transform:scaleY(1)}}
.f{animation:fade 6.25s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 6.25s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 6.25s ease-out both infinite alternate}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 6.25s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes drop{0%{transform:translateY(-40px);opacity:0}24%,48%,100%{transform:translateY(0);opacity:1}}.drop{animation:drop 6.25s ease-in both infinite alternate}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><path d="M16 82 H104 L94 98 H26z" fill="#1e3a5a" stroke="#38bdf8" stroke-width="2"/><g class="drop" style="animation-delay:0.0s"><rect x="26" y="64" width="22" height="16" rx="2" fill="#38bdf8"/></g><g class="drop" style="animation-delay:0.25s"><rect x="50" y="64" width="22" height="16" rx="2" fill="#fbbf24"/></g><g class="drop" style="animation-delay:0.5s"><rect x="74" y="64" width="22" height="16" rx="2" fill="#a78bfa"/></g><g class="drop" style="animation-delay:0.75s"><rect x="26" y="47" width="22" height="16" rx="2" fill="#22c55e"/></g><g class="drop" style="animation-delay:1.0s"><rect x="50" y="47" width="22" height="16" rx="2" fill="#f87171"/></g><g class="drop" style="animation-delay:1.25s"><rect x="74" y="47" width="22" height="16" rx="2" fill="#38bdf8"/></g></svg>