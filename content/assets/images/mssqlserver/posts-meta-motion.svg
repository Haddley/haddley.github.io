<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>SQL Server running in a Docker container with a client connected to it</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="42" y="30" width="68" height="62" rx="5" fill="none" stroke="#5bb4ea" stroke-width="2"/></g></g>
<g class="p" style="animation-delay:0.6s"><g><path d="M62,42 V75 A14.0,5 0 0 0 90,75 V42" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5"/><ellipse cx="76.0" cy="42" rx="14.0" ry="5" fill="#5bb4ea" stroke="#7cc6f0" stroke-width="1.5"/></g></g>
<g class="p" style="animation-delay:1.2s"><text x="96" y="48" text-anchor="middle" font-size="8" fill="#7cc6f0" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">SQL</text></g>
<path class="d" style="animation-delay:1.8s" pathLength="1" d="M34,62 H46 M42,58.5 L46,62 L42,65.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.4s"><g><rect x="4" y="44" width="30" height="34" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><path d="M11,52 l5,4 l-5,4" stroke="#2f9e4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
</svg>
