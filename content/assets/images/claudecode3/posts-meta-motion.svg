<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Context window bar compacted into a short summary</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="10" y="26" width="100" height="14" rx="4" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M14,33 H106" stroke="#ffb43a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.4s"><path d="M60,46 V70 M56.5,66 L60,70 L63.5,66" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<g class="p" style="animation-delay:1.8s"><text x="74" y="64" text-anchor="start" font-size="8" fill="#c9d3dd" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">/compact</text></g>
<g class="f" style="animation-delay:2.4s"><rect x="10" y="76" width="100" height="14" rx="4" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:2.8s" pathLength="1" d="M14,83 H42" stroke="#2f9e4a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
