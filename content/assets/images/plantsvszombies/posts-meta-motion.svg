<g class="p" style="animation-delay:1.2s"><circle cx="70" cy="58" r="5" fill="#2f9e4a"/></g>
<g class="p" style="animation-delay:1.8s"><g><circle cx="98" cy="50" r="10" fill="#9bb08a"/><rect x="88" y="60" width="20" height="30" rx="4" fill="#6d7f9a"/></g></g>
