<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="A real 931-letter test story against the 256 positions the machine can hold. With letters as tokens, the 256 positions are filled by the first 256 letters, about 50 words, and 675 letters do not fit. With 8k byte-pair pieces, the whole story fits in 217 of the 256 positions, leaving 39 spare."><rect width="720" height="346" fill="#fff"/><style>@media (prefers-reduced-motion: reduce){.a{animation:none!important}}.a{transform-box:fill-box}@keyframes k0{0%,4.62%{transform:scaleX(0)}29.23%,90.00%{transform:scaleX(1)}94.00%,100%{transform:scaleX(0)}}.k0{animation:k0 13s ease-out infinite;transform-origin:0% 50%}@keyframes k1{0%,40.00%{transform:scaleX(0)}64.62%,90.00%{transform:scaleX(1)}94.00%,100%{transform:scaleX(0)}}.k1{animation:k1 13s ease-out infinite;transform-origin:0% 50%}@keyframes k2{0%,32.31%{opacity:0}36.92%,90.00%{opacity:1}94.00%,100%{opacity:0}}.k2{animation:k2 13s ease-out infinite;transform-origin:50% 50%}@keyframes k3{0%,67.69%{opacity:0}72.31%,90.00%{opacity:1}94.00%,100%{opacity:0}}.k3{animation:k3 13s ease-out infinite;transform-origin:50% 50%}</style><text x="24" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >How much story fits in 256 positions?</text><text x="24" y="50" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >A real 931-letter test story, cut two ways</text><text x="40" y="92" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Letters as tokens</text><rect x="40" y="104" width="640" height="34" rx="5" fill="#f3f4f6" stroke="none" stroke-width="1.5" /><rect class="a k0" x="40" y="104" width="640.0" height="34" rx="5" fill="#c2410c"/><text x="40" y="158" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >position 1</text><text x="680" y="158" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >position 256</text><text x="40" y="222" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >My 8k BPE pieces as tokens</text><rect x="40" y="234" width="640" height="34" rx="5" fill="#f3f4f6" stroke="none" stroke-width="1.5" /><rect class="a k1" x="40" y="234" width="542.5" height="34" rx="5" fill="#059669"/><text x="40" y="288" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >position 1</text><text x="680" y="288" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >position 256</text><g class="a k2"><text x="40" y="186" font-size="13" font-weight="600" fill="#c2410c" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >All 256 positions are full after about 50 words.</text><text x="680" y="186" font-size="13" font-weight="600" fill="#c2410c" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >… and 675 more letters do not fit</text></g><g class="a k3"><text x="40" y="316" font-size="13" font-weight="600" fill="#059669" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >The whole story fits in 217 of the 256 positions.</text><text x="680" y="316" font-size="13" font-weight="600" fill="#059669" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >39 positions to spare</text></g></svg>