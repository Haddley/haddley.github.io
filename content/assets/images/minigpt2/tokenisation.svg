<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img"
     aria-label="The phrase 'Once upon a time' becomes 16 tokens with a character tokeniser, or 4 with either subword tokeniser. The model only ever sees the list of integer IDs."
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto">
  <rect width="820" height="400" fill="#ffffff"/>

  <text x="40" y="34" font-size="15" fill="#374151">The tokeniser turns text into a list of integers &#8212; the only thing the model ever sees</text>

  <!-- source text -->
  <rect x="40" y="52" width="220" height="34" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="150" y="74" font-size="15" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">Once upon a time</text>
  <text x="272" y="74" font-size="12" fill="#6b7280">16 characters</text>

  <!-- helper for token box style via repeated rects -->
  <!-- Row 1: character -->
  <text x="40" y="124" font-size="13" font-weight="600" fill="#1f2937">character</text>
  <text x="40" y="140" font-size="11" fill="#9ca3af">vocabulary 91</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#374151" text-anchor="middle">
    <g>
      <rect x="150" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="160" y="129">O</text>
      <rect x="172" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="182" y="129">n</text>
      <rect x="194" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="204" y="129">c</text>
      <rect x="216" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="226" y="129">e</text>
      <rect x="238" y="112" width="20" height="24" rx="3" fill="#eef2ff" stroke="#c7d2fe"/><text x="248" y="129" fill="#9ca3af">&#183;</text>
      <rect x="260" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="270" y="129">u</text>
      <rect x="282" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="292" y="129">p</text>
      <rect x="304" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="314" y="129">o</text>
      <rect x="326" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="336" y="129">n</text>
      <rect x="348" y="112" width="20" height="24" rx="3" fill="#eef2ff" stroke="#c7d2fe"/><text x="358" y="129" fill="#9ca3af">&#183;</text>
      <rect x="370" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="380" y="129">a</text>
      <rect x="392" y="112" width="20" height="24" rx="3" fill="#eef2ff" stroke="#c7d2fe"/><text x="402" y="129" fill="#9ca3af">&#183;</text>
      <rect x="414" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="424" y="129">t</text>
      <rect x="436" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="446" y="129">i</text>
      <rect x="458" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="468" y="129">m</text>
      <rect x="480" y="112" width="20" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="490" y="129">e</text>
    </g>
  </g>
  <text x="520" y="129" font-size="13" font-weight="600" fill="#2563eb">16 tokens</text>

  <!-- Row 2: GPT-2 BPE -->
  <text x="40" y="188" font-size="13" font-weight="600" fill="#1f2937">GPT-2 BPE</text>
  <text x="40" y="204" font-size="11" fill="#9ca3af">vocabulary 50,257</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#374151" text-anchor="middle">
    <rect x="150" y="176" width="60" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="180" y="193">Once</text>
    <rect x="214" y="176" width="66" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="247" y="193">&#183;upon</text>
    <rect x="284" y="176" width="46" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="307" y="193">&#183;a</text>
    <rect x="334" y="176" width="66" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="367" y="193">&#183;time</text>
  </g>
  <text x="420" y="193" font-size="13" font-weight="600" fill="#2563eb">4 tokens</text>

  <!-- Row 3: trained 8k BPE -->
  <text x="40" y="252" font-size="13" font-weight="600" fill="#1f2937">trained 8k BPE</text>
  <text x="40" y="268" font-size="11" fill="#9ca3af">vocabulary 8,192</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#374151" text-anchor="middle">
    <rect x="150" y="240" width="60" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="180" y="257">Once</text>
    <rect x="214" y="240" width="66" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="247" y="257">&#183;upon</text>
    <rect x="284" y="240" width="46" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="307" y="257">&#183;a</text>
    <rect x="334" y="240" width="66" height="24" rx="3" fill="#eff6ff" stroke="#93c5fd"/><text x="367" y="257">&#183;time</text>
  </g>
  <text x="420" y="257" font-size="13" font-weight="600" fill="#2563eb">4 tokens</text>

  <line x1="40" y1="292" x2="780" y2="292" stroke="#e5e7eb"/>

  <text x="40" y="320" font-size="13" fill="#374151">What the model receives is just the IDs. For GPT-2 BPE:</text>
  <text x="40" y="342" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#2563eb">[ 7454, 2402, 257, 640 ]</text>

  <text x="40" y="372" font-size="12" fill="#6b7280">Fewer tokens per sentence &#8594; each 256-token window covers more text.</text>
  <text x="40" y="390" font-size="12" fill="#6b7280">Larger vocabulary &#8594; a bigger embedding table: one learned row per possible ID.</text>
</svg>
