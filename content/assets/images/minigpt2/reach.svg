<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="A real 931-letter test story. With letters as tokens, the 256 positions cover only the first 256 letters, about 50 words. With my 8k BPE pieces, the whole story fits in 217 of the 256 positions."><rect width="820" height="470" fill="#fff"/><text x="40.0" y="32.0" font-size="15" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">The same 256 positions, filled two ways</text><text x="40.0" y="52.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">A real test story: 931 letters. Highlighted: what the machine can see.</text><text x="40.0" y="86.0" font-size="13" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">letters</text><text x="110.4" y="86.0" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">256 letters: about 50 words</text><rect x="38" y="96" width="714.8" height="16" rx="2" fill="#7c3aed" opacity="0.16"/><text x="40.0" y="108.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Once upon a time, in a big forest, there was a flexible snake named Sam. Sam loved to play with his friends.</text><rect x="38" y="113" width="708.2" height="16" rx="2" fill="#7c3aed" opacity="0.16"/><text x="40.0" y="125.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">They would play hide and seek, and Sam would always win. One day, Sam and his friends found a big box. They</text><rect x="38" y="130" width="259.4" height="16" rx="2" fill="#7c3aed" opacity="0.16"/><text x="40.0" y="142.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">didn&#x27;t know what was inside, but they wanted to find out. Sam and his friends decided to bury the box under the</text><text x="40.0" y="159.0" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">ground to keep it safe. They dug a big hole and put the box inside. Then, they covered it with dirt. They were</text><text x="40.0" y="176.0" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">very happy and felt peace because they thought the box was safe now. But, the next day, something unexpected</text><text x="40.0" y="193.0" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">happened. The box was gone! They dug in the hole, but it was empty. Sam and his friends were sad and confused.</text><text x="40.0" y="210.0" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Just then, they saw a big bird flying away with the box. The bird had taken it! They all laughed because they</text><text x="40.0" y="227.0" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">didn&#x27;t think a bird would find their box. In the end, Sam and his friends learned that sometimes things don&#x27;t go</text><text x="40.0" y="244.0" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">as planned, but it&#x27;s still fun to play together.</text><text x="40.0" y="287.0" font-size="13" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">my 8k BPE</text><text x="124.8" y="287.0" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">the whole story fits in 217 of the 256 positions</text><rect x="38" y="297" width="714.8" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="309.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Once upon a time, in a big forest, there was a flexible snake named Sam. Sam loved to play with his friends.</text><rect x="38" y="314" width="708.2" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="326.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">They would play hide and seek, and Sam would always win. One day, Sam and his friends found a big box. They</text><rect x="38" y="331" width="734.6" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="343.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">didn&#x27;t know what was inside, but they wanted to find out. Sam and his friends decided to bury the box under the</text><rect x="38" y="348" width="728.0" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="360.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">ground to keep it safe. They dug a big hole and put the box inside. Then, they covered it with dirt. They were</text><rect x="38" y="365" width="714.8" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="377.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">very happy and felt peace because they thought the box was safe now. But, the next day, something unexpected</text><rect x="38" y="382" width="728.0" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="394.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">happened. The box was gone! They dug in the hole, but it was empty. Sam and his friends were sad and confused.</text><rect x="38" y="399" width="721.4" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="411.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">Just then, they saw a big bird flying away with the box. The bird had taken it! They all laughed because they</text><rect x="38" y="416" width="741.2" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="428.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">didn&#x27;t think a bird would find their box. In the end, Sam and his friends learned that sometimes things don&#x27;t go</text><rect x="38" y="433" width="318.8" height="16" rx="2" fill="#2563eb" opacity="0.16"/><text x="40.0" y="445.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">as planned, but it&#x27;s still fun to play together.</text></svg>
