<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="Three bars, to scale. Every machine has the same blocks, 10.7 million numbers. Letters add 91 token embeddings, 35 thousand numbers, for 10.8 million in all. My 8k BPE adds 3.1 million, for 13.9 million, 23% embeddings. GPT-2 adds 19.3 million, for 30.0 million, 64% embeddings."><rect width="820" height="360" fill="#fff"/><text x="40.0" y="32.0" font-size="15" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">Same blocks, different supply of token embeddings</text><text x="40.0" y="52.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">Each bar is the whole machine, to scale. The token embeddings double as the output rows (weight tying).</text><text x="40.0" y="114.0" font-size="13" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">letters</text><text x="40.0" y="130.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">91 pieces</text><rect x="170" y="98" width="185.9" height="34" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="262.9" y="120.0" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">the blocks: 10.7 million</text><text x="368.9" y="112.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">10.8 million</text><text x="368.9" y="127.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">token embeddings: 35 thousand, under 1%</text><text x="40.0" y="190.0" font-size="13" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">my 8k BPE</text><text x="40.0" y="206.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">8,192 pieces</text><rect x="170" y="174" width="185.9" height="34" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="262.9" y="196.0" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">the blocks: 10.7 million</text><rect x="358.9" y="174" width="54.5" height="34" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="421.3" y="188.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">13.9 million</text><text x="421.3" y="203.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">token embeddings: 3.1 million, 23%</text><text x="40.0" y="266.0" font-size="13" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">GPT-2</text><text x="40.0" y="282.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">50,257 pieces</text><rect x="170" y="250" width="185.9" height="34" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="262.9" y="272.0" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">the blocks: 10.7 million</text><rect x="358.9" y="250" width="334.1" height="34" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="525.9" y="272.0" font-size="11" fill="#78350f" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">token embeddings: 19.3 million</text><text x="701.0" y="264.0" font-size="12" fill="#111827" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">30.0 million</text><text x="701.0" y="279.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">64% embeddings</text><text x="40.0" y="338.0" font-size="11.5" fill="#374151" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">The blocks do all the thinking, and they are identical in all three machines. Only the supply of token embeddings grows.</text></svg>
