<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Four stages linked in a loop: plan, code, build and deploy with Azure DevOps</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><circle cx="60" cy="60" r="36" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 5"/><g class="p" style="animation-delay:0.0s"><circle cx="60" cy="24" r="11" fill="#38bdf8"/></g><g class="p" style="animation-delay:0.5s"><circle cx="94" cy="60" r="11" fill="#a78bfa"/></g><g class="p" style="animation-delay:1.0s"><circle cx="60" cy="96" r="11" fill="#fbbf24"/></g><g class="p" style="animation-delay:1.5s"><circle cx="26" cy="60" r="11" fill="#22c55e"/></g><g class="p" style="animation-delay:2.0s"><path d="M48 60 h24 M64 52 l8 8 -8 8" stroke="#e0f2fe" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>