<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>The OpenGL triangle rotating using the GLM maths library</title><style>@keyframes fade{0%{opacity:0}19.44%,55.56%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}33.33%,55.56%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}19.44%,55.56%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 6.3s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 6.3s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 6.3s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="14" width="104" height="92" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.5s"><path d="M60,32 L88,80 H32 Z" fill="#ffb43a"/></g>
<path class="d" style="animation-delay:1.3s" pathLength="1" d="M92.2,33 A42,42 0 0 1 92.2,87 M99.1,85 L92.2,87 L93,79.8" stroke="#7cc6f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
