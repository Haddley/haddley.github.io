<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Two related Business Central tables shown in Dataverse as virtual tables</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="4" y="40" width="26" height="36" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><text x="17.0" y="62.0" text-anchor="middle" font-size="11" fill="#7cc6f0" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">BC</text></g></g>
<path class="d" style="animation-delay:0.8s" pathLength="1" d="M32,58 H46 M42,54.5 L46,58 L42,61.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.4s"><g><path d="M48,34 V61 A12.0,5 0 0 0 72,61 V34" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5" stroke-dasharray="3 2"/><ellipse cx="60.0" cy="34" rx="12.0" ry="5" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5" stroke-dasharray="3 2"/></g></g>
<path class="d" style="animation-delay:2.2s" pathLength="1" d="M72,50 H86" stroke="#c9d3dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.7s"><g><path d="M88,34 V61 A12.0,5 0 0 0 112,61 V34" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5" stroke-dasharray="3 2"/><ellipse cx="100.0" cy="34" rx="12.0" ry="5" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5" stroke-dasharray="3 2"/></g></g>
<g class="p" style="animation-delay:3.1s"><g><text x="60" y="92" text-anchor="middle" font-size="9" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">1</text><text x="100" y="92" text-anchor="middle" font-size="9" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">N</text></g></g>
</svg>
