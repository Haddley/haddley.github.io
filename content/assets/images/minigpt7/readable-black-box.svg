<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="The readable model from the outside, for the text goo. The text goes into the readable model, drawn as a closed black box: scores_for_next_letter, 826,433 trained numbers, opened up in this post. Out come 65 scores for the next letter: d 8.577, k 3.452, r 3.414, s 3.009, and 60 more, down to M at minus 5.773. Inside chances_from_scores, the settings act: temperature divides every score, 0.8 in write; top-k keeps the biggest k scores, 65 in write, so all; and softmax, scores_to_shares, turns scores into chances. The 65 chances at temperature 1: d 96.6%, k 0.6%, r 0.6%, s 0.4%. Then spin_the_wheel picks a letter. From the outside, it is the same black box as Part 1&#x27;s; this post opens it." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="430" fill="#ffffff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">The readable model, from the outside</text><text x="40" y="50" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Real numbers from my trained model, for the text “goo”. The rest of this post opens the box.</text><rect x="40" y="80" width="84" height="130" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="82" y="104" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">the text</text><text x="82" y="152" font-size="22" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">goo</text><line x1="124" y1="145" x2="138.0" y2="145.0" stroke="#6b7280" stroke-width="1.8"/><path d="M146 145 L138.0 149.5 L138.0 140.5 Z" fill="#6b7280"/><rect x="148" y="80" width="196" height="130" rx="10" fill="#111827" stroke="#111827" stroke-width="1"/><text x="246" y="112" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">the readable model</text><text x="