b" stroke="#ffffff" stroke-width="0.5"/><rect x="285" y="194" width="13" height="13" rx="2" fill="#d6e1fb" stroke="#ffffff" stroke-width="0.5"/><rect x="300" y="194" width="13" height="13" rx="2" fill="#f5e0d7" stroke="#ffffff" stroke-width="0.5"/><rect x="315" y="194" width="13" height="13" rx="2" fill="#f0d2c5" stroke="#ffffff" stroke-width="0.5"/><text x="334" y="204" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">…</text><line x1="220.0" y1="216" x2="220.0" y2="233" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 240 L215.0 232 L225.0 232 Z" fill="#6b7280"/><rect x="14" y="244" width="412" height="164" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="28" y="266" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Four times over:</text><text x="28" y="284" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">each row is mixed with the rows before it,</text><text x="28" y="300" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">then adjusted on its own</text><text x="124" y="324" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">the rows after all four:</text><text x="136" y="345" font-size="13" fill="#111827" text-anchor="end" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><rect x="150" y="334" width="13" height="13" rx="2" fill="#f4ded5" stroke="#ffffff" stroke-width="0.5"/><rect x="165" y="334" width="13" height="13" rx="2" fill="#ccdbfa" stroke="#ffffff" stroke-width="0.5"/><rect x="180" y="334" width="13" height="13" rx="2" fill="#f4dcd3" stroke="#ffffff" stroke-width="0.5"/><rect x="195" y="334" width="13" height="13" rx="2" fill="#d6e1fb" stroke="#ffffff" stroke-width="0.5"/><rect x="210" y="334" width="13" height="13" rx="2" fill="#efccbd" stroke="#ffffff" stroke-width="0.5"/><rect x="225" y="334" width="13" height="13" rx="2" fill="#f4ded5" stroke="#ffffff" stroke-width="0.5"/><rect x="240" y="334" width="13" height="13" rx="2" fill="#e1a288" stroke="#ffffff" stroke-width="0.5"/><rect x="255" y="334" width="13" height="13" rx="2" fill="#f3d9cf" stroke="#ffffff" stroke-width="0.5"/><rect x="270" y="334" width="13" height="13" rx="2" fill="#c2d3f9" stroke="#ffffff" stroke-width="0.5"/><rect x="285" y="334" width="13" height="13" rx="2" fill="#f1d3c6" stroke="#ffffff" stroke-width="0.5"/><rect x="300" y="334" width="13" height="13" rx="2" fill="#b0c6f8" stroke="#ffffff" stroke-width="0.5"/><rect x="315" y="334" width="13" height="13" rx="2" fill="#dbe5fc" stroke="#ffffff" stroke-width="0.5"/><text x="334" y="344" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">…</text><text x="136" y="365" font-size="13" fill="#111827" text-anchor="end" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><rect x="150" y="354" width="13" height="13" rx="2" fill="#f5e0d7" stroke="#ffffff" stroke-width="0.5"/><rect x="165" y="354" width="13" height="13" rx="2" fill="#d1defb" stroke="#ffffff" stroke-width="0.5"/><rect x="180" y="354" width="13" height="13" rx="2" fill="#dae5fc" stroke="#ffffff" stroke-width="0.5"/><rect x="195" y="354" width="13" height="13" rx="2" fill="#f3d8ce" stroke="#ffffff" stroke-width="0.5"/><rect x="210" y="354" width="13" height="13" rx="2" fill="#d5e1fb" stroke="#ffffff" stroke-width="0.5"/><rect x="225" y="354" width="13" height="13" rx="2" fill="#f3d8ce" stroke="#ffffff" stroke-width="0.5"/><rect x="240" y="354" width="13" height="13" rx="2" fill="#f2d5c9" stroke="#ffffff" stroke-width="0.5"/><rect x="255" y="354" width="13" height="13" rx="2" fill="#f3dbd1" stroke="#ffffff" stroke-width="0.5"/><rect x="270" y="354" width="13" height="13" rx="2" fill="#dce6fc" stroke="#ffffff" stroke-width="0.5"/><rect x="285" y="354" width="13" height="13" rx="2" fill="#dee8fc" stroke="#ffffff" stroke-width="0.5"/><rect x="300" y="354" width="13" height="13" rx="2" fill="#afc6f8" stroke="#ffffff" stroke-width="0.5"/><rect x="315" y="354" width="13" height="13" rx="2" fill="#dce6fc" stroke="#ffffff" stroke-width="0.5"/><text x="334" y="364" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">…</text><text x="136" y="385" font-size="13" fill="#111827" text-anchor="end" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><rect x="150" y="374" width="13" height="13" rx="2" fill="#d3dffb" stroke="#ffffff" stroke-width="0.5"/><rect x="165" y="374" width="13" height="13" rx="2" fill="#d4e1fb" stroke="#ffffff" stroke-width="0.5"/><rect x="180" y="374" width="13" height="13" rx="2" fill="#bdd0f9" stroke="#ffffff" stroke-width="0.5"/><rect x="195" y="374" width="13" height="13" rx="2" fill="#d0ddfb" stroke="#ffffff" stroke-width="0.5"/><rect x="210" y="374" width="13" height="13" rx="2" fill="#f4dcd2" stroke="#ffffff" stroke-width="0.5"/><rect x="225" y="374" width="13" height="13" rx="2" fill="#eecbbc" stroke="#ffffff" stroke-width="0.5"/><rect x="240" y="374" width="13" height="13" rx="2" fill="#f1d3c7" stroke="#ffffff" stroke-width="0.5"/><rect x="255" y="374" width="13" height="13" rx="2" fill="#d5e1fb" stroke="#ffffff" stroke-width="0.5"/><rect x="270" y="374" width="13" height="13" rx="2" fill="#d1defb" stroke="#ffffff" stroke-width="0.5"/><rect x="285" y="374" width="13" height="13" rx="2" fill="#c9d8fa" stroke="#ffffff" stroke-width="0.5"/><rect x="300" y="374" width="13" height="13" rx="2" fill="#cddbfa" stroke="#ffffff" stroke-width="0.5"/><rect x="315" y="374" width="13" height="13" rx="2" fill="#f1d3c7" stroke="#ffffff" stroke-width="0.5"/><text x="334" y="384" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">…</text><path d="M106 340 C70 340, 70 360, 100 360" fill="none" stroke="#6b7280" stroke-width="1.4"/><path d="M106 360 L98 356 L98 364 Z" fill="#6b7280"/><path d="M106 340 C60 340, 60 380, 100 380" fill="none" stroke="#6b7280" stroke-width="1.4"/><path d="M106 380 L98 376 L98 384 Z" fill="#6b7280"/><path d="M106 360 C70 360, 70 380, 100 380" fill="none" stroke="#6b7280" stroke-width="1.4"/><path d="M106 380 L98 376 L98 384 Z" fill="#6b7280"/><text x="352" y="360" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">never from</text><text x="352" y="374" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">a later row</text><rect x="124" y="371" width="226" height="19" rx="5" fill="none" stroke="#c2410c" stroke-width="1.8"/><line x1="220.0" y1="412" x2="220.0" y2="431" stroke="#c2410c" stroke-width="1.8"/><path d="M220.0 438 L215.0 430 L225.0 430 Z" fill="#c2410c"/><text x="230.0" y="430" font-size="12" fill="#c2410c" text-anchor="start" font-weight="normal" font-style="italic">only the last row is used</text><rect x="14" y="444" width="412" height="210" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="28" y="466" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">One more calculation:</text><text x="28" y="484" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">the row is compared with 65 stored rows, one for</text><text x="28" y="500" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">each letter: multiply the matching numbers, and</text><text x="28" y="516" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">add them up. That gives each letter a score.</text><text x="44" y="539" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">d</text><text x="110" y="539" font-size="13" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">8.58</text><rect x="122" y="528" width="188.70037078857422" height="14" rx="2" fill="#6b7280" stroke="none" stroke-width="1"/><text x="44" y="561" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">k</text><text x="110" y="561" font-size="13" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">3.45</text><rect x="122" y="550" width="75.94761180877686" height="14" rx="2" fill="#6b7280" stroke="none" stroke-width="1"/><text x="44" y="583" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">r</text><text x="110" y="583" font-size="13" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">3.41</text><rect x="122" y="572" width="75.10879278182983" height="14" rx="2" fill="#6b7280" stroke="none" stroke-width="1"/><text x="44" y="605" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">s</text><text x="110" y="605" font-size="13" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">3.01</text><rect x="122" y="594" width="66.20415925979614" height="14" rx="2" fill="#6b7280" stroke="none" stroke-width="1"/><text x="44" y="627" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">t</text><text x="110" y="627" font-size="13" fill="#111827" text-anchor="end" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">2.91</text><rect x="122" y="616" width="64.01850175857544" height="14" rx="2" fill="#6b7280" stroke="none" stroke-width="1"/><text x="44" y="648" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">… down to M at −5.77</text><line x1="220.0" y1="658" x2="220.0" y2="677" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 684 L215.0 676 L225.0 676 Z" fill="#6b7280"/><text x="230.0" y="676" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">the scores become chances</text><rect x="14" y="690" width="412" height="166" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/><text x="28" y="712" font-size="13" fill="#111827" text-anchor="start" font-weight="bold">Chances for the next letter:</text><text x="44" y="737" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">d</text><rect x="60" y="726" width="251.2427294254303" height="14" rx="2" fill="#c2410c" stroke="none" stroke-width="1"/><text x="319.2427294254303" y="737" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">96.6%</text><text x="44" y="759" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">k</text><rect x="60" y="748" width="2" height="14" rx="2" fill="#c2410c" stroke="none" stroke-width="1"/><text x="70" y="759" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">0.6%</text><text x="44" y="781" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">r</text><rect x="60" y="770" width="2" height="14" rx="2" fill="#c2410c" stroke="none" stroke-width="1"/><text x="70" y="781" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">0.6%</text><text x="44" y="803" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">s</text><rect x="60" y="792" width="2" height="14" rx="2" fill="#c2410c" stroke="none" stroke-width="1"/><text x="70" y="803" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">0.4%</text><text x="44" y="825" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">t</text><rect x="60" y="814" width="2" height="14" rx="2" fill="#c2410c" stroke="none" stroke-width="1"/><text x="70" y="825" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">0.3%</text><text x="44" y="846" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">… and 60 more letters, each less likely still</text><line x1="220.0" y1="860" x2="220.0" y2="877" stroke="#6b7280" stroke-width="1.8"/><path d="M220.0 884 L215.0 876 L225.0 876 Z" fill="#6b7280"/><text x="220.0" y="902" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">Pick one at random, weighted by the chances.</text><text x="220.0" y="920" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">Usually d, but not always.</text><text x="220.0" y="938" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">Add it to the text (goo + d = good), and ask again.</text><text x="220.0" y="956" font-size="13" fill="#111827" text-anchor="middle" font-weight="normal">It never stops by itself: I choose how many letters.</text></svg>
