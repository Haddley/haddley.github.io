" text-anchor="end" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><rect x="150" y="154" width="13" height="13" rx="2" fill="#f5e1d9" stroke="#ffffff" stroke-width="0.5"/><rect x="165" y="154" width="13" height="13" rx="2" fill="#f6e2da" stroke="#ffffff" stroke-width="0.5"/><rect x="180" y="154" width="13" height="13" rx="2" fill="#cfddfb" stroke="#ffffff" stroke-width="0.5"/><rect x="195" y="154" width="13" height="13" rx="2" fill="#c3d4f9" stroke="#ffffff" stroke-width="0.5"/><rect x="210" y="154" width="13" height="13" rx="2" fill="#d7e2fb" stroke="#ffffff" stroke-width="0.5"/><rect x="225" y="154" width="13" height="13" rx="2" fill="#dde7fc" stroke="#ffffff" stroke-width="0.5"/><rect x="240" y="154" width="13" height="13" rx="2" fill="#f3dacf" stroke="#ffffff" stroke-width="0.5"/><rect x="255" y="154" width="13" height="13" rx="2" fill="#f5e0d7" stroke="#ffffff" stroke-width="0.5"/><rect x="270" y="154" width="13" height="13" rx="2" fill="#d1defb" stroke="#ffffff" stroke-width="0.5"/><rect x="285" y="154" width="13" height="13" rx="2" fill="#f5e0d8" stroke="#ffffff" stroke-width="0.5"/><rect x="300" y="154" width="13" height="13" rx="2" fill="#cfddfb" stroke="#ffffff" stroke-width="0.5"/><rect x="315" y="154" width="13" height="13" rx="2" fill="#f3d9cf" stroke="#ffffff" stroke-width="0.5"/><text x="334" y="164" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">…</text><text x="136" y="185" font-size="13" fill="#111827" text-anchor="end" font-weight="bold" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><rect x="150" y="174" width="13" height="13" rx="2" fill="#f5e1d9" stroke="#ffffff" stroke-width="0.5"/><rect x="165" y="174" width="13" height="13" rx="2" fill="#f3dbd1" stroke="#ffffff" stroke-width="0.5"/><rect x="180" y="174" width="13" height="13" rx="2" fill="#dae4fc" stroke="#ffffff" stroke-width="0.5"/><rect x="195" y="174" width="13" height="13" rx="2" fill="#d0ddfb" stroke="#ffffff" s