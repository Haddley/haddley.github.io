<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 570" role="img" aria-label="One head slice of attention: block 1, slice 1, for goo. First, match_scores: each position&#x27;s looking query times each position&#x27;s looked-at key. Row g: 13.40, then 2.44 and minus 11.67 hidden. Row o at position 2: 23.02, minus 2.61, then minus 9.32 hidden. Row o at position 3: minus 2.19, 15.60, minus 3.62. Later positions are hidden: set to minus infinity. Then divide by the square root of 32 and softmax, giving attention_shares. Row g: 100 percent to itself. Row o at position 2: 98.9 percent to g, 1.1 percent to itself. Row o at position 3: 4.0 percent to g, 92.9 percent to the first o, 3.1 percent to itself. Then each position collects the passed-on values in those shares." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="440" height="570" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">One head slice: block 1, slice 1, for “goo”</text><text x="20" y="50" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Rows: the position looking. Columns: the position looked at.</text><text x="20" y="80" font-size="12.5" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">match_scores</text><text x="20" y="97" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">each looking query × each looked-at key, multiplied and added up</text><text x="178.0" y="122" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">1: g</text><text x="274.0" y="122" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">2: o</text><text x="370.0" y="122" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="ui-monospa