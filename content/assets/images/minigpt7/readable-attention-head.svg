t="normal" font-family="ui-monospace, Menlo, Consolas, monospace">3: o</text><rect x="132" y="426" width="92" height="30" rx="4" fill="rgba(37,99,235,0.10)" stroke="#e5e7eb" stroke-width="1"/><text x="178.0" y="446" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">4.0%</text><rect x="228" y="426" width="92" height="30" rx="4" fill="rgba(37,99,235,0.54)" stroke="#e5e7eb" stroke-width="1"/><text x="274.0" y="446" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">92.9%</text><rect x="324" y="426" width="92" height="30" rx="4" fill="rgba(37,99,235,0.10)" stroke="#e5e7eb" stroke-width="1"/><text x="370.0" y="446" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3.1%</text><line x1="220" y1="466" x2="220" y2="501" stroke="#6b7280" stroke-width="1.8"/><path d="M220 508 L215 500 L225 500 Z" fill="#6b7280"/><text x="232" y="484" font-size="11" fill="#c2410c" text-anchor="start" font-weight="normal">collect the passed-on values,</text><text x="232" y="499" font-size="11" fill="#c2410c" text-anchor="start" font-weight="normal">in those shares</text><rect x="20" y="514" width="400" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="220" y="533" font-size="12" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">what_this_head_slice_collected</text><text x="220" y="550" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="normal">for each position: 32 numbers; row 3 is mostly position 2&#x27;s value</text></svg>
