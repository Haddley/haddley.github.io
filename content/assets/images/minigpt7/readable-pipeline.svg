nospace, Menlo, Consolas, monospace">final_hidden_state = normalise(…)</text><rect x="342" y="437" width="66" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="375.0" y="452" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">128</text><line x1="220" y1="490" x2="220" y2="505" stroke="#6b7280" stroke-width="1.8"/><path d="M220 512 L215 504 L225 504 Z" fill="#6b7280"/><rect x="20" y="512" width="400" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><circle cx="38" cy="532" r="10" fill="#2563eb"/><text x="38" y="536" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="56" y="536" font-size="13" fill="#111827" text-anchor="start" font-weight="600">Score every letter that could come next</text><text x="56" y="555" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">scores = model.next_letter_rows @ … + …</text><text x="56" y="568" font-size="10" fill="#2563eb" text-anchor="start" font-weight="normal">d 8.58,  k 3.45,  r 3.41,  … 62 more</text><rect x="342" y="521" width="66" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="375.0" y="536" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">65</text><line x1="220" y1="574" x2="220" y2="589" stroke="#6b7280" stroke-width="1.8"/><path d="M220 596 L215 588 L225 588 Z" fill="#6b7280"/><rect x="20" y="596" width="400" height="62" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/><circle cx="38" cy="616" r="10" fill="#c2410c"/><text x="38" y="620" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">7</text><text x="56" y="620" font-size="13" fill="#111827" text-anchor="start" font-weight="600">Turn the scores into chances</text><text x="56" y="639" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">chances = chances_from_scores(…)</text><text x="56" y="652" font-size="10" fill="#c2410c" text-anchor="start" font-weight="normal">d 96.6%,  k 0.6%,  r 0.6%,  …</text><rect x="342" y="605" width="66" height="22" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="375.0" y="620" font-size="10.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">65</text><line x1="220" y1="658" x2="220" y2="673" stroke="#6b7280" stroke-width="1.8"/><path d="M220 680 L215 672 L225 672 Z" fill="#6b7280"/><rect x="20" y="680" width="400" height="62" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/><circle cx="38" cy="700" r="10" fill="#c2410c"/><text x="38" y="704" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">8</text><text x="56" y="704" font-size="13" fill="#111827" text-anchor="start" font-weight="600">Spin the wheel</text><text x="56" y="723" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">next_letter_id = spin_the_wheel(…)</text><text x="56" y="736" font-size="10" fill="#c2410c" text-anchor="start" font-weight="normal">lands on d, almost every time</text><rect x="341.2" y="689" width="66.8" height="22" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.6" y="704" font-size="10.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">1 letter</text><text x="220" y="774" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">Then the text grows by one letter, and all eight steps run again.</text></svg>
