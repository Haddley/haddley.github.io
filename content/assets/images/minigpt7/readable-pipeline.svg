<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 788" role="img" aria-label="choose_next_letter, the whole readable program, for the text goo, one box per line of code. The model, using fixed trained numbers: look up each letter&#x27;s ID, 45 53 53; give each letter its first vector, token embedding plus position embedding, 3 by 128; run the four blocks, each adding attention then the MLP, still 3 by 128; keep only the last letter&#x27;s vector, 128 numbers; normalise it, giving the final hidden state; score every letter that could come next, 65 scores, d 8.58, k 3.45, r 3.41. Then choosing, using settings you pick: turn the scores into chances, d 96.6 percent; spin the wheel, which lands on d almost every time." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="440" height="788" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">choose_next_letter, for “goo”</text><text x="20" y="50" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Each box is one line of the function, in order.</text><text x="20" y="66" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Blue: the fixed trained numbers.  Orange: settings you pick.</text><rect x="20" y="92" width="400" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><circle cx="38" cy="112" r="10" fill="#2563eb"/><text x="38" y="116" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="56" y="116" font-size="13" fill="#111827" text-anchor="start" font-weight="600">Look up each letter&#x27;s ID</text><text x="56" y="135" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">letter_ids = letters_to_ids(text)</text><rect x="314.8" y="101" width="93.19999999999999" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text 