<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-label="One block, for position 3 of goo, with the first three of its 128 numbers. hidden_states_entering starts 0.019, -0.080, 0.013, size 0.50. attention works out attention_contribution, starting 0.057, 0.002, 0.019, which is added: hidden_states_after_attention starts 0.076, -0.079, 0.033, size 0.84. The MLP works out mlp_contribution, starting 0.031, 0.038, 0.111, which is added: hidden_states_leaving starts 0.107, -0.041, 0.143, size 2.16. Nothing is replaced; each part only adds." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="440" height="520" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">One block: add, never replace</text><text x="20" y="50" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Position 3 of “goo”, block 1: the first 3 of each vector&#x27;s 128 numbers</text><rect x="20" y="72" width="250" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="32" y="94" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">hidden_states_entering</text><text x="32" y="116" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">[0.019, −0.080, 0.013, …]</text><text x="258" y="116" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal">size 0.50</text><rect x="284" y="108" width="144" height="74" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.2"/><text x="356" y="126" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">attention</text><text x="356" y="142" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">attention(…)</text><text x="356" y="160" font-size="9" fill="#111827" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">attention_contribution</text><text x="356" y="174" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">[0.057, 0.002, …]</text><line x1="270" y1="100" x2="279.4" y2="113.4" stroke="#c2410c" stroke-width="1.8"/><path d="M284 120 L275.3 116.3 L283.5 110.6 Z" fill="#c2410c"/><line x1="145" y1="130" x2="145" y2="175" stroke="#6b7280" stroke-width="1.8"/><path d="M145 182 L140 174 L150 174 Z" fill="#6b7280"/><circle cx="145" cy="195" r="13" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="145" y="201" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="700">+</text><text x="166" y="199" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">0.019 + 0.057 = 0.076</text><line x1="284" y1="168" x2="167.9" y2="188.6" stroke="#c2410c" stroke-width="1.8"/><path d="M160 190 L167.0 183.7 L168.8 193.5 Z" fill="#c2410c"/><line x1="145" y1="208" x2="145" y2="231" stroke="#6b7280" stroke-width="1.8"/><path d="M145 238 L140 230 L150 230 Z" fill="#6b7280"/><rect x="20" y="240" width="250" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="32" y="262" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">hidden_states_after_attention</text><text x="32" y="284" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">[0.076, −0.079, 0.033, …]</text><text x="258" y="284" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal">size 0.84</text><rect x="284" y="276" width="144" height="74" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.2"/><text x="356" y="294" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">MLP</text><text x="356" y="310" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">mlp(…)</text><text x="356" y="328" font-size="9" fill="#111827" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">mlp_contribution</text><text x="356" y="342" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">[0.031, 0.038, …]</text><line x1="270" y1="268" x2="279.4" y2="281.4" stroke="#c2410c" stroke-width="1.8"/><path d="M284 288 L275.3 284.3 L283.5 278.6 Z" fill="#c2410c"/><line x1="145" y1="298" x2="145" y2="343" stroke="#6b7280" stroke-width="1.8"/><path d="M145 350 L140 342 L150 342 Z" fill="#6b7280"/><circle cx="145" cy="363" r="13" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="145" y="369" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="700">+</text><text x="166" y="367" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">0.076 + 0.031 = 0.107</text><line x1="284" y1="336" x2="167.9" y2="356.6" stroke="#c2410c" stroke-width="1.8"/><path d="M160 358 L167.0 351.7 L168.8 361.5 Z" fill="#c2410c"/><line x1="145" y1="376" x2="145" y2="399" stroke="#6b7280" stroke-width="1.8"/><path d="M145 406 L140 398 L150 398 Z" fill="#6b7280"/><rect x="20" y="408" width="250" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="32" y="430" font-size="11.5" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">hidden_states_leaving</text><text x="32" y="452" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">[0.107, −0.041, 0.143, …]</text><text x="258" y="452" font-size="10" fill="#6b7280" text-anchor="end" font-weight="normal">size 2.16</text><text x="20" y="496" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">Each part works out something to add. Nothing that was there is thrown away.</text></svg>
