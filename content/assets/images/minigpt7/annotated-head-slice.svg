<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 811" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The head-slice loop of attention, line by line. Slice 1 is columns 0 to 31, slice 2 is 32 to 63, and so on; each slice keeps every row but only its 32 columns. match_scores: row i, column j is position i&#x27;s looking query times position j&#x27;s looked-at key. Divide by the square root of 32: the 2017 authors suspect it keeps softmax from getting stuck. masked_fill turns later positions into minus infinity, so they get a share of exactly 0. scores_to_shares: softmax, so each row adds up to 1. attention_shares @ head_passed_on_values: for each position, its shares times every passed-on value, added up, giving 32 numbers."><rect width="690" height="811" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">One head slice of attention, line by line</text><text x="24" y="52" font-size="12" fill="#6b7280">From readable_minigpt.py, with its comments taken out: the notes replace them</text><rect x="16" y="66" width="658" height="731" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="90" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">for head_slice in range(HEADS_PER_BLOCK):</text><text x="30" y="116" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    first_column = head_slice * NUMBERS_PER_HEAD</text><path d="M161.7 121 L362.6 121" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M167.7 138.0 L167.7 132.0" stroke="#c2410c" stroke-width="1.6"/><path d="M167.7 124.0 L171.3 132.2 L164.0 132.2 Z" fill="#c2410c"/><text x="161.7" y="153.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">slice 1 is columns 0 to 31, slice 2 is 32 to 63, …</text><text x="30" y="187" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    after_last_column = first_column + NUMBERS_PER_HEAD</text><text x="30" y="213" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    head_looking_queries = looking_queries[:, first_column:after_last_column]</text><path d="M321.1 218 L563.6 218" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M327.1 235.0 L327.1 229.0" stroke="#c2410c" stroke-width="1.6"/><path d="M327.1 221.0 L330.7 229.2 L323.4 229.2 Z" fill="#c2410c"/><text x="321.1" y="250.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">every row, but only this slice&#x27;s 32 columns</text><text x="30" y="284" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    head_looked_at_keys = looked_at_keys[:, first_column:after_last_column]</text><text x="30" y="310" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    head_passed_on_values = passed_on_values[:, first_column:after_last_column]</text><text x="30" y="336" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    match_scores = head_looking_queries @ head_looked_at_keys.T</text><path d="M161.7 341 L466.6 341" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M167.7 358.0 L167.7 352.0" stroke="#c2410c" stroke-width="1.6"/><path d="M167.7 344.0 L171.3 352.2 L164.0 352.2 Z" fill="#c2410c"/><text x="161.7" y="373.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">row i, column j: position i&#x27;s looking query</text><text x="161.7" y="392.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">· position j&#x27;s looked-at key</text><text x="30" y="426" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    shrunk_scores = match_scores / math.sqrt(NUMBERS_PER_HEAD)</text><path d="M258.7 431 L459.7 431" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M264.7 448.0 L264.7 442.0" stroke="#c2410c" stroke-width="1.6"/><path d="M264.7 434.0 L268.4 442.2 L261.0 442.2 Z" fill="#c2410c"/><text x="258.7" y="463.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">÷ √32: the 2017 authors &quot;suspect&quot; it keeps</text><text x="258.7" y="482.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">softmax from getting stuck</text><text x="30" y="516" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    scores_without_later_positions = shrunk_scores.masked_fill(~may_look_at, float(&quot;-inf&quot;))</text><path d="M383.4 521 L660.6 521" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M373.4 538.0 L387.4 532.0" stroke="#c2410c" stroke-width="1.6"/><path d="M387.4 524.0 L384.2 532.4 L379.0 527.2 Z" fill="#c2410c"/><text x="367.4" y="553.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">later positions become minus infinity,</text><text x="367.4" y="572.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">so they get a share of exactly 0</text><text x="30" y="606" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    attention_shares = scores_to_shares(scores_without_later_positions)</text><path d="M189.4 611 L522.0 611" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M195.4 628.0 L195.4 622.0" stroke="#c2410c" stroke-width="1.6"/><path d="M195.4 614.0 L199.1 622.2 L191.7 622.2 Z" fill="#c2410c"/><text x="189.4" y="643.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">softmax: each row now adds up to 1</text><text x="30" y="677" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    what_this_head_slice_collected = attention_shares @ head_passed_on_values</text><path d="M286.4 682 L563.6 682" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M292.4 699.0 L292.4 693.0" stroke="#c2410c" stroke-width="1.6"/><path d="M292.4 685.0 L296.1 693.2 L288.7 693.2 Z" fill="#c2410c"/><text x="286.4" y="714.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">for each position: its shares × every</text><text x="286.4" y="733.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">passed-on value, added up: 32 numbers</text><text x="30" y="767" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    findings_of_each_head_slice.append(what_this_head_slice_collected)</text></svg>
