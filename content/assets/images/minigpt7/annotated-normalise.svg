<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 759 598" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="normalise, line by line. vectors.mean gives the average of each row&#x27;s 128 numbers. vectors minus the average gives how far each number is from its row&#x27;s average. The mean of the squared distances is the variance. Its square root is the spread, the standard deviation; the tiny number only stops a divide by zero. Dividing by the spread means every row now averages 0 with a spread of 1. Then each of the 128 numbers gets its own trained stretch and shift."><rect width="759" height="598" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">Normalising, line by line</text><text x="24" y="52" font-size="12" fill="#6b7280">From readable_minigpt.py, with its comments taken out: the notes replace them</text><rect x="16" y="66" width="727" height="518" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="90" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">def normalise(vectors, stretch, shift):</text><text x="30" y="116" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    average_of_each_row = vectors.mean(dim=-1, keepdim=True)</text><path d="M210.2 121 L445.8 121" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M216.2 138.0 L216.2 132.0" stroke="#c2410c" stroke-width="1.6"/><path d="M216.2 124.0 L219.8 132.2 L212.5 132.2 Z" fill="#c2410c"/><text x="210.2" y="153.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the average of each row&#x27;s 128 numbers</text><text x="30" y="187" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    distance_from_average = vectors - average_of_each_row</text><path d="M224.0 192 L425.0 192" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M230.0 209.0 L230.0 203.0" stroke="#c2410c" stroke-width="1.6"/><path d="M230.0 195.0 L233.7 203.2 L226.4 203.2 Z" fill="#c2410c"/><text x="224.0" y="224.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">how far each number is from its row&#x27;s average</text><text x="30" y="258" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    average_squared_distance = (distance_from_average ** 2).mean(dim=-1, keepdim=True)</text><path d="M244.8 263 L626.0 263" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M250.8 280.0 L250.8 274.0" stroke="#c2410c" stroke-width="1.6"/><path d="M250.8 266.0 L254.5 274.2 L247.2 274.2 Z" fill="#c2410c"/><text x="244.8" y="295.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the average squared distance (the variance)</text><text x="30" y="329" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    spread_of_each_row = torch.sqrt(average_squared_distance + TINY_NUMBER_TO_AVOID_DIVIDING_BY_ZERO)</text><path d="M203.2 334 L729.9 334" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M209.2 351.0 L209.2 345.0" stroke="#c2410c" stroke-width="1.6"/><path d="M209.2 337.0 L212.9 345.2 L205.6 345.2 Z" fill="#c2410c"/><text x="203.2" y="366.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">its square root: the spread (standard deviation);</text><text x="203.2" y="385.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the tiny number only stops a divide by 0</text><text x="30" y="419" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    standardised = distance_from_average / spread_of_each_row</text><path d="M161.7 424 L452.7 424" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M167.7 441.0 L167.7 435.0" stroke="#c2410c" stroke-width="1.6"/><path d="M167.7 427.0 L171.3 435.2 L164.0 435.2 Z" fill="#c2410c"/><text x="161.7" y="456.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">now every row averages 0, with a spread of 1</text><text x="30" y="490" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    return standardised * stretch + shift</text><path d="M106.2 495 L314.1 495" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M112.2 512.0 L112.2 506.0" stroke="#c2410c" stroke-width="1.6"/><path d="M112.2 498.0 L115.9 506.2 L108.6 506.2 Z" fill="#c2410c"/><text x="106.2" y="527.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">each of the 128 numbers gets its own</text><text x="106.2" y="546.0" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">trained stretch and shift</text></svg>
