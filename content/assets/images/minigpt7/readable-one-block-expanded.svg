<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 932" role="img" aria-label="run_one_block expanded, for block 1 and the text goo, with the shape of the data at each step. hidden_states_entering, 3 by 128, goes into attention. Inside attention: normalise each row, 3 by 128; make three vectors from each row, the looking queries, looked-at keys and passed-on values, each 3 by 128; for each of the 4 head slices, match, divide by the square root of 32, hide later positions and softmax, giving 3 by 3 attention shares; collect the passed-on values, 3 by 32 per slice; lay the 4 slices side by side, 3 by 128; and mix them with one more table, giving attention_contribution. A line carries hidden_states_entering around attention to a plus, which adds them: hidden_states_after_attention, 3 by 128. Inside the MLP: normalise each row; widen each row to 512 numbers; bend every number; narrow each row back to 128, giving mlp_contribution. Another line carries the hidden states around the MLP to a second plus: hidden_states_leaving, 3 by 128. Only the plus steps change the hidden states; everything inside attention and the MLP is worked out, added, and thrown away." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="440" height="932" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">run_one_block, expanded: block 1, for “goo”</text><text x="20" y="50" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Every step inside one block, with the shape of its data.</text><text x="20" y="65" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">The line on the left carries the hidden states around each part.</text><rect x="44" y="80" width="376" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="58" y="105" font-size="12" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">hidden_states_entering</text><rect x="336" y="89" width="72" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="372" y="104" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><line x1="236" y1="120" x2="236" y2="131" stroke="#6b7280" stroke-width="1.8"/><path d="M236 138 L231 130 L241 130 Z" fill="#6b7280"/><rect x="56" y="138" width="364" height="300" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="6 4"/><text x="68" y="158" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">attention(hidden_states_entering, block)</text><rect x="66" y="168" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="182" font-size="11" fill="#111827" text-anchor="start" font-weight="600">normalise each row</text><text x="76" y="196" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">normalise(…, stretch_before_attention, …)</text><rect x="346.6" y="174" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="188" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><rect x="66" y="208" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="222" font-size="11" fill="#111827" text-anchor="start" font-weight="600">make three vectors from each row</text><text x="76" y="236" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">looking_queries, looked_at_keys, passed_on_values</text><rect x="346.6" y="214" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="228" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><rect x="66" y="248" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="262" font-size="11" fill="#111827" text-anchor="start" font-weight="600">each head slice: match, ÷ √32, hide, softmax</text><text x="76" y="276" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">attention_shares, for each of the 4 slices</text><rect x="334.2" y="254" width="67.80000000000001" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="368.1" y="268" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 3, ×4</text><rect x="66" y="288" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="302" font-size="11" fill="#111827" text-anchor="start" font-weight="600">each head slice: collect passed-on values</text><text x="76" y="316" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">what_this_head_slice_collected</text><rect x="328.0" y="294" width="74.0" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="365.0" y="308" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 32, ×4</text><rect x="66" y="328" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="342" font-size="11" fill="#111827" text-anchor="start" font-weight="600">lay the 4 slices side by side</text><text x="76" y="356" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">torch.cat(findings_of_each_head_slice, …)</text><rect x="346.6" y="334" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="348" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><rect x="66" y="368" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="382" font-size="11" fill="#111827" text-anchor="start" font-weight="600">mix them with one more table</text><text x="76" y="396" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">apply_weights(…, head_mixing_weights, …)</text><rect x="346.6" y="374" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="388" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><text x="248" y="426" font-size="10.5" fill="#c2410c" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">attention_contribution</text><line x1="236" y1="438" x2="236" y2="445" stroke="#6b7280" stroke-width="1.8"/><path d="M236 452 L231 444 L241 444 Z" fill="#6b7280"/><path d="M44 100 L30 100 L30 464 L216 464" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="210" y1="464" x2="215.0" y2="464.0" stroke="#2563eb" stroke-width="1.8"/><path d="M223 464 L215.0 469.0 L215.0 459.0 Z" fill="#2563eb"/><circle cx="236" cy="464" r="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="236" y="470" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">+</text><text x="256" y="468" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">add, never replace</text><line x1="236" y1="476" x2="236" y2="491" stroke="#6b7280" stroke-width="1.8"/><path d="M236 498 L231 490 L241 490 Z" fill="#6b7280"/><rect x="44" y="498" width="376" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="58" y="523" font-size="12" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">hidden_states_after_attention</text><rect x="336" y="507" width="72" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="372" y="522" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><line x1="236" y1="538" x2="236" y2="549" stroke="#6b7280" stroke-width="1.8"/><path d="M236 556 L231 548 L241 548 Z" fill="#6b7280"/><rect x="56" y="556" width="364" height="220" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="6 4"/><text x="68" y="576" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">mlp(hidden_states_after_attention, block)</text><rect x="66" y="586" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="600" font-size="11" fill="#111827" text-anchor="start" font-weight="600">normalise each row</text><text x="76" y="614" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">normalise(…, stretch_before_mlp, …)</text><rect x="346.6" y="592" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="606" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><rect x="66" y="626" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="640" font-size="11" fill="#111827" text-anchor="start" font-weight="600">widen each row</text><text x="76" y="654" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">apply_weights(…, widen_weights, …)</text><rect x="346.6" y="632" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="646" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 512</text><rect x="66" y="666" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="680" font-size="11" fill="#111827" text-anchor="start" font-weight="600">bend every number</text><text x="76" y="694" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">bend(widened)</text><rect x="346.6" y="672" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="686" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 512</text><rect x="66" y="706" width="344" height="34" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/><text x="76" y="720" font-size="11" fill="#111827" text-anchor="start" font-weight="600">narrow each row back</text><text x="76" y="734" font-size="9" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">apply_weights(…, narrow_weights, …)</text><rect x="346.6" y="712" width="55.4" height="20" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="1"/><text x="374.3" y="726" font-size="9.5" fill="#c2410c" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><text x="248" y="764" font-size="10.5" fill="#c2410c" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">mlp_contribution</text><line x1="236" y1="776" x2="236" y2="783" stroke="#6b7280" stroke-width="1.8"/><path d="M236 790 L231 782 L241 782 Z" fill="#6b7280"/><path d="M44 518 L30 518 L30 802 L216 802" fill="none" stroke="#2563eb" stroke-width="2"/><line x1="210" y1="802" x2="215.0" y2="802.0" stroke="#2563eb" stroke-width="1.8"/><path d="M223 802 L215.0 807.0 L215.0 797.0 Z" fill="#2563eb"/><circle cx="236" cy="802" r="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="236" y="808" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">+</text><text x="256" y="806" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">add again</text><line x1="236" y1="814" x2="236" y2="829" stroke="#6b7280" stroke-width="1.8"/><path d="M236 836 L231 828 L241 828 Z" fill="#6b7280"/><rect x="44" y="836" width="376" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><text x="58" y="861" font-size="12" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">hidden_states_leaving</text><rect x="336" y="845" width="72" height="22" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="372" y="860" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">3 × 128</text><text x="20" y="902" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">Only the + steps change the hidden states. Everything in the orange</text><text x="20" y="918" font-size="10.5" fill="#111827" text-anchor="start" font-weight="normal">frames is worked out, added, and then thrown away.</text></svg>
