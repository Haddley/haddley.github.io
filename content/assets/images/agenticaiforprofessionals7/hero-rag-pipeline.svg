<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <circle cx="60" cy="60" r="58" fill="#1a2b4b" />
  <!-- Question node -->
  <circle cx="24" cy="60" r="9" fill="#ffffff" opacity="0.95"/>
  <!-- Arrow to embedding vector -->
  <line x1="33" y1="60" x2="50" y2="60" stroke="#80deea" stroke-width="2" opacity="0.7"/>
  <!-- Vector dots cluster (embedding space) -->
  <circle cx="60" cy="42" r="3" fill="#4fc3f7"/>
  <circle cx="72" cy="48" r="3" fill="#4fc3f7"/>
  <circle cx="66" cy="60" r="4" fill="#ffffff"/>
  <circle cx="80" cy="60" r="3" fill="#4fc3f7"/>
  <circle cx="70" cy="74" r="3" fill="#4fc3f7"/>
  <circle cx="58" cy="78" r="3" fill="#4fc3f7"/>
  <!-- Nearest-neighbour lines from the query point -->
  <line x1="66" y1="60" x2="60" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="66" y1="60" x2="72" y2="48" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="66" y1="60" x2="80" y2="60" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="66" y1="60" x2="70" y2="74" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
  <line x1="66" y1="60" x2="58" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
