<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A click on a customer card starts a flow that decides to block the customer or send an email</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<rect class="f" style="animation-delay:0s" x="8" y="22" width="30" height="52" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><circle cx="23" cy="35" r="6" fill="#5bb4ea"/>
<rect class="p" style="animation-delay:0.4s" x="12" y="56" width="22" height="10" rx="3" fill="#ffb43a"/>
<path class="d" style="animation-delay:0.9s" pathLength="1" d="M34,61 H46 V21 H54" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect class="p" style="animation-delay:1.4s" x="54" y="14" width="34" height="14" rx="4" fill="#5bb4ea"/>
<path class="d" style="animation-delay:1.8s" pathLength="1" d="M71,28 V38" stroke="#5bb4ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="p" style="animation-delay:2.1s" d="M71,38 L85,50 L71,62 L57,50 Z" fill="#1c2a3d" stroke="#ffb43a" stroke-width="1.5"/>
<path class="d" style="animation-delay:2.6s" pathLength="1" d="M85,50 H100 V70 M71,62 V76" stroke="#5bb4ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect class="p" style="animation-delay:3.0s" x="88" y="70" width="24" height="14" rx="4" fill="#d9483b"/>
<rect class="p" style="animation-delay:3.3s" x="57" y="76" width="28" height="14" rx="4" fill="#2f9e4a"/>
</svg>
