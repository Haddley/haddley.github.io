<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A plugin action that a copilot calls with inputs the model chose</title><style>@keyframes fade{0%{opacity:0}16.33%,46.67%,100%{opacity:1}}
