<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Read first, then answer</title><desc>The harness has two MCP servers. It searches Microsoft Learn for what an action does, reads the real order from Business Central without changing it, and combines the two in its answer with sources.</desc>
<style>.bg{fill:#0f1b2d}.box{fill:#162740;stroke-width:2}.t{fill:#e8f0fb;font-size:17px;font-weight:700}.s{fill:#9fb3cc;font-size:13px}.cap{font-size:15px;font-weight:700}.ln{fill:none;stroke-width:3}.lb{fill:#9fb3cc;font-size:12px}.num{fill:#9fb3cc;font-size:12px;font-weight:700}
@keyframes a_p{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_p{animation:a_p 16.0s infinite;opacity:0.3}
@keyframes a_h{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}25.40%{opacity:0.3}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_h{animation:a_h 16.0s infinite;opacity:0.3}
@keyframes a_l{0.00%{opacity:0.3}25.40%{opacity:0.3}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0.3}100.00%{opacity:0.3}}.a_l{animation:a_l 16.0s infinite;opacity:0.3}
@keyframes a_b{0.00%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}100.00%{opacity:0.3}}.a_b{animation:a_b 16.0s infinite;opacity:0.3}
@keyframes a_e1{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e1{animation:a_e1 16.0s infinite;opacity:0.3}
@keyframes a_e2{0.00%{opacity:0.3}25.40%{opacity:0.3}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e2{animation:a_e2 16.0s infinite;opacity:0.3}
@keyframes a_e3{0.00%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e3{animation:a_e3 16.0s infinite;opacity:0.3}
@keyframes a_e4{0.00%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e4{animation:a_e4 16.0s infinite;opacity:0.3}
@keyframes c0{0.00%{opacity:0}0.40%{opacity:0}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0}100.00%{opacity:0}}.c0{animation:c0 16.0s infinite;opacity:0}
@keyframes c1{0.00%{opacity:0}25.40%{opacity:0}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0}100.00%{opacity:0}}.c1{animation:c1 16.0s infinite;opacity:0}
@keyframes c2{0.00%{opacity:0}50.40%{opacity:0}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0}100.00%{opacity:0}}.c2{animation:c2 16.0s infinite;opacity:0}
@keyframes c3{0.00%{opacity:0}75.40%{opacity:0}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0}100.00%{opacity:0}}.c3{animation:c3 16.0s infinite;opacity:0}
@media (prefers-reduced-motion:reduce){.a_p{animation:none;opacity:1}.a_h{animation:none;opacity:1}.a_l{animation:none;opacity:1}.a_b{animation:none;opacity:1}.a_e1{animation:none;opacity:1}.a_e2{animation:none;opacity:1}.a_e3{animation:none;opacity:1}.a_e4{animation:none;opacity:1}.cp{display:none}.still{display:block}}
.still{display:none}</style>
<defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5eb4ef"/></marker><marker id="m_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c084fc"/></marker></defs>
<rect class="bg" width="960" height="420" rx="18"/>
<text class="t" x="24" y="34" style="font-size:19px">Read first, then answer</text>
<g class="a_e1"><path class="ln" d="M170 195 L230 195" stroke="#5eb4ef" marker-end="url(#m_blue)"/>
</g>
<g class="a_e2"><path class="ln" d="M430 175 L600 110" stroke="#c084fc" marker-end="url(#m_purple)"/>
<text class="lb" x="515.0" y="132.5" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">search</text>
</g>
<g class="a_e3"><path class="ln" d="M430 215 L600 285" stroke="#fbbf24" marker-end="url(#m_amber)"/>
<text class="lb" x="515.0" y="240.0" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">look up</text>
</g>
<g class="a_e4"><path class="ln" d="M230 225 L170 225" stroke="#4ade80" marker-end="url(#m_green)"/>
</g>
<g class="a_p"><rect class="box" x="20" y="150" width="150" height="90" rx="12" stroke="#5eb4ef"/>
<text class="t" x="95.0" y="176" text-anchor="middle">The person</text>
<text class="s" x="95.0" y="198" text-anchor="middle">asks a question</text>
</g>
<g class="a_h"><rect class="box" x="230" y="150" width="200" height="90" rx="12" stroke="#5eb4ef"/>
<text class="t" x="330.0" y="176" text-anchor="middle">Harness and AI</text>
<text class="s" x="330.0" y="198" text-anchor="middle">two MCP servers</text>
</g>
<g class="a_l"><rect class="box" x="600" y="50" width="320" height="100" rx="12" stroke="#c084fc"/>
<text class="t" x="760.0" y="76" text-anchor="middle">Microsoft Learn</text>
<text class="s" x="760.0" y="98" text-anchor="middle">what does Ship and Invoice do?</text>
<text class="s" x="760.0" y="115" text-anchor="middle">public, no sign-in</text>
</g>
<g class="a_b"><rect class="box" x="600" y="240" width="320" height="100" rx="12" stroke="#fbbf24"/>
<text class="t" x="760.0" y="266" text-anchor="middle">Business Central</text>
<text class="s" x="760.0" y="288" text-anchor="middle">what is in order S-ORD101021?</text>
<text class="s" x="760.0" y="305" text-anchor="middle">read only</text>
</g>
<g class="cp c0"><circle cx="40" cy="386" r="13" fill="#5eb4ef"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">1</text><text class="cap" x="64" y="391" fill="#5eb4ef">You ask it to read the documentation first.</text></g>
<g class="cp c1"><circle cx="40" cy="386" r="13" fill="#c084fc"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">2</text><text class="cap" x="64" y="391" fill="#c084fc">It searches Microsoft Learn for what the action does.</text></g>
<g class="cp c2"><circle cx="40" cy="386" r="13" fill="#fbbf24"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">3</text><text class="cap" x="64" y="391" fill="#fbbf24">It reads the real order in Business Central. Nothing is changed.</text></g>
<g class="cp c3"><circle cx="40" cy="386" r="13" fill="#4ade80"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">4</text><text class="cap" x="64" y="391" fill="#4ade80">It puts the two together, with its sources.</text></g>
<text class="s still" x="24" y="391">Animation paused. The steps are listed in the text below.</text>
</svg>