<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A magnifying glass moves over the open book: looking things up</title><style>.a{animation-duration:4.5s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}.mg{animation-name:mg}@keyframes mg{0%,15%{transform:translate(-30px,-26px);opacity:0}60%,100%{transform:translate(0,0);opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><path d="M14 36 q22 -8 36 2 v46 q-14 -10 -36 -2z" fill="#e0f2fe"/><path d="M60 38 q14 -10 36 -2 v46 q-22 -8 -36 2z" fill="#7dd3fc"/><g stroke="#0f1b2d" stroke-width="2.5" stroke-linecap="round"><path d="M22 48 h20 M22 58 h18 M70 48 h18 M70 58 h14"/></g><g class="a mg"><circle cx="86" cy="80" r="11" fill="none" stroke="#fbbf24" stroke-width="5"/><path d="M94 88 l12 12" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/></g></svg>