<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A microphone feeding a recording waveform: the Raspberry Pi voice kit recorder</title><style>@keyframes fade{0%{opacity:0}18.01%,51.47%,100%{opacity:1}}
