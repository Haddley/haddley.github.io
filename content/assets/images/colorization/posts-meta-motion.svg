<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A black and white photo colourised by a deep learning model</title><style>@keyframes fade{0%{opacity:0}15.71%,44.87%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}26.92%,44.87%,100%{stroke-dashoffset:0}}
