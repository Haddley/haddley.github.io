<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 520" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The posting call, line by line. The token comes from the signed-in user, so the posting carries that person name. The URL names one action on one sales order: ship and invoice. It is a plain web request, not an MCP tool, so the AI has no posting tool to find."><rect width="690" height="520" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">The one call that posts</text><text x="24" y="52" font-size="12" fill="#6b7280">From bc_api.py, trimmed. The notes are mine</text><rect x="16" y="66" width="658" height="438" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="90" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">r = subprocess.run([az, 'account', 'get-access-token', '--tenant', tenant,</text><path d="M279.5 95 L390.4 95" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M285.5 112 L285.5 106" stroke="#c2410c" stroke-width="1.6"/><path d="M285.5 98 L289.2 106.2 L281.8 106.2 Z" fill="#c2410c"/><text x="279.5" y="127" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the signed-in user's own token, so the</text><text x="279.5" y="146" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">posting carries your name</text><text x="30" y="180" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">                    '--resource', 'https://api.businesscentral.dynamics.com',</text><text x="30" y="206" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">                    '--query', 'accessToken', '-o', 'tsv'], capture_output=True, text=True)</text><text x="30" y="232" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">tok = r.stdout.strip()</text><text x="30" y="258" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"></text><text x="30" y="284" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">url = f'{base}/companies({cid})/salesOrders({order_id})/Microsoft.NAV.shipAndInvoice'</text><path d="M418.1 289 L612.1 289" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M424.1 306 L424.1 300" stroke="#c2410c" stroke-width="1.6"/><path d="M424.1 292 L427.8 300.2 L420.4 300.2 Z" fill="#c2410c"/><text x="418.1" y="321" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">one action on one sales order:</text><text x="418.1" y="340" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">ship and invoice, nothing else</text><text x="30" y="374" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">req = urllib.request.Request(url, data=b'{}', method='POST',</text><text x="30" y="400" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">                             headers={'Authorization': 'Bearer ' + tok})</text><path d="M411.1 405 L515.1 405" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M417.1 422 L417.1 416" stroke="#c2410c" stroke-width="1.6"/><path d="M417.1 408 L420.8 416.2 L413.4 416.2 Z" fill="#c2410c"/><text x="405.0" y="437" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">a plain web request. No MCP here,</text><text x="405.0" y="456" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">so no posting tool for the AI to find</text></svg>