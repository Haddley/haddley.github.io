<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" font-family="Arial, Helvetica, sans-serif">
<title>The map: who talks to what</title><desc>The person talks to the harness. The harness reads and drafts in Business Central through the Assistant configuration and can read Microsoft Learn. To post, the model asks for request_posting and the harness runs the add-on, which shows the person a review card and, after Approve, posts through the separate Posting configuration.</desc>
