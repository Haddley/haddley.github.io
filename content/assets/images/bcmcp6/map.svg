<defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5eb4ef"/></marker><marker id="m_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c084fc"/></marker></defs>
<rect class="bg" width="960" height="450" rx="18"/>
<text class="t" x="24" y="34" style="font-size:19px">The map: who talks to what</text>
<g class="a_e1"><path class="ln" d="M170 215 L230 215" stroke="#5eb4ef" marker-end="url(#m_blue)"/>
<text class="lb" x="200.0" y="205.0" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">asks</text>
</g>
<g class="a_e2"><path class="ln" d="M430 215 L740 215" stroke="#fbbf24" marker-end="url(#m_amber)"/>
<text class="lb" x="585.0" y="205.0" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">Assistant configuration: read, drafts</text>
</g>
<g class="a_e3"><path class="ln" d="M430 185 L500 90" stroke="#c084fc" marker-end="url(#m_purple)"/>
<text class="lb" x="465.0" y="127.5" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">reads</text>
</g>
<g class="a_e4"><path class="ln" d="M430 245 L500 330" stroke="#4ade80" marker-end="url(#m_green)"/>
<text class="lb" x="465.0" y="277.5" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">request_posting(order)</text>
</g>
<g class="a_e5"><path class="ln" d="M720 345 L880 345 L880 270" stroke="#4ade80" marker-end="url(#m_green)"/>
<text class="lb" x="826.6666666666666" y="310.0" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">Posting configuration</text>
</g>
<g class="a_e6"><path class="ln" d="M500 360 L95 360 L95 260" stroke="#c084fc" marker-end="url(#m_purple)"/>
<text class="lb" x="230.0" y="316.6666666666667" text-anchor="middle" stroke="#0f1b2d" stroke-width="5" paint-order="stroke">review card</text>
</g>
<g class="a_p"><rect class="box" x="20" y="170" width="150" height="90" rx="12" stroke="#5eb4ef"/>
<text class="t" x="95.0" y="196" text-anchor="middle">The person</text>
</g>
<g class="a_h"><rect class="box" x="230" y="170" width="200" height="90" rx="12" stroke="#5eb4ef"/>
<text class="t" x="330.0" y="196" text-anchor="middle">Harness and AI</text>
<text class="s" x="330.0" y="218" text-anchor="middle">the model suggests,</text>
<text class="s" x="330.0" y="235" text-anchor="middle">the harness acts</text>
</g>
<g class="a_l"><rect class="box" x="500" y="40" width="220" height="80" rx="12" stroke="#c084fc"/>
<text class="t" x="610.0" y="66" text-anchor="middle">Microsoft Learn</text>
<text class="s" x="610.0" y="88" text-anchor="middle">documentation</text>
</g>
<g class="a_bc"><rect class="box" x="740" y="170" width="190" height="100" rx="12" stroke="#fbbf24"/>
<text class="t" x="835.0" y="196" text-anchor="middle">Business Central</text>
</g>
<g class="a_a"><rect class="box" x="500" y="300" width="220" height="90" rx="12" stroke="#4ade80"/>
<text class="t" x="610.0" y="326" text-anchor="middle">Posting add-on</text>
<text class="s" x="610.0" y="348" text-anchor="middle">request_posting</text>
</g>
<g class="cp c0"><circle cx="40" cy="416" r="13" fill="#5eb4ef"/><text class="num" x="40" y="420" text-anchor="middle" style="fill:#0f1b2d">1</text><text class="cap" x="64" y="421" fill="#5eb4ef">You ask the harness.</text></g>
<g class="cp c1"><circle cx="40" cy="416" r="13" fill="#fbbf24"/><text class="num" x="40" y="420" text-anchor="middle" style="fill:#0f1b2d">2</text><text class="cap" x="64" y="421" fill="#fbbf24">It reads Business Central and makes drafts, through the Assistant configuration.</text></g>
<g class="cp c2"><circle cx="40" cy="416" r="13" fill="#c084fc"/><text class="num" x="40" y="420" text-anchor="middle" style="fill:#0f1b2d">3</text><text class="cap" x="64" y="421" fill="#c084fc">It can read Microsoft Learn for documentation.</text></g>
<g class="cp c3"><circle cx="40" cy="416" r="13" fill="#4ade80"/><text class="num" x="40" y="420" text-anchor="middle" style="fill:#0f1b2d">4</text><text class="cap" x="64" y="421" fill="#4ade80">To post, the model asks for request_posting, and the harness runs the add-on.</text></g>
<g class="cp c4"><circle cx="40" cy="416" r="13" fill="#c084fc"/><text class="num" x="40" y="420" text-anchor="middle" style="fill:#0f1b2d">5</text><text class="cap" x="64" y="421" fill="#c084fc">The add-on shows you a review card. You decide.</text></g>
<g class="cp c5"><circle cx="40" cy="416" r="13" fill="#4ade80"/><text class="num" x="40" y="420" text-anchor="middle" style="fill:#0f1b2d">6</text><text class="cap" x="64" y="421" fill="#4ade80">Only after Approve does it post, through the separate Posting configuration.</text></g>
<text class="s still" x="24" y="421">Animation paused. The steps are listed in the text below.</text>
</svg>