<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Check, then ask a person, then post: the three steps appear in order</title><style>.a{animation-duration:4.5s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}.p0{animation-name:p0}@keyframes p0{0%,5%{opacity:0;transform:scale(.3)}28%,100%{opacity:1;transform:scale(1)}}.p1{animation-name:p1}@keyframes p1{0%,30%{opacity:0;transform:scale(.3)}53%,100%{opacity:1;transform:scale(1)}}.p2{animation-name:p2}@keyframes p2{0%,55%{opacity:0;transform:scale(.3)}78%,100%{opacity:1;transform:scale(1)}}.k1{animation-name:k1}.k2{animation-name:k2}@keyframes k1{0%,28%{opacity:0}45%,100%{opacity:1}}@keyframes k2{0%,53%{opacity:0}70%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="a p0"><circle cx="24" cy="60" r="14" fill="#fbbf24"/><path d="M17 60 l5 5 l9 -10" fill="none" stroke="#0f1b2d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="a p1"><circle cx="60" cy="60" r="14" fill="#c084fc"/><circle cx="60" cy="55" r="4.5" fill="#0f1b2d"/><path d="M51 70 q9 -10 18 0" fill="#0f1b2d"/></g><g class="a p2"><circle cx="96" cy="60" r="14" fill="#4ade80"/><path d="M89 60 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#0f1b2d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><path class="a k1" d="M38 60 h8" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/><path class="a k2" d="M74 60 h8" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/></svg>