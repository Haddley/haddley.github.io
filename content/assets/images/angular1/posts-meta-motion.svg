<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>An Angular app made of a root module with components</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><rect x="38" y="16" width="44" height="22" rx="5" fill="#d9483b"/></g>
<path class="d" style="animation-delay:0.8s" pathLength="1" d="M60,38 V50 M24,50 H96 M24,50 V60 M60,50 V60 M96,50 V60" stroke="#c9d3dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.4s"><rect x="10" y="60" width="28" height="22" rx="4" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:1.8s"><rect x="46" y="60" width="28" height="22" rx="4" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:2.2s"><rect x="82" y="60" width="28" height="22" rx="4" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:2.8s"><rect x="46" y="90" width="28" height="14" rx="4" fill="#ffb43a"/></g>
</svg>
