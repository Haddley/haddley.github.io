<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>The photographed gingerbread man is printed in a few thin layers</title><style>.al{animation-duration:6s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out}.l0{animation-name:l0}@keyframes l0{0%,10%{opacity:0;transform:translate(54px,26.6px) scale(.6)}22%,88%{opacity:1;transform:translate(54px,22.6px) scale(.6)}96%,100%{opacity:0;transform:translate(54px,26.6px) scale(.6)}}.l1{animation-name:l1}@keyframes l1{0%,28%{opacity:0;transform:translate(54px,25.0px) scale(.6)}40%,88%{opacity:1;transform:translate(54px,21.0px) scale(.6)}96%,100%{opacity:0;transform:translate(54px,25.0px) scale(.6)}}.l2{animation-name:l2}@keyframes l2{0%,46%{opacity:0;transform:translate(54px,23.4px) scale(.6)}58%,88%{opacity:1;transform:translate(54px,19.4px) scale(.6)}96%,100%{opacity:0;transform:translate(54px,23.4px) scale(.6)}}.ar{animation:ar 6s infinite}@keyframes ar{0%,100%{opacity:.35}30%{opacity:1}}@media (prefers-reduced-motion:reduce){.al,.ar{animation:none!important;opacity:1!important}}</style><defs><g id="gm"><circle cx="60" cy="28" r="7"/><rect x="50" y="36" width="20" height="28" rx="8"/><rect x="36" y="38" width="48" height="10" rx="5"/><rect x="49" y="58" width="9" height="22" rx="4.5"/><rect x="62" y="58" width="9" height="22" rx="4.5"/></g></defs><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g fill="#8b5a3c" transform="translate(-6 19.4) scale(.6)"><use href="#gm"/></g><path class="ar" d="M44 50 h12 m-4 -4 l4 4 l-4 4" fill="none" stroke="#9db0c3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="al l0" fill="#c2410c" transform="translate(54 22.6) scale(.6)"><use href="#gm"/></g><g class="al l1" fill="#ea580c" transform="translate(54 21.0) scale(.6)"><use href="#gm"/></g><g class="al l2" fill="#fb923c" transform="translate(54 19.4) scale(.6)"><use href="#gm"/></g><text x="60" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" fill="#9db0c3">PHOTO · STL · PRINT</text></svg>