<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Three pieces and one sign-in</title><desc>The harness connects to the Business Central MCP server through the mcp-remote helper. The first connection needs a Microsoft sign-in. The server sends the tool list, and the model suggests a tool call, the harness makes it, and the server runs it with the permissions of the signed-in user.</desc>
<style>.bg{fill:#0f1b2d}.box{fill:#162740;stroke-width:2}.t{fill:#e8f0fb;font-size:17px;font-weight:700}.s{fill:#9fb3cc;font-size:13px}.cap{font-size:15px;font-weight:700}.ln{fill:none;stroke-width:3}.lb{fill:#9fb3cc;font-size:12px}.num{fill:#9fb3cc;font-size:12px;font-weight:700}
@keyframes a_p{0.00%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_p{animation:a_p 16.0s infinite;opacity:0.3}
@keyframes a_h{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_h{animation:a_h 16.0s infinite;opacity:0.3}
@keyframes a_r{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}25.40%{opacity:0.3}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_r{animation:a_r 16.0s infinite;opacity:0.3}
@keyframes a_s{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_s{animation:a_s 16.0s infinite;opacity:0.3}
@keyframes a_ms{0.00%{opacity:0.3}25.40%{opacity:0.3}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0.3}100.00%{opacity:0.3}}.a_ms{animation:a_ms 16.0s infinite;opacity:0.3}
@keyframes a_e1{0.00%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e1{animation:a_e1 16.0s infinite;opacity:0.3}
@keyframes a_e2{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e2{animation:a_e2 16.0s infinite;opacity:0.3}
@keyframes a_e3{0.00%{opacity:0.3}0.40%{opacity:0.3}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0.3}50.40%{opacity:0.3}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0.3}75.40%{opacity:0.3}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e3{animation:a_e3 16.0s infinite;opacity:0.3}
@keyframes a_e4{0.00%{opacity:0.3}25.40%{opacity:0.3}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0.3}100.00%{opacity:0.3}}.a_e4{animation:a_e4 16.0s infinite;opacity:0.3}
@keyframes c0{0.00%{opacity:0}0.40%{opacity:0}2.50%{opacity:1}24.00%{opacity:1}24.90%{opacity:0}100.00%{opacity:0}}.c0{animation:c0 16.0s infinite;opacity:0}
@keyframes c1{0.00%{opacity:0}25.40%{opacity:0}27.50%{opacity:1}49.00%{opacity:1}49.90%{opacity:0}100.00%{opacity:0}}.c1{animation:c1 16.0s infinite;opacity:0}
@keyframes c2{0.00%{opacity:0}50.40%{opacity:0}52.50%{opacity:1}74.00%{opacity:1}74.90%{opacity:0}100.00%{opacity:0}}.c2{animation:c2 16.0s infinite;opacity:0}
@keyframes c3{0.00%{opacity:0}75.40%{opacity:0}77.50%{opacity:1}99.00%{opacity:1}99.90%{opacity:0}100.00%{opacity:0}}.c3{animation:c3 16.0s infinite;opacity:0}
@media (prefers-reduced-motion:reduce){.a_p{animation:none;opacity:1}.a_h{animation:none;opacity:1}.a_r{animation:none;opacity:1}.a_s{animation:none;opacity:1}.a_ms{animation:none;opacity:1}.a_e1{animation:none;opacity:1}.a_e2{animation:none;opacity:1}.a_e3{animation:none;opacity:1}.a_e4{animation:none;opacity:1}.cp{display:none}.still{display:block}}
.still{display:none}</style>
<defs><marker id="m_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5eb4ef"/></marker><marker id="m_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker><marker id="m_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="m_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="m_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c084fc"/></marker></defs>
<rect class="bg" width="960" height="420" rx="18"/>
<text class="t" x="24" y="34" style="font-size:19px">Three pieces and one sign-in</text>
<g class="a_e1"><path class="ln" d="M170 185 L215 185" stroke="#5eb4ef" marker-end="url(#m_blue)"/>
</g>
<g class="a_e2"><path class="ln" d="M405 185 L450 185" stroke="#c084fc" marker-end="url(#m_purple)"/>
</g>
<g class="a_e3"><path class="ln" d="M600 185 L650 185" stroke="#fbbf24" marker-end="url(#m_amber)"/>
</g>
<g class="a_e4"><path class="ln" d="M525 230 L525 290" stroke="#4ade80" marker-end="url(#m_green)"/>
</g>
<g class="a_p"><rect class="box" x="20" y="140" width="150" height="90" rx="12" stroke="#5eb4ef"/>
<text class="t" x="95.0" y="166" text-anchor="middle">The person</text>
<text class="s" x="95.0" y="188" text-anchor="middle">types a prompt</text>
</g>
<g class="a_h"><rect class="box" x="215" y="140" width="190" height="90" rx="12" stroke="#5eb4ef"/>
<text class="t" x="310.0" y="166" text-anchor="middle">DeepSeek Harness</text>
<text class="s" x="310.0" y="188" text-anchor="middle">and the model (the AI)</text>
</g>
<g class="a_r"><rect class="box" x="450" y="140" width="150" height="90" rx="12" stroke="#c084fc"/>
<text class="t" x="525.0" y="166" text-anchor="middle">mcp-remote</text>
<text class="s" x="525.0" y="188" text-anchor="middle">helper on my computer</text>
</g>
<g class="a_s"><rect class="box" x="650" y="140" width="280" height="90" rx="12" stroke="#fbbf24"/>
<text class="t" x="790.0" y="166" text-anchor="middle">Business Central MCP server</text>
<text class="s" x="790.0" y="188" text-anchor="middle">configuration: Assistant</text>
</g>
<g class="a_ms"><rect class="box" x="430" y="290" width="190" height="70" rx="12" stroke="#4ade80"/>
<text class="t" x="525.0" y="316" text-anchor="middle">Microsoft sign-in</text>
<text class="s" x="525.0" y="338" text-anchor="middle">once, in a browser</text>
</g>
<g class="cp c0"><circle cx="40" cy="386" r="13" fill="#c084fc"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">1</text><text class="cap" x="64" y="391" fill="#c084fc">At start-up the harness connects through mcp-remote.</text></g>
<g class="cp c1"><circle cx="40" cy="386" r="13" fill="#4ade80"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">2</text><text class="cap" x="64" y="391" fill="#4ade80">The first time, you sign in with Microsoft. The helper remembers it.</text></g>
<g class="cp c2"><circle cx="40" cy="386" r="13" fill="#fbbf24"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">3</text><text class="cap" x="64" y="391" fill="#fbbf24">The server returns the tool list from the configuration.</text></g>
<g class="cp c3"><circle cx="40" cy="386" r="13" fill="#5eb4ef"/><text class="num" x="40" y="390" text-anchor="middle" style="fill:#0f1b2d">4</text><text class="cap" x="64" y="391" fill="#5eb4ef">You ask. The model suggests a call, the harness makes it, the server runs it as the signed-in user.</text></g>
<text class="s still" x="24" y="391">Animation paused. The steps are listed in the text below.</text>
</svg>