<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 773" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The harness profile entry for Business Central, line by line. mcp-remote is the helper that talks to the remote server and handles the Microsoft sign-in. The port is a free port on the computer used for the sign-in. The environment header says which environment, and the configuration header says which configuration, so which tools the AI is given."><rect width="690" height="773" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">The profile entry that connects the harness</text><text x="24" y="52" font-size="12" fill="#6b7280">From the harness profile. IDs are placeholders; the notes are mine</text><rect x="16" y="66" width="658" height="691" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="90" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">- id: mcp-businesscentral</text><text x="30" y="116" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  name: '@deepseek-ai/dsh-mcp-client'</text><text x="30" y="142" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  config:</text><text x="30" y="168" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    serverName: businesscentral</text><text x="30" y="194" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    command: mcp-remote</text><path d="M120.1 199 L189.4 199" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M126.1 216 L126.1 210" stroke="#c2410c" stroke-width="1.6"/><path d="M126.1 202 L129.8 210.2 L122.4 210.2 Z" fill="#c2410c"/><text x="120.1" y="231" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the helper that talks to the remote server</text><text x="120.1" y="250" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">and handles the Microsoft sign-in</text><text x="30" y="284" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    args:</text><text x="30" y="310" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - 'https://mcp.businesscentral.dynamics.com'</text><text x="30" y="336" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - '33418'</text><path d="M85.4 341 L133.9 341" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M91.4 358 L91.4 352" stroke="#c2410c" stroke-width="1.6"/><path d="M91.4 344 L95.1 352.2 L87.7 352.2 Z" fill="#c2410c"/><text x="85.4" y="373" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">a free port on my computer,</text><text x="85.4" y="392" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">used for the sign-in</text><text x="30" y="426" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - '--header'</text><text x="30" y="452" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - 'TenantId: &lt;your tenant ID&gt;'</text><text x="30" y="478" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - '--header'</text><text x="30" y="504" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - 'EnvironmentName: SandboxRun11'</text><path d="M210.2 509 L293.3 509" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M216.2 526 L216.2 520" stroke="#c2410c" stroke-width="1.6"/><path d="M216.2 512 L219.9 520.2 L212.5 520.2 Z" fill="#c2410c"/><text x="210.2" y="541" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">which environment: the fresh sandbox</text><text x="30" y="575" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - '--header'</text><text x="30" y="601" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - 'Company: CRONUS USA, Inc.'</text><text x="30" y="627" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - '--header'</text><text x="30" y="653" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - 'ConfigurationName: Assistant'</text><path d="M224.0 658 L286.4 658" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round"/><path d="M230.0 675 L230.0 669" stroke="#c2410c" stroke-width="1.6"/><path d="M230.0 661 L233.7 669.2 L226.3 669.2 Z" fill="#c2410c"/><text x="224.0" y="690" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">which configuration, so which tools.</text><text x="224.0" y="709" font-size="15.5" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">A wrong name gives a different list</text></svg>