<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A table of data, a question, and an answer with a tick: a Fabric data agent answering from tables</title><style>.q{animation:qf 6s ease-in-out infinite}.b{opacity:0;animation:bf 6s ease-out infinite}.t{opacity:0;animation:tf 6s ease-out infinite}.a{animation:af 6s ease-in-out infinite}@keyframes qf{0%,100%{opacity:.85}50%{opacity:1}}@keyframes af{0%,20%{opacity:.3}40%,100%{opacity:1}}@keyframes bf{0%,35%{opacity:0;transform:translateY(4px)}55%,100%{opacity:1;transform:translateY(0)}}@keyframes tf{0%,70%{opacity:0}82%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.q,.a{animation:none}.b,.t{animation:none;opacity:1}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="q"><g><rect x="12" y="34" width="38" height="44" rx="6" fill="#38bdf8"/><rect x="12" y="34" width="38" height="11" rx="6" fill="#0ea5e9"/><g stroke="#0f1b2d" stroke-width="1.6" opacity=".6"><path d="M12 56 h38 M12 67 h38 M31 45 v33"/></g></g></g><g class="a"><g stroke="#9db0c3" stroke-width="3" stroke-linecap="round" fill="none"><path d="M55 56 h10 m-4 -4 l4 4 l-4 4"/></g></g><g class="b"><path d="M70 30 h32 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-18 l-9 9 v-9 h-5 a8 8 0 0 1 -8 -8 v-26 a8 8 0 0 1 8 -8 z" fill="#fb923c"/><g stroke="#0f1b2d" stroke-width="3" stroke-linecap="round"><path d="M76 42 h26 M76 51 h20 M76 60 h24"/></g></g><g class="t"><circle cx="100" cy="28" r="9" fill="#16a34a"/><path d="M95.5 28 l3 3 l5 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>