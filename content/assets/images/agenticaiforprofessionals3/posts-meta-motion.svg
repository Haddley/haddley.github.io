<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A research assistant with a database selector and an MCP server</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><g><rect x="6" y="20" width="66" height="80" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><rect x="6" y="20" width="66" height="9" rx="5" fill="#5bb4ea"/><circle cx="13" cy="24.5" r="1.5" fill="#0f1b2d"/><circle cx="18" cy="24.5" r="1.5" fill="#0f1b2d"/></g></g>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M14,40 H64" stroke="#c9d3dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.0s"><g><rect x="14" y="50" width="50" height="12" rx="3" fill="#0f1b2d" stroke="#ffb43a"/><text x="39" y="59" text-anchor="middle" font-size="7" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">All docs</text></g></g>
<path class="d" style="animation-delay:1.8s" pathLength="1" d="M14,74 H62 M14,84 H52" stroke="#7cc6f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:2.4s" pathLength="1" d="M74,60 H88 M84,56.5 L88,60 L84,63.5" stroke="#5bb4ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.9s"><g><rect x="90" y="40" width="22" height="40" rx="4" fill="#1c2a3d" stroke="#2f9e4a" stroke-width="1.5"/><path d="M95,52 H107 M95,60 H107 M95,68 H103" stroke="#2f9e4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
</svg>
