<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A custom code component inside a Power Apps screen</title><style>@keyframes fade{0%{opacity:0}17.01%,48.61%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}29.17%,48.61%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}17.01%,48.61%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.2s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.2s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.2s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="18" width="104" height="84" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M16,32 H60 M16,44 H50" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.2s"><g><rect x="60" y="44" width="44" height="46" rx="4" fill="#0f1b2d" stroke="#ffb43a" stroke-width="2" stroke-dasharray="4 3"/><text x="82" y="72" text-anchor="middle" font-size="14" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">&lt;/&gt;</text></g></g>
<g class="p" style="animation-delay:2.2s"><rect x="16" y="64" width="34" height="26" rx="4" fill="#5bb4ea"/></g>
</svg>
