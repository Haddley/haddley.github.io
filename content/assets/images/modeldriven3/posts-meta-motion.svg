<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>JavaScript on a form that moves a business process flow to its next stage</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="18" width="104" height="84" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.5s"><text x="34" y="42" text-anchor="middle" font-size="14" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">JS</text></g>
<path class="d" style="animation-delay:1.2s" pathLength="1" d="M16,58 H60 M16,70 H50" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.0s"><path d="M62,62 H88 L94,72 L88,82 H62 L68,72 Z" fill="#2f9e4a"/></g>
<g class="p" style="animation-delay:2.6s"><path d="M92,62 H112 L118,72 L112,82 H92 L98,72 Z" fill="#5bb4ea"/></g>
</svg>
