<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A canvas app form whose Publish button patches a new item into Business Central</title><style>@keyframes fade{0%{opacity:0}15.12%,43.21%,100%{opacity:1}}
