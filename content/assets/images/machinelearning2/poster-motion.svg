<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Three small apps and a stopwatch: what can be written quickly</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes hand{0%,10%{transform:rotate(-310deg)}70%,100%{transform:rotate(50deg)}}.hand{transform-box:view-box;transform-origin:60px 82px;animation:hand 3.5s ease-in-out both}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="p" style="animation-delay:0.0s"><rect x="16" y="20" width="24" height="24" rx="6" fill="#38bdf8"/><rect x="22" y="27" width="12" height="3" rx="1.5" fill="#0f1b2d" opacity=".6"/><rect x="22" y="33" width="8" height="3" rx="1.5" fill="#0f1b2d" opacity=".6"/></g><g class="p" style="animation-delay:0.3s"><rect x="46" y="20" width="24" height="24" rx="6" fill="#a78bfa"/><rect x="52" y="27" width="12" height="3" rx="1.5" fill="#0f1b2d" opacity=".6"/><rect x="52" y="33" width="8" height="3" rx="1.5" fill="#0f1b2d" opacity=".6"/></g><g class="p" style="animation-delay:0.6s"><rect x="76" y="20" width="24" height="24" rx="6" fill="#34d399"/><rect x="82" y="27" width="12" height="3" rx="1.5" fill="#0f1b2d" opacity=".6"/><rect x="82" y="33" width="8" height="3" rx="1.5" fill="#0f1b2d" opacity=".6"/></g><circle cx="60" cy="82" r="22" fill="#e0f2fe"/><rect x="56" y="54" width="8" height="5" rx="1.5" fill="#7dd3fc"/><circle cx="60" cy="82" r="2.5" fill="#0f1b2d"/><line class="hand" x1="60" y1="82" x2="60" y2="68" stroke="#dc2626" stroke-width="3" stroke-linecap="round" transform="rotate(50 60 82)"/></svg>