<path class="d" style="animation-delay:1.2s" pathLength="1" d="M16,52 H70 M16,64 H70 M16,76 H70" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
