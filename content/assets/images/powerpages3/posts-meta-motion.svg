<g><circle class="p" style="animation-delay:2.4s" cx="90" cy="64" r="6" fill="#5bb4ea"/><path d="M87,67 L93,61" stroke="#0f1b2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
