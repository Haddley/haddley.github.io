<path class="d" style="animation-delay:1.4s" pathLength="1" d="M16,28 H66" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.0s"><g><path d="M88,28 H110 M88,44 H110 M88,60 H110" stroke="#c9d3dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="88" cy="28" r="4" fill="#2f9e4a"/><circle cx="88" cy="44" r="4" fill="#2f9e4a"/><circle cx="88" cy="60" r="4" fill="#ffb43a"/></g></g>
<g class="p" style="animation-delay:2.8s"><rect x="86" y="76" width="26" height="14" rx="4" fill="#ffb43a"/></g>
</svg>
