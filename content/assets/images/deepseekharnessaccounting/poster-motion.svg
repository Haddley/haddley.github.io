<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A ledger page checked line by line with a green tick, and a person with a question: an agent that asks for help</title><style>@keyframes draw{0%,6%{transform:scaleX(0)}24%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}} @keyframes tick{0%,40%{transform:scale(.3);opacity:0}52%,88%{transform:scale(1);opacity:1}100%{opacity:0}} @keyframes ask{0%,55%{transform:translateY(6px);opacity:0}68%,88%{transform:translateY(0);opacity:1}100%{opacity:0}} .l{transform-box:fill-box;transform-origin:left;animation:draw 6s ease-out infinite}.t{transform-box:fill-box;transform-origin:center;animation:tick 6s ease-out infinite}.q{animation:ask 6s ease-out infinite}@media (prefers-reduced-motion: reduce){.l,.t,.q{animation:none}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="22" y="24" width="52" height="68" rx="6" fill="#e0f2fe"/><g fill="#7dd3fc"><rect class="l" x="29" y="34" width="38" height="4" rx="2" style="animation-delay:0s"/><rect class="l" x="29" y="44" width="38" height="4" rx="2" style="animation-delay:.25s"/><rect class="l" x="29" y="54" width="38" height="4" rx="2" style="animation-delay:.5s"/><rect class="l" x="29" y="64" width="24" height="4" rx="2" style="animation-delay:.75s"/></g><g class="t"><circle cx="63" cy="77" r="9" fill="#16a34a"/><path d="M58.5 77 l3.5 4 l6.5 -8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M78 80 q0 -22 14 -22 q14 0 14 22 z" fill="#fbbf24"/><g class="q"><circle cx="92" cy="42" r="8" fill="#fbbf24"/><text x="92" y="46" font-size="12" font-weight="700" text-anchor="middle" fill="#0f1b2d" font-family="system-ui,sans-serif">?</text></g><g fill="#5bb4ea" opacity="0.75"><rect x="22" y="100" width="76" height="3" rx="1.5"/></g></svg>
