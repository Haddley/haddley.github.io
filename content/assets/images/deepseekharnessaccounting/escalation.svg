<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" font-family="system-ui,Helvetica,Arial,sans-serif">
<title>How a month-end close task is routed: compute it, look it up, then ask a person</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="760" height="330" rx="12" fill="#f8fafc"/>
<g font-size="14" text-anchor="middle">
<rect x="20" y="125" width="120" height="70" rx="10" fill="#1e293b"/><text x="80" y="155" fill="#fff" font-weight="700">A task</text><text x="80" y="176" fill="#cbd5e1" font-size="12">for example, a</text><text x="80" y="191" fill="#cbd5e1" font-size="12">vendor dispute</text>
<rect x="180" y="30" width="140" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="250" y="58" fill="#14532d" font-weight="700">1. Understand</text><text x="250" y="79" fill="#14532d" font-size="12">Own accounting first,</text><text x="250" y="95" fill="#14532d" font-size="12">then check in Learn</text>
<rect x="400" y="30" width="170" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="485" y="58" fill="#0c4a6e" font-weight="700">2. Compute</text><text x="485" y="79" fill="#0c4a6e" font-size="12">Code does the sums,</text><text x="485" y="95" fill="#0c4a6e" font-size="12">with tests</text>
<rect x="400" y="215" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="485" y="243" fill="#78350f" font-weight="700">3. Propose</text><text x="485" y="264" fill="#78350f" font-size="12">The model drafts the</text><text x="485" y="280" fill="#78350f" font-size="12">journal and its reasons</text>
<rect x="610" y="215" width="130" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="675" y="243" fill="#7f1d1d" font-weight="700">4. Ask a person</text><text x="675" y="264" fill="#7f1d1d" font-size="12">Approve, answer,</text><text x="675" y="280" fill="#7f1d1d" font-size="12">or decide</text>
</g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M140 150 L160 150 L160 70 L178 70"/><path d="M322 70 L398 70"/><path d="M485 112 L485 213"/><path d="M572 255 L608 255"/>
</g>
<g font-size="12" fill="#334155" text-anchor="middle">
<text x="156" y="112" text-anchor="end">always first</text><text x="360" y="62">to verify</text>
<text x="500" y="165" text-anchor="start">numbers needed,</text><text x="500" y="181" text-anchor="start">then checked</text>

</g>
<text x="590" y="318" font-size="12" fill="#7f1d1d" text-anchor="middle">Always, before anything is posted</text>
</svg>
