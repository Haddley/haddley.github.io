<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" width="640" height="510" role="img"><title>The loop: you give the harness the scenario, the harness sends the model the conversation and the list of tools, the model answers or asks for a tool, and the harness runs the tool, adds the result and goes round again, or asks you a question, until the model gives an answer</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="640" height="510" fill="#ffffff"/><text x="320" y="28" font-size="16" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The loop: the model asks for tools, the harness runs them</text><rect x="14" y="56" width="100" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="64.0" y="98.0" font-size="15" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">You</text><text x="64.0" y="118.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">the scenario</text><rect x="176" y="56" width="240" height="90" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="296.0" y="98.0" font-size="15" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The harness</text><text x="296.0" y="118.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">holds the conversation, runs the loop</text><rect x="526" y="56" width="100" height="90" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="576.0" y="98.0" font-size="15" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The model</text><text x="576.0" y="118.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">an LLM</text><line x1="114" y1="101" x2="174" y2="101" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="174" y1="128" x2="116" y2="128" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><circle cx="145" cy="146" r="11" fill="#0f1b2d"/><text x="145" y="151" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text><circle cx="144" cy="84" r="11" fill="#0f1b2d"/><text x="144" y="89" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><line x1="418" y1="84" x2="524" y2="84" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><circle cx="471" cy="66" r="11" fill="#0f1b2d"/><text x="471" y="71" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><line x1="524" y1="118" x2="418" y2="118" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><circle cx="471" cy="138" r="11" fill="#0f1b2d"/><text x="471" y="143" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><line x1="296" y1="147" x2="296" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#s)" marker-start="url(#s)"/><circle cx="318" cy="170" r="11" fill="#0f1b2d"/><text x="318" y="175" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><line x1="84" y1="190" x2="555" y2="190" stroke="#475569" stroke-width="2.5"/><line x1="84" y1="190" x2="84" y2="208" stroke="#475569" stroke-width="2.5"/><rect x="14" y="208" width="140" height="62" rx="12" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="84" y="236.0" font-size="14" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Business Central</text><text x="84" y="256.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">MCP server</text><line x1="241" y1="190" x2="241" y2="208" stroke="#475569" stroke-width="2.5"/><rect x="171" y="208" width="140" height="62" rx="12" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="241" y="236.0" font-size="14" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Microsoft Learn</text><text x="241" y="256.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">MCP server</text><line x1="398" y1="190" x2="398" y2="208" stroke="#475569" stroke-width="2.5"/><rect x="328" y="208" width="140" height="62" rx="12" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="398" y="236.0" font-size="14" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Internet search</text><text x="398" y="256.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">and web pages</text><line x1="555" y1="190" x2="555" y2="208" stroke="#475569" stroke-width="2.5"/><rect x="485" y="208" width="140" height="62" rx="12" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="555" y="236.0" font-size="14" font-weight="700" fill="#0f1b2d" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Ask the user</text><text x="555" y="256.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">a question tool</text><circle cx="30" cy="312" r="11" fill="#0f1b2d"/><text x="30" y="317" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">1</text><text x="52" y="317" font-size="14" font-weight="400" fill="#0f1b2d" text-anchor="start" font-family="Helvetica, Arial, sans-serif">You give the harness the scenario, and later your answers to its questions.</text><circle cx="30" cy="342" r="11" fill="#0f1b2d"/><text x="30" y="347" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">2</text><text x="52" y="347" font-size="14" font-weight="400" fill="#0f1b2d" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The harness sends the model the conversation so far and the list of tools.</text><circle cx="30" cy="372" r="11" fill="#0f1b2d"/><text x="30" y="377" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">3</text><text x="52" y="377" font-size="14" font-weight="400" fill="#0f1b2d" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The model replies with an answer, or asks for a tool to be called.</text><circle cx="30" cy="402" r="11" fill="#0f1b2d"/><text x="30" y="407" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">4</text><text x="52" y="407" font-size="14" font-weight="400" fill="#0f1b2d" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The harness makes the call, adds the result to the conversation, and goes back to step 2.</text><circle cx="30" cy="432" r="11" fill="#0f1b2d"/><text x="30" y="437" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">5</text><text x="52" y="437" font-size="14" font-weight="400" fill="#0f1b2d" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The harness may come back to you: asking you is one of the tools. It puts the model's</text><text x="52" y="455" font-size="14" font-weight="400" fill="#0f1b2d" text-anchor="start" font-family="Helvetica, Arial, sans-serif">question to you, waits, and adds your answer. The final answer also comes back to you.</text><text x="52" y="488" font-size="14" font-weight="700" fill="#0f1b2d" text-anchor="start" font-family="Helvetica, Arial, sans-serif">The loop ends when the model gives an answer and asks for no more tools.</text></svg>