<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1776" width="640" height="1776" role="img"><title>DeepSeek Harness reads the scenario, asks Microsoft Learn, Business Central, an internet search and a GAAP handbook, then creates two draft credit memos in Business Central, using real queries and replies from its run</title><rect width="640" height="1776" fill="#ffffff"/><rect x="10" y="20" width="620" height="78" rx="12" fill="#0f1b2d"/><text x="320.0" y="42" font-size="13" font-weight="700" fill="#5be0cf" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" letter-spacing="1">TONIGHT'S TALK</text><text x="320.0" y="62" font-size="15" fill="#e6edf5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">DeepSeek Harness works one vendor dispute from start to</text><text x="320.0" y="82" font-size="15" fill="#e6edf5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">finish</text><text x="320.0" y="128" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The harness's lines are its real queries and calls. Each source</text><text x="320.0" y="148" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">answers in its own words. Long replies are cut.</text><circle cx="32" cy="212" r="20" fill="#334155"/><text x="32" y="219" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Y</text><rect x="62" y="190" width="380" height="222" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,204 52,214 61,222" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="205" width="3" height="16" fill="#f1f5f9"/><text x="76" y="216" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">You give it scenario.md: “Graphic Design</text><text x="76" y="236" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Institute (vendor 30000) delivered two orders</text><text x="76" y="256" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">to us. … All 10 arrived broken. The vendor has</text><text x="76" y="276" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">agreed to credit $385.00 … They arrived</text><text x="76" y="296" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">instead of the item we ordered. … the vendor</text><text x="76" y="316" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">has agreed to a $400.00 allowance. … Plan the</text><text x="76" y="336" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central steps to settle this case. Do</text><text x="76" y="356" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">not post anything.” And a method: Learn,</text><text x="76" y="376" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">ledger, tax, GAAP, plan, then create the</text><text x="76" y="396" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">drafts.</text><circle cx="608" cy="460" r="20" fill="#16a34a"/><polygon points="608.0,447 620.4,456 615.6,470.5 600.4,470.5 595.6,456" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="438" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,452 588,462 579,470" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="453" width="3" height="16" fill="#dcfce7"/><text x="212" y="464" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central item charges assign to</text><text x="212" y="484" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">purchase invoice allowance</text><circle cx="32" cy="548" r="20" fill="#2563eb"/><text x="32" y="555" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">L</text><rect x="62" y="526" width="380" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,540 52,550 61,558" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="541" width="3" height="16" fill="#f1f5f9"/><text x="76" y="552" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Microsoft Learn returns the page “Use item</text><text x="76" y="572" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">charges to account for extra trade costs”.</text><circle cx="608" cy="636" r="20" fill="#16a34a"/><polygon points="608.0,623 620.4,632 615.6,646.5 600.4,646.5 595.6,632" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="614" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,628 588,638 579,646" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="629" width="3" height="16" fill="#dcfce7"/><text x="212" y="640" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">vendorNumber eq '30000' and postingDate ge</text><text x="212" y="660" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">'2025-10-01'</text><circle cx="32" cy="724" r="20" fill="#0f766e"/><text x="32" y="731" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="702" width="380" height="122" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,716 52,726 61,734" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="717" width="3" height="16" fill="#f1f5f9"/><text x="76" y="728" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central: “A binary operator with</text><text x="76" y="748" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">incompatible types was detected. Found operand</text><text x="76" y="768" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">types 'Edm.Date' and 'Edm.String' …”. The</text><text x="76" y="788" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">harness retries without the quotes and gets</text><text x="76" y="808" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">“Returned 20 of 34 total records.”</text><circle cx="608" cy="872" r="20" fill="#16a34a"/><polygon points="608.0,859 620.4,868 615.6,882.5 600.4,882.5 595.6,868" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="850" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,864 588,874 579,882" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="865" width="3" height="16" fill="#dcfce7"/><text x="212" y="876" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Florida sales tax refund credit for returned</text><text x="212" y="896" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">merchandise statute 212.17</text><circle cx="32" cy="960" r="20" fill="#ea580c"/><text x="32" y="967" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">S</text><rect x="62" y="938" width="380" height="102" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,952 52,962 61,970" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="953" width="3" height="16" fill="#f1f5f9"/><text x="76" y="964" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Internet search: links to the Florida</text><text x="76" y="984" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Statutes, and “Rule 12A- 1.012(2)(a), Florida</text><text x="76" y="1004" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Statutes, states: A dealer who has paid sales</text><text x="76" y="1024" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">tax in full on the selling price of t …”</text><circle cx="608" cy="1088" r="20" fill="#16a34a"/><polygon points="608.0,1075 620.4,1084 615.6,1098.5 600.4,1098.5 595.6,1084" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="1066" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,1080 588,1090 579,1098" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="1081" width="3" height="16" fill="#dcfce7"/><text x="212" y="1092" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Create_PurchaseCreditMemo: vendorNumber 30000,</text><text x="212" y="1112" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">creditMemoDate 2026-11-13</text><circle cx="32" cy="1176" r="20" fill="#0f766e"/><text x="32" y="1183" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="1154" width="380" height="82" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,1168 52,1178 61,1186" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="1169" width="3" height="16" fill="#f1f5f9"/><text x="76" y="1180" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central: "number":"1011",</text><text x="76" y="1200" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">"vendorName":"Graphic Design Institute". A</text><text x="76" y="1220" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">draft credit memo now exists.</text><circle cx="608" cy="1284" r="20" fill="#16a34a"/><polygon points="608.0,1271 620.4,1280 615.6,1294.5 600.4,1294.5 595.6,1280" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="1262" width="380" height="82" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,1276 588,1286 579,1294" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="1277" width="3" height="16" fill="#dcfce7"/><text x="212" y="1288" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Create_PurchaseCreditMemoLine: lineType</text><text x="212" y="1308" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Charge, lineObjectNumber PURCH-ALLOW, unitCost</text><text x="212" y="1328" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">385</text><circle cx="32" cy="1392" r="20" fill="#0f766e"/><text x="32" y="1399" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="1370" width="380" height="82" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,1384 52,1394 61,1402" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="1385" width="3" height="16" fill="#f1f5f9"/><text x="76" y="1396" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central: “The Item Charge does not</text><text x="76" y="1416" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">exist. Identification fields and values:</text><text x="76" y="1436" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">No.='PURCH-ALLOW'”</text><circle cx="608" cy="1500" r="20" fill="#16a34a"/><polygon points="608.0,1487 620.4,1496 615.6,1510.5 600.4,1510.5 595.6,1496" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="1478" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,1492 588,1502 579,1510" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="1493" width="3" height="16" fill="#dcfce7"/><text x="212" y="1504" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Create_PurchaseCreditMemoLine: lineType</text><text x="212" y="1524" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Account, lineObjectNumber 72140, unitCost 385</text><circle cx="32" cy="1588" r="20" fill="#0f766e"/><text x="32" y="1595" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="1566" width="380" height="122" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,1580 52,1590 61,1598" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="1581" width="3" height="16" fill="#f1f5f9"/><text x="76" y="1592" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central accepts it:</text><text x="76" y="1612" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">"lineType":"Account",</text><text x="76" y="1632" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">"lineObjectNumber":"72140", "unitCost":385.</text><text x="76" y="1652" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">The same steps then create draft 1012 for</text><text x="76" y="1672" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">$400.00.</text><text x="320.0" y="1720" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The run took 8 min 58 s. Nothing was posted, because the harness had</text><text x="320.0" y="1740" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">no tool that posts. It stopped with seven questions for a person.</text></svg>