<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 2032" width="640" height="2032" role="img"><title>DeepSeek Harness starts from two purchase order numbers, follows them to the receipts and invoices in Business Central, looks up Microsoft Learn and the tax rule, and creates two draft credit memos, using real queries and replies from its run</title><rect width="640" height="2032" fill="#ffffff"/><rect x="10" y="20" width="620" height="58" rx="12" fill="#0f1b2d"/><text x="320.0" y="42" font-size="13" font-weight="700" fill="#5be0cf" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" letter-spacing="1">TONIGHT'S TALK</text><text x="320.0" y="62" font-size="15" fill="#e6edf5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">DeepSeek Harness starts from two purchase order numbers</text><text x="320.0" y="108" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The harness's lines are its real queries and calls. Each source</text><text x="320.0" y="128" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">answers in its own words. Long replies are cut.</text><circle cx="32" cy="192" r="20" fill="#334155"/><text x="32" y="199" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Y</text><rect x="62" y="170" width="380" height="242" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,184 52,194 61,202" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="185" width="3" height="16" fill="#f1f5f9"/><text x="76" y="196" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">You give it scenario.md: “Graphic Design</text><text x="76" y="216" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Institute (vendor 30000) delivered two</text><text x="76" y="236" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">purchase orders to us. … Purchase order 106014</text><text x="76" y="256" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">was 15 AMSTERDAM Lamps (item 1928-S). 6 of the</text><text x="76" y="276" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">15 arrived broken. The vendor has agreed to</text><text x="76" y="296" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">credit $200.00 … Purchase order 106015 was 5</text><text x="76" y="316" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">BERLIN Guest Chairs, yellow (item 1936-S).</text><text x="76" y="336" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">They arrived with the wrong finish. … a $75.00</text><text x="76" y="356" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">allowance. … Nobody here has the posted</text><text x="76" y="376" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">receipt numbers or the invoice numbers to</text><text x="76" y="396" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">hand. Start from the purchase order numbers.”</text><circle cx="608" cy="460" r="20" fill="#16a34a"/><polygon points="608.0,447 620.4,456 615.6,470.5 600.4,470.5 595.6,456" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="438" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,452 588,462 579,470" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="453" width="3" height="16" fill="#dcfce7"/><text x="212" y="464" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">List_PurchaseOrders: number eq '106014' or</text><text x="212" y="484" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">number eq '106015'</text><circle cx="32" cy="548" r="20" fill="#0f766e"/><text x="32" y="555" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="526" width="380" height="102" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,540 52,550 61,558" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="541" width="3" height="16" fill="#f1f5f9"/><text x="76" y="552" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central: “No results found. Try</text><text x="76" y="572" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">adjusting the request parameters.” The orders</text><text x="76" y="592" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">are fully invoiced, so the order documents no</text><text x="76" y="612" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">longer exist.</text><circle cx="608" cy="676" r="20" fill="#16a34a"/><polygon points="608.0,663 620.4,672 615.6,686.5 600.4,686.5 595.6,672" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="654" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,668 588,678 579,686" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="669" width="3" height="16" fill="#dcfce7"/><text x="212" y="680" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">List_PurchaseReceipts: orderNumber eq '106014'</text><text x="212" y="700" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">or orderNumber eq '106015'</text><circle cx="32" cy="764" r="20" fill="#0f766e"/><text x="32" y="771" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="742" width="380" height="82" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,756 52,766 61,774" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="757" width="3" height="16" fill="#f1f5f9"/><text x="76" y="768" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central: “Returned all 2 records.”</text><text x="76" y="788" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">"number":"107222" … "orderNumber":"106014".</text><text x="76" y="808" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">The order number lives on in the receipt.</text><circle cx="608" cy="872" r="20" fill="#16a34a"/><polygon points="608.0,859 620.4,868 615.6,882.5 600.4,882.5 595.6,868" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="850" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,864 588,874 579,882" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="865" width="3" height="16" fill="#dcfce7"/><text x="212" y="876" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">List_PurchaseInvoices: orderNumber eq '106014'</text><text x="212" y="896" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">or orderNumber eq '106015'</text><circle cx="32" cy="960" r="20" fill="#0f766e"/><text x="32" y="967" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="938" width="380" height="102" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,952 52,962 61,970" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="953" width="3" height="16" fill="#f1f5f9"/><text x="76" y="964" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central: “Returned all 2 records.”</text><text x="76" y="984" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">"number":"108216" …</text><text x="76" y="1004" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">"vendorInvoiceNumber":"106014" … and 108217</text><text x="76" y="1024" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">for the chairs.</text><circle cx="608" cy="1088" r="20" fill="#16a34a"/><polygon points="608.0,1075 620.4,1084 615.6,1098.5 600.4,1098.5 595.6,1084" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="1066" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,1080 588,1090 579,1098" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="1081" width="3" height="16" fill="#dcfce7"/><text x="212" y="1092" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central purchase credit memo create</text><text x="212" y="1112" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">and post for returned items</text><circle cx="32" cy="1176" r="20" fill="#2563eb"/><text x="32" y="1183" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">L</text><rect x="62" y="1154" width="380" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,1168 52,1178 61,1186" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="1169" width="3" height="16" fill="#f1f5f9"/><text x="76" y="1180" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Microsoft Learn returns the page “Process</text><text x="76" y="1200" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">purchase returns or cancellations”.</text><circle cx="608" cy="1264" r="20" fill="#16a34a"/><polygon points="608.0,1251 620.4,1260 615.6,1274.5 600.4,1274.5 595.6,1260" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="1242" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,1256 588,1266 579,1274" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="1257" width="3" height="16" fill="#dcfce7"/><text x="212" y="1268" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Florida Statute 212.17 credit refund tax</text><text x="212" y="1288" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">returned merchandise</text><circle cx="32" cy="1352" r="20" fill="#ea580c"/><text x="32" y="1359" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">S</text><rect x="62" y="1330" width="380" height="122" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,1344 52,1354 61,1362" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="1345" width="3" height="16" fill="#f1f5f9"/><text x="76" y="1356" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Internet search: the Florida Statutes, and</text><text x="76" y="1376" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">also “Include the following with your</text><text x="76" y="1396" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">application:- A completed and signed Schedule</text><text x="76" y="1416" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">of Tax Credits Claimed on Repossessed Tangible</text><text x="76" y="1436" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Per …”</text><circle cx="608" cy="1500" r="20" fill="#16a34a"/><polygon points="608.0,1487 620.4,1496 615.6,1510.5 600.4,1510.5 595.6,1496" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="1478" width="380" height="82" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,1492 588,1502 579,1510" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="1493" width="3" height="16" fill="#dcfce7"/><text x="212" y="1504" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Create_PurchaseCreditMemoLine: lineType</text><text x="212" y="1524" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Charge, lineObjectNumber PURCH-ALLOW, unitCost</text><text x="212" y="1544" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">200</text><circle cx="32" cy="1608" r="20" fill="#0f766e"/><text x="32" y="1615" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="1586" width="380" height="82" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,1600 52,1610 61,1618" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="1601" width="3" height="16" fill="#f1f5f9"/><text x="76" y="1612" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central: “The Item Charge does not</text><text x="76" y="1632" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">exist. Identification fields and values:</text><text x="76" y="1652" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">No.='PURCH-ALLOW'”</text><circle cx="608" cy="1716" r="20" fill="#16a34a"/><polygon points="608.0,1703 620.4,1712 615.6,1726.5 600.4,1726.5 595.6,1712" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="1694" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,1708 588,1718 579,1726" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="1709" width="3" height="16" fill="#dcfce7"/><text x="212" y="1720" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Create_PurchaseCreditMemoLine: lineType</text><text x="212" y="1740" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Account, lineObjectNumber 72140, unitCost 200</text><circle cx="32" cy="1804" r="20" fill="#0f766e"/><text x="32" y="1811" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">B</text><rect x="62" y="1782" width="380" height="162" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,1796 52,1806 61,1814" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="1797" width="3" height="16" fill="#f1f5f9"/><text x="76" y="1808" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Business Central accepts it: draft credit memo</text><text x="76" y="1828" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">1013, "lineType":"Account",</text><text x="76" y="1848" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">"lineObjectNumber":"72140". For 1014 the first</text><text x="76" y="1868" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">description is rejected: “The length of the</text><text x="76" y="1888" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">string is 105, but it must be less than or</text><text x="76" y="1908" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">equal to 100 characters.” A shorter one is</text><text x="76" y="1928" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">accepted.</text><text x="320.0" y="1976" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">The run took 6 min 17 s. Nothing was posted, because the harness had</text><text x="320.0" y="1996" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">no tool that posts. It stopped with four questions for a person.</text></svg>