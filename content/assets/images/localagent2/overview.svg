<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The whole blog agent on one page. The visitor&#x27;s browser holds the chat panel and the blog data downloaded from GitHub Pages. Only the model calls travel to the Mac mini, where Caddy, a gatekeeper program, Ollama and the Qwen3.5 9B model answer them."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="470" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The whole agent on one page</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Everything except the model runs in the visitor's browser</text><rect x="20" y="70" width="340" height="380" rx="12" fill="#e0f2fe" fill-opacity="0.45" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="3 3"/><text x="34" y="92" font-size="13" font-weight="700" fill="#0284c7" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Visitor's browser</text><rect x="40" y="105" width="300" height="52" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="190.0" y="126.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The blog page</text><text x="190.0" y="144.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">static files from GitHub Pages</text><rect x="40" y="185" width="300" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="190.0" y="213.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Chat panel (BlogAgent.tsx)</text><text x="190.0" y="231.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">runs the loop and every tool</text><rect x="40" y="285" width="300" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="190.0" y="308.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Blog data (JSON)</text><text x="190.0" y="326.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">agent-data.json</text><text x="190.0" y="344.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">agent-posts/&lt;slug&gt;.json</text><text x="190.0" y="362.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">agent-wiki.json</text><polyline points="190,251 190,283" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><text x="198" y="272" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">reads</text><text x="40" y="405" font-size="12" font-weight="400" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">Searching and reading happen here,</text><text x="40" y="423" font-size="12" font-weight="400" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">not on my server.</text><rect x="440" y="70" width="300" height="380" rx="12" fill="#dcfce7" fill-opacity="0.45" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3"/><text x="454" y="92" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Mac mini at home</text><rect x="460" y="105" width="260" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="590.0" y="126.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Caddy</text><text x="590.0" y="144.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">HTTPS on port 8443</text><rect x="460" y="185" width="260" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="590.0" y="213.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Gatekeeper (server.mjs)</text><text x="590.0" y="231.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">two paths, one model, limits</text><rect x="460" y="285" width="260" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="590.0" y="306.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Ollama</text><text x="590.0" y="324.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">listens on localhost only</text><rect x="460" y="365" width="260" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="590.0" y="386.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Qwen3.5 9B</text><text x="590.0" y="404.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">thinking off, 16K context</text><polyline points="590,157 590,183" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="590,251 590,283" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="590,337 590,363" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="340,218 400,218 400,131 458,131" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/><text x="400" y="164" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="5" paint-order="stroke">chat</text><text x="400" y="180" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="5" paint-order="stroke">requests</text><text x="400" y="196" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="5" paint-order="stroke">only</text></svg>