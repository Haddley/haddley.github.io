<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="What the gatekeeper checks, in order, before a request reaches the model. Each failed check stops the request with its own error. Only a request that passes every check is rebuilt with the fixed model and sent to Ollama."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="640" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">What the gatekeeper checks, in order</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Every check that fails stops the request right there</text><rect x="30" y="78" width="380" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="105.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1.  Is it one of the two allowed paths?</text><polyline points="410,101 490,101" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="93" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="490" y="78" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="610.0" y="105.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">404 Not found</text><polyline points="220,124 220,144" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="232" y="138" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="30" y="144" width="380" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="171.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">2.  Is the page's origin on my list?</text><polyline points="410,167 490,167" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="159" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="490" y="144" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="610.0" y="171.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">403 Origin not allowed</text><polyline points="220,190 220,210" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="232" y="204" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="30" y="210" width="380" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="237.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">3.  Is the body small enough?</text><polyline points="410,233 490,233" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="225" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="490" y="210" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="610.0" y="237.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">413 Request too large</text><polyline points="220,256 220,276" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="232" y="270" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="30" y="276" width="380" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="303.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">4.  Are the messages well formed?</text><polyline points="410,299 490,299" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="291" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="490" y="276" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="610.0" y="303.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">400 Invalid messages</text><polyline points="220,322 220,342" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="232" y="336" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="30" y="342" width="380" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="369.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">5.  Has this visitor asked too often?</text><polyline points="410,365 490,365" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="357" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="490" y="342" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="610.0" y="369.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">429 Too many requests</text><polyline points="220,388 220,408" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="232" y="402" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="30" y="408" width="380" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="435.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">6.  Has the daily budget run out?</text><polyline points="410,431 490,431" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="423" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="490" y="408" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="610.0" y="435.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">429 Daily limit reached</text><polyline points="220,454 220,474" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="232" y="468" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">yes</text><rect x="30" y="474" width="380" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="501.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">7.  Are too many requests running now?</text><polyline points="410,497 490,497" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="489" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">no</text><rect x="490" y="474" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="610.0" y="501.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">503 Busy, try again</text><polyline points="220,520 220,540" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="540" width="700" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="380.0" y="571.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">8.  Build my own request for Ollama</text><text x="380.0" y="589.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">fixed model · thinking off · capped answer length · only role and content kept from the page</text></svg>