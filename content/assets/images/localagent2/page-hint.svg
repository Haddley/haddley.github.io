<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="How the agent knows which page the visitor is on. The browser reads the address, writes a short hint such as this category or this topic, and adds a rule that tells the model which tool to call."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="440" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Where am I?</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The address tells the agent what "this" means</text><text x="30" y="84" font-size="13" font-weight="700" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Address</text><text x="258" y="84" font-size="13" font-weight="700" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The hint the model reads</text><text x="502" y="84" font-size="13" font-weight="700" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The tool it should use</text><rect x="24" y="100" width="210" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="129.0" y="126.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">/posts/&lt;slug&gt;/</text><polyline points="234,122 256,122" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="258" y="100" width="220" height="44" rx=