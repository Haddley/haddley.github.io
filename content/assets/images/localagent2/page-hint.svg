pace">/topics/&lt;slug&gt;/</text><polyline points="234,234 256,234" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="258" y="212" width="220" height="44" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="368.0" y="238.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">this topic, by slug</text><polyline points="478,234 500,234" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="502" y="212" width="240" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="622.0" y="238.025" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">get_topic</text><rect x="24" y="268" width="210" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="129.0" y="294.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">/topics/</text><polyline points="234,290 256,290" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="258" y="268" width="220" height="44" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="368.0" y="294.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the topics list</text><polyline points="478,290 500,290" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="502" y="268" width="240" height="44" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="622.0" y="294.025" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">list_topics</text><rect x="24" y="324" width="210" height="44" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="129.0" y="350.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">/posts/ and /categories/</text><polyline points="234,346 256,346" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="258" y="324" width="220" height="44" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="368.0" y="350.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">a listing or overview</text><polyline points="478,346 500,346" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="502" y="324" width="240" height="44" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="622.0" y="350.025" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">search_posts, list_categories</text><rect x="24" y="380" width="210" height="44" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="129.0" y="406.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">/ (home)</text><polyline points="234,402 256,402" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="258" y="380" width="220" height="44" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="368.0" y="406.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the home page</text><polyline points="478,402 500,402" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="502" y="380" width="240" height="44" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="622.0" y="406.025" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">whichever tool fits</text><text x="24" y="450" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">A visitor who types "summarise this category" on /categories/3d/ now gets the 3D category.</text></svg>