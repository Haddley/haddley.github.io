<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="What one request to the model contains. The system prompt, the last six messages of history, the current question with its page hint, and then each tool round adds two messages. Old tool results are never kept between questions."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="312" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">What one request contains</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The window is small on purpose</text><rect x="20" y="76" width="130" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="85.0" y="107.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">System</text><text x="85.0" y="125.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">prompt</text><text x="85.0" y="142.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">tools and rules</text><rect x="160" y="76" width="300" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="310.0" y="99.125" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">History</text><text x="310.0" y="116.625" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the last 6 messages</text><text x="310.0" y="134.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">(3 questions and 3 answers)</text><text x="310.0" y="151.625" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">tool results are not kept</text><rect x="470" y="76" width="140" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="540.0" y="107.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Your question</text><text x="540.0" y="125.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">with the page</text><text x="540.0" y="142.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">hint in front</text><rect x="620" y="76" width="120" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="680.0" y="107.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Tool rounds</text><text x="680.0" y="125.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">2 messages</text><text x="680.0" y="142.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">each</text><path d="M20,178 L20,190 L740,190 L740,178" fill="none" stroke="#6b7280" stroke-width="1.6"/><text x="380" y="212" font-size="12" font-weight="400" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">everything above is sent again with every call</text><rect x="20" y="236" width="340" height="56" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="190.0" y="259.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Context window: 16K tokens</text><text x="190.0" y="277.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">set on the Mac mini (it was 4K)</text><rect x="380" y="236" width="360" height="56" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="560.0" y="259.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Backend limit on messages</text><text x="560.0" y="277.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the history cap keeps every request under it</text></svg>