<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img">
  <title>A browser window, a gate with a keyhole, and a small neural network: the chat agent, its gatekeeper and its model</title>
  <style>
  @keyframes q{0%,5%{opacity:0;transform:translateX(0)}8%{opacity:1;transform:translateX(0)}24%,29%{opacity:1;transform:translateX(27px)}40%{opacity:1;transform:translateX(52px)}43%,100%{opacity:0;transform:translateX(52px)}}
  @keyframes a{0%,64%{opacity:0;transform:translateX(52px)}67%{opacity:1;transform:translateX(52px)}80%,82%{opacity:1;transform:translateX(27px)}92%{opacity:1;transform:translateX(0)}94%,100%{opacity:0;transform:translateX(0)}}
  @keyframes gate{0%,26%,38%,76%,86%,100%{stroke:#f5a623}30%,33%,79%,82%{stroke:#ffe08a}}
  @keyframes key{0%,26%,38%,76%,86%,100%{transform:scale(1)}30%,33%,79%,82%{transform:scale(1.22)}}
  @keyframes n1{0%,40%,56%,100%{fill:#7dd3fc}46%,50%{fill:#ffffff}}
  @keyframes n2{0%,46%,62%,100%{fill:#4fc3f7}52%,56%{fill:#ffffff}}
  @keyframes n3{0%,52%,68%,100%{fill:#4fc3f7}58%,62%{fill:#ffffff}}
  @keyframes r{0%,80%{transform:scaleX(0);opacity:1}90%,97%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
  .q,.a{opacity:0}.q{animation:q 7s ease-in-out infinite}.a{animation:a 7s ease-in-out infinite}
  .shield{animation:gate 7s ease-in-out infinite}.key{transform-box:fill-box;transform-origin:center;animation:key 7s ease-in-out infinite}
  .n1{animation:n1 7s ease-in-out infinite}.n2{animation:n2 7s ease-in-out infinite}.n3{animation:n3 7s ease-in-out infinite}
  .r{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:r 7s ease-out infinite}
  @media (prefers-reduced-motion: reduce){.q,.a,.shield,.key,.n1,.n2,.n3,.r{animation:none}.q,.a,.r{opacity:0}}
</style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5bb4ea"/></marker>
  </defs>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>

  <!-- Browser window -->
  <rect x="8" y="36" width="28" height="48" rx="5.5" fill="#17304a" stroke="#5bb4ea" stroke-width="2.2"/>
  <line x1="8" y1="46" x2="36" y2="46" stroke="#5bb4ea" stroke-width="1.6"/>
  <circle cx="14" cy="41" r="1.5" fill="#5bb4ea"/>
  <circle cx="19" cy="41" r="1.5" fill="#5bb4ea"/>
  <circle cx="24" cy="41" r="1.5" fill="#5bb4ea"/>
  <rect x="13" y="52" width="18" height="3" rx="1.5" fill="#5bb4ea" opacity="0.75"/>
  <rect x="13" y="59" width="14" height="3" rx="1.5" fill="#5bb4ea" opacity="0.55"/>
  <rect x="13" y="66" width="17" height="3" rx="1.5" fill="#5bb4ea" opacity="0.55"/>
  <rect x="13" y="73" width="11" height="3" rx="1.5" fill="#5bb4ea" opacity="0.4"/>

  <!-- Arrow to the gate -->
  <line x1="37.5" y1="60" x2="43.5" y2="60" stroke="#5bb4ea" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Gate: a shield with a keyhole -->
  <path class="shield" d="M60,28 L77,35 V57 C77,72 69,83 60,92 C51,83 43,72 43,57 V35 Z" fill="#2b2412" stroke="#f5a623" stroke-width="2.6" stroke-linejoin="round"/>
  <g class="key"><circle cx="60" cy="54" r="5" fill="#f5a623"/>
  <path d="M58,57 H62 L63.4,70 H56.6 Z" fill="#f5a623"/></g>

  <!-- Arrow to the model -->
  <line x1="78.5" y1="60" x2="84.5" y2="60" stroke="#5bb4ea" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Model: a small neural network -->
  <g stroke="#4fc3f7" stroke-width="1.6" opacity="0.55">
    <line x1="99" y1="36" x2="91" y2="56"/>
    <line x1="99" y1="36" x2="108" y2="56"/>
    <line x1="91" y1="56" x2="95" y2="82"/>
    <line x1="91" y1="56" x2="107" y2="82"/>
    <line x1="108" y1="56" x2="95" y2="82"/>
    <line x1="108" y1="56" x2="107" y2="82"/>
    <line x1="91" y1="56" x2="108" y2="56"/>
  </g>
  <circle class="n1" cx="99" cy="36" r="6" fill="#7dd3fc"/>
  <circle class="n2" cx="91" cy="56" r="5.2" fill="#4fc3f7" opacity="0.9"/>
  <circle class="n2" cx="108" cy="56" r="5.2" fill="#4fc3f7" opacity="0.9"/>
  <circle class="n3" cx="95" cy="82" r="5.6" fill="#4fc3f7" opacity="0.8"/>
  <circle class="n3" cx="107" cy="82" r="5.6" fill="#4fc3f7" opacity="0.8"/>

  <!-- Motion only: a question goes through the gate to the model, the answer comes back as a new line -->
  <rect class="r" x="13" y="73" width="17" height="3" rx="1.5" fill="#4ade80"/>
  <circle class="q" cx="33" cy="60" r="3.2" fill="#f8fafc"/>
  <circle class="a" cx="33" cy="60" r="3.2" fill="#4ade80"/>
</svg>
