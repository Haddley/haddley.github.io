<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The agent loop. The question, the page hint and the recent history go to the model. If the model replies with a tool call, the browser runs the tool on local data and sends the result back, up to eight rounds. When the model answers in plain text, that answer is shown."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="520" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The agent loop</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The model asks, the browser does the work, and they repeat until there is an answer</text><rect x="30" y="80" width="220" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="140.0" y="103.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1. Build the request</text><text x="140.0" y="121.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">system prompt + last 3 exchanges</text><text x="140.0" y="138.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">+ page hint + your question</text><rect x="300" y="80" width="160" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="380.0" y="103.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">2. Ask the model</text><text x="380.0" y="121.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">one call to the</text><text x="380.0" y="138.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">backend</text><polyline points="250,117 298,117" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="510" y="80" width="220" height="74" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="620.0" y="103.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">3. Read the reply</text><text x="620.0" y="121.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">a JSON tool call, or</text><text x="620.0" y="138.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">plain text?</text><polyline points="460,117 508,117" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="510" y="230" width="220" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="620.0" y="253.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">4a. Plain text</text><text x="620.0" y="271.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">that is the answer:</text><text x="620.0" y="288.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">show it to the visitor</text><polyline points="670,154 670,228" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="680" y="196" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">plain text</text><rect x="30" y="230" width="220" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="253.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">4b. Tool call</text><text x="140.0" y="271.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">run the tool in the browser</text><text x="140.0" y="288.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">on the local JSON data</text><polyline points="560,154 560,192 140,192 140,228" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/><text x="350" y="185" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">tool call</text><rect x="30" y="370" width="220" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="140.0" y="393.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">5. Wrap the result</text><text x="140.0" y="411.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">as a tool_response and</text><text x="140.0" y="428.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">add it to the request</text><polyline points="140,304 140,368" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="140,444 140,476 20,476 20,117 28,117" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/><text x="150" y="470" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">repeat, at most 8 rounds</text><rect x="330" y="370" width="400" height="74" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="530.0" y="393.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Guard rails inside the loop</text><text x="530.0" y="411.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the same call twice is refused · at most 6 full post fetches</text><text x="530.0" y="428.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the last rounds tell the model to answer now</text></svg>