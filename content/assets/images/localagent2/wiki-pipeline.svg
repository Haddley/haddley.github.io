<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="How the blog wiki is made and checked. Each post is split into numbered sentences. A local model picks sentence numbers, so every quote is copied word for word. Topic pages are built from the post pages. An audit checks every quote against the post, and the deploy stops if one fails."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="560" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">How the wiki is made and checked</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The model chooses sentence numbers. A program copies the words.</text><rect x="30" y="76" width="200" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="130.0" y="100.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">content/*.md</text><text x="130.0" y="118.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the posts</text><rect x="280" y="76" width="220" height="58" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="390.0" y="100.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Number the sentences</text><text x="390.0" y="118.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1. 2. 3. ... by a script</text><rect x="550" y="76" width="180" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="640.0" y="100.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Local model</text><text x="640.0" y="118.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">gemma4:12b picks ids</text><polyline points="230,105 278,105" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="500,105 548,105" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="190" width="330" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="195.0" y="211.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">wiki/posts/&lt;slug&gt;.md</text><text x="195.0" y="229.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">292 pages: summary, claims,</text><text x="195.0" y="246.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">each claim with a copied quote</text><polyline points="640,134 640,160 195,160 195,188" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/><text x="420" y="154" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">ids in, words copied out by the script</text><rect x="400" y="190" width="330" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="565.0" y="211.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">wiki/concepts/&lt;topic&gt;.md</text><text x="565.0" y="229.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">15 topic pages, built from the post</text><text x="565.0" y="246.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">pages that share a tag</text><polyline points="360,225 398,225" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="320" width="700" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="380.0" y="341.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Audit</text><text x="380.0" y="359.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">every quote must appear word for word in its post · every claim needs a quote</text><text x="380.0" y="376.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">a changed post makes its page "stale"</text><polyline points="195,260 195,318" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="565,260 565,318" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="30" y="440" width="330" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="195.0" y="465.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">agent-wiki.json</text><text x="195.0" y="483.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">what the agent loads when it needs the wiki</text><rect x="400" y="440" width="330" height="60" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="565.0" y="465.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Deploy gate</text><text x="565.0" y="483.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">a failed audit stops the site build</text><polyline points="195,390 195,438" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="205" y="420" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">pass</text><polyline points="565,390 565,438" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr)"/><text x="575" y="420" font-size="11.5" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">pass</text><text x="30" y="535" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic">A new or edited post is picked up with one command: npm run wiki</text></svg>