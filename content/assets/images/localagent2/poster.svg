<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img">
  <title>A browser window, a gate with a keyhole, and a small neural network: the chat agent, its gatekeeper and its model</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5bb4ea"/></marker>
  </defs>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>

  <!-- Browser window -->
  <rect x="8" y="36" width="28" height="48" rx="5.5" fill="#17304a" stroke="#5bb4ea" stroke-width="2.2"/>
  <line x1="8" y1="46" x2="36" y2="46" stroke="#5bb4ea" stroke-width="1.6"/>
  <circle cx="14" cy="41" r="1.5" fill="#5bb4ea"/>
  <circle cx="19" cy="41" r="1.5" fill="#5bb4ea"/>
  <circle cx="24" cy="41" r="1.5" fill="#5bb4ea"/>
  <rect x="13" y="52" width="18" height="3" rx="1.5" fill="#5bb4ea" opacity="0.75"/>
  <rect x="13" y="59" width="14" height="3" rx="1.5" fill="#5bb4ea" opacity="0.55"/>
  <rect x="13" y="66" width="17" height="3" rx="1.5" fill="#5bb4ea" opacity="0.55"/>
  <rect x="13" y="73" width="11" height="3" rx="1.5" fill="#5bb4ea" opacity="0.4"/>

  <!-- Arrow to the gate -->
  <line x1="37.5" y1="60" x2="43.5" y2="60" stroke="#5bb4ea" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Gate: a shield with a keyhole -->
  <path d="M60,28 L77,35 V57 C77,72 69,83 60,92 C51,83 43,72 43,57 V35 Z" fill="#2b2412" stroke="#f5a623" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="60" cy="54" r="5" fill="#f5a623"/>
  <path d="M58,57 H62 L63.4,70 H56.6 Z" fill="#f5a623"/>

  <!-- Arrow to the model -->
  <line x1="78.5" y1="60" x2="84.5" y2="60" stroke="#5bb4ea" stroke-width="2.2" marker-end="url(#a)"/>

  <!-- Model: a small neural network -->
  <g stroke="#4fc3f7" stroke-width="1.6" opacity="0.55">
    <line x1="99" y1="36" x2="91" y2="56"/>
    <line x1="99" y1="36" x2="108" y2="56"/>
    <line x1="91" y1="56" x2="95" y2="82"/>
    <line x1="91" y1="56" x2="107" y2="82"/>
    <line x1="108" y1="56" x2="95" y2="82"/>
    <line x1="108" y1="56" x2="107" y2="82"/>
    <line x1="91" y1="56" x2="108" y2="56"/>
  </g>
  <circle cx="99" cy="36" r="6" fill="#7dd3fc"/>
  <circle cx="91" cy="56" r="5.2" fill="#4fc3f7" opacity="0.9"/>
  <circle cx="108" cy="56" r="5.2" fill="#4fc3f7" opacity="0.9"/>
  <circle cx="95" cy="82" r="5.6" fill="#4fc3f7" opacity="0.8"/>
  <circle cx="107" cy="82" r="5.6" fill="#4fc3f7" opacity="0.8"/>
</svg>
