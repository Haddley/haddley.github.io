<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The nine tools and where each gets its data. Three search the post list in agent-data.json, one reads a post file, three search or list the wiki file, one moves the page with the Next.js router, and one sends a query to the web through Jina."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="650" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The tool belt</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Nine tools, five places they get their data</text><rect x="30" y="80" width="240" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="107.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">search_posts</text><rect x="30" y="136" width="240" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="163.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">get_posts_by_category</text><rect x="30" y="192" width="240" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="219.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">list_categories</text><rect x="30" y="262" width="240" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="289.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">get_post_content</text><rect x="30" y="332" width="240" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="150.0" y="359.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">search_wiki</text><rect x="30" y="388" width="240" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="150.0" y="415.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">list_topics</text><rect x="30" y="444" width="240" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="150.0" y="471.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">get_topic</text><rect x="30" y="514" width="240" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="150.0" y="541.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">navigate_to_post</text><rect x="30" y="570" width="240" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="150.0" y="597.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">web_search</text><rect x="500" y="120" width="230" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="615.0" y="145.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">agent-data.json</text><text x="615.0" y="163.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">titles, descriptions, tags,</text><text x="615.0" y="180.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">categories of every post</text><rect x="500" y="250" width="230" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="615.0" y="276.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">agent-posts/&lt;slug&gt;.json</text><text x="615.0" y="294.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the text of one post</text><rect x="500" y="360" width="230" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="615.0" y="385.875" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">agent-wiki.json</text><text x="615.0" y="403.375" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">summaries, claims, quotes</text><text x="615.0" y="420.875" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">and topic pages</text><rect x="500" y="506" width="230" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="615.0" y="533.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Next.js router</text><rect x="500" y="570" width="230" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="615.0" y="597.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The web (s.jina.ai)</text><polyline points="270,103 385,103 385,150 498,150" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,159 385,159 385,160 498,160" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,215 385,215 385,175 498,175" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,285 498,285" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,355 385,355 385,385 498,385" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,411 498,399" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,467 385,467 385,413 498,413" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,537 498,529" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="270,593 498,593" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr)"/><text x="384" y="585" font-size="11.5" fill="#374151" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-style="italic" stroke="#ffffff" stroke-width="4" paint-order="stroke">last resort</text></svg>