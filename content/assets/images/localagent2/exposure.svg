<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="Before and after. Before, the internet could reach Ollama directly, so anyone could pick any model and send any prompt. After, the internet reaches only Caddy and the gatekeeper, and Ollama is bound to localhost where nothing outside the Mac mini can reach it."><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="760" height="460" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Before and after</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">What the internet can reach</text><rect x="20" y="70" width="350" height="370" rx="12" fill="#fee2e2" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 3"/><text x="34" y="92" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Before</text><rect x="60" y="110" width="270" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="195.0" y="131.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The internet</text><text x="195.0" y="149.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">any browser, any script</text><rect x="60" y="210" width="270" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="195.0" y="236.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Caddy forwards everything</text><text x="195.0" y="254.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">to Ollama, port 8443</text><rect x="60" y="320" width="270" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="195.0" y="344.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Ollama, wide open</text><text x="195.0" y="362.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">any model, any prompt,</text><text x="195.0" y="380.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">no limits of my own</text><polyline points="195,162 195,208" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="195,272 195,318" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><rect x="390" y="70" width="350" height="370" rx="12" fill="#dcfce7" fill-opacity="0.45" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3"/><text x="404" y="92" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">After</text><rect x="430" y="110" width="270" height="52" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="565.0" y="131.55" font-size="13" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The internet</text><text x="565.0" y="149.55" font-size="13" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">any browser, any script</text><rect x="430" y="195" width="270" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="565.0" y="216.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Caddy</text><text x="565.0" y="234.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">two paths only, else 404</text><rect x="430" y="280" width="270" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="565.0" y="301.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Gatekeeper</text><text x="565.0" y="319.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">origin, limits, one fixed model</text><rect x="430" y="365" width="270" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="565.0" y="388.625" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Ollama on localhost</text><text x="565.0" y="406.125" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">unreachable from outside</text><polyline points="565,162 565,193" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="565,247 565,278" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="565,332 565,363" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/></svg>