<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Analytics key events on a static site and a one dollar a day ad experiment</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><path d="M10,100 H110 M10,100 V20" stroke="#5bb4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<g class="p" style="animation-delay:0.5s"><rect x="20" y="70" width="14" height="30" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:0.9s"><rect x="40" y="56" width="14" height="44" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:1.3s"><rect x="60" y="44" width="14" height="56" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:1.7s"><rect x="80" y="30" width="14" height="70" fill="#2f9e4a"/></g>
<g class="p" style="animation-delay:2.4s"><path d="M87,13 L89.7,19.3 L96,22 L89.7,24.7 L87,31 L84.3,24.7 L78,22 L84.3,19.3 Z" fill="#ffb43a"/></g>
<g class="p" style="animation-delay:3.0s"><g><circle cx="100" cy="58" r="10" fill="#ffb43a"/><text x="100" y="62" text-anchor="middle" font-size="9" fill="#0f1b2d" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">$1</text></g></g>
</svg>
