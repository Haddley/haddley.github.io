<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A Business Central page shows Dataverse orders through an integration table without copying them</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g><rect class="f" style="animation-delay:0s" x="6" y="24" width="60" height="72" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><rect x="6" y="24" width="60" height="10" rx="5" fill="#5bb4ea"/></g>
<path class="d" style="animation-delay:0.6s" pathLength="1" d="M12,44 H60 M12,54 H60 M12,64 H60 M12,74 H60 M12,84 H46" stroke="#c9d3dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g><path class="p" style="animation-delay:1.6s" d="M86,42 V73 A12.0,5 0 0 0 110,73 V42" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5"/><ellipse cx="98.0" cy="42" rx="12.0" ry="5" fill="#2f9e4a" stroke="#7cc6f0" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:2.4s" pathLength="1" d="M66,54 H86 M66,66 H86" stroke="#ffb43a" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g><circle class="p" style="animation-delay:3.0s" cx="76" cy="60" r="6" fill="#0f1b2d" stroke="#ffb43a" stroke-width="1.5"/><path d="M73,60 H79 M76,57 V63" stroke="#ffb43a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
