<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A seven-spoked ship wheel turning: Kubernetes orchestrating containers</title><style>@keyframes fade{0%{opacity:0}24.5%,70%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}24.5%,70%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}42%,70%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}31.5%,70%,100%{transform:scaleY(1)}}
.f{animation:fade 5s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 5s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 5s ease-out both infinite alternate}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 5s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes wheel{0%,7%{transform:rotate(-120deg)}56%,70%,100%{transform:rotate(0)}}.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 5s ease-in-out both infinite alternate}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="wheel"><circle cx="60" cy="58" r="30" fill="none" stroke="#326ce5" stroke-width="5"/><circle cx="60" cy="58" r="8" fill="#326ce5"/><path d="M60 58 L60.0 28.0" stroke="#326ce5" stroke-width="3"/><circle cx="60.0" cy="21.0" r="3.5" fill="#326ce5"/><path d="M60 58 L83.5 39.3" stroke="#326ce5" stroke-width="3"/><circle cx="88.9" cy="34.9" r="3.5" fill="#326ce5"/><path d="M60 58 L89.2 64.7" stroke="#326ce5" stroke-width="3"/><circle cx="96.1" cy="66.2" r="3.5" fill="#326ce5"/><path d="M60 58 L73.0 85.0" stroke="#326ce5" stroke-width="3"/><circle cx="76.1" cy="91.3" r="3.5" fill="#326ce5"/><path d="M60 58 L47.0 85.0" stroke="#326ce5" stroke-width="3"/><circle cx="43.9" cy="91.3" r="3.5" fill="#326ce5"/><path d="M60 58 L30.8 64.7" stroke="#326ce5" stroke-width="3"/><circle cx="23.9" cy="66.2" r="3.5" fill="#326ce5"/><path d="M60 58 L36.5 39.3" stroke="#326ce5" stroke-width="3"/><circle cx="31.1" cy="34.9" r="3.5" fill="#326ce5"/></g></svg>