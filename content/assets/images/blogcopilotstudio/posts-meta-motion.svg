<path class="d" style="animation-delay:2.0s" pathLength="1" d="M82,70 H70 M74,66.5 L70,70 L74,73.5" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
