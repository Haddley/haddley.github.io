<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A notebook of cells running a Scheme-like LISP</title><style>@keyframes fade{0%{opacity:0}16.12%,46.05%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}27.63%,46.05%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}16.12%,46.05%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.6s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.6s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.6s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="16" width="104" height="88" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.4s"><g><rect x="14" y="24" width="92" height="22" rx="3" fill="#0f1b2d"/><text x="60" y="40" text-anchor="middle" font-size="10" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">(+ 1 2)</text></g></g>
<g class="p" style="animation-delay:1.2s"><text x="60" y="58" text-anchor="middle" font-size="10" fill="#2f9e4a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">3</text></g>
<g class="p" style="animation-delay:1.8s"><g><rect x="14" y="66" width="92" height="22" rx="3" fill="#0f1b2d"/><text x="60" y="82" text-anchor="middle" font-size="8" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">(* 3 (+ 1 2))</text></g></g>
<g class="p" style="animation-delay:2.6s"><text x="60" y="99" text-anchor="middle" font-size="9" fill="#2f9e4a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">9</text></g>
</svg>
