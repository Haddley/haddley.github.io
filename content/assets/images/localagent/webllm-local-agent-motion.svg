<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A small neural network lighting up and answering with a chat bubble: the blog assistant</title><style>
@keyframes pulse{0%,4.82%{fill-opacity:.25}18.07%,60.24%,100%{fill-opacity:1}}
@keyframes wire{0%,4.82%{stroke-opacity:.1}21.08%,60.24%,100%{stroke-opacity:1}}
@keyframes bub{0%,33.13%{opacity:0;transform:translateY(6px)}40.96%,60.24%,100%{opacity:1;transform:translateY(0)}}
@keyframes dot{0%,36.14%{opacity:0}40.96%,43.37%{opacity:1}48.19%,60.24%,100%{opacity:1}}
.n{animation:pulse 8.3s ease-out both infinite alternate}.w{animation:wire 8.3s ease-out both infinite alternate}.b{animation:bub 8.3s ease-out both infinite alternate}.d{animation:dot 8.3s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){.n,.w,.b,.d{animation:none}}
</style>
  <!-- Background circle -->
  <rect width="120" height="120" rx="22" fill="#1a2b4b"/>

  <!-- Brain / neural network nodes -->
  <!-- Left cluster -->
  <circle class="n" style="animation-delay:0.18s" cx="32" cy="45" r="6" fill="#4fc3f7" opacity="0.9"/>
  <circle class="n" style="animation-delay:0.36s" cx="28" cy="65" r="5" fill="#4fc3f7" opacity="0.75"/>
  <circle class="n" style="animation-delay:0.54s" cx="38" cy="78" r="5.5" fill="#4fc3f7" opacity="0.8"/>

  <!-- Right cluster -->
  <circle class="n" style="animation-delay:0.72s" cx="88" cy="45" r="6" fill="#4fc3f7" opacity="0.9"/>
  <circle class="n" style="animation-delay:0.90s" cx="92" cy="65" r="5" fill="#4fc3f7" opacity="0.75"/>
  <circle class="n" style="animation-delay:1.08s" cx="82" cy="78" r="5.5" fill="#4fc3f7" opacity="0.8"/>

  <!-- Center nodes -->
  <circle class="n" style="animation-delay:1.26s" cx="60" cy="35" r="7" fill="#80deea" opacity="0.95"/>
  <circle class="n" style="animation-delay:1.44s" cx="48" cy="58" r="6" fill="#80deea" opacity="0.85"/>
  <circle class="n" style="animation-delay:1.62s" cx="72" cy="58" r="6" fill="#80deea" opacity="0.85"/>
  <circle class="n" style="animation-delay:1.80s" cx="60" cy="80" r="7" fill="#80deea" opacity="0.95"/>

  <!-- Connections -->
  <line class="w" x1="32" y1="45" x2="60" y2="35" stroke="#4fc3f7" stroke-width="1.2" opacity="0.5"/>
  <line class="w" x1="32" y1="45" x2="48" y2="58" stroke="#4fc3f7" stroke-width="1.2" opacity="0.5"/>
  <line class="w" x1="28" y1="65" x2="48" y2="58" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <line class="w" x1="28" y1="65" x2="38" y2="78" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <line class="w" x1="38" y1="78" x2="60" y2="80" stroke="#4fc3f7" stroke-width="1.2" opacity="0.5"/>

  <line class="w" x1="88" y1="45" x2="60" y2="35" stroke="#4fc3f7" stroke-width="1.2" opacity="0.5"/>
  <line class="w" x1="88" y1="45" x2="72" y2="58" stroke="#4fc3f7" stroke-width="1.2" opacity="0.5"/>
  <line class="w" x1="92" y1="65" x2="72" y2="58" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <line class="w" x1="92" y1="65" x2="82" y2="78" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <line class="w" x1="82" y1="78" x2="60" y2="80" stroke="#4fc3f7" stroke-width="1.2" opacity="0.5"/>

  <line class="w" x1="60" y1="35" x2="48" y2="58" stroke="#80deea" stroke-width="1.4" opacity="0.6"/>
  <line class="w" x1="60" y1="35" x2="72" y2="58" stroke="#80deea" stroke-width="1.4" opacity="0.6"/>
  <line class="w" x1="48" y1="58" x2="60" y2="80" stroke="#80deea" stroke-width="1.4" opacity="0.6"/>
  <line class="w" x1="72" y1="58" x2="60" y2="80" stroke="#80deea" stroke-width="1.4" opacity="0.6"/>
  <line class="w" x1="48" y1="58" x2="72" y2="58" stroke="#80deea" stroke-width="1.4" opacity="0.55"/>

  <!-- Chat bubble indicator at bottom right -->
  <g class="b" style="transform-box:fill-box"><rect x="70" y="88" width="24" height="16" rx="4" fill="#ffffff" opacity="0.9"/>
  <polygon points="74,104 70,110 80,104" fill="#ffffff" opacity="0.9"/></g>
  <!-- Dots inside bubble -->
  <circle class="d" style="animation-delay:0.15s" cx="77" cy="96" r="1.8" fill="#1a2b4b"/>
  <circle class="d" style="animation-delay:0.30s" cx="82" cy="96" r="1.8" fill="#1a2b4b"/>
  <circle class="d" style="animation-delay:0.45s" cx="87" cy="96" r="1.8" fill="#1a2b4b"/>
</svg>
