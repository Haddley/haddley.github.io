<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 566" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="After Tim gave his dog a, the real next word is bone. Learning from the answer alone gives bone 100 percent and every other piece 0. GPT-2, trained on web text, gives hug 6.2 percent, big 2.1, good 2.0, ride 1.5, treat 1.0, and bone just 0.03 percent, in 501st place; its 20 biggest slices hold 28 percent. TinyStories-33M, trained on children's stories, gives bone 24.7 percent, first place, then big 17.2, treat 6.9, hug 4.0, and stick 3.9; its 20 biggest slices hold 78 percent."><rect width="720" height="566" fill="#fff"/><text x="24.0" y="30.0" font-size="15" fill="#111827" text-anchor="start" font-weight="600">What the student learns from, after “Tim gave his dog a”</text><text x="24.0" y="50.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">The guessing game from Part 2, against two teachers' real wheels. The two teachers are drawn on the same scale</text><text x="24.0" y="84.0" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">The answer alone</text><text x="24.0" y="100.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">one slice gets everything</text><text x="86.0" y="130.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">bone</text><rect x="94" y="119" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="94" y="119" width="170.0" height="16" rx="3" fill="#dc2626"/><text x="272.0" y="131.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">100%</text><text x="86.0" y="158.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">ball</text><rect x="94" y="147" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="272.0" y="159.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="86.0" y="186.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">treat</text><rect x="94" y="175" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="272.0" y="187.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="86.0" y="214.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">hug</text><rect x="94" y="203" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="272.0" y="215.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="86.0" y="242.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">banana</text><rect x="94" y="231" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="272.0" y="243.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="372.0" y="84.0" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">GPT-2: learned from the web</text><text x="372.0" y="100.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">bars drawn up to 25%</text><text x="434.0" y="130.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">hug</text><rect x="442" y="119" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="119" width="42.2" height="16" rx="3" fill="#2563eb"/><text x="620.0" y="131.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">6.2%</text><text x="434.0" y="158.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">big</text><rect x="442" y="147" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="147" width="14.3" height="16" rx="3" fill="#2563eb"/><text x="620.0" y="159.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">2.1%</text><text x="434.0" y="186.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">good</text><rect x="442" y="175" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="175" width="13.6" height="16" rx="3" fill="#2563eb"/><text x="620.0" y="187.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">2.0%</text><text x="434.0" y="214.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">treat</text><rect x="442" y="203" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="203" width="6.8" height="16" rx="3" fill="#2563eb"/><text x="620.0" y="215.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">1.0%</text><text x="434.0" y="242.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">bone</text><rect x="442" y="231" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="231" width="2.0" height="16" rx="3" fill="#2563eb"/><text x="620.0" y="243.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0.03%: 501st</text><text x="442.0" y="268.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">its 20 biggest slices hold only 28%</text><text x="372.0" y="300.0" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">TinyStories-33M: learned from stories</text><text x="372.0" y="316.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">bars drawn up to 25%</text><text x="434.0" y="346.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">bone</text><rect x="442" y="335" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="335" width="168.0" height="16" rx="3" fill="#16a34a"/><text x="620.0" y="347.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">24.7%: 1st</text><text x="434.0" y="374.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">big</text><rect x="442" y="363" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="363" width="117.0" height="16" rx="3" fill="#16a34a"/><text x="620.0" y="375.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">17.2%</text><text x="434.0" y="402.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">treat</text><rect x="442" y="391" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="391" width="46.9" height="16" rx="3" fill="#16a34a"/><text x="620.0" y="403.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">6.9%</text><text x="434.0" y="430.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">hug</text><rect x="442" y="419" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="419" width="27.2" height="16" rx="3" fill="#16a34a"/><text x="620.0" y="431.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">4.0%</text><text x="434.0" y="458.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">stick</text><rect x="442" y="447" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="442" y="447" width="26.5" height="16" rx="3" fill="#16a34a"/><text x="620.0" y="459.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">3.9%</text><text x="442.0" y="484.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">its 20 biggest slices hold 78%</text><rect x="24" y="500" width="672" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/><text x="40.0" y="521.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">The answer alone says only that bone was right. A teacher's wheel also says which near misses were reasonable,</text><text x="40.0" y="539.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">but only a teacher that knows this kind of text puts the chance in the right places.</text></svg>
