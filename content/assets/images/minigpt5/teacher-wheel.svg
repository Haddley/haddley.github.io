<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="After Tim gave his dog a, the real next word is bone. Learning from the answer alone gives bone 100 percent and every other piece 0, so ball, treat, hug, and banana all count as equally wrong. GPT-2's real wheel gives hug 6.2 percent, big 2.1, good 2.0, treat 1.0, and thousands of thinner slices; its 20 biggest slices hold only 28 percent, and bone gets just 0.03 percent, in 501st place. Distillation trains the student to copy the whole wheel."><rect width="720" height="380" fill="#fff"/><text x="24.0" y="30.0" font-size="15" fill="#111827" text-anchor="start" font-weight="600">What the student learns from, after “Tim gave his dog a”</text><text x="24.0" y="50.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Left: the guessing game from Part 2. Right: a teacher's whole wheel, GPT-2's real chances</text><text x="24.0" y="84.0" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">The answer alone</text><text x="24.0" y="100.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">one slice gets everything</text><text x="98.0" y="132.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">bone</text><rect x="106" y="121" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="106" y="121" width="170.0" height="16" rx="3" fill="#dc2626"/><text x="284.0" y="133.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">100%</text><text x="98.0" y="162.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">ball</text><rect x="106" y="151" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="284.0" y="163.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="98.0" y="192.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">treat</text><rect x="106" y="181" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="284.0" y="193.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="98.0" y="222.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">hug</text><rect x="106" y="211" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="284.0" y="223.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="98.0" y="252.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">banana</text><rect x="106" y="241" width="170" height="16" rx="3" fill="#f3f4f6"/><text x="284.0" y="253.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0</text><text x="372.0" y="84.0" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">A teacher's wheel (GPT-2)</text><text x="372.0" y="100.0" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">spread over thousands of pieces (bars drawn up to 10%)</text><text x="446.0" y="132.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">hug</text><rect x="454" y="121" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="454" y="121" width="105.4" height="16" rx="3" fill="#2563eb"/><text x="632.0" y="133.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">6.2%</text><text x="446.0" y="162.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">big</text><rect x="454" y="151" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="454" y="151" width="35.7" height="16" rx="3" fill="#2563eb"/><text x="632.0" y="163.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">2.1%</text><text x="446.0" y="192.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">good</text><rect x="454" y="181" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="454" y="181" width="34.0" height="16" rx="3" fill="#2563eb"/><text x="632.0" y="193.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">2.0%</text><text x="446.0" y="222.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">treat</text><rect x="454" y="211" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="454" y="211" width="17.0" height="16" rx="3" fill="#2563eb"/><text x="632.0" y="223.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">1.0%</text><text x="446.0" y="252.0" font-size="12" fill="#111827" text-anchor="end" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">bone</text><rect x="454" y="241" width="170" height="16" rx="3" fill="#f3f4f6"/><rect x="454" y="241" width="2.0" height="16" rx="3" fill="#2563eb"/><text x="632.0" y="253.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">0.03%: 501st</text><text x="446.0" y="288.0" font-size="14" fill="#6b7280" text-anchor="end" font-weight="normal">…</text><text x="454.0" y="290.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">the 20 biggest slices hold only 28%</text><rect x="24" y="314" width="672" height="50" rx="10" fill="#f9fafb" stroke="#e5e7eb"/><text x="40.0" y="335.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">On the left, ball, treat, hug, and banana are all simply wrong. On the right, the student also learns which near misses were</text><text x="40.0" y="353.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">reasonable. Copying the whole wheel is distillation, and comparing wheels slice by slice is why the pieces must match.</text></svg>
