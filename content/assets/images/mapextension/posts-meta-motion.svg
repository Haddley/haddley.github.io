<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A customer card with a map that shows where the customer is</title><style>@keyframes fade{0%{opacity:0}18.01%,51.47%,100%{opacity:1}}
