<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A lightning bolt function connected to a Business Central tile: creating the Azure Functions app</title><style>@keyframes fade{0%{opacity:0}19.76%,56.45%,100%{opacity:1}}
