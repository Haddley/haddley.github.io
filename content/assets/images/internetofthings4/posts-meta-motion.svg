<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Readings flowing through a broker into a database and a chart, with a delayed copy into a second database</title><style>.e{animation:fly 1.8s linear infinite;opacity:0}.e2{animation-delay:.6s}.e3{animation-delay:1.2s}.h{animation:hb 1.8s ease-in-out infinite}.hand{transform-box:view-box;transform-origin:60px 96px;animation:spin 9s linear infinite}.p{opacity:0;animation:mv 9s ease-in-out infinite}.c2{opacity:.35;animation:fl 9s ease-out infinite}.t{opacity:0;animation:tk 9s ease-out infinite}@keyframes fly{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(18px);opacity:0}}@keyframes hb{0%,100%{opacity:.85}50%{opacity:1}}@keyframes spin{0%{transform:rotate(0)}65%{transform:rotate(720deg)}100%{transform:rotate(720deg)}}@keyframes mv{0%,60%{transform:translate(0,0);opacity:0}64%{opacity:1}80%{transform:translate(22px,38px);opacity:1}84%,100%{transform:translate(22px,38px);opacity:0}}@keyframes fl{0%,78%{opacity:.35}86%,100%{opacity:1}}@keyframes tk{0%,82%{opacity:0}90%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.e{animation:none;opacity:1}.h{animation:none}.hand{animation:none}.p{display:none}.c2,.t{animation:none;opacity:1}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g fill="#fb923c"><circle class="e e1" cx="12" cy="36" r="3.5"/><circle class="e e2" cx="12" cy="48" r="3.5"/><circle class="e e3" cx="12" cy="60" r="3.5"/></g><path d="M24 48 h4" stroke="#9db0c3" stroke-width="3" stroke-linecap="round"/><g class="h"><g><rect x="30" y="26" width="26" height="44" rx="8" fill="#38bdf8"/><circle cx="43" cy="48" r="5" fill="#0f1b2d"/><path d="M43 48 L36 38 M43 48 L50 38 M43 48 L36 58 M43 48 L50 58" stroke="#0f1b2d" stroke-width="2" stroke-linecap="round"/></g></g><path d="M57 48 h4" stroke="#9db0c3" stroke-width="3" stroke-linecap="round"/><g><rect x="62" y="26" width="24" height="44" rx="8" fill="#22c55e"/><ellipse cx="74" cy="37" rx="8" ry="3" fill="#0f1b2d" opacity=".7"/><rect x="66" y="37" width="16" height="16" fill="#0f1b2d" opacity=".45"/><ellipse cx="74" cy="53" rx="8" ry="3" fill="#0f1b2d" opacity=".7"/></g><path d="M87 48 h4" stroke="#9db0c3" stroke-width="3" stroke-linecap="round"/><g><rect x="92" y="26" width="22" height="44" rx="8" fill="#a78bfa"/><rect x="97" y="52" width="3.5" height="12" rx="1" fill="#fff"/><rect x="103" y="42" width="3.5" height="22" rx="1" fill="#fff"/><rect x="109" y="36" width="3.5" height="28" rx="1" fill="#fff" opacity=".0"/></g><g><circle cx="60" cy="96" r="13" fill="#fbbf24"/><circle cx="60" cy="96" r="9" fill="#fff7e0"/><path class="hand" d="M60 90 v6" stroke="#451a03" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M60 96 l4 3" stroke="#451a03" stroke-width="2.4" fill="none" stroke-linecap="round"/></g><g class="c2"><g><rect x="84" y="82" width="24" height="26" rx="7" fill="#2dd4bf"/><ellipse cx="96" cy="91" rx="7" ry="2.6" fill="#0f1b2d" opacity=".7"/><rect x="89" y="91" width="14" height="9" fill="#0f1b2d" opacity=".45"/></g></g><circle class="p" cx="74" cy="56" r="3.5" fill="#fb923c"/><g class="t"><circle cx="108" cy="16" r="8" fill="#16a34a"/><path d="M104 16 l2.6 2.6 l4.4 -5.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>