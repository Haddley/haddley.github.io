<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <circle cx="60" cy="60" r="58" fill="#0d3b3e" />

  <!-- Business Central: a 2x2 grid of API tiles, left side -->
  <g opacity="0.95">
    <rect x="22" y="34" width="18" height="18" rx="3" fill="#2ec4c6"/>
    <rect x="42" y="34" width="18" height="18" rx="3" fill="#2ec4c6" opacity="0.75"/>
    <rect x="22" y="54" width="18" height="18" rx="3" fill="#2ec4c6" opacity="0.75"/>
    <rect x="42" y="54" width="18" height="18" rx="3" fill="#2ec4c6" opacity="0.55"/>
  </g>

  <!-- cloud arc above, signalling this server is custom-deployed rather than built in -->
  <path d="M 68 30 q 4 -6 10 -3 q 3 -5 9 -2 q 5 1 4 7 q 4 1 3 5 l -24 0 q -4 -1 -2 -7 z"
        fill="#ffffff" opacity="0.35"/>

  <!-- MCP link connecting the two sides -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="62" y1="63" x2="76" y2="63"/>
  </g>
  <circle cx="62" cy="63" r="3" fill="#ffffff"/>
  <circle cx="76" cy="63" r="3" fill="#ffffff"/>

  <!-- terminal prompt glyph, right side -->
  <rect x="76" y="46" width="24" height="24" rx="6" fill="#d97757"/>
  <path d="M 81 54 L 87 58 L 81 62" fill="none" stroke="#0d3b3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="90" y1="62" x2="96" y2="62" stroke="#0d3b3e" stroke-width="2.4" stroke-linecap="round"/>
</svg>
