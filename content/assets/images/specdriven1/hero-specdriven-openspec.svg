  <g class="tw" style="animation-delay:1.29s"><rect x="15" y="60" width="5" height="5" fill="#1a2b4b" opacity="0.7"/></g>
  <g class="tw" style="animation-delay:1.72s"><rect x="23" y="60" width="5" height="5" fill="#1a2b4b" opacity="0.7"/></g>
  <g class="tw" style="animation-delay:2.15s"><rect x="31" y="60" width="5" height="5" fill="#1a2b4b" opacity="0.7"/></g>
  <g class="tw" style="animation-delay:2.58s"><rect x="15" y="70" width="5" height="5" fill="#1a2b4b" opacity="0.7"/></g>
  <g class="tw" style="animation-delay:3.01s"><rect x="23" y="70" width="5" height="5" fill="#1a2b4b" opacity="0.7"/></g>
  <rect x="31" y="70" width="5" height="5" fill="#1a2b4b" opacity="0.7"/>
  <rect x="15" y="80" width="21" height="5" fill="#1a2b4b" opacity="0.7"/>

  <!-- Arrow, proposal becoming spec -->
  <line x1="50" y1="60" x2="68" y2="60" stroke="#80deea" stroke-width="2.4" opacity="0.9"/>
  <polygon points="68,55 76,60 68,65" fill="#80deea" opacity="0.9"/>

  <!-- Spec document, right, with delta markers -->
  <path d="M82 26 H100 L108 34 V94 H82 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M100 26 V34 H108 Z" fill="#4fc3f7" opacity="0.85"/>
