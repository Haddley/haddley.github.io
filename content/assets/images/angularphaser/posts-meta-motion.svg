<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A Phaser game scene bouncing inside an Angular component</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="10" y="18" width="100" height="84" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="f" style="animation-delay:0.5s"><path d="M20,90 C30,30 44,30 54,90 C62,50 72,50 82,90" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<g class="p" style="animation-delay:1.2s"><circle cx="28" cy="44" r="7" fill="#ffb43a"/></g>
<g class="p" style="animation-delay:1.8s"><circle cx="68" cy="58" r="7" fill="#2f9e4a"/></g>
<g class="p" style="animation-delay:2.4s"><rect x="20" y="92" width="80" height="4" rx="2" fill="#5bb4ea"/></g>
</svg>
