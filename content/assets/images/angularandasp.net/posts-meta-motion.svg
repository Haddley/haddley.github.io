<path class="d" style="animation-delay:0.5s" pathLength="1" d="M18,36 H80" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:1.4s" pathLength="1" d="M60,58 V68 M56,64 L60,69 L64,64 M70,68 V58 M66,62 L70,57 L74,62" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
