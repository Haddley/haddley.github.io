  <line x1="50" y1="42" x2="76" y2="42" stroke="#1a2b4b" stroke-width="2" opacity="0.4"/>
  <g class="tw" style="animation-delay:1.67s"><circle cx="44" cy="54" r="3" fill="#27c93f"/></g>
  <line x1="50" y1="54" x2="76" y2="54" stroke="#1a2b4b" stroke-width="2" opacity="0.4"/>
  <g class="tw" style="animation-delay:2.10s"><circle cx="44" cy="66" r="3" fill="#27c93f"/></g>
  <line x1="50" y1="66" x2="70" y2="66" stroke="#1a2b4b" stroke-width="2" opacity="0.4"/>
  <g class="tw" style="animation-delay:2.53s"><circle cx="44" cy="78" r="3" fill="#27c93f"/></g>
  <line x1="50" y1="78" x2="76" y2="78" stroke="#1a2b4b" stroke-width="2" opacity="0.4"/>
