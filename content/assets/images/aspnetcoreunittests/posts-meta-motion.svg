<g class="p" style="animation-delay:1.0s"><g><circle cx="26" cy="34" r="7" fill="#2f9e4a"/><path d="M22.85,34 L25.3,36.8 L29.5,31.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:1.7s"><g><circle cx="26" cy="54" r="7" fill="#2f9e4a"/><path d="M22.85,54 L25.3,56.8 L29.5,51.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:2.4s"><g><circle cx="26" cy="74" r="7" fill="#2f9e4a"/><path d="M22.85,74 L25.3,76.8 L29.5,71.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:3.0s"><rect x="70" y="86" width="32" height="12" rx="4" fill="#2f9e4a"/></g>
</svg>
