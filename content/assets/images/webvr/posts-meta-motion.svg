<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A virtual reality headset and a 3D scene in the browser</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
