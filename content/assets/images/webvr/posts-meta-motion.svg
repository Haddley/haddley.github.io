.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="21.0" y="19.0" width="78.0" height="42.0" rx="8" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5"/><rect x="30.0" y="28.0" width="60.0" height="24.0" rx="4" fill="#0f1b2d"/><path d="M33.0,19.0 q27.0,-18.0 54.0,0" stroke="#7cc6f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<path class="d" style="animation-delay:0.9s" pathLength="1" d="M30,66 L16,98 M90,66 L104,98" stroke="#c9d3dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.5s"><g><path d="M16,98 H104" stroke="#5bb4ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:2.2s"><g transform="translate(60,86) scale(0.8)"><path d="M0,-16 L16,-8 V10 L0,18 L-16,10 V-8 Z" fill="#1c2a3d" stroke="#ffb43a" stroke-width="1.5"/><path d="M-16,-8 L0,0 L16,-8 M0,0 V18" stroke="#ffb43a" stroke-width="1.5" fill="none"/></g></g>
</svg>
