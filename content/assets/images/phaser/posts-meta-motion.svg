<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A Phaser game scene built from a preload step and a create step</title><style>@keyframes fade{0%{opacity:0}16.55%,47.3%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}28.38%,47.3%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}16.55%,47.3%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.4s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.4s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.4s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="16" width="104" height="88" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.5s"><circle cx="34" cy="50" r="9" fill="#ffb43a"/></g>
<g class="p" style="animation-delay:1.1s"><rect x="62" y="38" width="34" height="14" rx="3" fill="#2f9e4a"/></g>
<g class="p" style="animation-delay:1.7s"><rect x="20" y="86" width="80" height="6" rx="3" fill="#5bb4ea"/></g>
<g class="f" style="animation-delay:2.4s"><path d="M34,60 V84" stroke="#c9d3dd" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
