<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Dimensions label sales so that they can be analysed by salesperson and customer group</title><style>@keyframes fade{0%{opacity:0}16.55%,47.3%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}28.38%,47.3%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}16.55%,47.3%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.4s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.4s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.4s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<path class="f" style="animation-delay:0s" d="M10,100 H110 M10,100 V20" stroke="#5bb4ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g><rect class="p" style="animation-delay:0.5s" x="20" y="64" width="18" height="36" fill="#5bb4ea"/><rect x="20" y="52" width="18" height="12" fill="#ffb43a"/></g>
<g><rect class="p" style="animation-delay:1.0s" x="46" y="48" width="18" height="52" fill="#5bb4ea"/><rect x="46" y="30" width="18" height="18" fill="#ffb43a"/></g>
<g><rect class="p" style="animation-delay:1.5s" x="72" y="72" width="18" height="28" fill="#5bb4ea"/><rect x="72" y="66" width="18" height="6" fill="#ffb43a"/></g>
<g><rect class="p" style="animation-delay:2.4s" x="94" y="18" width="18" height="10" rx="3" fill="#5bb4ea"/><rect x="94" y="32" width="18" height="10" rx="3" fill="#ffb43a"/></g>
</svg>
