<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Dataverse security roles that give each user the access their duties need</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
