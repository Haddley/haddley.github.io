<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>The list of tools fills in one row at a time: three read only, then two that can also change</title><style>.a{animation-duration:6s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}.f0{animation-name:f0}@keyframes f0{0%{opacity:0}3.8%{opacity:0}14.2%{opacity:1}92%{opacity:1}100%{opacity:0}}.f1{animation-name:f1}@keyframes f1{0%{opacity:0}14.2%{opacity:0}24.8%{opacity:1}92%{opacity:1}100%{opacity:0}}.f2{animation-name:f2}@keyframes f2{0%{opacity:0}24.8%{opacity:0}35.2%{opacity:1}92%{opacity:1}100%{opacity:0}}.f3{animation-name:f3}@keyframes f3{0%{opacity:0}35.2%{opacity:0}45.8%{opacity:1}92%{opacity:1}100%{opacity:0}}.f4{animation-name:f4}@keyframes f4{0%{opacity:0}45.8%{opacity:0}56.2%{opacity:1}92%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="a f0"><circle cx="30" cy="28" r="4.5" fill="#7dd3fc"/><rect x="42" y="26" width="48" height="5" rx="2.5" fill="#e0f2fe"/></g><g class="a f1"><circle cx="30" cy="42" r="4.5" fill="#7dd3fc"/><rect x="42" y="40" width="48" height="5" rx="2.5" fill="#e0f2fe"/></g><g class="a f2"><circle cx="30" cy="56" r="4.5" fill="#7dd3fc"/><rect x="42" y="54" width="48" height="5" rx="2.5" fill="#e0f2fe"/></g><g class="a f3"><circle cx="30" cy="70" r="4.5" fill="#fbbf24"/><rect x="42" y="68" width="48" height="5" rx="2.5" fill="#e0f2fe"/></g><g class="a f4"><circle cx="30" cy="84" r="4.5" fill="#fbbf24"/><rect x="42" y="82" width="48" height="5" rx="2.5" fill="#e0f2fe"/></g></svg>