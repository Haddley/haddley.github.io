<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img"
     aria-label="The same two user turns feed two separate assistant chains. The baseline chain keeps UltraChat's original GPT-3.5 answers throughout. The distilled chain has DeepSeek answer both turns instead, with DeepSeek's own first answer fed back in as context for its second answer, never UltraChat's original answer."
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto">
  <rect width="920" height="360" fill="#ffffff"/>
  <defs>
    <marker id="drarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="drarrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <text x="460" y="28" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Same user turns, two self-consistent assistants</text>

  <!-- shared user turns -->
  <rect x="60" y="50" width="200" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="160" y="71" text-anchor="middle" font-size="12.5" fill="#111827">User 1: "…body wash?"</text>

  <rect x="620" y="50" width="220" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="730" y="71" text-anchor="middle" font-size="12.5" fill="#111827">User 2: "…sensitive skin?"</text>

  <text x="460" y="71" text-anchor="middle" font-size="12.5" fill="#6b7280">(identical in both chains)</text>

  <!-- Baseline row -->
  <text x="20" y="130" font-size="12" font-weight="600" fill="#1e3a8a">BASELINE</text>
  <line x1="160" y1="84" x2="160" y2="138" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#drarrow)"/>
  <rect x="60" y="140" width="200" height="36" rx="6" fill="#e0edff" stroke="#bfdbfe"/>
  <text x="160" y="162" text-anchor="middle" font-size="12.5" fill="#111827">A1 (orig., GPT-3.5)</text>

  <line x1="260" y1="158" x2="618" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#drarrow)"/>
  <line x1="730" y1="84" x2="730" y2="138" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#drarrow)"/>
  <rect x="620" y="140" width="220" height="36" rx="6" fill="#e0edff" stroke="#bfdbfe"/>
  <text x="730" y="162" text-anchor="middle" font-size="12.5" fill="#111827">A2 (orig., GPT-3.5)</text>
  <text x="440" y="152" text-anchor="middle" font-size="11.5" fill="#6b7280">GPT-3.5's own A1 feeds its A2</text>

  <!-- Distilled row -->
  <text x="20" y="240" font-size="12" font-weight="600" fill="#9a3412">DISTILLED</text>
  <line x1="160" y1="84" x2="160" y2="248" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#drarrow-orange)"/>
  <rect x="60" y="250" width="200" height="36" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <text x="160" y="272" text-anchor="middle" font-size="12.5" fill="#111827">D1 (DeepSeek)</text>

  <path d="M 260 268 C 400 268, 400 340, 620 268" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#drarrow-orange)"/>
  <text x="440" y="335" text-anchor="middle" font-size="11.5" fill="#9a3412">DeepSeek's OWN D1 feeds its D2 -- never GPT-3.5's A1</text>

  <line x1="730" y1="84" x2="730" y2="248" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#drarrow-orange)"/>
  <rect x="620" y="250" width="220" height="36" rx="6" fill="#ffedd5" stroke="#fdba74"/>
  <text x="730" y="272" text-anchor="middle" font-size="12.5" fill="#111827">D2 (DeepSeek)</text>

  <text x="20" y="310" font-size="12.5" fill="#374151">Same two questions in every chain. Each chain's answers come from one model, in the order it wrote them --</text>
  <text x="20" y="328" font-size="12.5" fill="#374151">no chain ever mixes GPT-3.5's answer at one turn with DeepSeek's answer at the next.</text>
</svg>
