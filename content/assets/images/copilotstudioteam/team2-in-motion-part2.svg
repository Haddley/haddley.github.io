%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k6{animation-name:k6}@keyframes k7{0%,65.2%{opacity:0;transform:translateY(6px)}68.8%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k7{animation-name:k7}@media (prefers-reduced-motion: reduce){.m{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="780" height="550" fill="#ffffff"/><line x1="110" y1="56" x2="110" y2="536" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="48" y="14" width="124" height="38" rx="9" fill="#64748b"/><text x="110" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">User</text><line x1="390" y1="56" x2="390" y2="536" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="328" y="14" width="124" height="38" rx="9" fill="#7c3aed"/><text x="390" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Math Agent2</text><line x1="670" y1="56" x2="670" y2="536" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="608" y="14" width="124" height="38" rx="9" fill="#0d9488"/><text x="670" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Addition Agent2</text><g class="m k0"><text x="250.0" y="98" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"What is the result when you add 20, 30, and Z?"</text><line x1="113" y1="109" x2="381" y2="109" stroke="#475569" stroke-width="2"/><path d="M389 109 L379 103.5 L379 114.5 Z" fill="#475569"/></g><g class="m k1"><text x="530.0" y="153" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">task: add 20, 30, and Z (Z is unresolved)</text><line x1="393" y1="164" x2="661" y2="164" stroke="#475569" stroke-width="2"/><path d="M669 164 L659 158.5 L659 169.5 Z" fill="#475569"/></g><g class="m k2"><text x="530.0" y="206" text-anchor="middle" font-size="11" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">{"findings": "",</text><text x="530.0" y="221" text-anchor="middle" font-size="11" fill="#c2410c" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"> "openQuestions": "What is the value of Z?"}</text><line x1="667" y1="232" x2="399" y2="232" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/><path d="M391 232 L401 226.5 L401 237.5 Z" fill="#c2410c"/></g><g class="m k3"><text x="250.0" y="276" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"What’s the value of Z?"</text><line x1="387" y1="287" x2="119" y2="287" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><path d="M111 287 L121 281.5 L121 292.5 Z" fill="#475569"/></g><g class="m k4"><text x="250.0" y="331" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"100"</text><line x1="113" y1="342" x2="381" y2="342" stroke="#475569" stroke-width="2"/><path d="M389 342 L379 336.5 L379 347.5 Z" fill="#475569"/></g><g class="m k5"><text x="530.0" y="386" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">task: add 20 + 30 + 100 (same conversation_id)</text><line x1="393" y1="397" x2="661" y2="397" stroke="#475569" stroke-width="2"/><path d="M669 397 L659 391.5 L659 402.5 Z" fill="#475569"/></g><g class="m k6"><text x="530.0" y="439" text-anchor="middle" font-size="11" fill="#15803d" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">{"findings": "Total: 150",</text><text x="530.0" y="454" text-anchor="middle" font-size="11" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:spa