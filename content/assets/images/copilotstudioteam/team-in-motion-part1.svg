<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 582" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="Part 1, the Math Agent and the Addition Agent. The user asks for the result of 20, 30 and Z. The Math Agent delegates the addition. The Addition Agent returns a needs_input request that names Z as missing and gives the question to ask. The Math Agent asks the user for Z. The user answers 100. The Math Agent sends the complete list again. The Addition Agent returns Total: 150, and the Math Agent tells the user the total is 150."><title>The Math Agent and the Addition Agent clarify a missing value</title><style>.m{animation-duration:18s;animation-iteration-count:infinite;animation-timing-function:ease-out;animation-fill-mode:both}@keyframes k0{0%,4.0%{opacity:0;transform:translateY(6px)}7.5%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k0{animation-name:k0}@keyframes k1{0%,12.8%{opacity:0;transform:translateY(6px)}16.2%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k1{animation-name:k1}@keyframes k2{0%,21.5%{opacity:0;transform:translateY(6px)}25.0%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k2{animation-name:k2}@keyframes k3{0%,30.2%{opacity:0;transform:translateY(6px)}33.8%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k3{animation-name:k3}@keyframes k4{0%,39.0%{opacity:0;transform:translateY(6px)}42.5%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k4{animation-name:k4}@keyframes k5{0%,47.8%{opacity:0;transform:translateY(6px)}51.2%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k5{animation-name:k5}@keyframes k6{0%,56.5%{opacity:0;transform:translateY(6px)}60.0%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k6{animation-name:k6}@keyframes k7{0%,65.2%{opacity:0;transform:translateY(6px)}68.8%,93%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}.k7{animation-name:k7}@media (prefers-reduced-motion: reduce){.m{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="780" height="582" fill="#ffffff"/><line x1="110" y1="56" x2="110" y2="568" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="48" y="14" width="124" height="38" rx="9" fill="#64748b"/><text x="110" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">User</text><line x1="390" y1="56" x2="390" y2="568" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="328" y="14" width="124" height="38" rx="9" fill="#7c3aed"/><text x="390" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Math Agent</text><line x1="670" y1="56" x2="670" y2="568" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="608" y="14" width="124" height="38" rx="9" fill="#0d9488"/><text x="670" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Addition Agent</text><g class="m k0"><text x="250.0" y="98" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"What is the result when you add 20, 30, and Z?"</text><line x1="113" y1="109" x2="381" y2="109" stroke="#475569" stroke-width="2"/><path d="M389 109 L379 103.5 L379 114.5 Z" fill="#475569"/></g><g class="m k1"><text x="530.0" y="153" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">delegate the addition</text><line x1="393" y1="164" x2="661" y2="164" stroke="#475569" stroke-width="2"/><path d="M669 164 L659 158.5 L659 169.5 Z" fill="#475569"/></g><g class="m k2"><text x="530.0" y="206" text-anchor="middle" font-size="11" fill="#c2410c" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">{</text><text x="530.0" y="221" text-anchor="middle" font-size="11" fill="#c2410c" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  "status": "needs_input",</text><text x="530.0" y="236" text-anchor="middle" font-size="11" fill="#c2410c" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  "missing": ["Z"],</text><text x="530.0" y="251" text-anchor="middle" font-size="11" fill="#c2410c" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  "prompt": "What is the value of Z?"</text><text x="530.0" y="266" text-anchor="middle" font-size="11" fill="#c2410c" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">}</text><line x1="667" y1="277" x2="399" y2="277" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/><path d="M391 277 L401 271.5 L401 282.5 Z" fill="#c2410c"/></g><g class="m k3"><text x="250.0" y="321" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"What is the value of Z?"</text><line x1="387" y1="332" x2="119" y2="332" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><path d="M111 332 L121 326.5 L121 337.5 Z" fill="#475569"/></g><g class="m k4"><text x="250.0" y="376" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"100"</text><line x1="113" y1="387" x2="381" y2="387" stroke="#475569" stroke-width="2"/><path d="M389 387 L379 381.5 L379 392.5 Z" fill="#475569"/></g><g class="m k5"><text x="530.0" y="431" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">the complete list again: 20, 30 and Z = 100</text><line x1="393" y1="442" x2="661" y2="442" stroke="#475569" stroke-width="2"/><path d="M669 442 L659 436.5 L659 447.5 Z" fill="#475569"/></g><g class="m k6"><text x="530.0" y="486" text-anchor="middle" font-size="12.5" fill="#15803d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"Total: 150"</text><line x1="667" y1="497" x2="399" y2="497" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/><path d="M391 497 L401 491.5 L401 502.5 Z" fill="#15803d"/></g><g class="m k7"><text x="250.0" y="541" text-anchor="middle" font-size="12.5" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xml:space="preserve">"With Z = 100, the total is 150."</text><line x1="387" y1="552" x2="119" y2="552" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/><path d="M111 552 L121 546.5 L121 557.5 Z" fill="#475569"/></g></svg>