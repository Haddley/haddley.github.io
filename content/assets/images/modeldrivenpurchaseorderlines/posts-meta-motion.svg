<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A purchase order form with a subgrid of its lines and a button to add another</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<rect class="f" style="animation-delay:0s" x="10" y="14" width="100" height="92" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><rect x="10" y="14" width="100" height="16" rx="5" fill="#5bb4ea"/>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M18,22 H50" stroke="#0f1b2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:1.0s" pathLength="1" d="M18,46 H102 M18,60 H102 M18,74 H102" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect class="f" style="animation-delay:1.6s" x="16" y="40" width="88" height="40" rx="3" fill="none" stroke="#ffb43a" stroke-width="1.5" stroke-dasharray="4 3"/>
<g><circle class="p" style="animation-delay:2.4s" cx="92" cy="92" r="8" fill="#2f9e4a"/><path d="M88.0,92 H96.0 M92,88.0 V96.0" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
