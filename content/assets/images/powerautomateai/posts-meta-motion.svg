<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A flow that sends a request to an Azure AI Foundry model and uses the reply</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><circle cx="20" cy="56" r="10" fill="#ffb43a"/><path d="M22,49 L16,57 H21 L18,64 L25,55 H20 Z" fill="#0f1b2d"/></g></g>
<path class="d" style="animation-delay:0.8s" pathLength="1" d="M32,56 H48 M44,52.5 L48,56 L44,59.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.4s"><g><rect x="50" y="34" width="34" height="44" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><path d="M67,44 L70.6,52.4 L79,56 L70.6,59.6 L67,68 L63.4,59.6 L55,56 L63.4,52.4 Z" fill="#ffb43a"/></g></g>
<path class="d" style="animation-delay:2.1s" pathLength="1" d="M86,56 H98 M94,52.5 L98,56 L94,59.5" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.6s"><g><g><rect x="96" y="40" width="18" height="22" rx="6" fill="#2f9e4a"/><path d="M104,61 l-6,8 l10,-2 z" fill="#2f9e4a"/></g></g></g>
</svg>
