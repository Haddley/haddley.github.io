<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img">
  <title>A winding path with four stops: prompt agent, hosted agent, voice agent (optional) and several agents, with a strip below listing what to skip</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b2d"/><stop offset="1" stop-color="#1d1840"/></linearGradient>
  </defs>
  <rect width="880" height="520" rx="26" fill="url(#bg)"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="440" y="62" font-size="38" font-weight="800" fill="#ffffff">Where to start in Microsoft Foundry</text>
    <text x="440" y="96" font-size="18" fill="#b9c7da">A map of agent kinds, samples and quickstarts</text>

    <path d="M60,300 Q100,230 150,230 T330,270 T540,230 T750,270" fill="none" stroke="#2c3e5c" stroke-width="16" stroke-linecap="round"/>
    <path d="M60,300 Q100,230 150,230 T330,270 T540,230 T750,270" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/>
    <path d="M750,270 L820,228" fill="none" stroke="#2c3e5c" stroke-width="16" stroke-linecap="round"/>
    <path d="M750,270 L820,228" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/>
    <path d="M820,228 v-34" stroke="#e8eef5" stroke-width="3" stroke-linecap="round"/>
    <path d="M820,194 l30,10 l-30,10 Z" fill="#ff6b6b"/>

    <circle cx="150" cy="230" r="34" fill="#5bb4ea"/><text x="150" y="241" font-size="30" font-weight="800" fill="#0f1b2d">1</text>
    <circle cx="330" cy="270" r="34" fill="#9b7bff"/><text x="330" y="281" font-size="30" font-weight="800" fill="#0f1b2d">2</text>
    <circle cx="540" cy="230" r="34" fill="#5be0cf"/><text x="540" y="241" font-size="30" font-weight="800" fill="#0f1b2d">3</text>
    <circle cx="750" cy="270" r="34" fill="#ff8ac4"/><text x="750" y="281" font-size="30" font-weight="800" fill="#0f1b2d">4</text>

    <text x="150" y="316" font-size="21" font-weight="700" fill="#5bb4ea">Prompt agent</text>
    <text x="150" y="340" font-size="15" fill="#c9d3dd">instructions + tools</text>
    <text x="330" y="356" font-size="21" font-weight="700" fill="#b9a4ff">Hosted agent</text>
    <text x="330" y="380" font-size="15" fill="#c9d3dd">your own code</text>
    <text x="540" y="316" font-size="21" font-weight="700" fill="#5be0cf">Voice agent</text>
    <text x="540" y="340" font-size="15" fill="#c9d3dd">optional side trip</text>
    <text x="750" y="356" font-size="21" font-weight="700" fill="#ff8ac4">Several agents</text>
    <text x="750" y="380" font-size="15" fill="#c9d3dd">A2A, roles, connections</text>

    <rect x="60" y="414" width="760" height="70" rx="16" fill="#2a1730" stroke="#ff6b6b" stroke-width="2"/>
    <text x="440" y="442" font-size="17" font-weight="700" fill="#ff9a9a">Skip these: they are going away</text>
    <text x="440" y="467" font-size="16" fill="#f1d6d6">Workflows (1 Dec 2026)  ·  classic agents (31 Mar 2027)  ·  Prompt flow (20 Apr 2027)</text>
  </g>
</svg>
