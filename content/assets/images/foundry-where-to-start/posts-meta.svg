<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><style>@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}@keyframes shine{0%,52%{transform:translateX(-80px)}100%{transform:translateX(200px)}}.tw{animation:tw 3.4s ease-in-out infinite}.shine{animation:shine 9s ease-in-out infinite;animation-delay:-0s}@media (prefers-reduced-motion: reduce){.tw,.shine{animation:none}.shine-g{display:none}}</style><defs><clipPath id="tile-clip"><rect width="120" height="120" rx="22"/></clipPath><linearGradient id="tile-shine" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <title>A winding dotted path with four colored stops and a red flag at the end</title>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>
  <path d="M14,92 Q24,62 38,62 T62,74 T86,54" fill="none" stroke="#2c3e5c" stroke-width="9" stroke-linecap="round"/>
  <path d="M14,92 Q24,62 38,62 T62,74 T86,54" fill="none" stroke="#ffd166" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>
  <circle cx="38" cy="62" r="11" fill="#5bb4ea"/>
  <circle cx="62" cy="74" r="11" fill="#9b7bff"/>
  <circle cx="86" cy="54" r="11" fill="#5be0cf"/>
  <path d="M86,54 L100,40" stroke="#2c3e5c" stroke-width="9" stroke-linecap="round"/>
  <path d="M100,40 v-22" stroke="#e8eef5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100,18 l14,5 l-14,5 Z" fill="#ff6b6b"/>
  <g class="tw" style="animation-delay:1.55s"><circle cx="100" cy="40" r="5" fill="#ff8ac4"/></g>
<g class="shine-g" clip-path="url(#tile-clip)"><g transform="rotate(20 60 60)"><rect class="shine" x="0" y="-30" width="38" height="180" fill="url(#tile-shine)"/></g></g></svg>