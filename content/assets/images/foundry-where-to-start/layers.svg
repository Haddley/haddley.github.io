<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img">
  <title>Layers of an agent: the open, cross-platform pieces on the left and what Microsoft Foundry adds on the right</title>
  <rect width="880" height="470" rx="26" fill="#0f1b2d"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="440" y="50" font-size="26" font-weight="800" fill="#ffffff">What is open, and what does Microsoft add?</text>
    <rect x="150" y="76" width="320" height="34" rx="17" fill="#5be0cf"/><text x="310" y="99" font-size="17" font-weight="700" fill="#0f1b2d">Open and cross-platform</text>
    <rect x="490" y="76" width="320" height="34" rx="17" fill="#5bb4ea"/><text x="650" y="99" font-size="17" font-weight="700" fill="#0f1b2d">What Microsoft brings</text>

    <g font-size="16" fill="#e8eef5">
      <text x="64" y="152" font-weight="700" fill="#c9d3dd" text-anchor="middle">Think</text>
      <rect x="130" y="128" width="340" height="38" rx="10" fill="#17323a"/><text x="300" y="152">Models from many makers</text>
      <rect x="490" y="128" width="340" height="38" rx="10" fill="#17304a"/><text x="660" y="152">A model catalog and hosting</text>

      <text x="64" y="204" font-weight="700" fill="#c9d3dd">Use tools</text>
      <rect x="130" y="180" width="340" height="38" rx="10" fill="#17323a"/><text x="300" y="204">MCP, an open tool protocol</text>
      <rect x="490" y="180" width="340" height="38" rx="10" fill="#17304a"/><text x="660" y="204">A toolbox that bundles tools</text>

      <text x="64" y="256" font-weight="700" fill="#c9d3dd">Know</text>
      <rect x="130" y="232" width="340" height="38" rx="10" fill="#17323a"/><text x="300" y="256">Search, vector stores, your data</text>
      <rect x="490" y="232" width="340" height="38" rx="10" fill="#17304a"/><text x="660" y="256">Foundry IQ and a memory store</text>

      <text x="64" y="308" font-weight="700" fill="#c9d3dd">Team up</text>
      <rect x="130" y="284" width="340" height="38" rx="10" fill="#17323a"/><text x="300" y="308">A2A, an open agent protocol</text>
      <rect x="490" y="284" width="340" height="38" rx="10" fill="#17304a"/><text x="660" y="308">Connections and roles for agents</text>

      <text x="64" y="360" font-weight="700" fill="#c9d3dd">Build</text>
      <rect x="130" y="336" width="340" height="38" rx="10" fill="#17323a"/><text x="300" y="360">Agent Framework, LangGraph, your code</text>
      <rect x="490" y="336" width="340" height="38" rx="10" fill="#17304a"/><text x="660" y="360">Hosted agents that run your code</text>

      <text x="64" y="412" font-weight="700" fill="#c9d3dd">Trust</text>
      <rect x="130" y="388" width="340" height="38" rx="10" fill="#17323a"/><text x="300" y="412">OpenTelemetry traces</text>
      <rect x="490" y="388" width="340" height="38" rx="10" fill="#17304a"/><text x="660" y="412">Identity, roles, guardrails, Teams</text>
    </g>
    <text x="440" y="452" font-size="14" fill="#9fb0c6">My reading of the docs, not an official Microsoft diagram</text>
  </g>
</svg>
