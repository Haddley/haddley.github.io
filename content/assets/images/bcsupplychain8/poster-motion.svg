<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Checklist dots appear one by one: green, green, amber, green, green</title>
<style>.a{animation-duration:4s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:center}
.d1{animation-name:d1}.d2{animation-name:d2}.d3{animation-name:d3}.d4{animation-name:d4}.d5{animation-name:d5}
@keyframes d1{0%,5%{opacity:0;transform:scale(.3)}20%,100%{opacity:1;transform:scale(1)}}
@keyframes d2{0%,25%{opacity:0;transform:scale(.3)}40%,100%{opacity:1;transform:scale(1)}}
@keyframes d3{0%,45%{opacity:0;transform:scale(.3)}60%,100%{opacity:1;transform:scale(1)}}
@keyframes d4{0%,65%{opacity:0;transform:scale(.3)}80%,100%{opacity:1;transform:scale(1)}}
@keyframes d5{0%,80%{opacity:0;transform:scale(.3)}95%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style>
<rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="22" y="16" width="76" height="88" rx="6" fill="#e0f2fe"/>
<circle class="a d1" cx="36" cy="32" r="5" fill="#16a34a"/><circle class="a d2" cx="36" cy="46" r="5" fill="#16a34a"/><circle class="a d3" cx="36" cy="60" r="5" fill="#fbbf24"/><circle class="a d4" cx="36" cy="74" r="5" fill="#16a34a"/><circle class="a d5" cx="36" cy="88" r="5" fill="#16a34a"/>
<g fill="#7dd3fc"><rect x="48" y="29" width="40" height="5" rx="2.5"/><rect x="48" y="43" width="32" height="5" rx="2.5"/><rect x="48" y="57" width="38" height="5" rx="2.5"/><rect x="48" y="71" width="28" height="5" rx="2.5"/><rect x="48" y="85" width="36" height="5" rx="2.5"/></g></svg>
