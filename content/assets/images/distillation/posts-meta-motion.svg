<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><style>@keyframes m0{0.00%{transform:rotate(-55deg)}4.29%{transform:rotate(-55deg);animation-timing-function:ease-in-out}22.86%{transform:rotate(0deg)}100.00%{transform:rotate(0deg)}}.m0{transform-origin:50px 62px;animation:m0 7s ease-in-out infinite}@keyframes m1{0.00%{opacity:0;transform:translateY(-6px)}22.86%{opacity:0;transform:translateY(-6px)}25.00%{opacity:1;transform:translateY(-6px)}31.43%{opacity:1;transform:translateY(8px)}34.29%{opacity:0;transform:translateY(8px)}34.43%{opacity:0;transform:translateY(-6px)}44.29%{opacity:0;transform:translateY(-6px)}46.43%{opacity:1;transform:translateY(-6px)}52.86%{opacity:1;transform:translateY(8px)}55.71%{opacity:0;transform:translateY(8px)}100.00%{opacity:0}}.m1{;animation:m1 7s ease-in-out infinite}@keyframes m2{0.00%{opacity:0;transform:translateY(-6px)}27.14%{opacity:0;transform:translateY(-6px)}29.29%{opacity:1;transform:translateY(-6px)}35.71%{opacity:1;transform:translateY(8px)}38.57%{opacity:0;transform:translateY(8px)}38.71%{opacity:0;transform:translateY(-6px)}48.57%{opacity:0;transform:translateY(-6px)}50.71%{opacity:1;transform:translateY(-6px)}57.14%{opacity:1;transform:translateY(8px)}60.00%{opacity:0;transform:translateY(8px)}100.00%{opacity:0}}.m2{;animation:m2 7s ease-in-out infinite}@keyframes m3{0.00%{opacity:.9;transform:scaleY(0.25)}25.71%{opacity:.9;transform:scaleY(0.25)}71.43%{opacity:.9;transform:scaleY(1)}91.43%{opacity:.9;transform:scaleY(1)}97.14%{opacity:0;transform:scaleY(1)}100.00%{opacity:.9;transform:scaleY(0.25)}}.m3{transform-box:fill-box;transform-origin:50% 100%;animation:m3 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <title>Distillation</title>
  <defs>
    <linearGradient id="distGradA" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="100" y2="100">
      <stop offset="0" stop-color="#3a9bdc"/>
      <stop offset="1" stop-color="#0066a3"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>
  <!-- the teacher, tipped over, pouring -->
  <g class="m0"><g transform="rotate(55 50 62)">
    <path d="M46 24 h14 v18 l14 26 a10 10 0 0 1 -9 15 H41 a10 10 0 0 1 -9 -15 l14 -26 z"
          fill="none" stroke="url(#distGradA)" stroke-width="3" stroke-linejoin="round"/>
    <line x1="44" y1="24" x2="62" y2="24" stroke="url(#distGradA)" stroke-width="3" stroke-linecap="round"/>
  </g></g>
  <!-- drops falling from the lip -->
  <path class="m1" d="M89 54 c2.4 3.6 3.6 6 3.6 8.1 a3.6 3.6 0 0 1 -7.2 0 c0 -2.1 1.2 -4.5 3.6 -8.1 z" fill="url(#distGradA)"/>
  <path class="m2" d="M89 66 c1.8 2.7 2.7 4.5 2.7 6.1 a2.7 2.7 0 0 1 -5.4 0 c0 -1.6 0.9 -3.4 2.7 -6.1 z" fill="url(#distGradA)" opacity="0.8"/>
