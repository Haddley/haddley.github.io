<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img">
  <title>Distillation</title>
  <defs>
    <linearGradient id="distGrad" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="100" y2="100">
      <stop offset="0" stop-color="#3a9bdc"/>
      <stop offset="1" stop-color="#0066a3"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>
  <!-- large flask (teacher) -->
  <path d="M46 24 h14 v18 l14 26 a10 10 0 0 1 -9 15 H41 a10 10 0 0 1 -9 -15 l14 -26 z"
        fill="none" stroke="url(#distGrad)" stroke-width="3" stroke-linejoin="round"/>
  <line x1="44" y1="24" x2="62" y2="24" stroke="url(#distGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- droplet falling -->
  <path d="M78 58 c4 6 6 10 6 13.5 a6 6 0 0 1 -12 0 c0 -3.5 2 -7.5 6 -13.5 z" fill="url(#distGrad)"/>
  <!-- small flask (student) -->
  <path d="M83 78 h8 v8 l7 12 a5.5 5.5 0 0 1 -5 8 H81 a5.5 5.5 0 0 1 -5 -8 l7 -12 z"
        fill="url(#distGrad)" opacity="0.9"/>
</svg>
