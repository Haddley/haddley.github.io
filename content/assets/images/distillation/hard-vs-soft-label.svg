<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" role="img"
     aria-label="Soft-label distillation trains the student to match the teacher's whole probability distribution via KL divergence, and needs the teacher's own weights. Hard-label distillation trains the student on just the teacher's one generated answer via cross-entropy, and needs only the teacher's output."
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto">
  <rect width="940" height="480" fill="#ffffff"/>
  <defs>
    <marker id="hvsarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="470" y1="20" x2="470" y2="450" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===== Left: soft-label (logit) distillation ===== -->
  <text x="235" y="34" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">Soft-label (logit) distillation</text>
  <text x="235" y="54" font-size="12" fill="#6b7280" text-anchor="middle">MiniGPT Parts 5 &amp; 7, WebPageGPT Part 3</text>

  <rect x="185" y="70" width="100" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="235" y="92" font-size="12" fill="#374151" text-anchor="middle">prompt</text>
  <line x1="235" y1="104" x2="235" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hvsarrow)"/>

  <rect x="165" y="130" width="140" height="50" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="235" y="160" font-size="15" fill="#3730a3" text-anchor="middle">teacher</text>
  <line x1="235" y1="180" x2="235" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hvsarrow)"/>
  <text x="330" y="196" font-size="11.5" fill="#6b7280" text-anchor="middle">full softmax over</text>
  <text x="330" y="209" font-size="11.5" fill="#6b7280" text-anchor="middle">every vocab token</text>

  <!-- probability bar chart -->
  <g transform="translate(150,208)">
    <line x1="0" y1="52" x2="170" y2="52" stroke="#d1d5db"/>
    <g fill="#6366f1">
      <rect x="4"   y="14" width="14" height="38"/>
      <rect x="24"  y="28" width="14" height="24"/>
      <rect x="44"  y="6"  width="14" height="46"/>
      <rect x="64"  y="36" width="14" height="16"/>
      <rect x="84"  y="22" width="14" height="30"/>
      <rect x="104" y="42" width="14" height="10"/>
      <rect x="124" y="32" width="14" height="20"/>
    </g>
    <g fill="#c7d2fe">
      <rect x="144" y="47" width="4" height="5"/>
      <rect x="151" y="47" width="4" height="5"/>
      <rect x="158" y="47" width="4" height="5"/>
    </g>
    <text x="85" y="68" font-size="11" fill="#6b7280" text-anchor="middle">probability spread across ~49k tokens</text>
  </g>

  <line x1="235" y1="278" x2="235" y2="302" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hvsarrow)"/>
  <text x="330" y="286" font-size="11.5" fill="#6b7280" text-anchor="middle">KL divergence:</text>
  <text x="330" y="299" font-size="11.5" fill="#6b7280" text-anchor="middle">matches the whole shape</text>

  <rect x="165" y="304" width="140" height="50" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="235" y="334" font-size="15" fill="#065f46" text-anchor="middle">student</text>

  <rect x="115" y="392" width="240" height="46" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="235" y="411" font-size="11.5" fill="#374151" text-anchor="middle">needs the teacher's own weights —</text>
  <text x="235" y="426" font-size="11.5" fill="#374151" text-anchor="middle">open models only</text>

  <!-- ===== Right: hard-label (response) distillation ===== -->
  <text x="705" y="34" font-size="17" font-weight="600" fill="#111827" text-anchor="middle">Hard-label (response) distillation</text>
  <text x="705" y="54" font-size="12" fill="#6b7280" text-anchor="middle">this series</text>

  <rect x="655" y="70" width="100" height="34" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="705" y="92" font-size="12" fill="#374151" text-anchor="middle">prompt</text>
  <line x1="705" y1="104" x2="705" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hvsarrow)"/>

  <rect x="635" y="130" width="140" height="50" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="705" y="160" font-size="15" fill="#3730a3" text-anchor="middle">teacher</text>
  <line x1="705" y1="180" x2="705" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hvsarrow)"/>
  <text x="815" y="196" font-size="11.5" fill="#6b7280" text-anchor="middle">one generated</text>
  <text x="815" y="209" font-size="11.5" fill="#6b7280" text-anchor="middle">answer, in words</text>

  <!-- speech bubble with sample text -->
  <path d="M 615 210 h 180 a 6 6 0 0 1 6 6 v 38 a 6 6 0 0 1 -6 6 h -80 l -14 14 v -14 h -86 a 6 6 0 0 1 -6 -6 v -38 a 6 6 0 0 1 6 -6 z"
        fill="#eef6ff" stroke="#93c5fd"/>
  <text x="705" y="234" font-size="12" fill="#1e3a8a" text-anchor="middle">"The capital of</text>
  <text x="705" y="250" font-size="12" fill="#1e3a8a" text-anchor="middle">France is Paris."</text>

  <line x1="705" y1="278" x2="705" y2="302" stroke="#6b7280" stroke-width="1.5" marker-end="url(#hvsarrow)"/>
  <text x="815" y="286" font-size="11.5" fill="#6b7280" text-anchor="middle">cross-entropy:</text>
  <text x="815" y="299" font-size="11.5" fill="#6b7280" text-anchor="middle">matches these exact tokens</text>

  <rect x="635" y="304" width="140" height="50" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="705" y="334" font-size="15" fill="#065f46" text-anchor="middle">student</text>

  <rect x="585" y="392" width="240" height="46" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="705" y="411" font-size="11.5" fill="#374151" text-anchor="middle">needs only the teacher's output —</text>
  <text x="705" y="426" font-size="11.5" fill="#374151" text-anchor="middle">works through a closed API too</text>
</svg>
