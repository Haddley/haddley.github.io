<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The five parts of a benchmark. A question that knows its answer is put into a prompt, sent to a model, and the reply is read by a checker, which gives a mark that goes on the scoreboard. A small dot travels through the parts."><style>@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}} .a{transform-box:fill-box}
            @keyframes travel{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(588px);opacity:0}}
            @keyframes glow{0%,100%{opacity:.0}50%{opacity:.9}}
            .dot{animation:travel 7s linear infinite}
            .g1{animation:glow 7s ease-in-out infinite}.g2{animation:glow 7s ease-in-out infinite 1.3s}.g3{animation:glow 7s ease-in-out infinite 2.6s}
            .g4{animation:glow 7s ease-in-out infinite 3.9s}.g5{animation:glow 7s ease-in-out infinite 5.2s}</style><rect width="760" height="330" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >The five parts of a benchmark</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Every benchmark, big or small, is these five boxes</text><rect x="20" y="96" width="128" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" /><rect x="20" y="96" width="128" height="96" rx="10" fill="none" stroke="#2563eb" class="a g1" stroke-width="4"/><text x="84" y="128" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >1. Questions</text><text x="84" y="152" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >with the right</text><text x="84" y="169" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >answer attached</text><path d="M150 144 H164" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/><rect x="168" y="96" width="128" height="96" rx="10" fill="#ede9fe" stroke="#7c3aed" /><rect x="168" y="96" width="128" height="96" rx="10" fill="none" stroke="#7c3aed" class="a g2" stroke-width="4"/><text x="232" y="128" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >2. Prompt</text><text x="232" y="152" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >the question plus</text><text x="232" y="169" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >the rules for replying</text><path d="M298 144 H312" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/><rect x="316" y="96" width="128" height="96" rx="10" fill="#fef3c7" stroke="#d97706" /><rect x="316" y="96" width="128" height="96" rx="10" fill="none" stroke="#d97706" class="a g3" stroke-width="4"/><text x="380" y="128" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >3. Model</text><text x="380" y="152" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >answers in</text><text x="380" y="169" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >its own words</text><path d="M446 144 H460" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/><rect x="464" y="96" width="128" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" /><rect x="464" y="96" width="128" height="96" rx="10" fill="none" stroke="#16a34a" class="a g4" stroke-width="4"/><text x="528" y="128" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >4. Checker</text><text x="528" y="152" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >reads the reply</text><text x="528" y="169" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >and marks it</text><path d="M594 144 H608" stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)"/><rect x="612" y="96" width="128" height="96" rx="10" fill="#f3f4f6" stroke="#6b7280" /><rect x="612" y="96" width="128" height="96" rx="10" fill="none" stroke="#6b7280" class="a g5" stroke-width="4"/><text x="676" y="128" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >5. Scoreboard</text><text x="676" y="152" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >adds up the marks</text><text x="676" y="169" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >and the timings</text><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><g class="a dot"><circle cx="84" cy="107" r="8" fill="#2563eb" opacity="0.95"/><text x="84" y="111" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">?</text></g><text x="84" y="224" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >a question</text><text x="380" y="224" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >the model never sees the right answer; the checker does</text><g><rect x="20" y="252" width="340" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="190.0" y="275.7" font-size="12" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The big project: a second model marks the answer</text><text x="190.0" y="292.7" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">against a rubric (accuracy, completeness, clarity)</text></g><g><rect x="400" y="252" width="340" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="570.0" y="275.7" font-size="12" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">This one: a few lines of code compare two numbers</text><text x="570.0" y="292.7" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">no second model, no rubric, no cost per mark</text></g></svg>