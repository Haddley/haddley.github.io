<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="A judge model against a checker. The big project asks a second model to score each answer for accuracy, completeness and clarity out of ten. This project compares the number in the reply with the right answer and gets a yes or no."><style>@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}} .a{transform-box:fill-box}@keyframes fade{0%,10%{opacity:0}25%,90%{opacity:1}100%{opacity:0}} @keyframes tick{0%,30%{opacity:0;transform:scale(.4)}45%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
    .j1{animation:fade 8s ease infinite}.j2{animation:fade 8s ease infinite .4s}.j3{animation:fade 8s ease infinite .8s}.tk{animation:tick 8s ease infinite;transform-origin:center}</style><rect width="760" height="360" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >A judge, or a checker?</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Two ways to mark the same answer</text><rect x="20" y="70" width="350" height="270" rx="12" fill="#dbeafe" stroke="#2563eb" fill-opacity="0.35"/><rect x="390" y="70" width="350" height="270" rx="12" fill="#dcfce7" stroke="#16a34a" fill-opacity="0.35"/><text x="195" y="98" font-size="15" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >The judge (the big project)</text><text x="565" y="98" font-size="15" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >The checker (this project)</text><g><rect x="50" y="116" width="290" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="195.0" y="136.7" font-size="12" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A second model reads the answer</text><text x="195.0" y="153.7" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">next to an ideal answer, then scores it</text></g><g class="a j1"><rect x="50" y="182" width="290" height="30" rx="7" fill="#fff" stroke="#2563eb"/><text x="64" y="202" font-size="13" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Accuracy</text><text x="326" y="202" font-size="13" font-weight="700" text-anchor="end" fill="#2563eb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">7 / 10</text></g><g class="a j2"><rect x="50" y="220" width="290" height="30" rx="7" fill="#fff" stroke="#2563eb"/><text x="64" y="240" font-size="13" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Completeness</text><text x="326" y="240" font-size="13" font-weight="700" text-anchor="end" fill="#2563eb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">6 / 10</text></g><g class="a j3"><rect x="50" y="258" width="290" height="30" rx="7" fill="#fff" stroke="#2563eb"/><text x="64" y="278" font-size="13" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Clarity</text><text x="326" y="278" font-size="13" font-weight="700" text-anchor="end" fill="#2563eb" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">8 / 10</text></g><text x="195" y="300" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >good for essays and explanations,</text><text x="195" y="317" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >but every mark costs another model call</text><g><rect x="420" y="116" width="290" height="50" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><text x="565.0" y="136.7" font-size="12" font-weight="700" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">A few lines of code read the number</text><text x="565.0" y="153.7" font-size="12" font-weight="400" fill="#111827" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">after ANSWER: and compare it</text></g><g class="a tk"><circle cx="565" cy="232" r="42" fill="#16a34a"/><path d="M544 232 l15 16 l28 -34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="565" y="296" font-size="14" font-weight="700" fill="#111827" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" >5070.00 = 5070.00: right</text><text x="565" y="317" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >free and the same every time, but only for sums</text></svg>