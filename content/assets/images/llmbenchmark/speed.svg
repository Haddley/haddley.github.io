<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="Speed against accuracy. Each dot is a model: how many tokens a second it writes, and the share of questions it answered correctly. Gemma 4 12B 9 tokens a second, 87 percent; Gemma 4 26B 18 tokens a second, 97 percent; Llama 3.1 8B 19 tokens a second, 50 percent; Qwen2.5 14B 7 tokens a second, 70 percent; Qwen3.5 2B 38 tokens a second, 77 percent; Qwen3.5 9B 35 tokens a second, 90 percent"><style>@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}} .a{transform-box:fill-box}@keyframes pop{0%,6%{opacity:0;transform:scale(.2)}14%,92%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.2)}} .pt{animation:pop 9s ease-out infinite;transform-origin:center}</style><rect width="760" height="420" fill="#ffffff"/><text x="24" y="32" font-size="18" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Fast, or right?</text><text x="24" y="53" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Each dot is a model: how quickly it writes, against how many answers it got right</text><line x1="70" y1="348.0" x2="670" y2="348.0" stroke="#e5e7eb"/><text x="60" y="352.0" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >0%</text><line x1="70" y1="280.5" x2="670" y2="280.5" stroke="#e5e7eb"/><text x="60" y="284.5" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >25%</text><line x1="70" y1="213.0" x2="670" y2="213.0" stroke="#e5e7eb"/><text x="60" y="217.0" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >50%</text><line x1="70" y1="145.5" x2="670" y2="145.5" stroke="#e5e7eb"/><text x="60" y="149.5" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >75%</text><line x1="70" y1="78.0" x2="670" y2="78.0" stroke="#e5e7eb"/><text x="60" y="82.0" font-size="11" font-weight="400" fill="#6b7280" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >100%</text><text x="70.0" y="370" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >0</text><text x="190.0" y="370" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >10</text><text x="310.0" y="370" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >20</text><text x="430.0" y="370" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >30</text><text x="550.0" y="370" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >40</text><text x="670.0" y="370" font-size="11" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >50</text><text x="370.0" y="394" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >tokens written per second (more is faster)</text><g class="a pt" style="animation-delay:0.0s"><circle cx="155.2" cy="159.0" r="11" fill="#db2777" fill-opacity="0.9" stroke="#db2777" stroke-width="3"/></g><text class="a pt" x="172.2" y="163.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="animation-delay:0.0s">Qwen2.5 14B</text><g class="a pt" style="animation-delay:0.3s"><circle cx="181.6" cy="113.9" r="11" fill="#d97706" fill-opacity="0.9" stroke="#d97706" stroke-width="3"/></g><text class="a pt" x="198.6" y="117.9" font-size="13" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="animation-delay:0.3s">Gemma 4 12B</text><g class="a pt" style="animation-delay:0.7s"><circle cx="280.0" cy="86.9" r="11" fill="#2563eb" fill-opacity="0.9" stroke="#2563eb" stroke-width="3"/></g><text class="a pt" x="297.0" y="90.9" font-size="13" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="animation-delay:0.7s">Gemma 4 26B</text><g class="a pt" style="animation-delay:1.0s"><circle cx="293.2" cy="213.0" r="11" fill="#0891b2" fill-opacity="0.9" stroke="#0891b2" stroke-width="3"/></g><text class="a pt" x="310.2" y="217.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="animation-delay:1.0s">Llama 3.1 8B</text><g class="a pt" style="animation-delay:1.4s"><circle cx="485.2" cy="105.0" r="11" fill="#7c3aed" fill-opacity="0.9" stroke="#7c3aed" stroke-width="3"/></g><text class="a pt" x="502.2" y="109.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="animation-delay:1.4s">Qwen3.5 9B</text><g class="a pt" style="animation-delay:1.8s"><circle cx="526.0" cy="140.9" r="11" fill="#16a34a" fill-opacity="0.9" stroke="#16a34a" stroke-width="3"/></g><text class="a pt" x="543.0" y="144.9" font-size="13" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="animation-delay:1.8s">Qwen3.5 2B</text></svg>