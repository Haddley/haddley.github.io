<g class="p" style="animation-delay:2.0s"><g><circle cx="38" cy="78" r="5" fill="#fff"/><circle cx="82" cy="78" r="5" fill="#fff"/></g></g>
<g class="p" style="animation-delay:2.8s"><rect x="40" y="102" width="40" height="8" rx="3" fill="#2f9e4a"/></g>
