<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A Raspberry Pi blinking holiday lights on a gingerbread house</title><style>@keyframes fade{0%{opacity:0}15.71%,44.87%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}26.92%,44.87%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15.71%,44.87%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.8s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.8s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.8s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
