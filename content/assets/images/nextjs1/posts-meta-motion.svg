<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A Next.js blog with an about page and links between pages</title><style>@keyframes fade{0%{opacity:0}16.12%,46.05%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}27.63%,46.05%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}16.12%,46.05%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.6s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.6s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.6s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><g><rect x="8" y="16" width="64" height="84" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><rect x="8" y="16" width="64" height="9" rx="5" fill="#5bb4ea"/><circle cx="15" cy="20.5" r="1.5" fill="#0f1b2d"/><circle cx="20" cy="20.5" r="1.5" fill="#0f1b2d"/></g></g>
<path class="d" style="animation-delay:0.5s" pathLength="1" d="M16,38 H64 M16,50 H56 M16,62 H60" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.2s"><g><rect x="80" y="30" width="32" height="40" rx="4" fill="#1c2a3d" stroke="#ffb43a" stroke-width="1.5"/><text x="96" y="54" text-anchor="middle" font-size="7" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">about</text></g></g>
<path class="d" style="animation-delay:1.9s" pathLength="1" d="M70,50 H80 M76,46 L80,50 L76,54" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.6s"><rect x="16" y="76" width="30" height="10" rx="3" fill="#2f9e4a"/></g>
