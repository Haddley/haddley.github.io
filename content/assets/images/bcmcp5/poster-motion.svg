<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>The copy slides out from behind the clean original</title><style>.a{animation-duration:4.5s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}.cp{animation-name:cp}@keyframes cp{0%,15%{transform:translate(-24px,-24px)}65%,100%{transform:translate(0,0)}}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="16" y="22" width="52" height="52" rx="8" fill="#16a34a"/><g class="a cp"><rect x="44" y="46" width="52" height="52" rx="8" fill="#7dd3fc"/><g fill="#0f1b2d"><rect x="54" y="58" width="32" height="4" rx="2"/><rect x="54" y="68" width="26" height="4" rx="2"/><rect x="54" y="78" width="30" height="4" rx="2"/></g></g></svg>