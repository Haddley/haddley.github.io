      <path d="M20,13 L26,11 L30,15 L29,22 L22,26 L18,20 Z" fill="#000" opacity=".22"/>
      <path d="M6,18 L9,8 L14,11 L12,22 Z" fill="#000" opacity=".12"/>
      <path d="M14,11 L18,20 L22,26" fill="none" stroke="#0f1b2d" stroke-width="1" opacity=".45"/>
    </g>
    <g id="block" stroke-linejoin="round">
      <path d="M-10,-10 L0,-8.2 L10,-10 L8.2,0 L10,10 L0,8.2 L-10,10 L-8.2,0 Z M-5,-5 L-3,0 L-5,5 L0,3 L5,5 L3,0 L5,-5 L0,-3 Z" transform="translate(2.2,-3)" fill="currentColor" fill-rule="evenodd"/>
      <path d="M-10,-10 L0,-8.2 L10,-10 L8.2,0 L10,10 L0,8.2 L-10,10 L-8.2,0 Z M-5,-5 L-3,0 L-5,5 L0,3 L5,5 L3,0 L5,-5 L0,-3 Z" transform="translate(2.2,-3)" fill="#000" fill-rule="evenodd" opacity=".35"/>
      <path d="M-10,-10 L0,-8.2 L10,-10 L8.2,0 L10,10 L0,8.2 L-10,10 L-8.2,0 Z M-5,-5 L-3,0 L-5,5 L0,3 L5,5 L3,0 L5,-5 L0,-3 Z" fill="currentColor" fill-rule="evenodd" stroke="#fff" stroke-width="1.2" stroke-opacity=".8"/>
      <path d="M-10,-10 L0,-8.2 L10,-10 L8.2,0 L-8.2,0 Z" fill="#fff" opacity=".18"/>
    </g>
  </defs>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>
  <g fill="none" stroke-width="0.8"><circle cx="60" cy="52" r="30" stroke="#5be0cf" opacity=".25"/><circle cx="60" cy="52" r="44" stroke="#ff8ac4" opacity=".18"/></g>
  <g color="#ff3b4e"><use href="#block" transform="translate(36,28) scale(1.2)"/></g>
  <g color="#2f6bff"><use href="#block" transform="translate(84,28) scale(1.2)"/></g>
  <g color="#ff3b4e"><circle cx="38" cy="66" r="19" fill="#ff3b4e" opacity=".2"/><g transform="translate(24,45)"><use href="#fist"/></g></g>
  <g color="#2f6bff"><circle cx="82" cy="66" r="19" fill="#2f6bff" opacity=".2"/><g transform="translate(97,45) scale(-1,1)"><use href="#fist"/></g></g>
  <text x="60" y="104" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e8fffb" stroke="#0f1b2d" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke">It works!</text>
  <path d="M60,12 v-6 M60,6 l5,1.5" stroke="#ffd45a" stroke-width="1.6" stroke-linecap="round" fill="none"/><ellipse cx="57.5" cy="12.5" rx="3" ry="2.2" fill="#ffd45a"/>
<g class="shine-g" clip-path="url(#tile-clip)"><g transform="rotate(20 60 60)"><rect class="shine" x="0" y="-30" width="38" height="180" fill="url(#tile-shine)"/></g></g></svg>