<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Microsoft Graph as one hub that reaches mail, files, chat and calendar</title><style>@keyframes fade{0%{opacity:0}15.71%,44.87%,100%{opacity:1}}
