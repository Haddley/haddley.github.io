<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 566 310" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The notebook&#x27;s MLP code, with handwritten notes. x = self.fc1(x): one letter&#x27;s hidden state, 128 numbers, goes in, and 512 dot products give 512 numbers out. x = self.gelu(x): the bend, where big positive numbers pass through and negative ones are squashed to about 0. x = self.fc2(x): 512 numbers back down to 128, ready to add onto the hidden state."><rect width="566" height="310" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">The MLP, in the notebook&#x27;s Python</text><text x="24" y="52" font-size="12" fill="#6b7280">From FeedForward.forward (cell 1.3); the handwritten notes are my own reading</text><rect x="16" y="66" width="226" height="194" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="96" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"># in FeedForward.forward</text><text x="30" y="142" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">x = self.fc1(x)</text><text x="30" y="188" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">x = self.gelu(x)</text><text x="30" y="234" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">x = self.fc2(x)</text><text x="272" y="127" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">one letter&#x27;s hidden state, 128 numbers</text><text x="272" y="145" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">in; 512 dot products, 512 numbers out</text><path d="M266 138 C 226 128, 165 154, 105 146" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M105 146 l9 -2 M105 146 l6 7" stroke="#c2410c" stroke-width="1.6" fill="none"/><text x="272" y="177" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the bend: big positives pass,</text><text x="272" y="195" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">negatives squashed to about 0</text><path d="M266 188 C 226 178, 172 200, 112 192" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M112 192 l9 -2 M112 192 l6 7" stroke="#c2410c" stroke-width="1.6" fill="none"/><text x="272" y="227" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">512 back down to 128, ready to</text><text x="272" y="245" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">ADD onto the hidden state</text><path d="M266 238 C 226 228, 165 246, 105 238" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M105 238 l9 -2 M105 238 l6 7" stroke="#c2410c" stroke-width="1.6" fill="none"/></svg>
