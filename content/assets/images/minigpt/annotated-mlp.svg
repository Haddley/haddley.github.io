<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 582 290" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The notebook&#x27;s MLP code, with handwritten notes. x = self.fc1(x): one letter&#x27;s hidden state, 128 numbers, goes in, and 512 dot products give 512 numbers out. x = self.gelu(x): the bend, where big positive numbers pass through and negative ones are squashed to about 0. x = self.fc2(x): 512 numbers back down to 128, ready to add onto the hidden state."><rect width="582" height="290" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">The MLP, in the notebook&#x27;s Python</text><text x="24" y="52" font-size="12" fill="#6b7280">From FeedForward.forward (cell 1.3); the handwritten notes are my own reading</text><rect x="16" y="66" width="216" height="194" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="96" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"># in FeedForward.forward</text><text x="30" y="142" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">x = self.fc1(x)</text><text x="30" y="188" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">x = self.gelu(x)</text><text x="30" y="234" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">x = self.fc2(x)</text><path d="M57.7 147 L133.9 147" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="260" y="128" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">one letter&#x27;s hidden state, 128 numbers</text><text x="260" y="146" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">in; 512 dot products, 512 numbers out</text><path d="M254.3 132.0 C 203.8 132.0, 192.5 138.0, 146.9 138.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M141.9 138.0 L150.2 134.3 L150.2 141.7 Z" fill="#c2410c"/><path d="M57.7 193 L140.9 193" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="260" y="174" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the bend: big positives pass,</text><text x="260" y="192" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">negatives squashed to about 0</text><path d="M254.3 178.0 C 206.9 178.0, 196.3 184.0, 153.9 184.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M148.9 184.0 L157.1 180.3 L157.1 187.7 Z" fill="#c2410c"/><path d="M57.7 239 L133.9 239" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="260" y="220" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">512 back down to 128, ready to</text><text x="260" y="238" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">ADD onto the hidden state</text><path d="M254.3 224.0 C 203.8 224.0, 192.5 230.0, 146.9 230.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M141.9 230.0 L150.2 226.3 L150.2 233.7 Z" fill="#c2410c"/></svg>
