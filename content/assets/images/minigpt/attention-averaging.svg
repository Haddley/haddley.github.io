<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Two 3 by 3 grids of weights for the letters g, o, o. Left, a plain average: each row shares 100 percent equally among the letters it can see, and the upper triangle is zero. Right, attention: the same triangle, but each row uses its own weights; this example head puts most of each row's weight on the previous letter." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="320" fill="#ffffff"/><text x="158.0" y="34" font-size="16" fill="#111827" text-anchor="middle" font-weight="600" >First: a plain average</text><text x="158.0" y="56" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" >every letter so far counts equally</text><text x="158.0" y="82" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >takes from →</text><text x="106.0" y="110" font-size="18" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><text x="158.0" y="110" font-size="18" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="210.0" y="110" font-size="18" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="64" y="150.0" font-size="18" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><rect x="82" y="120" width="48" height="48" fill="#2563eb" fill-opacity="1.00"/><text x="106.0" y="149.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >100%</text><rect x="134" y="120" width="48" height="48" fill="#f3f4f6"/><text x="158.0" y="149.0" font-size="14" fill="#9ca3af" text-anchor="middle" font-weight="normal" >0</text><rect x="186" y="120" width="48" height="48" fill="#f3f4f6"/><text x="210.0" y="149.0" font-size="14" fill="#9ca3af" text-anchor="middle" font-weight="normal" >0</text><text x="64" y="202.0" font-size="18" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><rect x="82" y="172" width="48" height="48" fill="#2563eb" fill-opacity="0.56"/><text x="106.0" y="201.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >50%</text><rect x="134" y="172" width="48" height="48" fill="#2563eb" fill-opacity="0.56"/><text x="158.0" y="201.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" >50%</text><rect x="186" y="172" width="48" height="48" fill="#f3f4f6"/><text x="210.0" y="201.0" font-size="14" fill="#9ca3af" text-anchor="middle" font-weight="normal" >0</text><text x="64" y="254.0" font-size="18" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><rect x="82" y="224" width="48" height="48" fill="#2563eb" fill-opacity="0.41"/><text x="106.0" y="253.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >33%</text><rect x="134" y="224" width="48" height="48" fill="#2563eb" fill-opacity="0.41"/><text x="158.0" y="253.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >33%</text><rect x="186" y="224" width="48" height="48" fill="#2563eb" fill-opacity="0.41"/><text x="210.0" y="253.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="600" >33%</text><text x="158.0" y="302" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" >each row is one letter, and adds up to 100%</text><line x1="360" y1="40" x2="360" y2="340" stroke="#e5e7eb"/><text x="514.0" y="34" font-size="16" fill="#111827" text-anchor="middle" font-weight="600" >Then: attention</text><text x="514.0" y="56" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" >each letter chooses its own weights</text><text x="514.0" y="82" font-size="12" fill="#6b7280"