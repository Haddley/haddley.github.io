<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img"
     aria-label="An 8 by 8 grid. Each row is a token; filled cells are the earlier tokens it is allowed to attend to. The pattern is a lower triangle, so a token never sees the future."
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto">
  <rect width="640" height="372" fill="#ffffff"/>

  <text x="40" y="30" font-size="15" fill="#374151">Which tokens each token is allowed to look at</text>

  <!-- column header -->
  <text x="245" y="66" font-size="12" fill="#6b7280" text-anchor="middle">looks at token &#8594;</text>
  <g font-size="11" fill="#9ca3af" text-anchor="middle">
    <text x="90"  y="88">1</text><text x="122" y="88">2</text><text x="154" y="88">3</text><text x="186" y="88">4</text>
    <text x="218" y="88">5</text><text x="250" y="88">6</text><text x="282" y="88">7</text><text x="314" y="88">8</text>
  </g>

  <!-- grid -->
  <g>
    <!-- row i (this token), col j (looks at token j); fill when j <= i -->
    <!-- generated as 8 rows -->
    <!-- row1 -->
    <rect x="74"  y="96"  width="28" height="28" fill="#2563eb"/>
    <rect x="106" y="96"  width="28" height="28" fill="#f3f4f6"/><rect x="138" y="96" width="28" height="28" fill="#f3f4f6"/><rect x="170" y="96" width="28" height="28" fill="#f3f4f6"/><rect x="202" y="96" width="28" height="28" fill="#f3f4f6"/><rect x="234" y="96" width="28" height="28" fill="#f3f4f6"/><rect x="266" y="96" width="28" height="28" fill="#f3f4f6"/><rect x="298" y="96" width="28" height="28" fill="#f3f4f6"/>
    <!-- row2 -->
    <rect x="74"  y="128" width="28" height="28" fill="#2563eb"/><rect x="106" y="128" width="28" height="28" fill="#2563eb"/>
    <rect x="138" y="128" width="28" height="28" fill="#f3f4f6"/><rect x="170" y="128" width="28" height="28" fill="#f3f4f6"/><rect x="202" y="128" width="28" height="28" fill="#f3f4f6"/><rect x="234" y="128" width="28" height="28" fill="#f3f4f6"/><rect x="266" y="128" width="28" height="28" fill="#f3f4f6"/><rect x="298" y="128" width="28" height="28" fill="#f3f4f6"/>
    <!-- row3 -->
    <rect x="74"  y="160" width="28" height="28" fill="#2563eb"/><rect x="106" y="160" width="28" height="28" fill="#2563eb"/><rect x="138" y="160" width="28" height="28" fill="#2563eb"/>
    <rect x="170" y="160" width="28" height="28" fill="#f3f4f6"/><rect x="202" y="160" width="28" height="28" fill="#f3f4f6"/><rect x="234" y="160" width="28" height="28" fill="#f3f4f6"/><rect x="266" y="160" width="28" height="28" fill="#f3f4f6"/><rect x="298" y="160" width="28" height="28" fill="#f3f4f6"/>
    <!-- row4 -->
    <rect x="74"  y="192" width="28" height="28" fill="#2563eb"/><rect x="106" y="192" width="28" height="28" fill="#2563eb"/><rect x="138" y="192" width="28" height="28" fill="#2563eb"/><rect x="170" y="192" width="28" height="28" fill="#2563eb"/>
    <rect x="202" y="192" width="28" height="28" fill="#f3f4f6"/><rect x="234" y="192" width="28" height="28" fill="#f3f4f6"/><rect x="266" y="192" width="28" height="28" fill="#f3f4f6"/><rect x="298" y="192" width="28" height="28" fill="#f3f4f6"/>
    <!-- row5 (highlighted) -->
    <rect x="74"  y="224" width="28" height="28" fill="#1d4ed8"/><rect x="106" y="224" width="28" height="28" fill="#1d4ed8"/><rect x="138" y="224" width="28" height="28" fill="#1d4ed8"/><rect x="170" y="224" width="28" height="28" fill="#1d4ed8"/><rect x="202" y="224" width="28" height="28" fill="#1d4ed8"/>
    <rect x="234" y="224" width="28" height="28" fill="#f3f4f6"/><rect x="266" y="224" width="28" height="28" fill="#f3f4f6"/><rect x="298" y="224" width="28" height="28" fill="#f3f4f6"/>
    <!-- row6 -->
    <rect x="74"  y="256" width="28" height="28" fill="#2563eb"/><rect x="106" y="256" width="28" height="28" fill="#2563eb"/><rect x="138" y="256" width="28" height="28" fill="#2563eb"/><rect x="170" y="256" width="28" height="28" fill="#2563eb"/><rect x="202" y="256" width="28" height="28" fill="#2563eb"/><rect x="234" y="256" width="28" height="28" fill="#2563eb"/>
    <rect x="266" y="256" width="28" height="28" fill="#f3f4f6"/><rect x="298" y="256" width="28" height="28" fill="#f3f4f6"/>
    <!-- row7 -->
    <rect x="74"  y="288" width="28" height="28" fill="#2563eb"/><rect x="106" y="288" width="28" height="28" fill="#2563eb"/><rect x="138" y="288" width="28" height="28" fill="#2563eb"/><rect x="170" y="288" width="28" height="28" fill="#2563eb"/><rect x="202" y="288" width="28" height="28" fill="#2563eb"/><rect x="234" y="288" width="28" height="28" fill="#2563eb"/><rect x="266" y="288" width="28" height="28" fill="#2563eb"/>
    <rect x="298" y="288" width="28" height="28" fill="#f3f4f6"/>
    <!-- row8 -->
    <rect x="74"  y="320" width="28" height="28" fill="#2563eb"/><rect x="106" y="320" width="28" height="28" fill="#2563eb"/><rect x="138" y="320" width="28" height="28" fill="#2563eb"/><rect x="170" y="320" width="28" height="28" fill="#2563eb"/><rect x="202" y="320" width="28" height="28" fill="#2563eb"/><rect x="234" y="320" width="28" height="28" fill="#2563eb"/><rect x="266" y="320" width="28" height="28" fill="#2563eb"/><rect x="298" y="320" width="28" height="28" fill="#2563eb"/>
    <!-- grid lines -->
    <g stroke="#ffffff" stroke-width="2">
      <line x1="74" y1="96" x2="74" y2="348"/><line x1="106" y1="96" x2="106" y2="348"/><line x1="138" y1="96" x2="138" y2="348"/><line x1="170" y1="96" x2="170" y2="348"/><line x1="202" y1="96" x2="202" y2="348"/><line x1="234" y1="96" x2="234" y2="348"/><line x1="266" y1="96" x2="266" y2="348"/><line x1="298" y1="96" x2="298" y2="348"/><line x1="326" y1="96" x2="326" y2="348"/>
      <line x1="74" y1="96" x2="326" y2="96"/><line x1="74" y1="128" x2="326" y2="128"/><line x1="74" y1="160" x2="326" y2="160"/><line x1="74" y1="192" x2="326" y2="192"/><line x1="74" y1="224" x2="326" y2="224"/><line x1="74" y1="256" x2="326" y2="256"/><line x1="74" y1="288" x2="326" y2="288"/><line x1="74" y1="320" x2="326" y2="320"/><line x1="74" y1="348" x2="326" y2="348"/>
    </g>
  </g>

  <!-- row labels -->
  <g font-size="11" fill="#9ca3af" text-anchor="end">
    <text x="66" y="114">1</text><text x="66" y="146">2</text><text x="66" y="178">3</text><text x="66" y="210">4</text>
    <text x="66" y="242" fill="#1d4ed8" font-weight="700">5</text><text x="66" y="274">6</text><text x="66" y="306">7</text><text x="66" y="338">8</text>
  </g>
  <text x="40" y="222" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 40 222)">this token</text>

  <!-- callout -->
  <line x1="330" y1="238" x2="372" y2="238" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="228" font-size="13" fill="#1f2937">Token 5 attends to tokens 1&#8211;5,</text>
  <text x="380" y="246" font-size="13" fill="#1f2937">never to 6, 7, 8.</text>
  <text x="380" y="278" font-size="12" fill="#6b7280">The blocked cells are set to &#8722;&#8734;</text>
  <text x="380" y="294" font-size="12" fill="#6b7280">before the softmax, so their</text>
  <text x="380" y="310" font-size="12" fill="#6b7280">attention weight becomes zero.</text>
</svg>
