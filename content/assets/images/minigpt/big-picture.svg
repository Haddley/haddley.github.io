<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 488" role="img" aria-label="The big picture of MiniGPT at runtime, for the text goo. 1: each letter becomes an ID: 45 53 53. 2: each ID picks a token embedding, and each position embedding is added to it number by number, giving three input embeddings, g in position 1, o in position 2 and o in position 3, where the two o's now differ. 3: the hidden states go through four blocks; each block is attention with four heads followed by an MLP. 4: only the last hidden state is read; after the blocks it stands for the whole of goo so far. It is scored against the 65 rows of lm_head, giving a chance for every letter: d 96.6 percent. 5: a spin of the wheel picks d, it is added to the text, making good, and the whole thing runs again." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="488" fill="#ffffff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">MiniGPT at runtime: what happens to “goo”</text><text x="40" y="50" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Real numbers from my trained model. The notebook's names in grey, where they differ.</text><rect x="56" y="78" width="96" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db"/><circle cx="56" cy="78" r="10" fill="#111827"/><text x="56" y="82" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="104" y="100" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">the text</text><text x="104" y="130" font-size="22" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">goo</text><line x1="152" y1="118" x2="168.0" y2="118.0" stroke="#6b7280" stroke-width="1.8"/><path d="M176 118 L168.0 122.5 L168.0 113.5 Z" fill="#6b7280"/><rect x="178" y="78" width="112" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="234" y="100" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">letter IDs</text><text x="234" y="128" font-size="15" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">45 53 53</text><text x="234" y="148" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal">token IDs</text><line x1="290" y1="118" x2="306.0" y2="118.0" stroke="#6b7280" stroke-width="1.8"/><path d="M314 118 L306.0 122.5 L306.0 113.5 Z" fill="#6b7280"/><rect x="316" y="78" width="236" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db"/><circle cx="316" cy="78" r="10" fill="#111827"/><text x="316" y="82" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">2</text><rect x="336" y="88" width="26" height="32" rx="5" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="349.0" y="109.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><rect x="366" y="88" width="26" height="32" rx="5" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="379.0" y="109.0" font-size="14" fill="#10b981" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><rect x="396" y="88" width="26" height="32" rx="5" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="409.0" y="109.0" font-size="14" fill="#10b981" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="452" y="108" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="700">+</text><rect x="476" y="90" width="18" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed"/><text x="485" y="109" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">1</text><rect x="500" y="90" width="18" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed"/><text x="509" y="109" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">2</text><rect x="524" y="90" width="18" height="28" rx="4" fill="#f5f3ff" stroke="#7c3aed"/><text x="533" y="109" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">3</text><text x="386" y="138" font-size="11" fill="#111827" text-anchor="middle" font-weight="600">token embeddings</text><text x="504" y="138" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="600">position embeddings</text><line x1="552" y1="118" x2="568.0" y2="118.0" stroke="#6b7280" stroke-width="1.8"/><path d="M576 118 L568.0 122.5 L568.0 113.5 Z" fill="#6b7280"/><rect x="578" y="78" width="112" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db"/><rect x="596" y="88" width="26" height="32" rx="5" fill="#ede9fe" stroke="#2563eb" stroke-width="2"/><rect x="597" y="110" width="24" height="9" rx="0" fill="#7c3aed" opacity="0.18"/><text x="607" y="109" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><text x="616" y="117" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700">1</text><rect x="626" y="88" width="26" height="32" rx="5" fill="#ede9fe" stroke="#10b981" stroke-width="2"/><rect x="627" y="110" width="24" height="9" rx="0" fill="#7c3aed" opacity="0.18"/><text x="637" y="109" font-size="14" fill="#10b981" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="646" y="117" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700">2</text><rect x="656" y="88" width="26" height="32" rx="5" fill="#ede9fe" stroke="#10b981" stroke-width="2"/><rect x="657" y="110" width="24" height="9" rx="0" fill="#7c3aed" opacity="0.18"/><text x="667" y="109" font-size="14" fill="#10b981" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="676" y="117" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700">3</text><text x="634" y="136" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">input embeddings</text><text x="60" y="176" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">+ means adding the two vectors number by number: −0.049 + 0.043 = −0.006, and so on for all 128 numbers.</text><line x1="634" y1="158" x2="634.0" y2="180.0" stroke="#6b7280" stroke-width="1.8"/><path d="M634 188 L629.5 180.0 L638.5 180.0 Z" fill="#6b7280"/><circle cx="46" cy="202" r="10" fill="#111827"/><text x="46" y="206" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="62" y="206" font-size="12" fill="#111827" text-anchor="start" font-weight="600">four blocks, each attention then an MLP</text><text x="332" y="206" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal">transformer blocks</text><rect x="56" y="216" width="146" height="70" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="129" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">block 1</text><rect x="64" y="240" width="74" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="101" y="256" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">attention</text><text x="101" y="270" font-size="10" fill="#d97706" text-anchor="middle" font-weight="normal">4 heads</text><rect x="144" y="240" width="50" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="169" y="263" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">MLP</text><line x1="202" y1="251" x2="206.0" y2="251.0" stroke="#6b7280" stroke-width="1.8"/><path d="M214 251 L206.0 255.5 L206.0 246.5 Z" fill="#6b7280"/><rect x="214" y="216" width="146" height="70" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="287" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">block 2</text><rect x="222" y="240" width="74" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="259" y="256" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">attention</text><text x="259" y="270" font-size="10" fill="#d97706" text-anchor="middle" font-weight="normal">4 heads</text><rect x="302" y="240" width="50" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="327" y="263" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">MLP</text><line x1="360" y1="251" x2="364.0" y2="251.0" stroke="#6b7280" stroke-width="1.8"/><path d="M372 251 L364.0 255.5 L364.0 246.5 Z" fill="#6b7280"/><rect x="372" y="216" width="146" height="70" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="445" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">block 3</text><rect x="380" y="240" width="74" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="417" y="256" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">attention</text><text x="417" y="270" font-size="10" fill="#d97706" text-anchor="middle" font-weight="normal">4 heads</text><rect x="460" y="240" width="50" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="485" y="263" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">MLP</text><line x1="518" y1="251" x2="522.0" y2="251.0" stroke="#6b7280" stroke-width="1.8"/><path d="M530 251 L522.0 255.5 L522.0 246.5 Z" fill="#6b7280"/><rect x="530" y="216" width="146" height="70" rx="10" fill="#ffffff" stroke="#d1d5db"/><text x="603" y="232" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">block 4</text><rect x="538" y="240" width="74" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/><text x="575" y="256" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">attention</text><text x="575" y="270" font-size="10" fill="#d97706" text-anchor="middle" font-weight="normal">4 heads</text><rect x="618" y="240" width="50" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="643" y="263" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">MLP</text><text x="56" y="306" font-size="11" fill="#374151" text-anchor="start" font-weight="normal">All the hidden states go through every block. Each one gathers more about the earlier positions.</text><path d="M676 251 L708 251 L708 400" fill="none" stroke="#6b7280" stroke-width="1.8"/><line x1="708" y1="400" x2="699.0" y2="400.0" stroke="#6b7280" stroke-width="1.8"/><path d="M691 400 L699.0 395.5 L699.0 404.5 Z" fill="#6b7280"/><rect x="560" y="356" width="130" height="88" rx="10" fill="#f9fafb" stroke="#d1d5db"/><circle cx="560" cy="356" r="10" fill="#111827"/><text x="560" y="360" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="625" y="378" font-size="10" fill="#111827" text-anchor="middle" font-weight="600">the last hidden state</text><g opacity="0.3"><rect x="574" y="390" width="22" height="28" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="585" y="409" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">g</text></g><g opacity="0.3"><rect x="602" y="390" width="22" height="28" rx="4" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="613" y="409" font-size="12" fill="#10b981" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text></g><rect x="632.0" y="385" width="13.3" height="38" fill="#2563eb" opacity="0.28"/><rect x="645.3" y="385" width="13.3" height="38" fill="#10b981" opacity="0.28"/><rect x="658.7" y="385" width="13.3" height="38" fill="#10b981" opacity="0.28"/><rect x="632" y="385" width="40" height="38" rx="5" fill="none" stroke="#d97706" stroke-width="2.5"/><text x="652.0" y="410" font-size="15" fill="#d97706" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="625" y="437" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">now means “goo so far”</text><line x1="560" y1="400" x2="544.0" y2="400.0" stroke="#6b7280" stroke-width="1.8"/><path d="M536 400 L544.0 395.5 L544.0 404.5 Z" fill="#6b7280"/><rect x="384" y="356" width="150" height="88" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="459" y="378" font-size="11" fill="#111827" text-anchor="middle" font-weight="600">score it against</text><text x="459" y="394" font-size="11" fill="#111827" text-anchor="middle" font-weight="600">65 rows of lm_head</text><text x="459" y="412" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">one per next letter</text><text x="459" y="430" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal">lm_head + softmax</text><line x1="384" y1="400" x2="368.0" y2="400.0" stroke="#6b7280" stroke-width="1.8"/><path d="M360 400 L368.0 395.5 L368.0 404.5 Z" fill="#6b7280"/><rect x="206" y="356" width="152" height="88" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="282" y="372" font-size="10" fill="#111827" text-anchor="middle" font-weight="600">chances for the next letter</text><text x="222" y="390" font-size="12" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">d</text><rect x="232" y="381" width="87" height="10" rx="2" fill="#2563eb"/><text x="324.94" y="390" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">96.6%</text><text x="222" y="405" font-size="12" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">k</text><rect x="232" y="396" width="1" height="10" rx="2" fill="#2563eb"/><text x="238.54" y="405" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">0.6%</text><text x="222" y="420" font-size="12" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">r</text><rect x="232" y="411" width="1" height="10" rx="2" fill="#2563eb"/><text x="238.54" y="420" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">0.6%</text><text x="222" y="435" font-size="12" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">s</text><rect x="232" y="426" width="0" height="10" rx="2" fill="#2563eb"/><text x="238.36" y="435" font-size="10" fill="#111827" text-anchor="start" font-weight="normal">0.4%</text><line x1="206" y1="400" x2="190.0" y2="400.0" stroke="#6b7280" stroke-width="1.8"/><path d="M182 400 L190.0 395.5 L190.0 404.5 Z" fill="#6b7280"/><rect x="56" y="356" width="124" height="88" rx="10" fill="#f9fafb" stroke="#d1d5db"/><circle cx="56" cy="356" r="10" fill="#111827"/><text x="56" y="360" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">5</text><circle cx="95" cy="390" r="17" fill="#d1d5db"/><path d="M95,390 L93.19,406.90 A17,17 0 1 1 96.81,406.90 Z" fill="#2563eb"/><text x="95" y="387" font-size="10" fill="#fff" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">d</text><path d="M90,365 L100,365 L95,375 Z" fill="#111827" stroke="#fff" stroke-width="1"/><text x="122" y="396" font-size="14" fill="#111827" text-anchor="start" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">→ d</text><text x="118" y="424" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">spin the wheel:</text><text x="118" y="436" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal">it lands on d</text><path d="M56 400 L30 400 L30 118 L48 118" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M56 118 L48 113.5 L48 122.5 Z" fill="#6b7280"/><text x="40" y="474" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">Add the new letter to the text, making “good”, and run the whole thing again to choose the letter after that.</text></svg>
