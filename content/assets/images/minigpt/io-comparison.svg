<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img"
     aria-label="The digit model turns 784 pixels into 10 scores and picks the biggest. The language model turns a run of characters into a 65-way score at every position."
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto">
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== Row 1: MNIST digit model ===== -->
  <text x="40" y="42" font-size="19" font-weight="600" fill="#111827">Machine Learning, Part 9 — recognise a digit</text>

  <!-- pixel grid (a rough 7) -->
  <g transform="translate(40,66)">
    <rect x="-6" y="-6" width="96" height="96" fill="none" stroke="#d1d5db"/>
    <g fill="#374151">
      <rect x="0"  y="0"  width="14" height="14"/><rect x="14" y="0" width="14" height="14"/>
      <rect x="28" y="0"  width="14" height="14"/><rect x="42" y="0" width="14" height="14"/>
      <rect x="56" y="0"  width="14" height="14"/><rect x="70" y="0" width="14" height="14"/>
      <rect x="70" y="14" width="14" height="14"/><rect x="56" y="28" width="14" height="14"/>
      <rect x="42" y="42" width="14" height="14"/><rect x="42" y="56" width="14" height="14"/>
      <rect x="28" y="70" width="14" height="14"/>
    </g>
  </g>
  <text x="88" y="176" font-size="13" fill="#6b7280" text-anchor="middle">28 × 28 image</text>

  <line x1="150" y1="108" x2="266" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="208" y="100" font-size="13" fill="#6b7280" text-anchor="middle">784 numbers</text>

  <rect x="270" y="80" width="120" height="56" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="330" y="114" font-size="15" fill="#3730a3" text-anchor="middle">network</text>

  <line x1="394" y1="108" x2="452" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="423" y="100" font-size="13" fill="#6b7280" text-anchor="middle">10 scores</text>

  <!-- 10 score bars, digit 7 tallest -->
  <g transform="translate(466,150)">
    <g fill="#9ca3af">
      <rect x="0"  y="-10" width="12" height="10"/><rect x="18" y="-15" width="12" height="15"/>
      <rect x="36" y="-8"  width="12" height="8"/><rect x="54" y="-16" width="12" height="16"/>
      <rect x="72" y="-11" width="12" height="11"/><rect x="90" y="-7"  width="12" height="7"/>
      <rect x="108" y="-9" width="12" height="9"/>
      <rect x="144" y="-13" width="12" height="13"/><rect x="162" y="-9" width="12" height="9"/>
    </g>
    <rect x="126" y="-58" width="12" height="58" fill="#2563eb"/>
    <g font-size="11" fill="#6b7280" text-anchor="middle">
      <text x="6" y="14">0</text><text x="24" y="14">1</text><text x="42" y="14">2</text>
      <text x="60" y="14">3</text><text x="78" y="14">4</text><text x="96" y="14">5</text>
      <text x="114" y="14">6</text><text x="132" y="14" fill="#2563eb" font-weight="700">7</text>
      <text x="150" y="14">8</text><text x="168" y="14">9</text>
    </g>
  </g>

  <line x1="656" y1="108" x2="716" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="686" y="100" font-size="13" fill="#6b7280" text-anchor="middle">biggest</text>
  <text x="756" y="120" font-size="34" font-weight="700" fill="#111827">7</text>

  <line x1="40" y1="212" x2="860" y2="212" stroke="#e5e7eb"/>

  <!-- ===== Row 2: MiniGPT ===== -->
  <text x="40" y="252" font-size="19" font-weight="600" fill="#111827">MiniGPT — predict the next character</text>

  <!-- input characters -->
  <g transform="translate(40,278)" font-size="18" fill="#111827" text-anchor="middle">
    <rect x="0"  y="0" width="34" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="17" y="26">h</text>
    <rect x="38" y="0" width="34" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="55" y="26">e</text>
    <rect x="76" y="0" width="34" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="93" y="26">l</text>
    <rect x="114" y="0" width="34" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="131" y="26">l</text>
  </g>
  <text x="114" y="340" font-size="13" fill="#6b7280" text-anchor="middle">a run of characters</text>

  <line x1="204" y1="298" x2="266" y2="298" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="232" y="288" font-size="13" fill="#6b7280" text-anchor="middle">one ID each</text>

  <rect x="270" y="270" width="120" height="56" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="330" y="304" font-size="15" fill="#3730a3" text-anchor="middle">network</text>

  <line x1="394" y1="298" x2="452" y2="298" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- four score clusters, one per position: 5 short grey bars + 1 tall blue -->
  <g transform="translate(474,362)" font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="34"  y="24">after h</text><text x="128" y="24">after he</text>
    <text x="222" y="24">after hel</text><text x="316" y="24">after hell</text>
  </g>
  <g>
    <g transform="translate(478,362)" fill="#9ca3af">
      <rect x="0" y="-9" width="7" height="9"/><rect x="10" y="-13" width="7" height="13"/>
      <rect x="30" y="-10" width="7" height="10"/><rect x="40" y="-7" width="7" height="7"/><rect x="50" y="-12" width="7" height="12"/>
      <rect x="20" y="-46" width="7" height="46" fill="#2563eb"/>
    </g>
    <text x="501" y="304" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">&#8220;e&#8221;</text>

    <g transform="translate(572,362)" fill="#9ca3af">
      <rect x="0" y="-12" width="7" height="12"/><rect x="10" y="-8" width="7" height="8"/>
      <rect x="20" y="-13" width="7" height="13"/><rect x="30" y="-9" width="7" height="9"/><rect x="50" y="-10" width="7" height="10"/>
      <rect x="40" y="-46" width="7" height="46" fill="#2563eb"/>
    </g>
    <text x="595" y="304" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">&#8220;l&#8221;</text>

    <g transform="translate(666,362)" fill="#9ca3af">
      <rect x="0" y="-8" width="7" height="8"/><rect x="10" y="-12" width="7" height="12"/>
      <rect x="20" y="-9" width="7" height="9"/><rect x="40" y="-11" width="7" height="11"/><rect x="50" y="-7" width="7" height="7"/>
      <rect x="30" y="-46" width="7" height="46" fill="#2563eb"/>
    </g>
    <text x="689" y="304" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">&#8220;l&#8221;</text>

    <g transform="translate(760,362)" fill="#9ca3af">
      <rect x="0" y="-11" width="7" height="11"/><rect x="10" y="-7" width="7" height="7"/>
      <rect x="20" y="-13" width="7" height="13"/><rect x="30" y="-9" width="7" height="9"/><rect x="40" y="-12" width="7" height="12"/>
      <rect x="50" y="-46" width="7" height="46" fill="#2563eb"/>
    </g>
    <text x="789" y="304" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">&#8220;o&#8221;</text>
  </g>

  <!-- takeaway -->
  <line x1="40" y1="424" x2="860" y2="424" stroke="#e5e7eb"/>
  <text x="40" y="452" font-size="14" fill="#374151">Same shape of problem: numbers in, a score per option out, pick the biggest.</text>
  <text x="40" y="476" font-size="14" fill="#374151">The digit model produces <tspan font-weight="700">one</tspan> set of 10 scores. The language model produces a set of 65 <tspan font-weight="700">at every position</tspan>.</text>
</svg>
