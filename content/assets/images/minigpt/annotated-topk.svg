<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 336" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The notebook&#x27;s top-k lines, with handwritten notes. k = min(top_k, logits.size(-1)): never more than the 65 letters, so the notebook&#x27;s 200 becomes 65. torch.topk finds the k biggest scores and which letters they belong to. torch.full_like makes a fresh list of 65 scores, all minus infinity. scatter_ puts the k biggest back in their places, and the rest stay cut. From then on only k letters can win, and softmax gives the rest a chance of 0."><rect width="814" height="336" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">Top-k, in the notebook&#x27;s Python</text><text x="24" y="52" font-size="12" fill="#6b7280">From generate_text; the handwritten notes are my own reading</text><rect x="16" y="66" width="459" height="240" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="96" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">k = min(top_k, logits.size(-1))</text><text x="30" y="142" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">values, indices = torch.topk(logits, k=k)</text><text x="30" y="188" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">filtered_logits = torch.full_like(logits, float(&quot;-inf&quot;))</text><text x="30" y="234" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">filtered_logits.scatter_(dim=-1, index=indices, src=values)</text><text x="30" y="280" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">logits = filtered_logits</text><path d="M57.7 101 L244.8 101" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="503" y="82" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">never more than the 65 letters:</text><text x="503" y="100" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the notebook&#x27;s 200 becomes 65</text><path d="M496.9 86.0 C 387.1 86.0, 362.6 92.0, 257.8 92.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M252.8 92.0 L261.0 88.3 L261.0 95.7 Z" fill="#c2410c"/><path d="M154.7 147 L314.1 147" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="503" y="128" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">the k biggest scores, and</text><text x="503" y="146" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">which letters they belong to</text><path d="M496.9 132.0 C 418.2 132.0, 400.8 138.0, 327.1 138.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M322.1 138.0 L330.3 134.3 L330.3 141.7 Z" fill="#c2410c"/><path d="M154.7 193 L418.1 193" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="503" y="174" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">a fresh list of 65 scores,</text><text x="503" y="192" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">all minus infinity</text><path d="M496.9 178.0 C 465.0 178.0, 457.9 184.0, 431.1 184.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M426.1 184.0 L434.3 180.3 L434.3 187.7 Z" fill="#c2410c"/><path d="M140.9 239 L438.9 239" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="503" y="220" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">put the k biggest back in</text><text x="503" y="238" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">their places; the rest stay cut</text><path d="M496.9 224.0 C 474.4 224.0, 469.4 230.0, 451.9 230.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M446.9 230.0 L455.1 226.3 L455.1 233.7 Z" fill="#c2410c"/><path d="M92.4 285 L196.3 285" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="503" y="266" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">from here on, only k letters</text><text x="503" y="284" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">can win; softmax gives the rest 0</text><path d="M496.9 270.0 C 365.2 270.0, 336.0 276.0, 209.3 276.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M204.3 276.0 L212.5 272.3 L212.5 279.7 Z" fill="#c2410c"/></svg>
