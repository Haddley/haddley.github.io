s="a k14"><rect x="599" y="352" width="88.2" height="9" rx="3" fill="#059669" stroke="none" stroke-width="1.5" /><text x="644" y="384" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >right 49% of the time</text></g><text x="24" y="344" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Across a large sample of Shakespeare, the top guess is right:</text><text x="24" y="402" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >A peek, not how the machine writes: lm_head was only ever trained to read block 4's output.</text></svg>