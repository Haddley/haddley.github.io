<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 428" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The notebook&#x27;s lines for the heads, with handwritten notes. q = q.view(B, T, self.n_head, self.head_dim) cuts each 128 numbers into 4 pieces of 32, because n_head is 4 and head_dim is 32. q = q.transpose(1, 2) regroups the pieces by head, so all four heads run side by side, at once. The same is done to the keys and values. After collecting, out.transpose(1, 2).contiguous().view(B, T, C) lays the four heads&#x27; 32 numbers side by side, 128 again, and self.proj, one more table of weights, mixes what the four heads found."><rect width="766" height="428" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">The heads, in the notebook&#x27;s Python</text><text x="24" y="52" font-size="12" fill="#6b7280">From CausalSelfAttention.forward (cell 1.2); the handwritten notes are my own reading</text><rect x="16" y="66" width="410" height="332" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="96" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"># before matching: cut into heads</text><text x="30" y="142" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">q = q.view(B, T, self.n_head, self.head_dim)</text><text x="30" y="188" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">q = q.transpose(1, 2)</text><text x="30" y="234" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"></text><text x="30" y="280" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve"># after collecting: put them back</text><text x="30" y="326" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">out = out.transpose(1, 2).contiguous().view(B, T, C)</text><text x="30" y="372" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">out = self.proj(out)</text><path d="M147.8 147 L328.0 147" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="454" y="128" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">cut each 128 numbers into 4 pieces</text><text x="454" y="146" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">of 32: n_head = 4, head_dim = 32</text><path d="M448.4 132.0 C 400.9 132.0, 390.4 138.0, 347.9 138.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M342.9 138.0 L351.1 134.3 L351.1 141.7 Z" fill="#c2410c"/><path d="M71.6 193 L175.5 193" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="454" y="174" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">regroup by head, so all 4 heads</text><text x="454" y="192" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">run side by side, at once</text><path d="M448.4 178.0 C 329.2 178.0, 302.7 184.0, 188.5 184.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M183.5 184.0 L191.7 180.3 L191.7 187.7 Z" fill="#c2410c"/><path d="M293.3 331 L390.4 331" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="454" y="312" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">lay the 4 heads&#x27; 32 numbers</text><text x="454" y="330" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">side by side: 128 again</text><path d="M448.4 316.0 C 425.9 316.0, 420.9 322.0, 403.4 322.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M398.4 322.0 L406.6 318.3 L406.6 325.7 Z" fill="#c2410c"/><path d="M71.6 377 L168.6 377" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="454" y="358" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">one more table of weights</text><text x="454" y="376" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">mixes what the 4 heads found</text><path d="M448.4 362.0 C 326.1 362.0, 298.9 368.0, 181.6 368.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M176.6 368.0 L184.8 364.3 L184.8 371.7 Z" fill="#c2410c"/></svg>
