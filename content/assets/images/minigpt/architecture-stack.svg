<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img"
     aria-label="Token IDs become 384-number vectors, pass through six identical Transformer blocks and a final LayerNorm, and a linear head turns each into 65 scores. Inside one block: LayerNorm then attention added back, LayerNorm then an MLP added back."
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto">
  <rect width="900" height="580" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="600" fill="#111827">The stack</text>
  <text x="500" y="34" font-size="18" font-weight="600" fill="#111827">Inside one block</text>

  <!-- ================= LEFT: the pipeline ================= -->
  <g text-anchor="middle" font-size="14" fill="#1f2937">
    <!-- input -->
    <g font-size="17" font-family="ui-monospace, Menlo, monospace">
      <rect x="150" y="54" width="30" height="34" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="165" y="77">h</text>
      <rect x="182" y="54" width="30" height="34" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="197" y="77">e</text>
      <rect x="214" y="54" width="30" height="34" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="229" y="77">l</text>
      <rect x="246" y="54" width="30" height="34" rx="4" fill="#f9fafb" stroke="#d1d5db"/><text x="261" y="77">l</text>
    </g>
    <text x="213" y="106" font-size="13" fill="#6b7280">token IDs &#8212; one integer per character</text>
    <text x="213" y="123" font-size="12" fill="#9ca3af" font-family="ui-monospace, Menlo, monospace">shape [batch, 256]</text>
    <line x1="213" y1="130" x2="213" y2="152" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>

    <rect x="90" y="154" width="246" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="213" y="176">token embedding + position</text>
    <text x="213" y="192" font-size="11" fill="#6b7280">each ID &#8594; a learned vector of 384 numbers</text>
    <text x="213" y="222" font-size="12" fill="#9ca3af" font-family="ui-monospace, Menlo, monospace">[batch, 256, 384]</text>
    <line x1="213" y1="228" x2="213" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>

    <rect x="90" y="252" width="246" height="52" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="213" y="276">Transformer block</text>
    <text x="213" y="294" font-size="12" fill="#4338ca">&#215; 6 &#8212; identical, stacked</text>
    <line x1="336" y1="278" x2="540" y2="278" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="438" y="270" font-size="11" fill="#818cf8" text-anchor="middle">shown at right</text>
    <line x1="213" y1="304" x2="213" y2="326" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>

    <rect x="120" y="328" width="186" height="40" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="213" y="353">final LayerNorm</text>
    <line x1="213" y1="368" x2="213" y2="390" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>

    <rect x="90" y="392" width="246" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="213" y="414">linear head</text>
    <text x="213" y="430" font-size="11" fill="#6b7280">each vector &#8594; 65 scores, one per character</text>
    <text x="213" y="460" font-size="12" fill="#9ca3af" font-family="ui-monospace, Menlo, monospace">[batch, 256, 65]</text>
    <line x1="213" y1="466" x2="213" y2="486" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>

    <line x1="213" y1="486" x2="120" y2="500" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>
    <line x1="213" y1="486" x2="306" y2="500" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="24" y="502" width="180" height="58" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="114" y="524" font-size="13">training</text>
    <text x="114" y="542" font-size="11" fill="#047857">cross-entropy against</text>
    <text x="114" y="556" font-size="11" fill="#047857">the real next character</text>
    <rect x="222" y="502" width="190" height="58" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="317" y="524" font-size="13">generation</text>
    <text x="317" y="542" font-size="11" fill="#b45309">softmax &#8594; sample one &#8594;</text>
    <text x="317" y="556" font-size="11" fill="#b45309">append &#8594; run it again</text>
  </g>

  <!-- ================= RIGHT: inside a block ================= -->
  <g text-anchor="middle" font-size="13" fill="#1f2937">
    <text x="660" y="60" font-size="12" fill="#9ca3af" font-family="ui-monospace, Menlo, monospace">x  [batch, 256, 384]</text>
    <line x1="660" y1="68" x2="660" y2="86" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>

    <!-- residual rail -->
    <path d="M660 92 L560 92 L560 214 L636 214" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a2)"/>
    <path d="M660 232 L560 232 L560 356 L636 356" fill="none" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="548" y="150" font-size="11" fill="#94a3b8" text-anchor="end">carried through</text>
    <text x="548" y="296" font-size="11" fill="#94a3b8" text-anchor="end">carried through</text>

    <rect x="620" y="92" width="150" height="34" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="695" y="114">LayerNorm</text>
    <line x1="695" y1="126" x2="695" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="605" y="142" width="180" height="46" rx="5" fill="#eef2ff" stroke="#6366f1"/>
    <text x="695" y="162">causal self-attention</text>
    <text x="695" y="178" font-size="10" fill="#6b7280">looks back at earlier tokens</text>
    <line x1="695" y1="188" x2="695" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>
    <circle cx="695" cy="214" r="11" fill="#fff" stroke="#64748b"/><text x="695" y="219" font-size="14">+</text>
    <line x1="695" y1="225" x2="695" y2="238" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>

    <rect x="620" y="240" width="150" height="34" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="695" y="262">LayerNorm</text>
    <line x1="695" y1="274" x2="695" y2="288" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="605" y="290" width="180" height="46" rx="5" fill="#eef2ff" stroke="#6366f1"/>
    <text x="695" y="310">MLP</text>
    <text x="695" y="326" font-size="10" fill="#6b7280">384 &#8594; 1536 &#8594; 384, per token</text>
    <line x1="695" y1="336" x2="695" y2="350" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>
    <circle cx="695" cy="356" r="11" fill="#fff" stroke="#64748b"/><text x="695" y="361" font-size="14">+</text>
    <line x1="695" y1="367" x2="695" y2="382" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="695" y="398" font-size="12" fill="#9ca3af" font-family="ui-monospace, Menlo, monospace">out  [batch, 256, 384]</text>
    <text x="695" y="420" font-size="11" fill="#6b7280">same shape in and out &#8212; that is why blocks stack</text>
  </g>
</svg>
