<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-label="A map of all 65 token embeddings after training, squashed from 128 numbers down to two. The pause marks, comma, semicolon and colon, sit together on the right; the sentence-ending marks, full stop, question mark and exclamation mark, sit together above them. The vowels gather near the top middle, and most capitals sit on the left." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="510" fill="#ffffff"/><text x="40" y="32" font-size="16" font-weight="600" fill="#111827">A map of the 65 token embeddings after training</text><text x="40" y="54" font-size="12" fill="#6b7280">Letters with similar embeddings end up close together. Squashing 128 numbers</text><text x="40" y="70" font-size="12" fill="#6b7280">down to 2 loses detail, so this is only a rough map.</text><rect x="434" y="260" width="222" height="63" rx="14" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-dasharray="4 3"/><text x="428" y="254" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="start">the six main punctuation marks</text><text x="367.8" y="208.1" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">↵</text><text x="373.0" y="215.4" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">␣</text><text x="586.5" y="279.7" font-size="26" font-weight="700" fill="#7c3aed" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">!</text><text x="144.0" y="267.6" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">$</text><text x="102.8" y="170.3" font-size="17" font-weight="700" fill="#6b7280" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">&amp;</text><text x="281.