font-family="ui-monospace, Menlo, Consolas, monospace">d</text><text x="186" y="261" font-size="16" fill="#111827" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">⋮</text><path d="M166 122 h-6 v146 h6" fill="none" stroke="#111827"/><text x="150" y="189.0" font-size="13" fill="#111827" text-anchor="end" font-weight="600" >block_size</text><text x="150" y="207.0" font-size="13" fill="#111827" text-anchor="end" font-weight="600" >= up to 128</text><text x="150" y="225.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal" >rows: one</text><text x="150" y="241.0" font-size="12" fill="#6b7280" text-anchor="end" font-weight="normal" >per position</text><text x="40" y="310" font-size="13" fill="#111827" text-anchor="start" font-weight="600" >Attention</text><text x="138" y="310" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" >mixes rows: each row gathers from the rows above it (4 heads at once)</text><text x="40" y="336" font-size="13" fill="#111827" text-anchor="start" font-weight="600" >MLP</text><text x="138" y="336" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" >works on each row alone: 128 → 512 → 128 columns, no mixing between rows</text><text x="40" y="362" font-size="13" fill="#111827" text-anchor="start" font-weight="600" >n_layer = 4</text><text x="138" y="362" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" >the sheet goes through attention + MLP four times; its shape never changes</text><text x="40" y="392" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" >In Part 1, block_size and n_embd are both 128 by coincidence. In the stronger model they are 256 and 384.</text></svg>
