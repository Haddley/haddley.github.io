<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="The meeting, drawn as people. The three letters of goo stand in a row, each wearing a name badge. The last o asks its question: was there an o just before me? It reads every badge it is allowed to see, including its own, and takes 92.9 percent of its notes from the o before it, 4.0 percent from the g, and 3.1 percent from itself. These are real numbers from one head of my trained model." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="430" fill="#ffffff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">The meeting, from the point of view of the last letter</text><text x="40" y="50" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Every letter brings a question, a badge, and a note, all worked out from its own card.</text><circle cx="160" cy="130" r="18" fill="#fff" stroke="#374151" stroke-width="2.5"/><circle cx="154" cy="127" r="2" fill="#374151"/><circle cx="166" cy="127" r="2" fill="#374151"/><path d="M154 137 q6 5 12 0" fill="none" stroke="#374151" stroke-width="1.8"/><line x1="160" y1="148" x2="160" y2="210" stroke="#374151" stroke-width="2.5"/><line x1="160" y1="162" x2="136" y2="188" stroke="#374151" stroke-width="2.5"/><line x1="160" y1="162" x2="184" y2="188" stroke="#374151" stroke-width="2.5"/><line x1="160" y1="210" x2="144" y2="250" stroke="#374151" stroke-width="2.5"/><line x1="160" y1="210" x2="176" y2="250" stroke="#374151" stroke-width="2.5"/><rect x="143" y="160" width="34" height="28" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/><text x="160" y="180" font-size="17" fill="#059669" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><text x="160" y="272" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">position 1</text><line x1="160" y1="310" x2="548" y2="310" stroke="#2563eb" stroke-width="1.9" stroke-opacity="0.8"/><path d="M548 303.02777777777777 L562 310 L548 316.97222222222223 Z" fill="#2563eb"/><circle cx="160" cy="310" r="4" fill="#2563eb"/><text x="168" y="304.02777777777777" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">4% of its note</text><circle cx="370" cy="130" r="18" fill="#fff" stroke="#374151" stroke-width="2.5"/><circle cx="364" cy="127" r="2" fill="#374151"/><circle cx="376" cy="127" r="2" fill="#374151"/><path d="M364 137 q6 5 12 0" fill="none" stroke="#374151" stroke-width="1.8"/><line x1="370" y1="148" x2="370" y2="210" stroke="#374151" stroke-width="2.5"/><line x1="370" y1="162" x2="346" y2="188" stroke="#374151" stroke-width="2.5"/><line x1="370" y1="162" x2="394" y2="188" stroke="#374151" stroke-width="2.5"/><line x1="370" y1="210" x2="354" y2="250" stroke="#374151" stroke-width="2.5"/><line x1="370" y1="210" x2="386" y2="250" stroke="#374151" stroke-width="2.5"/><rect x="353" y="160" width="34" height="28" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/><text x="370" y="180" font-size="17" fill="#059669" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="370" y="272" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">position 2</text><line x1="370" y1="338" x2="548" y2="338" stroke="#2563eb" stroke-width="11.8" stroke-opacity="0.8"/><path d="M548 326.0888888888889 L562 338 L548 349.9111111111111 Z" fill="#2563eb"/><circle cx="370" cy="338" r="4" fill="#2563eb"/><text x="378" y="327.0888888888889" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">92.9% of its note</text><circle cx="580" cy="130" r="18" fill="#fff" stroke="#d97706" stroke-width="2.5"/><circle cx="574" cy="127" r="2" fill="#d97706"/><circle cx="586" cy="127" r="2" fill="#d97706"/><path d="M574 137 q6 5 12 0" fill="none" stroke="#d97706" stroke-width="1.8"/><line x1="580" y1="148" x2="580" y2="210" stroke="#d97706" stroke-width="2.5"/><line x1="580" y1="162" x2="556" y2="188" stroke="#d97706" stroke-width="2.5"/><line x1="580" y1="162" x2="604" y2="188" stroke="#d97706" stroke-width="2.5"/><line x1="580" y1="210" x2="564" y2="250" stroke="#d97706" stroke-width="2.5"/><line x1="580" y1="210" x2="596" y2="250" stroke="#d97706" stroke-width="2.5"/><rect x="563" y="160" width="34" height="28" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/><text x="580" y="180" font-size="17" fill="#059669" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="580" y="272" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">position 3</text><rect x="566" y="288" width="40" height="66" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="586" y="316" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">+3.1%</text><text x="586" y="332" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="normal">of its</text><text x="586" y="345" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="normal">own</text><text x="620" y="316" font-size="11" fill="#111827" text-anchor="start" font-weight="600">the last letter</text><text x="620" y="332" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">collects</text><text x="620" y="346" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">the notes</text><rect x="452" y="70" width="230" height="44" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><path d="M570 114 l6 14 l6 -14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><rect x="571" y="111" width="10" height="5" fill="#fffbeb"/><text x="567" y="90" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">Question: was there an <tspan font-family="ui-monospace, Menlo, Consolas, monospace">o</tspan></text><text x="567" y="106" font-size="13" fill="#111827" text-anchor="middle" font-weight="600">just before me?</text><text x="40" y="390" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">The badge (green) says what each letter is. The question (amber) is what the last letter is looking for.</text><text x="40" y="410" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">The better a badge answers the question, the bigger the share of that letter's note it takes (blue).</text></svg>
