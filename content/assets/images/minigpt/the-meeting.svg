<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Attention for working card 3 in goo, drawn as a tabletop. Working cards 1, 2 and 3 sit along the top. Each has laid a key card face up and a value card face down on the table. Working card 3 holds its query card, starting 0.00, 0.27, 0.76, and matches it against the three key cards: the scores are minus 2.19, 15.60 and minus 3.62, giving shares of 4.0, 92.9 and 3.1 percent. It collects those shares of the three value cards, adds them to itself, and every scratch card is then thrown away."><defs><pattern id="back" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#dbeafe"/><line x1="0" y1="0" x2="0" y2="8" stroke="#93c5fd" stroke-width="3"/></pattern></defs><rect width="720" height="470" fill="#fff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Attention, from the point of view of position 3</text><text x="40" y="50" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Real numbers from block 1, head 1 of my trained model. Each query, key and value shown with its first 3 of 32 numbers.</text><rect x="100" y="72" width="60" height="58" rx="7" fill="#ede9fe" stroke="#2563eb" stroke-width="2"/><text x="124" y="108" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">g</text><text x="144" y="122" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">1</text><text x="130" y="146" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">position 1</text><rect x="290" y="72" width="60" height="58" rx="7" fill="#ede9fe" stroke="#10b981" stroke-width="2"/><text x="314" y="108" font-size="20" fill="#10b981" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="334" y="122" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">2</text><text x="320" y="146" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">position 2</text><rect x="480" y="72" width="60" height="58" rx="7" fill="#ede9fe" stroke="#d97706" stroke-width="3"/><text x="504" y="108" font-size="20" fill="#10b981" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="524" y="122" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">3</text><text x="510" y="146" font-size="11" fill="#111827" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">position 3</text><rect x="50" y="160" width="560" height="168" rx="14" fill="#faf7f0" stroke="#e7dcc6"/><text x="64" y="178" font-size="11" fill="#a8916a" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">the table</text><rect x="60" y="188" width="140" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="130" y="206" font-size="12" fill="#059669" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">key 1</text><text x="130" y="224" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">−0.88, −0.47, −0.87, …</text><text x="130" y="238" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">face up</text><rect x="60" y="256" width="140" height="56" rx="6" fill="url(#back)" stroke="#2563eb" stroke-width="2"/><rect x="100" y="274" width="60" height="20" rx="4" fill="#fff" opacity="0.9"/><text x="130" y="288" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">value 1</text><rect x="250" y="188" width="140" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="320" y="206" font-size="12" fill="#059669" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">key 2</text><text x="320" y="224" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">−2.37, −0.09, 0.19, …</text><text x="320" y="238" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">face up</text><rect x="250" y="256" width="140" height="56" rx="6" fill="url(#back)" stroke="#2563eb" stroke-width="2"/><rect x="290" y="274" width="60" height="20" rx="4" fill="#fff" opacity="0.9"/><text x="320" y="288" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">value 2</text><rect x="440" y="188" width="140" height="56" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="510" y="206" font-size="12" fill="#059669" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">key 3</text><text x="510" y="224" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">−1.38, −0.84, −0.45, …</text><text x="510" y="238" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">face up</text><rect x="440" y="256" width="140" height="56" rx="6" fill="url(#back)" stroke="#2563eb" stroke-width="2"/><rect x="480" y="274" width="60" height="20" rx="4" fill="#fff" opacity="0.9"/><text x="510" y="288" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">value 3</text><rect x="598" y="72" width="84" height="74" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="640" y="90" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">query 3</text><text x="640" y="108" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">0.00, 0.27,</text><text x="640" y="122" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">0.76, …</text><text x="640" y="138" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">in its hand</text><path d="M548 101 L598 101" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M640 146 C 640 172, 130 168, 130 188" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.75"/><path d="M640 146 C 640 172, 320 168, 320 188" fill="none" stroke="#d97706" stroke-width="5.6" opacity="0.75"/><path d="M640 146 C 640 172, 510 168, 510 188" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.75"/><text x="130" y="342" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">query × key: −2.19</text><text x="130" y="358" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">share: 4.0%</text><text x="320" y="342" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">query × key: 15.60</text><text x="320" y="358" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">share: 92.9%</text><text x="510" y="342" font-size="11" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">query × key: −3.62</text><text x="510" y="358" font-size="12" fill="#d97706" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">share: 3.1%</text><rect x="50" y="374" width="620" height="44" rx="10" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="393" font-size="12" fill="#111827" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Hidden state 3 collects 4.0% of value 1 + 92.9% of value 2 + 3.1% of value 3,</text><text x="360" y="409" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">number by number, and adds the result to itself. Then every query, key and value is thrown away.</text><text x="40" y="442" font-size="11" fill="#374151" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Keys lie face up, so every later position can read them. Values lie face down: a position only picks them up,</text><text x="40" y="458" font-size="11" fill="#374151" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">in the shares it has chosen, after matching its query against the keys. Only keys from its own position or earlier are on its table.</text></svg>
