<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-label="Top: the MNIST digit network, 784 pixel values, then two dense layers, then 10 scores. Bottom: MiniGPT, letters, then a lookup of 128 numbers per letter, then a Transformer block repeated 4 times containing attention followed by an MLP of two dense layers, then a final dense layer, then 65 scores at every position. The MLP's two dense layers line up under the MNIST network's two dense layers." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="392" fill="#ffffff"/><text x="20" y="30" font-size="13" fill="#111827" text-anchor="start" font-weight="600">MNIST digit network (Machine Learning, Part 9)</text><rect x="225" y="52" width="110" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="280.0" y="75.5" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">784 pixel</text><text x="280.0" y="90.5" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">values</text><line x1="335" y1="78.0" x2="359" y2="78.0" stroke="#6b7280" stroke-width="1.5"/><path d="M358 74.0 L365 78.0 L358 82.0 Z" fill="#6b7280"/><rect x="365" y="58" width="52" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="391.0" y="83.0" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="600">dense</text><line x1="417" y1="78.0" x2="425" y2="78.0" stroke="#6b7280" stroke-width="1.5"/><path d="M424 74.0 L431 78.0 L424 82.0 Z" fill="#6b7280"/><rect x="431" y="58" width="52" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="457.0" y="83.0" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="600">dense</text><line x1="483" y1="78.0" x2="509" y2="78.0" stroke="#6b7280" stroke-width="1.5"/><path d="M508 74.0 L515 78.0 L508 82.0 Z" fill="#6b7280"/><rect x="515" y="52" width="110" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="570.0" y="75.5" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">10 scores,</text><text x="570.0" y="90.5" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">one per digit</text><text x="20" y="170" font-size="13" fill="#111827" text-anchor="start" font-weight="600">MiniGPT</text><rect x="14" y="230" width="84" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="56.0" y="262.5" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">up to 128</text><text x="56.0" y="277.5" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">letters</text><line x1="98" y1="265.0" x2="106" y2="265.0" stroke="#6b7280" stroke-width="1.5"/><path d="M105 261.0 L112 265.0 L105 269.0 Z" fill="#6b7280"/><rect x="112" y="230" width="100" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="162.0" y="255.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">look up</text><text x="162.0" y="270.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">128 numbers</text><text x="162.0" y="285.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">per letter</text><line x1="212" y1="265.0" x2="220" y2="265.0" stroke="#6b7280" stroke-width="1.5"/><path d="M219 261.0 L226 265.0 L219 269.0 Z" fill="#6b7280"/><rect x="226" y="186" width="268" height="136" rx="10" fill="none" stroke="#111827" stroke-dasharray="5 4"/><text x="360" y="204" font-size="12" fill="#111827" text-anchor="middle" font-weight="600">Transformer block × 4</text><rect x="236" y="230" width="104" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="288.0" y="255.0" font-size="12" fill="#78350f" text-anchor="middle" font-weight="600">attention:</text><text x="288.0" y="270.0" font-size="12" fill="#78350f" text-anchor="middle" font-weight="600">letters share</text><text x="288.0" y="285.0" font-size="12" fill="#78350f" text-anchor="middle" font-weight="600">information</text><line x1="340" y1="265.0" x2="350" y2="265.0" stroke="#6b7280" stroke-width="1.5"/><path d="M349 261.0 L356 265.0 L349 269.0 Z" fill="#6b7280"/><rect x="356" y="226" width="132" height="78" rx="8" fill="#ffffff" stroke="#2563eb"/><rect x="365" y="244" width="52" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="391.0" y="270.0" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="600">dense</text><line x1="417" y1="265.0" x2="425" y2="265.0" stroke="#6b7280" stroke-width="1.5"/><path d="M424 261.0 L431 265.0 L424 269.0 Z" fill="#6b7280"/><rect x="431" y="244" width="52" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="457.0" y="270.0" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="600">dense</text><text x="422" y="316" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal">MLP: 128 → 512 → 128</text><line x1="494" y1="265.0" x2="504" y2="265.0" stroke="#6b7280" stroke-width="1.5"/><path d="M503 261.0 L510 265.0 L503 269.0 Z" fill="#6b7280"/><rect x="510" y="240" width="62" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="541.0" y="262.5" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="600">dense</text><text x="541.0" y="277.5" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="600">128 → 65</text><line x1="572" y1="265.0" x2="580" y2="265.0" stroke="#6b7280" stroke-width="1.5"/><path d="M579 261.0 L586 265.0 L579 269.0 Z" fill="#6b7280"/><rect x="586" y="230" width="120" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="646.0" y="255.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">65 scores</text><text x="646.0" y="270.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">at every</text><text x="646.0" y="285.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal">letter position</text><line x1="391" y1="98" x2="391" y2="244" stroke="#2563eb" stroke-dasharray="3 4" opacity="0.6"/><line x1="457" y1="98" x2="457" y2="244" stroke="#2563eb" stroke-dasharray="3 4" opacity="0.6"/><text x="500" y="148" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">the same two-layer idea</text><line x1="496" y1="144" x2="462" y2="144" stroke="#2563eb" opacity="0.6"/><text x="20" y="360" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">Attention (amber) is the only part where letters exchange information. Everything blue works on each letter separately.</text><text x="20" y="380" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">Take attention out, and the model could only guess the next letter from the current letter.</text></svg>
