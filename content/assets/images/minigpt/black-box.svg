<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Where temperature and top-k act, for the text go. The text goes into MiniGPT, drawn as a closed black box holding token embeddings, 4 blocks and lm_head, 826,433 trained parameters. Out come 65 scores (logits) for the next letter: o 4.878, space 4.076, d 4.062, n 3.068, and 60 more, down to V at minus 7.421. The scores then pass through temperature, which divides every score by it, and top-k, which keeps the biggest k scores; these two hyperparameters act here. Softmax turns the scores into 65 chances for the next letter, that add up to 100 percent: o 34.8, space 15.6, d 15.4, n 5.7 percent at temperature 1. Then the wheel is spun." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="430" fill="#ffffff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">Where temperature and top-k act: on the scores</text><text x="40" y="50" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">Real numbers from my trained model, for the text “go”. The inside of the model stays closed for now.</text><rect x="40" y="80" width="84" height="130" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="82" y="104" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">the text</text><text x="82" y="152" font-size="24" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">go</text><line x1="124" y1="145" x2="138.0" y2="145.0" stroke="#6b7280" stroke-width="1.8"/><path d="M146 145 L138.0 149.5 L138.0 140.5 Z" fill="#6b7280"/><rect x="148" y="80" width="196" height="130" rx="10" fill="#111827" stroke="#111827" stroke-width="1"/><text x="246" y="118" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">MiniGPT</text><text x="246" y="140" font-size="10" fill="#d1d5db" text-anchor="middle" font-weight="normal">token embeddings, 4 blocks, lm_head</text><text x="246" y="158" font-size="10" fill="#d1d5db" text-anchor="middle" font-weight="normal">826,433 trained parameters</text><text x="246" y="188" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal" font-style="italic">opened up later in this post</text><line x1="344" y1="145" x2="358.0" y2="145.0" stroke="#6b7280" stroke-width="1.8"/><path d="M366 145 L358.0 149.5 L358.0 140.5 Z" fill="#6b7280"/><rect x="368" y="80" width="312" height="130" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="524" y="100" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">65 scores (logits) for the next letter</text><line x1="520" y1="108" x2="520" y2="202" stroke="#9ca3af" stroke-width="1"/><rect x="520.0" y="113" width="58.5" height="10" rx="2" fill="#2563eb"/><text x="392" y="122" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="600" y="122" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">4.878</text><rect x="520.0" y="129" width="48.9" height="10" rx="2" fill="#2563eb"/><text x="392" y="138" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">␣</text><text x="600" y="138" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">4.076</text><rect x="520.0" y="145" width="48.7" height="10" rx="2" fill="#2563eb"/><text x="392" y="154" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">d</text><text x="600" y="154" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">4.062</text><rect x="520.0" y="161" width="36.8" height="10" rx="2" fill="#2563eb"/><text x="392" y="170" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">n</text><text x="600" y="170" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">3.068</text><text x="410" y="187" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal">… 60 more</text><rect x="430.9" y="191" width="89.1" height="10" rx="2" fill="#d97706"/><text x="392" y="200" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">V</text><text x="600" y="200" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">−7.421</text><text x="406" y="208" font-size="10" fill="#111827" text-anchor="middle" font-weight="normal"></text><line x1="620" y1="210" x2="620.0" y2="254.0" stroke="#6b7280" stroke-width="1.8"/><path d="M620 262 L615.5 254.0 L624.5 254.0 Z" fill="#6b7280"/><rect x="426" y="240" width="262" height="140" rx="10" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/><text x="434" y="256" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">the hyperparameters act here</text><rect x="560" y="266" width="120" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="620" y="292" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">temperature</text><text x="620" y="318" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">divide every</text><text x="620" y="332" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">score by it</text><text x="620" y="356" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal">0.8 in the notebook</text><line x1="560" y1="318" x2="550.0" y2="318.0" stroke="#6b7280" stroke-width="1.8"/><path d="M542 318 L550.0 313.5 L550.0 322.5 Z" fill="#6b7280"/><rect x="434" y="266" width="106" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="487" y="292" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">top-k</text><text x="487" y="318" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">keep the biggest</text><text x="487" y="332" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">k scores</text><text x="487" y="356" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal">200 in the notebook</text><line x1="434" y1="318" x2="420.0" y2="318.0" stroke="#6b7280" stroke-width="1.8"/><path d="M412 318 L420.0 313.5 L420.0 322.5 Z" fill="#6b7280"/><rect x="306" y="266" width="104" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="358" y="292" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">softmax</text><text x="358" y="318" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">scores into</text><text x="358" y="332" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">chances</text><text x="358" y="356" font-size="10" fill="#9ca3af" text-anchor="middle" font-weight="normal">they add up to 100%</text><line x1="306" y1="318" x2="292.0" y2="318.0" stroke="#6b7280" stroke-width="1.8"/><path d="M284 318 L292.0 313.5 L292.0 322.5 Z" fill="#6b7280"/><rect x="156" y="266" width="126" height="104" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="219" y="284" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">65 chances</text><text x="219" y="297" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal">for the next letter</text><text x="196" y="311" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">o</text><text x="212" y="311" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">34.8%</text><text x="196" y="324" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">␣</text><text x="212" y="324" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">15.6%</text><text x="196" y="337" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">d</text><text x="212" y="337" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">15.4%</text><text x="196" y="350" font-size="11" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">n</text><text x="212" y="350" font-size="10" fill="#111827" text-anchor="start" font-weight="normal" font-family="ui-monospace, Menlo, Consolas, monospace">5.7%</text><text x="219" y="365" font-size="9" fill="#9ca3af" text-anchor="middle" font-weight="normal">… at temperature 1</text><line x1="156" y1="318" x2="142.0" y2="318.0" stroke="#6b7280" stroke-width="1.8"/><path d="M134 318 L142.0 313.5 L142.0 322.5 Z" fill="#6b7280"/><path d="M86,314 L55.80,298.37 A34,34 0 0 1 116.20,298.37 Z" fill="#2563eb" stroke="#fff" stroke-width="1"/><path d="M86,314 L116.20,298.37 A34,34 0 0 1 115.79,330.38 Z" fill="#7c3aed" stroke="#fff" stroke-width="1"/><path d="M86,314 L115.79,330.38 A34,34 0 0 1 89.41,347.83 Z" fill="#059669" stroke="#fff" stroke-width="1"/><path d="M86,314 L89.41,347.83 A34,34 0 0 1 77.34,346.88 Z" fill="#d97706" stroke="#fff" stroke-width="1"/><path d="M86,314 L77.34,346.88 A34,34 0 0 1 69.62,343.79 Z" fill="#dc2626" stroke="#fff" stroke-width="1"/><path d="M86,314 L69.62,343.79 A34,34 0 0 1 55.80,298.37 Z" fill="#e5e7eb" stroke="#fff" stroke-width="1"/><path d="M79,268 L93,268 L86,282 Z" fill="#111827"/><text x="86" y="368" font-size="10" fill="#374151" text-anchor="middle" font-weight="normal">spin the wheel</text><text x="40" y="410" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">Temperature and top-k never reach inside the black box. They only reshape the scores that come out of it.</text></svg>