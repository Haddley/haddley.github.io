<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 781 474" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The heart of the attention code, with a handwritten note beside each line. self.query, self.key and self.value make each hidden state&#x27;s query, what it is looking for, its key, what it has to offer, and its value, what it hands over. q at k transpose matches every query with every key by multiplying and adding. Dividing by the square root of 32 shrinks the scores. masked_fill means only listen to earlier positions. softmax shares out attention so that every row adds up to 100 percent. attn at v collects the values in those shares."><rect width="781" height="474" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#111827">Attention, in eight lines of code</text><text x="24" y="52" font-size="12" fill="#6b7280">From CausalSelfAttention.forward (cell 1.2), without the head lines; the handwritten notes are my own reading</text><rect x="16" y="66" width="445" height="378" rx="8" fill="#f5f5f5" stroke="#ddd"/><text x="30" y="96" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">q = self.query(x)</text><text x="30" y="142" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">k = self.key(x)</text><text x="30" y="188" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">v = self.value(x)</text><text x="30" y="234" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">scores = q @ k.transpose(-2, -1)</text><text x="30" y="280" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">scores = scores / math.sqrt(self.head_dim)</text><text x="30" y="326" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">scores = scores.masked_fill(mask == False, float(&quot;-inf&quot;))</text><text x="30" y="372" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">attn = F.softmax(scores, dim=-1)</text><text x="30" y="418" font-size="11.5" fill="#111827" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">out = attn @ v</text><path d="M57.7 101 L147.8 101" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="82" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">each hidden state&#x27;s query:</text><text x="489" y="100" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">what it is looking for</text><path d="M483.0 86.0 C 335.8 86.0, 303.1 92.0, 160.8 92.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M155.8 92.0 L164.0 88.3 L164.0 95.7 Z" fill="#c2410c"/><path d="M57.7 147 L133.9 147" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="128" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">each hidden state&#x27;s key:</text><text x="489" y="146" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">what it has to offer</text><path d="M483.0 132.0 C 329.5 132.0, 295.4 138.0, 146.9 138.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M141.9 138.0 L150.2 134.3 L150.2 141.7 Z" fill="#c2410c"/><path d="M57.7 193 L147.8 193" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="174" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">each hidden state&#x27;s value:</text><text x="489" y="192" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">what it hands over</text><path d="M483.0 178.0 C 335.8 178.0, 303.1 184.0, 160.8 184.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M155.8 184.0 L164.0 180.3 L164.0 187.7 Z" fill="#c2410c"/><path d="M92.4 239 L251.8 239" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="220" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">match every query with every</text><text x="489" y="238" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">key: multiply and add</text><path d="M483.0 224.0 C 382.5 224.0, 360.2 230.0, 264.8 230.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M259.8 230.0 L268.0 226.3 L268.0 233.7 Z" fill="#c2410c"/><path d="M92.4 285 L321.1 285" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="275" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">shrink: divide by √32</text><path d="M483.0 270.0 C 413.7 270.0, 398.3 276.0, 334.1 276.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M329.1 276.0 L337.3 272.3 L337.3 279.7 Z" fill="#c2410c"/><path d="M140.9 331 L425.0 331" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="312" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">only listen to earlier</text><text x="489" y="330" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">positions</text><path d="M483.0 316.0 C 460.5 316.0, 455.5 322.0, 438.0 322.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M433.0 322.0 L441.2 318.3 L441.2 325.7 Z" fill="#c2410c"/><path d="M78.5 377 L251.8 377" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="358" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">share out: every row</text><text x="489" y="376" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">adds up to 100%</text><path d="M483.0 362.0 C 382.5 362.0, 360.2 368.0, 264.8 368.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M259.8 368.0 L268.0 364.3 L268.0 371.7 Z" fill="#c2410c"/><path d="M71.6 423 L127.0 423" stroke="#c2410c" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/><text x="489" y="404" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">collect the values,</text><text x="489" y="422" font-size="16" fill="#c2410c" font-family="'Bradley Hand', 'Chalkboard SE', 'Segoe Print', 'Comic Sans MS', cursive">in those shares</text><path d="M483.0 408.0 C 326.4 408.0, 291.6 414.0, 140.0 414.0" fill="none" stroke="#c2410c" stroke-width="1.6"/><path d="M135.0 414.0 L143.2 410.3 L143.2 417.7 Z" fill="#c2410c"/></svg>
