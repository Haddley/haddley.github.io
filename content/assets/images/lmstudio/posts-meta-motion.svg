<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A local model chatting on a laptop with a system prompt and settings panel</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="6" y="18" width="108" height="84" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M14,28 H60" stroke="#c9d3dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.0s"><g><rect x="14" y="38" width="44" height="16" rx="6" fill="#5bb4ea"/><path d="M22,53 l-6,8 l10,-2 z" fill="#5bb4ea"/></g></g>
<g class="p" style="animation-delay:1.6s"><g><rect x="30" y="60" width="44" height="16" rx="6" fill="#2f9e4a"/><path d="M66,75 l6,8 l-10,-2 z" fill="#2f9e4a"/></g></g>
<g class="p" style="animation-delay:2.2s"><g><path d="M86,30 H106 M86,48 H106 M86,66 H106" stroke="#c9d3dd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="94" cy="30" r="3.5" fill="#ffb43a"/><circle cx="100" cy="48" r="3.5" fill="#ffb43a"/><circle cx="90" cy="66" r="3.5" fill="#ffb43a"/></g></g>
</svg>
