<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Events streaming into an Eventhouse, then a delay, then the same data arriving in the lake, with a tick</title><style>.e{animation:fly 1.8s linear infinite;opacity:0}.e2{animation-delay:.6s}.e3{animation-delay:1.2s}.h{animation:hb 1.8s ease-in-out infinite}.hand{transform-box:view-box;transform-origin:76px 96px;animation:spin 9s linear infinite}.p{opacity:0;animation:mv 9s ease-in-out infinite}.t{opacity:0;animation:tk 9s ease-out infinite}.l{opacity:.35;animation:fl 9s ease-out infinite}@keyframes fly{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(34px);opacity:0}}@keyframes hb{0%,100%{opacity:.85}50%{opacity:1}}@keyframes spin{0%{transform:rotate(0)}65%{transform:rotate(720deg)}100%{transform:rotate(720deg)}}@keyframes mv{0%,60%{transform:translateX(0);opacity:0}64%{opacity:1}78%{transform:translateX(16px);opacity:1}82%,100%{transform:translateX(16px);opacity:0}}@keyframes tk{0%,80%{opacity:0}88%,100%{opacity:1}}@keyframes fl{0%,78%{opacity:.35}86%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.e{animation:none;opacity:1}.h{animation:none}.hand{animation:none}.p{display:none}.t,.l{animation:none;opacity:1}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g fill="#fb923c"><circle class="e e1" cx="14" cy="38" r="4"/><circle class="e e2" cx="14" cy="50" r="4"/><circle class="e e3" cx="14" cy="62" r="4"/></g><g stroke="#9db0c3" stroke-width="3" stroke-linecap="round" fill="none"><path d="M28 48 h8 m-4 -4 l4 4 l-4 4"/></g><g class="h"><g><rect x="40" y="26" width="30" height="44" rx="8" fill="#38bdf8"/><ellipse cx="55" cy="38" rx="9" ry="3.5" fill="#0f1b2d" opacity=".7"/><rect x="46" y="38" width="18" height="16" fill="#0f1b2d" opacity=".5"/><ellipse cx="55" cy="54" rx="9" ry="3.5" fill="#0f1b2d" opacity=".7"/><path d="M48 61 l4 -3 l4 4 l5 -5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><g stroke="#9db0c3" stroke-width="3" stroke-linecap="round" fill="none"><path d="M73 48 h6 m-4 -4 l4 4 l-4 4"/></g><g class="l"><g><rect x="82" y="26" width="30" height="44" rx="8" fill="#2dd4bf"/><path d="M87 52 q4 -5 8 0 t8 0" stroke="#0f1b2d" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M87 60 q4 -5 8 0 t8 0" stroke="#0f1b2d" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="90" y="33" width="14" height="8" rx="2" fill="#0f1b2d" opacity=".55"/></g></g><circle class="p" cx="72" cy="48" r="4.5" fill="#fb923c"/><g><circle cx="76" cy="96" r="13" fill="#fbbf24"/><circle cx="76" cy="96" r="9" fill="#fff7e0"/><path class="hand" d="M76 90 v6" stroke="#451a03" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M76 96 l4 3" stroke="#451a03" stroke-width="2.4" fill="none" stroke-linecap="round"/></g><g class="t"><circle cx="108" cy="22" r="9" fill="#16a34a"/><path d="M103.5 22 l3 3 l5 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>