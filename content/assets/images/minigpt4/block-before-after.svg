<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-label="Where Llama's four changes sit. Of Part 1's five steps, only two change. Step 2 loses its position cards: each token card goes into the blocks on its own. Step 3 swaps the 2017 block for Llama's block. Steps 1, 4, and 5 are unchanged. Inside the block, the 2017 version normalises with LayerNorm, runs attention with 6 query, 6 key, and 6 value cards, adds the result, normalises again, and runs a two-recipe MLP. Llama's block normalises with RMSNorm (change 1), turns the query and key cards by position (change 2), shares 2 key and 2 value cards between the 6 heads (change 4), and uses an MLP with a gate and three recipes (change 3)." style="max-width:100%;height:auto"><rect width="720" height="760" fill="#fff"/><text x="24.0" y="28.0" font-size="14" fill="#111827" text-anchor="start" font-weight="600">Where Llama's four changes sit: only steps 2 and 3 change</text><rect x="21.0" y="60" width="126" height="78" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><circle cx="84.0" cy="60" r="12" fill="#2563eb"/><text x="84.0" y="64.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="84.0" y="92.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Letters to numbers</text><text x="84.0" y="112.0" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="normal">same: my</text><text x="84.0" y="126.0" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="normal">8k pieces</text><path d="M149.0 99 l6 0" stroke="#6b7280" stroke-width="2"/><path d="M159.0 99 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="159.0" y="60" width="126" height="118" rx="12" fill="#f0fdf4" stroke="#7c3aed" stroke-width="2.5"/><circle cx="222.0" cy="60" r="12" fill="#7c3aed"/><text x="222.0" y="64.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text><text