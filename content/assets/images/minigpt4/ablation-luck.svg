<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="Bits per byte for six machines, lower is better. The new block, trained from three random starts, scored between 0.672 and 0.678, a band of luck about 0.007 wide. The version with the old MLP scored 0.675 to 0.680, overlapping the band. Full keys and values, 0.672, and the old normalise, 0.668, are inside or just below the band. The 2017 block, 0.689, and the version with position cards, 0.702, are well above it."><rect width="720" height="380" fill="#fff"/><text x="24.0" y="28.0" font-size="14" fill="#111827" text-anchor="start" font-weight="600">Which change matters? Bits per byte, lower is better</text><text x="24.0" y="48.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Dots are single training runs. The green band is how far the new block moved between three random starts.</text><rect x="352.9" y="64" width="58.4" height="268" fill="#16a34a" opacity="0.12"/><text x="382.1" y="348.0" font-size="10.5" fill="#166534" text-anchor="middle" font-weight="600">the luck band</text><line x1="250.0" y1="64" x2="250.0" y2="332" stroke="#e5e7eb"/><text x="250.0" y="364.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0.66</text><line x1="338.0" y1="64" x2="338.0" y2="332" stroke="#e5e7eb"/><text x="338.0" y="364.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0.67</text><line x1="426.0" y1="64" x2="426.0" y2="332" stroke="#e5e7eb"/><text x="426.0" y="364.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0.68</text><line x1="514.0" y1="64" x2="514.0" y2="332" stroke="#e5e7eb"/><text x="514.0" y="364.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0.69</text><line x1="602.0" y1="64" x2="602.0" y2="332" stroke="#e5e7eb"/><text x="602.0" y="364.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0.70</text><line x1="690.0" y1="64" x2="690.0" y2="332" stroke="#e5e7eb"/><text x="690.0" y="364.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0.71</text><text x="24.0" y="93.0" font-size="12" fill="#111827" text-anchor="start" font-weight="600">2017 block (Part 4)</text><text x="24.0" y="107.0" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal">13.9M numbers</text><rect x="250" y="83.0" width="250.8" height="18" rx="3" fill="#9ca3af" opacity="0.25"/><circle cx="500.8" cy="92.0" r="5" fill="#9ca3af" stroke="#fff" stroke-width="1.5"/><text x="510.8" y="96.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="600">0.6885</text><text x="24.0" y="137.0" font-size="12" fill="#111827" text-anchor="start" font-weight="600">New block, all four changes</text><text x="24.0" y="151.0" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal">12.6M numbers</text><rect x="250" y="127.0" width="136.3" height="18" rx="3" fill="#16a34a" opacity="0.25"/><line x1="352.9" y1="136.0" x2="411.3" y2="136.0" stroke="#16a34a" stroke-width="2"/><circle cx="352.9" cy="136.0" r="5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><circle cx="411.3" cy="136.0" r="5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><circle cx="394.7" cy="136.0" r="5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/><text x="421.3" y="140.0" font-size="11" fill="#16a34a" text-anchor="start" font-weight="600">0.6755  (average of 3)</text><text x="24.0" y="181.0" font-size="12" fill="#111827" text-anchor="start" font-weight="600">… but the old MLP</text><text x="24.0" y="195.0" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal">12.6M numbers</text><rect x="250" y="171.0" width="147.7" height="18" rx="3" fill="#2563eb" opacity="0.25"/><line x1="380.8" y1="180.0" x2="424.5" y2="180.0" stroke="#2563eb" stroke-width="2"/><circle cx="387.7" cy="180.0" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><circle cx="424.5" cy="180.0" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><circle cx="380.8" cy="180.0" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="434.5" y="184.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">0.6768  (average of 3)</text><text x="24.0" y="225.0" font-size="12" fill="#111827" text-anchor="start" font-weight="600">… but full keys and values</text><text x="24.0" y="239.0" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal">13.8M numbers</text><rect x="250" y="215.0" width="106.8" height="18" rx="3" fill="#2563eb" opacity="0.25"/><circle cx="356.8" cy="224.0" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="366.8" y="228.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">0.6721</text><text x="24.0" y="269.0" font-size="12" fill="#111827" text-anchor="start" font-weight="600">… but the old normalise</text><text x="24.0" y="283.0" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal">12.6M numbers</text><rect x="250" y="259.0" width="72.9" height="18" rx="3" fill="#2563eb" opacity="0.25"/><circle cx="322.9" cy="268.0" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/><text x="332.9" y="272.0" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">0.6683</text><text x="24.0" y="313.0" font-size="12" fill="#111827" text-anchor="start" font-weight="600">… but position cards</text><text x="24.0" y="327.0" font-size="10" fill="#9ca3af" text-anchor="start" font-weight="normal">12.7M numbers</text><rect x="250" y="303.0" width="372.3" height="18" rx="3" fill="#dc2626" opacity="0.25"/><circle cx="622.3" cy="312.0" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="632.3" y="316.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600">0.7023</text></svg>
