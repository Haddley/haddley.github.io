<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="The new-block MiniGPT at runtime, for the text The sun was. 1: the text is cut into three pieces, The, sun, and was, with IDs 259, 470, and 120. 2: each ID picks a token embedding; there are no position embeddings, so each hidden state starts as its token embedding. 3: the row goes through six blocks; each is attention, with 6 queries and 2 shared keys and values, turned by position, followed by a gated MLP. 4: the last hidden state now stands for The sun was so far, and is scored against 8,192 output rows, which are the token embeddings themselves. The chances for the next piece are shining 27.9 percent, warm 15.6, happy 13.9, and bright 10.8. 5: a spin of the wheel picks shining, which is added to the text, and the whole thing runs again." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="500" fill="#ffffff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">The new-block MiniGPT at runtime: what happens to “The sun was”</text><text x="40" y="50" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Real numbers from a trained new-block machine. Green numbers mark the four changes from Part 4.</text><rect x="40" y="78" width="112" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db"/><circle cx="40" cy="78" r="10" fill="#111827"/><text x="40" y="82" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="96" y="100" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">the text</text><text x="96" y="128" font-size="14" fill="#111827" text-anchor="middle" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">The sun was</text><line x1="152" y1="118" x2="162.0" y2="118.0" stroke="#6b7280" stroke-width="1.8"/><path d="M170 118 L162.0 122.5 L162.0 113.5 Z" fill="#6b7280"/><rect x="172" 