<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="RoPE turns each query and key card by an angle that grows with its position, here 10 degrees per position. A query at position 7 is turned 70 degrees and a key at position 5 is turned 50 degrees: 20 degrees apart. A query at position 107 is turned 1,070 degrees and a key at position 105, 1,050 degrees: also 20 degrees apart. The match only feels the gap, so both pairs are matched the same way: two positions back."><rect width="720" height="376" fill="#fff"/><text x="24.0" y="30.0" font-size="15" fill="#111827" text-anchor="start" font-weight="600">RoPE: the match only feels the gap between the turns</text><text x="24.0" y="50.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">Each card is turned 10 degrees per position, like a clock hand</text><circle cx="180" cy="206" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="180.0" y1="134.0" x2="180.0" y2="128.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="216.0" y1="143.6" x2="219.0" y2="138.5" stroke="#d1d5db" stroke-width="1.5"/><line x1="242.4" y1="170.0" x2="247.5" y2="167.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="252.0" y1="206.0" x2="258.0" y2="206.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="242.4" y1="242.0" x2="247.5" y2="245.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="216.0" y1="268.4" x2="219.0" y2="273.5" stroke="#d1d5db" stroke-width="1.5"/><line x1="180.0" y1="278.0" x2="180.0" y2="284.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="144.0" y1="268.4" x2="141.0" y2="273.5" stroke="#d1d5db" stroke-width="1.5"/><line x1="117.6" y1="242.0" x2="112.5" y2="245.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="108.0" y1="206.0" x2="102.0" y2="206.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="117.6" y1="170.0" x2="112.5" y2="167.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="144.0" y1="143.6" x2="141.0" y2="138.5" stroke="#d1d5db" stroke-width="1.5"/><path d="M180,206 L226.0,167.4 A60,60 0 0 1 236.4,185.5 Z" fill="#16a34a" opacity="0.25"/><text x="263.1" y="162.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">20° apart</text><line x1="180" y1="206" x2="229.0" y2="164.9" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><line x1="180" y1="206" x2="240.1" y2="184.1" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><circle cx="180" cy="206" r="5" fill="#111827"/><text x="180.0" y="82.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Positions 7 and 5</text><text x="180.0" y="100.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">query at 7: turned 70°,  key at 5: turned 50°</text><circle cx="540" cy="206" r="78" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/><line x1="540.0" y1="134.0" x2="540.0" y2="128.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="576.0" y1="143.6" x2="579.0" y2="138.5" stroke="#d1d5db" stroke-width="1.5"/><line x1="602.4" y1="170.0" x2="607.5" y2="167.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="612.0" y1="206.0" x2="618.0" y2="206.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="602.4" y1="242.0" x2="607.5" y2="245.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="576.0" y1="268.4" x2="579.0" y2="273.5" stroke="#d1d5db" stroke-width="1.5"/><line x1="540.0" y1="278.0" x2="540.0" y2="284.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="504.0" y1="268.4" x2="501.0" y2="273.5" stroke="#d1d5db" stroke-width="1.5"/><line x1="477.6" y1="242.0" x2="472.5" y2="245.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="468.0" y1="206.0" x2="462.0" y2="206.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="477.6" y1="170.0" x2="472.5" y2="167.0" stroke="#d1d5db" stroke-width="1.5"/><line x1="504.0" y1="143.6" x2="501.0" y2="138.5" stroke="#d1d5db" stroke-width="1.5"/><path d="M540,206 L510.0,154.0 A60,60 0 0 1 529.6,146.9 Z" fill="#16a34a" opacity="0.25"/><text x="507.2" y="119.8" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">20° apart</text><line x1="540" y1="206" x2="508.0" y2="150.6" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><line x1="540" y1="206" x2="528.9" y2="143.0" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><circle cx="540" cy="206" r="5" fill="#111827"/><text x="540.0" y="82.0" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">Positions 107 and 105</text><text x="540.0" y="100.0" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">query at 107: turned 1,070°,  key at 105: turned 1,050°</text><line x1="360" y1="126" x2="360" y2="286" stroke="#e5e7eb" stroke-width="1.5"/><line x1="24" y1="314" x2="44" y2="314" stroke="#d97706" stroke-width="4" stroke-linecap="round"/><text x="50.0" y="318.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">the query card's turn</text><line x1="200" y1="314" x2="220" y2="314" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><text x="226.0" y="318.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">the key card's turn</text><text x="24.0" y="346.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">Both pairs are 20 degrees apart, so both are matched the same way: "two positions back".</text><text x="24.0" y="364.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">With position cards, positions 5 and 105 have very different cards, and "two back" must be learned all along the row.</text></svg>
