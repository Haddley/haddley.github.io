<path class="d" style="animation-delay:1.6s" pathLength="1" d="M40,60 H50 M70,60 H80" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.2s"><g><path transform="translate(98,60) scale(1.2)" d="M-22,10 A9,9 0 0 1 -16,-6 A14,14 0 0 1 10,-8 A9,9 0 0 1 12,10 Z" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g></g>
</svg>
