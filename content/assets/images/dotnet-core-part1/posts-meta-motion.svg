<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A REST API service returning JSON to a client</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
