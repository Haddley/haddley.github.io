<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A microphone sending speech to a cloud assistant that answers in a speech bubble: the Google Assistant API</title><style>@keyframes fade{0%{opacity:0}18.56%,53.03%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}18.56%,53.03%,100%{opacity:1;transform:scale(1)}}
