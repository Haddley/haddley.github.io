<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" role="img"><title>Our AI Agent and Google's AI Overview discuss what happens when you read one section of the statute and stop</title><rect width="640" height="860" fill="#ffffff"/><rect x="10" y="20" width="620" height="80" rx="12" fill="#0f1b2d"/><text x="320.0" y="42" font-size="13" font-weight="700" fill="#5be0cf" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" letter-spacing="1">TONIGHT'S TALK</text><text x="320.0" y="62" font-size="15" fill="#e6edf5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Our AI Agent and Google's AI Overview discuss what happens</text><text x="320.0" y="82" font-size="15" fill="#e6edf5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">when you read one section of the statute and stop</text><text x="320.0" y="132" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Google arrives with a list of source links. Our AI Agent arrives with</text><text x="320.0" y="152" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">a section number.</text><circle cx="32" cy="194" r="20" fill="#ca8a04"/><text x="32" y="201" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">G</text><rect x="62" y="172" width="380" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,186 52,196 61,204" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="187" width="3" height="16" fill="#f1f5f9"/><text x="76" y="198" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">First, I asked a follow-up question. County?</text><text x="76" y="218" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Probation? Nobody else did that.</text><circle cx="608" cy="270" r="20" fill="#16a34a"/><polygon points="608.0,257.0 620.4,266.0 615.6,280.5 600.4,280.5 595.6,266.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="248" width="380" height="82" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,262 588,272 579,280" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="263" width="3" height="16" fill="#dcfce7"/><text x="212" y="274" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">You did, and it was a good one. But you told this</text><text x="212" y="294" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">person “a mandatory minimum sentence of one year</text><text x="212" y="314" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">of incarceration”.</text><circle cx="32" cy="366" r="20" fill="#ca8a04"/><text x="32" y="373" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">G</text><rect x="62" y="344" width="380" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,358 52,368 61,376" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="359" width="3" height="16" fill="#f1f5f9"/><text x="76" y="370" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">That's § 169A.275, subdivision 4, the fifth-</text><text x="76" y="390" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">offence section.</text><circle cx="608" cy="442" r="20" fill="#16a34a"/><polygon points="608.0,429.0 620.4,438.0 615.6,452.5 600.4,452.5 595.6,438.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="420" width="380" height="102" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,434 588,444 579,452" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="435" width="3" height="16" fill="#dcfce7"/><text x="212" y="446" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">It starts “Unless the court commits the person to</text><text x="212" y="466" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">the custody of the commissioner of corrections as</text><text x="212" y="486" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">provided in section 169A.276”. And that section</text><text x="212" y="506" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">says “not less than three years”.</text><text x="320.0" y="550" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">A pause. Google scrolls.</text><circle cx="32" cy="592" r="20" fill="#ca8a04"/><text x="32" y="599" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">G</text><rect x="62" y="570" width="380" height="42" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,584 52,594 61,602" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="585" width="3" height="16" fill="#f1f5f9"/><text x="76" y="596" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">So I read one section and stopped.</text><circle cx="608" cy="648" r="20" fill="#16a34a"/><polygon points="608.0,635.0 620.4,644.0 615.6,658.5 600.4,658.5 595.6,644.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="626" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,640 588,650 579,658" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="641" width="3" height="16" fill="#dcfce7"/><text x="212" y="652" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">A person deciding whether to plead hears one year</text><text x="212" y="672" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">when the floor is three.</text><circle cx="32" cy="724" r="20" fill="#ca8a04"/><text x="32" y="731" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">G</text><rect x="62" y="702" width="380" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,716 52,726 61,734" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="717" width="3" height="16" fill="#f1f5f9"/><text x="76" y="728" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">I also said “exactly 30 days”, and that they can</text><text x="76" y="748" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">“no longer challenge” the revocation.</text><circle cx="608" cy="800" r="20" fill="#16a34a"/><polygon points="608.0,787.0 620.4,796.0 615.6,810.5 600.4,810.5 595.6,796.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="778" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,792 588,802 579,810" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="793" width="3" height="16" fill="#dcfce7"/><text x="212" y="804" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">It's 60 (§ 169A.53), and written administrative</text><text x="212" y="824" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">review is still open.</text></svg>