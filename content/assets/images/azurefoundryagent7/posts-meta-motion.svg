<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><style>@keyframes full{0%{stroke-dashoffset:1;fill-opacity:0}30%{stroke-dashoffset:0;fill-opacity:.12}90%{opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}@keyframes weak{0%,30%{transform:scale(0);opacity:1}54%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}@keyframes dent{0%,56%{opacity:0}60%,90%{opacity:1}97%,100%{opacity:0}}@keyframes ring{0%,58%{opacity:0;transform:scale(1)}60%{opacity:.9;transform:scale(1)}78%,100%{opacity:0;transform:scale(3.2)}}.full{stroke-dasharray:1;animation:full 7s ease-in-out infinite}.weak{transform-origin:60px 60px;animation:weak 7s ease-out infinite}.dent{animation:dent 7s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 7s ease-out infinite}@media (prefers-reduced-motion: reduce){.full,.weak,.dent,.ring{animation:none}.dent,.ring{opacity:0}}</style>
  <title>A full pentagon of correct answers over a weaker, dented one</title>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>
  <polygon points="60,16 101.8,46.4 85.8,95.6 34.2,95.6 18.2,46.4" fill="#17304a" stroke="#5bb4ea" stroke-width="2"/>
  <polygon points="60,38 80.9,53.2 72.9,77.8 47.1,77.8 39.1,53.2" fill="none" stroke="#2f5a80" stroke-width="1.5"/>
  <polygon class="weak" points="60,16 80.9,53.2 82,90.3 51,72.5 28.6,49.8" fill="#ff8ac4" fill-opacity="0.3" stroke="#ff8ac4" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <polygon class="full" pathLength="1" points="60,16 101.8,46.4 85.8,95.6 34.2,95.6 18.2,46.4" fill="#5be0cf" fill-opacity="0.12" stroke="#5be0cf" stroke-width="4" stroke-linejoin="round"/>
<circle class="dent" cx="51" cy="72.5" r="3.4" fill="#ff8ac4" opacity="0"/><circle class="ring" cx="51" cy="72.5" r="3.4" fill="none" stroke="#ff8ac4" stroke-width="1.5" opacity="0"/>
</svg>
