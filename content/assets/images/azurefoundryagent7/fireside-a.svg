<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 784" width="640" height="784" role="img"><title>Our AI Agent and DeepSeek with search discuss who read the law and who read the web</title><rect width="640" height="784" fill="#ffffff"/><rect x="10" y="20" width="620" height="80" rx="12" fill="#0f1b2d"/><text x="320.0" y="42" font-size="13" font-weight="700" fill="#5be0cf" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" letter-spacing="1">TONIGHT'S TALK</text><text x="320.0" y="62" font-size="15" fill="#e6edf5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Our AI Agent and DeepSeek with search discuss who read the law</text><text x="320.0" y="82" font-size="15" fill="#e6edf5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">and who read the web</text><text x="320.0" y="132" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">Both take their seats. DeepSeek has 54 search results. Our AI Agent</text><text x="320.0" y="152" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">has a statute book.</text><circle cx="32" cy="194" r="20" fill="#7c3aed"/><text x="32" y="201" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">D</text><rect x="62" y="172" width="380" height="82" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,186 52,196 61,204" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="187" width="3" height="16" fill="#f1f5f9"/><text x="76" y="198" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">I said the felony carries “a mandatory minimum of</text><text x="76" y="218" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">3 years — but that can be stayed to probation”.</text><text x="76" y="238" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Right, in all three cases.</text><circle cx="608" cy="290" r="20" fill="#16a34a"/><polygon points="608.0,277.0 620.4,286.0 615.6,300.5 600.4,300.5 595.6,286.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="268" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,282 588,292 579,300" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="283" width="3" height="16" fill="#dcfce7"/><text x="212" y="294" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">It is right, and I'll say so. That's § 169A.276.</text><text x="212" y="314" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Now, how long is this person's licence gone?</text><circle cx="32" cy="366" r="20" fill="#7c3aed"/><text x="32" y="373" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">D</text><rect x="62" y="344" width="380" height="42" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,358 52,368 61,376" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="359" width="3" height="16" fill="#f1f5f9"/><text x="76" y="370" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">“License revocation of at least 4 years.”</text><circle cx="608" cy="422" r="20" fill="#16a34a"/><polygon points="608.0,409.0 620.4,418.0 615.6,432.5 600.4,432.5 595.6,418.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="400" width="380" height="82" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,414 588,424 579,432" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="415" width="3" height="16" fill="#dcfce7"/><text x="212" y="426" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">The statute says until treatment is done and an</text><text x="212" y="446" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">ignition interlock period of at least ten years</text><text x="212" y="466" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">(§ 171.178).</text><circle cx="32" cy="518" r="20" fill="#7c3aed"/><text x="32" y="525" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">D</text><rect x="62" y="496" width="380" height="62" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><polygon points="61,510 52,520 61,528" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="61" y="511" width="3" height="16" fill="#f1f5f9"/><text x="76" y="522" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Four, ten. Same neighbourhood. And the deadline</text><text x="76" y="542" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">is “often 30 days”.</text><circle cx="608" cy="594" r="20" fill="#16a34a"/><polygon points="608.0,581.0 620.4,590.0 615.6,604.5 600.4,604.5 595.6,590.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="572" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,586 588,596 579,604" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="587" width="3" height="16" fill="#dcfce7"/><text x="212" y="598" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Sixty (§ 169A.53). Thirty is what some web pages</text><text x="212" y="618" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">say.</text><text x="320.0" y="662" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">DeepSeek takes about 6 minutes to reply. Our AI Agent has already</text><text x="320.0" y="682" font-size="13" font-style="italic" fill="#64748b" text-anchor="middle" font-family="Helvetica, Arial, sans-serif">finished.</text><circle cx="608" cy="724" r="20" fill="#16a34a"/><polygon points="608.0,711.0 620.4,720.0 615.6,734.5 600.4,734.5 595.6,720.0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><rect x="198" y="702" width="380" height="62" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><polygon points="579,716 588,726 579,734" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><rect x="576" y="717" width="3" height="16" fill="#dcfce7"/><text x="212" y="728" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">Someone wrote the sections down once. I look them</text><text x="212" y="748" font-size="15" fill="#0f1b2d" font-family="Helvetica, Arial, sans-serif">up.</text></svg>