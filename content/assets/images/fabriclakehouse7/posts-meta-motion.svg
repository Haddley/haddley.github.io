<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Two layers joined by a connector: an agent layer on top of a data layer, with a tick</title><style>.d{animation:df 6s ease-in-out infinite}.l{opacity:0;animation:lf 6s ease-out infinite}.a{opacity:0;animation:af 6s ease-out infinite}.t{opacity:0;animation:tf 6s ease-out infinite}@keyframes df{0%,100%{opacity:.85}50%{opacity:1}}@keyframes lf{0%,20%{opacity:0}35%,100%{opacity:1}}@keyframes af{0%,35%{opacity:0}55%,100%{opacity:1}}@keyframes tf{0%,70%{opacity:0}82%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.d{animation:none}.l,.a,.t{animation:none;opacity:1}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="d"><rect x="18" y="68" width="84" height="30" rx="8" fill="#38bdf8"/><g stroke="#0f1b2d" stroke-width="1.8" opacity=".6"><path d="M18 83 h84 M46 68 v30 M74 68 v30"/></g></g><g class="l"><rect x="56" y="55" width="8" height="13" fill="#9db0c3"/><circle cx="60" cy="61" r="3.2" fill="#fb923c"/></g><g class="a"><rect x="18" y="22" width="84" height="33" rx="8" fill="#a78bfa"/><g fill="#0f1b2d"><circle cx="48" cy="35" r="3.4"/><circle cx="72" cy="35" r="3.4"/></g><path d="M50 45 h20" stroke="#0f1b2d" stroke-width="3" stroke-linecap="round"/></g><g class="t"><circle cx="100" cy="24" r="9" fill="#16a34a"/><path d="M95.5 24 l3 3 l5 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>