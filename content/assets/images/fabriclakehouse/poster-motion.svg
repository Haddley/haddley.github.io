<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A CSV file is loaded into a Lakehouse table and charted as monthly revenue bars with a tick</title><style>.b{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow 8s ease-out infinite}.b1{animation-delay:1.2s}.b2{animation-delay:1.8s}.b3{animation-delay:2.4s}.b4{animation-delay:3s}.d{animation:fadeIn 8s ease-out infinite}.t{opacity:0;animation:tk 8s ease-out infinite}@keyframes grow{0%{transform:scaleY(0)}10%{transform:scaleY(1)}90%{transform:scaleY(1)}100%{transform:scaleY(1)}}@keyframes tk{0%,45%{opacity:0}55%,92%{opacity:1}100%{opacity:1}}@keyframes fadeIn{0%{opacity:.35}12%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){.b{animation:none;transform:none}.t,.d{animation:none;opacity:1}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="d"><g><rect x="10" y="22" width="38" height="52" rx="6" fill="#e6edf5"/><rect x="16" y="32" width="26" height="4" rx="2" fill="#2dd4bf"/><rect x="16" y="42" width="26" height="3" rx="1.5" fill="#9db0c3"/><rect x="16" y="50" width="26" height="3" rx="1.5" fill="#9db0c3"/><rect x="16" y="58" width="18" height="3" rx="1.5" fill="#9db0c3"/><text x="29" y="90" font-size="11" font-weight="700" text-anchor="middle" fill="#9db0c3" font-family="Arial,Helvetica,sans-serif">CSV</text></g><g stroke="#9db0c3" stroke-width="3" stroke-linecap="round" fill="none"><path d="M51 48 h8 m-4 -4 l4 4 l-4 4"/></g></g><line x1="58" y1="84" x2="112" y2="84" stroke="#9db0c3" stroke-width="2" stroke-linecap="round"/><rect class="b b1" x="62" y="26" width="9" height="58" rx="2" fill="#fb923c"/><rect class="b b2" x="74" y="38" width="9" height="46" rx="2" fill="#fb923c"/><rect class="b b3" x="86" y="46" width="9" height="38" rx="2" fill="#fb923c"/><rect class="b b4" x="98" y="58" width="9" height="26" rx="2" fill="#fb923c"/><g class="t"><circle cx="100" cy="24" r="9" fill="#16a34a"/><path d="M95.5 24 l3 3 l5 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>