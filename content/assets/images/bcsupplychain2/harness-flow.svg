<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" font-family="Arial, Helvetica, sans-serif"><title>Animated diagram: how DeepSeek Harness, a hosted AI model, the wiki, Microsoft Learn and the Business Central connection work together, in six steps</title><style>.a{animation-duration:19.200000000000003s;animation-iteration-count:infinite;animation-timing-function:linear;opacity:0}@keyframes st{0%{opacity:0}2%{opacity:1}14.67%{opacity:1}16.67%{opacity:0}100%{opacity:0}}.a{animation-name:st}.d0{animation-delay:0.0s}.d1{animation-delay:3.2s}.d2{animation-delay:6.4s}.d3{animation-delay:9.600000000000001s}.d4{animation-delay:12.8s}.d5{animation-delay:16.0s}.flow{stroke-dasharray:7 7}.stat{display:none}@media (prefers-reduced-motion:reduce){.a{animation:none!important;opacity:1}.cap{display:none}.stat{display:block}}</style><rect width="960" height="530" rx="20" fill="#0f1b2d"/><rect x="200" y="14" width="330" height="380" rx="14" fill="none" stroke="#2a3f58" stroke-width="2" stroke-dasharray="6 5"/><text x="216" y="36" font-size="12" font-weight="700" fill="#9db0c3">YOUR COMPUTER</text><rect x="580" y="14" width="360" height="380" rx="14" fill="none" stroke="#2a3f58" stroke-width="2" stroke-dasharray="6 5"/><text x="596" y="36" font-size="12" font-weight="700" fill="#9db0c3">THE CLOUD</text><circle cx="80" cy="190" r="22" fill="#e6eef7"/><path d="M42 252 a38 38 0 0 1 76 0 z" fill="#e6eef7"/><text x="80" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#e6eef7">You</text><rect x="225" y="150" width="280" height="90" rx="10" fill="#16273d" stroke="#fbbf24" stroke-width="2"/><text x="365.0" y="193.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">DeepSeek Harness</text><text x="365.0" y="211.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">runs the conversation and the tools</text><rect x="225" y="300" width="280" height="70" rx="10" fill="#16273d" stroke="#4ade80" stroke-width="2"/><text x="365.0" y="333.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">The wiki</text><text x="365.0" y="351.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">notes, procedures, hand-over rules</text><rect x="610" y="50" width="300" height="64" rx="10" fill="#16273d" stroke="#5bb4ea" stroke-width="2"/><text x="760.0" y="80.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Hosted AI model</text><text x="760.0" y="98.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">DeepSeek V4 Flash decides what to do next</text><rect x="610" y="130" width="300" height="56" rx="10" fill="#16273d" stroke="#8b9eb3" stroke-width="2"/><text x="760.0" y="156.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Microsoft Learn</text><text x="760.0" y="174.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">documentation search</text><rect x="610" y="206" width="300" height="70" rx="10" fill="#16273d" stroke="#5bb4ea" stroke-width="2"/><text x="760.0" y="239.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Business Central connection</text><text x="760.0" y="257.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">Microsoft's MCP server and your configuration</text><rect x="610" y="306" width="300" height="70" rx="10" fill="#16273d" stroke="#5bb4ea" stroke-width="2"/><text x="760.0" y="339.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Business Central</text><text x="760.0" y="357.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">practice company, the evidence</text><line x1="142" y1="200" x2="225" y2="200" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="505" y1="175" x2="610" y2="85" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="505" y1="195" x2="610" y2="160" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="505" y1="215" x2="610" y2="240" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="760" y1="276" x2="760" y2="306" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="365" y1="240" x2="365" y2="300" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line class="a d0 flow" x1="142" y1="200" x2="225" y2="200" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d0"><circle cx="183" cy="176" r="13" fill="#fbbf24"/><text x="183" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">1</text></g><line class="a d1 flow" x1="505" y1="175" x2="610" y2="85" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d1"><circle cx="555" cy="112" r="13" fill="#fbbf24"/><text x="555" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">2</text></g><line class="a d2 flow" x1="610" y1="95" x2="505" y2="180" stroke="#5bb4ea" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d2"><circle cx="560" cy="128" r="13" fill="#fbbf24"/><text x="560" y="133" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">3</text></g><line class="a d3 flow" x1="505" y1="215" x2="610" y2="240" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><line class="a d3 flow" x1="760" y1="276" x2="760" y2="306" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d3"><circle cx="555" cy="242" r="13" fill="#fbbf24"/><text x="555" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">4</text></g><line class="a d4 flow" x1="610" y1="260" x2="505" y2="222" stroke="#5bb4ea" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><line class="a d4 flow" x1="225" y1="215" x2="142" y2="225" stroke="#5bb4ea" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d4"><circle cx="555" cy="205" r="13" fill="#fbbf24"/><text x="555" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">5</text></g><line class="a d5 flow" x1="365" y1="240" x2="365" y2="300" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d5"><circle cx="395" cy="270" r="13" fill="#fbbf24"/><text x="395" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">6</text></g><g class="cap a d0"><text x="480" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">1. You type a short request</text><text x="480" y="476" text-anchor="middle" font-size="14" fill="#9db0c3">The harness is the program on your computer that holds the conversation.</text></g><g class="cap a d1"><text x="480" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">2. The harness asks the hosted AI model</text><text x="480" y="476" text-anchor="middle" font-size="14" fill="#9db0c3">The model reads the conversation and decides what to do next.</text></g><g class="cap a d2"><text x="480" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">3. The model asks for a tool</text><text x="480" y="476" text-anchor="middle" font-size="14" fill="#9db0c3">For example: look up the customer, or search Microsoft Learn.</text></g><g class="cap a d3"><text x="480" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">4. The harness runs the tool</text><text x="480" y="476" text-anchor="middle" font-size="14" fill="#9db0c3">Business Central's connection lets it read, and create drafts, only as the configuration allows.</text></g><g class="cap a d4"><text x="480" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">5. Results come back</text><text x="480" y="476" text-anchor="middle" font-size="14" fill="#9db0c3">The model reads them, and asks you only what it could not find.</text></g><g class="cap a d5"><text x="480" y="450" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">6. The AI writes down what it learned</text><text x="480" y="476" text-anchor="middle" font-size="14" fill="#9db0c3">Notes go to the wiki. The draft order is waiting in Business Central.</text></g><g class="stat"><text x="40" y="420" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">1. You type a short request</tspan><tspan fill="#9db0c3"> The harness is the program on your computer that holds the conversation.</tspan></text><text x="40" y="437" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">2. The harness asks the hosted AI model</tspan><tspan fill="#9db0c3"> The model reads the conversation and decides what to do next.</tspan></text><text x="40" y="454" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">3. The model asks for a tool</tspan><tspan fill="#9db0c3"> For example: look up the customer, or search Microsoft Learn.</tspan></text><text x="40" y="471" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">4. The harness runs the tool</tspan><tspan fill="#9db0c3"> Business Central's connection lets it read, and create drafts, only as the configuration allows.</tspan></text><text x="40" y="488" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">5. Results come back</tspan><tspan fill="#9db0c3"> The model reads them, and asks you only what it could not find.</tspan></text><text x="40" y="505" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">6. The AI writes down what it learned</tspan><tspan fill="#9db0c3"> Notes go to the wiki. The draft order is waiting in Business Central.</tspan></text></g></svg>