<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A configuration list: rows appear, three get a green tick as editable, and the last row locks as read only</title>
<style>
.a{animation-duration:4.5s;animation-timing-function:ease-out;animation-fill-mode:both;animation-iteration-count:1}
.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}
.t1{animation-name:t1;transform-box:fill-box;transform-origin:center}
.t2{animation-name:t2;transform-box:fill-box;transform-origin:center}
.t3{animation-name:t3;transform-box:fill-box;transform-origin:center}
.k4{animation-name:k4;transform-box:fill-box;transform-origin:center}
@keyframes r1{0%,4%{opacity:0;transform:translateX(-6px)}14%,100%{opacity:1;transform:none}}
@keyframes r2{0%,12%{opacity:0;transform:translateX(-6px)}22%,100%{opacity:1;transform:none}}
@keyframes r3{0%,20%{opacity:0;transform:translateX(-6px)}30%,100%{opacity:1;transform:none}}
@keyframes r4{0%,28%{opacity:0;transform:translateX(-6px)}38%,100%{opacity:1;transform:none}}
@keyframes t1{0%,40%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.15)}56%,100%{opacity:1;transform:scale(1)}}
@keyframes t2{0%,52%{opacity:0;transform:scale(.4)}62%{opacity:1;transform:scale(1.15)}68%,100%{opacity:1;transform:scale(1)}}
@keyframes t3{0%,64%{opacity:0;transform:scale(.4)}74%{opacity:1;transform:scale(1.15)}80%,100%{opacity:1;transform:scale(1)}}
@keyframes k4{0%,76%{opacity:0;transform:scale(.4)}88%{opacity:1;transform:scale(1.15)}94%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style>
<rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="18" y="20" width="84" height="80" rx="8" fill="#e0f2fe"/>
<g class="a r1"><rect x="26" y="30" width="46" height="6" rx="3" fill="#7dd3fc"/></g>
<g class="a t1"><circle cx="86" cy="33" r="7" fill="#16a34a"/><path d="M82.5 33 l2.5 3 l5 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="a r2"><rect x="26" y="48" width="38" height="6" rx="3" fill="#7dd3fc"/></g>
<g class="a t2"><circle cx="86" cy="51" r="7" fill="#16a34a"/><path d="M82.5 51 l2.5 3 l5 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="a r3"><rect x="26" y="66" width="50" height="6" rx="3" fill="#7dd3fc"/></g>
<g class="a t3"><circle cx="86" cy="69" r="7" fill="#16a34a"/><path d="M82.5 69 l2.5 3 l5 -6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="a r4"><rect x="26" y="84" width="42" height="6" rx="3" fill="#94a3b8"/></g>
<g class="a k4"><circle cx="86" cy="87" r="7" fill="#94a3b8"/><rect x="82.5" y="87" width="7" height="5" rx="1" fill="#0f1b2d"/><path d="M84 87 v-2 a2.5 2.5 0 0 1 5 0 v2" fill="none" stroke="#0f1b2d" stroke-width="1.6"/></g>
</svg>
