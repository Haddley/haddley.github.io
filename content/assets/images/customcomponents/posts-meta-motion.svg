<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A library of reusable Power Apps components used again and again</title><style>@keyframes fade{0%{opacity:0}15.51%,44.3%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}26.58%,44.3%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15.51%,44.3%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7.9s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7.9s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7.9s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><rect x="10" y="22" width="28" height="22" rx="4" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:0.4s"><rect x="46" y="22" width="28" height="22" rx="4" fill="#ffb43a"/></g>
<g class="p" style="animation-delay:0.8s"><rect x="82" y="22" width="28" height="22" rx="4" fill="#2f9e4a"/></g>
<g class="f" style="animation-delay:1.6s"><path d="M24,46 V62 M60,46 V62 M96,46 V62" stroke="#c9d3dd" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<g class="p" style="animation-delay:2.2s"><rect x="10" y="66" width="28" height="22" rx="4" fill="#5bb4ea"/><rect x="46" y="66" width="28" height="22" rx="4" fill="#ffb43a"/><rect x="82" y="66" width="28" height="22" rx="4" fill="#2f9e4a"/></g>
<g class="p" style="animation-delay:2.9s"><rect x="10" y="94" width="28" height="12" rx="4" fill="#5bb4ea"/></g>
</svg>
