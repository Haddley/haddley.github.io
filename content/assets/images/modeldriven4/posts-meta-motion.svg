<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A Power Fx formula behind a Clone button on a model-driven form command bar</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="6" y="24" width="108" height="72" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/></g>
<g class="p" style="animation-delay:0.4s"><rect x="6" y="24" width="108" height="16" rx="5" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:1.0s"><rect x="14" y="28" width="22" height="8" rx="3" fill="#0f1b2d"/></g>
<g class="p" style="animation-delay:1.4s"><rect x="40" y="28" width="22" height="8" rx="3" fill="#ffb43a"/></g>
<path class="d" style="animation-delay:1.8s" pathLength="1" d="M16,56 H100 M16,68 H80" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.5s"><g><rect x="70" y="76" width="34" height="14" rx="4" fill="#0f1b2d"/><text x="87" y="86" text-anchor="middle" font-size="9" fill="#ffb43a" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">fx</text></g></g>
</svg>
