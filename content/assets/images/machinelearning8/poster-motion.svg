<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>An eye watching a hand signal beside a baseball: stealing baseball signs</title><style>@keyframes fade{0%{opacity:0}20.42%,58.33%,100%{opacity:1}}
