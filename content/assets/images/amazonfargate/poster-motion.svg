<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A coin dropping onto running containers with a tick: Fargate pay-as-you-go</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes coin{0%,10%{transform:translateY(-14px);opacity:0}50%,100%{transform:translateY(0);opacity:1}}.coin{animation:coin 3.5s ease-in both}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><g class="p" style="animation-delay:0.0s"><rect x="30" y="50" width="16" height="12" rx="3" fill="#1e3a5a" stroke="#f59e0b" stroke-width="2"/><path d="M35 52 v8 M40 52 v8" stroke="#f59e0b" stroke-width="1.5"/></g><g class="p" style="animation-delay:0.3s"><rect x="54" y="50" width="16" height="12" rx="3" fill="#1e3a5a" stroke="#f59e0b" stroke-width="2"/><path d="M59 52 v8 M64 52 v8" stroke="#f59e0b" stroke-width="1.5"/></g><g class="p" style="animation-delay:0.6s"><rect x="78" y="50" width="16" height="12" rx="3" fill="#1e3a5a" stroke="#f59e0b" stroke-width="2"/><path d="M83 52 v8 M88 52 v8" stroke="#f59e0b" stroke-width="1.5"/></g><path d="M22 70 H98" stroke="#475569" stroke-width="3"/><g class="coin"><circle cx="60" cy="22" r="10" fill="#fbbf24"/><text x="60" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#0f1b2d" font-family="system-ui,sans-serif">$</text></g><g class="p" style="animation-delay:1.6s"><circle cx="60" cy="86" r="10" fill="#16a34a"/><path d="M55 86 l3.5 4 l6.5 -8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></svg>