<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"><style>@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}@keyframes shine{0%,52%{transform:translateX(-80px)}100%{transform:translateX(200px)}}.tw{animation:tw 3.4s ease-in-out infinite}.shine{animation:shine 9s ease-in-out infinite;animation-delay:-7s}@media (prefers-reduced-motion: reduce){.tw,.shine{animation:none}.shine-g{display:none}}</style><defs><clipPath id="tile-clip"><rect width="120" height="120" rx="22"/></clipPath><linearGradient id="tile-shine" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <rect width="120" height="120" rx="22" fill="#1a2b4b"/>
  <!-- Supervisor -->
  <circle cx="60" cy="34" r="13" fill="#ffffff" opacity="0.92"/>
  <!-- Three sub-agents, each inside its own boundary -->
  <g class="tw" style="animation-delay:0.93s"><circle cx="30" cy="84" r="10" fill="#4fc3f7" opacity="0.85"/></g>
  <g class="tw" style="animation-delay:1.36s"><circle cx="60" cy="90" r="10" fill="#80deea" opacity="0.85"/></g>
  <g class="tw" style="animation-delay:1.79s"><circle cx="90" cy="84" r="10" fill="#4fc3f7" opacity="0.85"/></g>
  <circle cx="30" cy="84" r="15" fill="none" stroke="#80deea" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="60" cy="90" r="15" fill="none" stroke="#80deea" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="90" cy="84" r="15" fill="none" stroke="#80deea" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <!-- Delegation lines -->
  <line x1="52" y1="45" x2="35" y2="70" stroke="#80deea" stroke-width="2.5" opacity="0.8"/>
  <line x1="60" y1="47" x2="60" y2="73" stroke="#80deea" stroke-width="2.5" opacity="0.8"/>
  <line x1="68" y1="45" x2="85" y2="70" stroke="#80deea" stroke-width="2.5" opacity="0.8"/>
<g class="shine-g" clip-path="url(#tile-clip)"><g transform="rotate(20 60 60)"><rect class="shine" x="0" y="-30" width="38" height="180" fill="url(#tile-shine)"/></g></g></svg>