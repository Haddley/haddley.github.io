  <circle cx="60" cy="90" r="15" fill="none" stroke="#80deea" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="90" cy="84" r="15" fill="none" stroke="#80deea" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <!-- Delegation lines -->
