<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A customised quote template listing items with start date, term and quantity</title><style>@keyframes fade{0%{opacity:0}15.31%,43.75%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}26.25%,43.75%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15.31%,43.75%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 8s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 8s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 8s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="f" style="animation-delay:0s"><rect x="8" y="16" width="104" height="88" rx="5" fill="#1c2a3d" stroke="#ffb43a" stroke-width="1.5"/></g>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M16,30 H56" stroke="#ffb43a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.0s"><rect x="16" y="42" width="88" height="12" rx="3" fill="#ffb43a"/></g>
<path class="d" style="animation-delay:1.6s" pathLength="1" d="M24,48 H36 M48,48 H58 M70,48 H78 M90,48 H96" stroke="#0f1b2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:2.2s" pathLength="1" d="M24,66 H36 M48,66 H58 M70,66 H78 M90,66 H96 M24,80 H36 M48,80 H58 M70,80 H78 M90,80 H96" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:3.0s"><g><circle cx="98" cy="26" r="6" fill="#2f9e4a"/><path d="M95.3,26 L97.4,28.4 L101.0,23.6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
</svg>
