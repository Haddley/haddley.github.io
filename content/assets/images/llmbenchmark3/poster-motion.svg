<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A grid of exam questions: most turn green because most models get them right, and a few stay amber because most models miss them</title><style>@keyframes r0{0%,4%{transform:scale(.3);opacity:0}14%,88%{transform:scale(1);opacity:1}100%{opacity:0}}@keyframes r1{0%,11%{transform:scale(.3);opacity:0}21%,88%{transform:scale(1);opacity:1}100%{opacity:0}}@keyframes r2{0%,18%{transform:scale(.3);opacity:0}28%,88%{transform:scale(1);opacity:1}100%{opacity:0}}@keyframes r3{0%,25%{transform:scale(.3);opacity:0}35%,88%{transform:scale(1);opacity:1}100%{opacity:0}}@keyframes r4{0%,32%{transform:scale(.3);opacity:0}42%,88%{transform:scale(1);opacity:1}100%{opacity:0}}@keyframes am{0%,52%{transform:scale(.3);opacity:0}64%{transform:scale(1.18);opacity:1}72%,88%{transform:scale(1);opacity:1}100%{opacity:0}}.r0{animation:r0 6s ease-out infinite}.r1{animation:r1 6s ease-out infinite}.r2{animation:r2 6s ease-out infinite}.r3{animation:r3 6s ease-out infinite}.r4{animation:r4 6s ease-out infinite}.am{animation:am 6s ease-out infinite}.q{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){.q{animation:none}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect class="q r0" x="19" y="12" width="11" height="11" rx="3" fill="#16a34a"/><rect class="q r0" x="33" y="12" width="11" height="11" rx="3" fill="#16a34a"/><rect class="q r0" x="47" y="12" width="11" height="11" rx="3" fill="#16a34a"/><rect class="q am" x="61" y="12" width="11" height="11" rx="3" fill="#f59e0b"/><rect class="q r0" x="75" y="12" width="11" height="11" rx="3" fill="#16a34a"/><rect class="q r0" x="89" y="12" width="11" height="11" rx="3" fill="#16a34a"/><rect class="q r1" x="19" y="26" width="11" height="11" rx="3" fill="#16a34a"/><rect class="q r1" x="33" y="26" width="11" height="11" rx="3" fill="#16a34a"/><rect class="q r1" x="47" y="26" width="11" height="11" rx="3