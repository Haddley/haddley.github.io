<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A web page listing todo items, each with a red delete button: Spring MVC and a Thymeleaf template</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="14" y="22" width="92" height="76" rx="6" fill="#16263b" stroke="#5bb4ea" stroke-width="2"/><rect x="14" y="22" width="92" height="9" rx="4" fill="#2a5a73"/><g class="p" style="animation-delay:0.0s"><rect x="22" y="38" width="52" height="12" rx="4" fill="#1e3a5a" stroke="#7dd3fc" stroke-width="1.8"/><rect x="82" y="38" width="16" height="12" rx="4" fill="#ef4444"/><path d="M87 41.5 l6 5 M93 41.5 l-6 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g><g class="p" style="animation-delay:0.3s"><rect x="22" y="56" width="52" height="12" rx="4" fill="#1e3a5a" stroke="#7dd3fc" stroke-width="1.8"/><rect x="82" y="56" width="16" height="12" rx="4" fill="#ef4444"/><path d="M87 59.5 l6 5 M93 59.5 l-6 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g><g class="p" style="animation-delay:0.6s"><rect x="22" y="74" width="52" height="12" rx="4" fill="#1e3a5a" stroke="#7dd3fc" stroke-width="1.8"/><rect x="82" y="74" width="16" height="12" rx="4" fill="#ef4444"/><path d="M87 77.5 l6 5 M93 77.5 l-6 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></g></svg>