<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A React app window sending itself up to a cloud: publishing to Azure Static Web Apps</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="14" y="30" width="62" height="50" rx="6" fill="#16263b" stroke="#5bb4ea" stroke-width="2"/><rect x="14" y="30" width="62" height="8" rx="4" fill="#2a5a73"/><g fill="none" stroke="#61dafb" stroke-width="1.8"><ellipse cx="45" cy="59" rx="14" ry="5.5"/><ellipse cx="45" cy="59" rx="14" ry="5.5" transform="rotate(60 45 59)"/><ellipse cx="45" cy="59" rx="14" ry="5.5" transform="rotate(120 45 59)"/></g><circle cx="45" cy="59" r="2.4" fill="#61dafb"/><path class="d" style="animation-delay:0.4s" pathLength="1" d="M80 60 H86" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="p" style="animation-delay:1.0s"><g fill="#bae6fd"><circle cx="76" cy="36" r="9"/><circle cx="90" cy="30" r="13"/><circle cx="104" cy="37" r="8"/><rect x="66" y="36" width="46" height="11" rx="5"/></g></g></svg>