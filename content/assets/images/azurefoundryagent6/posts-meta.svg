<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><style>@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}@keyframes shine{0%,52%{transform:translateX(-80px)}100%{transform:translateX(200px)}}.tw{animation:tw 3.4s ease-in-out infinite}.shine{animation:shine 9s ease-in-out infinite;animation-delay:-2s}@media (prefers-reduced-motion: reduce){.tw,.shine{animation:none}.shine-g{display:none}}</style><defs><clipPath id="tile-clip"><rect width="120" height="120" rx="22"/></clipPath><linearGradient id="tile-shine" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <title>A stack of documents feeding a magnifier, with a quoted citation bracket</title>
  <rect width="120" height="120" rx="22" fill="#0f1b2d"/>
  <g fill="#17304a" stroke="#5bb4ea" stroke-width="2">
    <rect x="16" y="30" width="40" height="52" rx="5"/>
    <rect x="24" y="22" width="40" height="52" rx="5" fill="#1d3c5c"/>
    <rect x="32" y="14" width="40" height="52" rx="5" fill="#22496f"/>
  </g>
  <g stroke="#c9d3dd" stroke-width="2.4" stroke-linecap="round">
    <path d="M40,28 h24"/><path d="M40,36 h24"/><path d="M40,44 h16"/>
  </g>
  <circle cx="78" cy="70" r="17" fill="none" stroke="#5be0cf" stroke-width="6"/>
  <path d="M90,83 L106,100" stroke="#5be0cf" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="800" fill="#ff8ac4" text-anchor="middle">
    <text x="78" y="77" font-size="20">[1]</text>
  </g>
<g class="shine-g" clip-path="url(#tile-clip)"><g transform="rotate(20 60 60)"><rect class="shine" x="0" y="-30" width="38" height="180" fill="url(#tile-shine)"/></g></g></svg>