<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><style>@keyframes wire{0%,10.91%{transform:scaleX(0)}36.36%,72.73%,100%{transform:scaleX(1)}}@keyframes pop{0%,32.73%{opacity:0;transform:scale(.4)}50.91%,72.73%,100%{opacity:1;transform:scale(1)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}.w{transform-box:fill-box;transform-origin:left;animation:wire 5.5s ease-out both infinite alternate}.p{transform-box:fill-box;transform-origin:center;animation:pop 5.5s ease-out both infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <rect width="120" height="120" rx="22" fill="#1a2b4b"/>

