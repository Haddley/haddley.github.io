<path class="d" style="animation-delay:2.2s" pathLength="1" d="M62,92 C44,96 24,84 34,62 C37,54.5 42.2,48.2 46.3,43.8" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
