<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>An agent loop: the model reasons, picks a tool, reads the result and repeats</title><style>@keyframes fade{0%{opacity:0}15.31%,43.75%,100%{opacity:1}}
