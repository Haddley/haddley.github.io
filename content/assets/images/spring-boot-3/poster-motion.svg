<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A todo list saved into a small database: Spring Data JPA with an in-memory H2 database</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="14" y="26" width="52" height="68" rx="6" fill="#e0f2fe"/><g class="p" style="animation-delay:0.0s"><rect x="20" y="36" width="10" height="10" rx="2" fill="#38bdf8"/><rect x="34" y="39" width="26" height="4" rx="2" fill="#0f1b2d" opacity=".7"/></g><g class="p" style="animation-delay:0.3s"><rect x="20" y="56" width="10" height="10" rx="2" fill="#38bdf8"/><rect x="34" y="59" width="26" height="4" rx="2" fill="#0f1b2d" opacity=".7"/></g><g class="p" style="animation-delay:0.6s"><rect x="20" y="76" width="10" height="10" rx="2" fill="#38bdf8"/><rect x="34" y="79" width="26" height="4" rx="2" fill="#0f1b2d" opacity=".7"/></g><path class="d" style="animation-delay:1.2s" pathLength="1" d="M70 60 H80" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="p" style="animation-delay:1.6s"><ellipse cx="94" cy="50" rx="14" ry="5" fill="#38bdf8"/><path d="M80 50 v18 a14 5 0 0 0 28 0 v-18" fill="#1e3a5a" stroke="#38bdf8" stroke-width="2"/></g></svg>