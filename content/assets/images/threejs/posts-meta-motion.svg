<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A 3D scene of floating cubes and spheres with a red and blue anaglyph effect</title><style>@keyframes fade{0%{opacity:0}17.5%,50%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}30%,50%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}17.5%,50%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 7s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 7s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 7s ease-out both infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g transform="translate(40,54) scale(1.4)"><path d="M0,-16 L16,-8 V10 L0,18 L-16,10 V-8 Z" fill="#1c2a3d" stroke="#d9483b" stroke-width="1.5"/><path d="M-16,-8 L0,0 L16,-8 M0,0 V18" stroke="#d9483b" stroke-width="1.5" fill="none"/></g></g>
<g class="p" style="animation-delay:0.4s"><g transform="translate(46,60) scale(1.4)"><path d="M0,-16 L16,-8 V10 L0,18 L-16,10 V-8 Z" fill="#1c2a3d" stroke="#7cc6f0" stroke-width="1.5"/><path d="M-16,-8 L0,0 L16,-8 M0,0 V18" stroke="#7cc6f0" stroke-width="1.5" fill="none"/></g></g>
<g class="p" style="animation-delay:1.2s"><g><circle cx="86" cy="44" r="12" fill="#d9483b"/><circle cx="90" cy="48" r="12" fill="#7cc6f0" opacity=".6"/></g></g>
<g class="p" style="animation-delay:2.0s"><g><circle cx="80" cy="86" r="7" fill="#ffb43a"/></g></g>
</svg>
