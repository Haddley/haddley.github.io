<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A fiscal year of twelve accounting periods that starts on the first of July</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
