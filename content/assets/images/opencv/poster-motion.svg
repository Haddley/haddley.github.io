<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A camera lens finding an object with a green detection box: object detection with OpenCV on a Raspberry Pi</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
.f{animation:fade 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><circle cx="60" cy="60" r="34" fill="#16263b" stroke="#7dd3fc" stroke-width="3"/><circle cx="60" cy="60" r="20" fill="#0b1626" stroke="#38bdf8" stroke-width="2"/><circle cx="52" cy="52" r="4" fill="#e0f2fe" opacity=".7"/><circle cx="64" cy="66" r="8" fill="#fbbf24"/><rect class="d" style="animation-delay:0.6s" pathLength="1" x="50" y="52" width="28" height="28" rx="2" fill="none" stroke="#22c55e" stroke-width="3"/><g class="p" style="animation-delay:1.8s"><rect x="50" y="40" width="22" height="9" rx="2" fill="#22c55e"/></g></svg>