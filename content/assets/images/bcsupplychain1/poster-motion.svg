<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A purchase order, a box and a sales order appear in a row, then a tick: supply chain scenarios for an agent</title>
<style>
.a{animation-duration:4s;animation-timing-function:ease-out;animation-fill-mode:both;animation-iteration-count:1}
.po{animation-name:in1}
.l1{animation-name:in2}
.bx{animation-name:in3}
.l2{animation-name:in4}
.so{animation-name:in5}
.tk{animation-name:pop;transform-box:fill-box;transform-origin:center}
.ck{animation-name:draw;stroke-dasharray:24;stroke-dashoffset:0}
@keyframes in1{0%,5%{opacity:0;transform:translateY(6px)}20%,100%{opacity:1;transform:none}}
@keyframes in2{0%,18%{opacity:0}30%,100%{opacity:1}}
@keyframes in3{0%,28%{opacity:0;transform:translateY(6px)}43%,100%{opacity:1;transform:none}}
@keyframes in4{0%,41%{opacity:0}53%,100%{opacity:1}}
@keyframes in5{0%,51%{opacity:0;transform:translateY(6px)}66%,100%{opacity:1;transform:none}}
@keyframes pop{0%,66%{opacity:0;transform:scale(.4)}78%{opacity:1;transform:scale(1.15)}86%,100%{opacity:1;transform:scale(1)}}
@keyframes draw{0%,76%{stroke-dashoffset:24}92%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style>
<rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="a po"><rect x="12" y="34" width="26" height="34" rx="4" fill="#e0f2fe"/><g fill="#7dd3fc"><rect x="16" y="41" width="18" height="3" rx="1.5"/><rect x="16" y="48" width="18" height="3" rx="1.5"/><rect x="16" y="55" width="11" height="3" rx="1.5"/></g></g>
<g class="a l1" stroke="#5bb4ea" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M40 51 h5"/></g>
<g class="a bx"><rect x="47" y="40" width="26" height="24" rx="3" fill="#fbbf24"/><rect x="47" y="40" width="26" height="7" fill="#f59e0b"/></g>
<g class="a l2" stroke="#5bb4ea" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M75 51 h5"/></g>
<g class="a so"><rect x="82" y="34" width="26" height="34" rx="4" fill="#e0f2fe"/><g fill="#7dd3fc"><rect x="86" y="41" width="18" height="3" rx="1.5"/><rect x="86" y="48" width="18" height="3" rx="1.5"/><rect x="86" y="55" width="11" height="3" rx="1.5"/></g></g>
<g class="a tk"><circle cx="60" cy="88" r="11" fill="#16a34a"/><path class="a ck" d="M54.5 88 l4 4.5 l7.5 -9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
