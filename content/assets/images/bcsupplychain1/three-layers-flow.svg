<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" font-family="Arial, Helvetica, sans-serif"><title>Animated diagram: a request becomes a draft made by the AI, then passes the checking screen, then a person decides, then it is posted and verified. If any rule fails there is no panel</title><style>.a{animation-duration:19.200000000000003s;animation-iteration-count:infinite;animation-timing-function:linear;opacity:0}@keyframes st{0%{opacity:0}2%{opacity:1}14.67%{opacity:1}16.67%{opacity:0}100%{opacity:0}}.a{animation-name:st}.d0{animation-delay:0.0s}.d1{animation-delay:3.2s}.d2{animation-delay:6.4s}.d3{animation-delay:9.600000000000001s}.d4{animation-delay:12.8s}.d5{animation-delay:16.0s}.flow{stroke-dasharray:7 7}.stat{display:none}@media (prefers-reduced-motion:reduce){.a{animation:none!important;opacity:1}.cap{display:none}.stat{display:block}}</style><rect width="960" height="520" rx="20" fill="#0f1b2d"/><rect x="30" y="110" width="140" height="90" rx="10" fill="#16273d" stroke="#e6eef7" stroke-width="2"/><text x="100.0" y="153.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">A request</text><text x="100.0" y="171.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">foolish or sensible</text><rect x="220" y="110" width="140" height="90" rx="10" fill="#16273d" stroke="#5bb4ea" stroke-width="2"/><text x="290.0" y="153.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">The AI</text><text x="290.0" y="171.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">prepares a draft</text><rect x="410" y="110" width="140" height="90" rx="10" fill="#16273d" stroke="#fbbf24" stroke-width="2"/><text x="480.0" y="153.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">The checking screen</text><text x="480.0" y="171.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">checks every rule</text><rect x="600" y="110" width="140" height="90" rx="10" fill="#16273d" stroke="#fbbf24" stroke-width="2"/><text x="670.0" y="153.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">A person</text><text x="670.0" y="171.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">Approval panel</text><rect x="790" y="110" width="140" height="90" rx="10" fill="#16273d" stroke="#4ade80" stroke-width="2"/><text x="860.0" y="153.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">Posted</text><text x="860.0" y="171.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">then verified</text><line x1="170" y1="155" x2="220" y2="155" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="360" y1="155" x2="410" y2="155" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="550" y1="155" x2="600" y2="155" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="740" y1="155" x2="790" y2="155" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><line x1="480" y1="200" x2="480" y2="262" stroke="#2a3f58" stroke-width="3" stroke-linecap="round"/><rect x="410" y="262" width="140" height="70" rx="10" fill="#16273d" stroke="#f87171" stroke-width="2"/><text x="480.0" y="295.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6eef7">No panel</text><text x="480.0" y="313.0" text-anchor="middle" font-size="11.5" fill="#9db0c3">stays a draft</text><g class="a d0"><rect x="22" y="102" width="156" height="106" rx="14" fill="none" stroke="#e6eef7" stroke-width="3"/></g><g class="a d0"><circle cx="30" cy="100" r="13" fill="#fbbf24"/><text x="30" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">1</text></g><line class="a d1 flow" x1="170" y1="155" x2="220" y2="155" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d1"><circle cx="195" cy="130" r="13" fill="#fbbf24"/><text x="195" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">2</text></g><line class="a d2 flow" x1="360" y1="155" x2="410" y2="155" stroke="#5bb4ea" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d2"><circle cx="385" cy="130" r="13" fill="#fbbf24"/><text x="385" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">3</text></g><line class="a d3 flow" x1="480" y1="200" x2="480" y2="262" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d3"><circle cx="510" cy="230" r="13" fill="#fbbf24"/><text x="510" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">4</text></g><line class="a d4 flow" x1="550" y1="155" x2="600" y2="155" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d4"><circle cx="575" cy="130" r="13" fill="#fbbf24"/><text x="575" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">5</text></g><line class="a d5 flow" x1="740" y1="155" x2="790" y2="155" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"/></line><g class="a d5"><circle cx="765" cy="130" r="13" fill="#fbbf24"/><text x="765" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">6</text></g><g class="cap a d0"><text x="480" y="425" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">1. A request arrives</text><text x="480" y="451" text-anchor="middle" font-size="14" fill="#9db0c3">Sensible, vague or foolish. It does not matter yet.</text></g><g class="cap a d1"><text x="480" y="425" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">2. The AI prepares a draft</text><text x="480" y="451" text-anchor="middle" font-size="14" fill="#9db0c3">It looks things up and asks only what it cannot find. It cannot post.</text></g><g class="cap a d2"><text x="480" y="425" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">3. The checking screen runs every rule</text><text x="480" y="451" text-anchor="middle" font-size="14" fill="#9db0c3">Order value, price, stock, credit, dates, daily totals. In code.</text></g><g class="cap a d3"><text x="480" y="425" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">4. If a rule fails: no panel</text><text x="480" y="451" text-anchor="middle" font-size="14" fill="#9db0c3">Nothing happens. The order stays a draft.</text></g><g class="cap a d4"><text x="480" y="425" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">5. If every rule passes: a person decides</text><text x="480" y="451" text-anchor="middle" font-size="14" fill="#9db0c3">They choose Allow once in the panel.</text></g><g class="cap a d5"><text x="480" y="425" text-anchor="middle" font-size="19" font-weight="700" fill="#e6eef7">6. The order is posted, then checked</text><text x="480" y="451" text-anchor="middle" font-size="14" fill="#9db0c3">Stock and balance are compared with Business Central itself.</text></g><g class="stat"><text x="40" y="380" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">1. A request arrives</tspan><tspan fill="#9db0c3"> Sensible, vague or foolish. It does not matter yet.</tspan></text><text x="40" y="397" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">2. The AI prepares a draft</tspan><tspan fill="#9db0c3"> It looks things up and asks only what it cannot find. It cannot post.</tspan></text><text x="40" y="414" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">3. The checking screen runs every rule</tspan><tspan fill="#9db0c3"> Order value, price, stock, credit, dates, daily totals. In code.</tspan></text><text x="40" y="431" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">4. If a rule fails: no panel</tspan><tspan fill="#9db0c3"> Nothing happens. The order stays a draft.</tspan></text><text x="40" y="448" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">5. If every rule passes: a person decides</tspan><tspan fill="#9db0c3"> They choose Allow once in the panel.</tspan></text><text x="40" y="465" font-size="12.5" fill="#e6eef7"><tspan font-weight="700">6. The order is posted, then checked</tspan><tspan fill="#9db0c3"> Stock and balance are compared with Business Central itself.</tspan></text></g></svg>