<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A stored procedure that shuffles a table of playing cards</title><style>@keyframes fade{0%{opacity:0}16.12%,46.05%,100%{opacity:1}}
