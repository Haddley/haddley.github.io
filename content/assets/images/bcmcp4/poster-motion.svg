<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>Steps are ticked one by one, then the five-day badge appears</title><style>.a{animation-duration:4.5s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:ease-in-out;transform-box:fill-box;transform-origin:center}.t0{animation-name:t0}@keyframes t0{0%,5%{stroke-dashoffset:14}25%,100%{stroke-dashoffset:0}}.t1{animation-name:t1}@keyframes t1{0%,23%{stroke-dashoffset:14}43%,100%{stroke-dashoffset:0}}.t2{animation-name:t2}@keyframes t2{0%,41%{stroke-dashoffset:14}61%,100%{stroke-dashoffset:0}}.bd{animation-name:bd}@keyframes bd{0%,65%{opacity:0;transform:scale(.3)}90%,100%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/><rect x="26" y="18" width="58" height="82" rx="6" fill="#e0f2fe"/><g stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path class="a t0" stroke-dasharray="14" d="M34 36 l4 4 l8 -8"/><path class="a t1" stroke-dasharray="14" d="M34 56 l4 4 l8 -8"/><path class="a t2" stroke-dasharray="14" d="M34 76 l4 4 l8 -8"/></g><g fill="#0f1b2d"><rect x="54" y="34" width="22" height="4" rx="2"/><rect x="54" y="54" width="22" height="4" rx="2"/><rect x="54" y="74" width="22" height="4" rx="2"/></g><g class="a bd"><circle cx="88" cy="88" r="16" fill="#fbbf24"/><text x="88" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#0f1b2d">5</text></g></svg>