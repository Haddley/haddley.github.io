<g class="p" style="animation-delay:2.5s"><g><circle cx="100" cy="28" r="7" fill="#1c2a3d" stroke="#ffb43a" stroke-width="2"/><circle cx="100" cy="28" r="2.4499999999999997" fill="#ffb43a"/><path d="M100,18 V22 M100,34 V38 M90,28 H94 M106,28 H110" stroke="#ffb43a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
