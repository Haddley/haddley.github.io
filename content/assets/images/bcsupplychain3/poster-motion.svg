<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A short prompt appears, then a follow-up question, then a draft order and a tick</title>
<style>.a{animation-duration:6s;animation-timing-function:ease-out;animation-fill-mode:both;animation-iteration-count:infinite}
.p{animation-name:p}.q{animation-name:q}.d{animation-name:d}.t{animation-name:t;transform-box:fill-box;transform-origin:center}
@keyframes p{0%{opacity:0;transform:translateX(-8px)}3.3%{opacity:0;transform:translateX(-8px)}14.7%{opacity:1;transform:none}92%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-8px)}}
@keyframes q{0%{opacity:0;transform:translateX(8px)}18.7%{opacity:0;transform:translateX(8px)}30.7%{opacity:1;transform:none}92%{opacity:1;transform:none}100%{opacity:0;transform:translateX(8px)}}
@keyframes d{0%{opacity:0;transform:translateY(6px)}34.7%{opacity:0;transform:translateY(6px)}46.7%{opacity:1;transform:none}92%{opacity:1;transform:none}100%{opacity:0;transform:translateY(6px)}}
@keyframes t{0%{opacity:0;transform:scale(.4)}48%{opacity:0;transform:scale(.4)}56%{opacity:1;transform:scale(1.15)}61.3%{opacity:1;transform:scale(1)}92%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}</style>
<rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="a p"><rect x="14" y="22" width="52" height="24" rx="8" fill="#e0f2fe"/><rect x="22" y="31" width="30" height="4" rx="2" fill="#7dd3fc"/></g>
<g class="a q"><rect x="54" y="52" width="52" height="24" rx="8" fill="#fbbf24"/><text x="80" y="69" font-size="16" font-weight="700" text-anchor="middle" fill="#0f1b2d" font-family="system-ui,sans-serif">?</text></g>
<g class="a d"><rect x="14" y="82" width="52" height="20" rx="4" fill="#e0f2fe"/><g fill="#7dd3fc"><rect x="20" y="88" width="34" height="3" rx="1.5"/><rect x="20" y="95" width="22" height="3" rx="1.5"/></g></g>
<g class="a t"><circle cx="92" cy="92" r="11" fill="#16a34a"/><path d="M86.5 92 l4 4.5 l7.5 -9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
