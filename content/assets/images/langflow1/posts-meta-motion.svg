<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A visual flow of connected nodes that ends in a spoken answer</title><style>@keyframes fade{0%{opacity:0}15.31%,43.75%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}26.25%,43.75%,100%{stroke-dashoffset:0}}
