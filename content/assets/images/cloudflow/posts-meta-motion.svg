<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A chat topic that calls a cloud flow to list Business Central customers</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="6" y="30" width="32" height="20" rx="6" fill="#5bb4ea"/><path d="M14,49 l-6,8 l10,-2 z" fill="#5bb4ea"/></g></g>
<path class="d" style="animation-delay:0.4s" pathLength="1" d="M12,40 H32" stroke="#0f1b2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="d" style="animation-delay:1.0s" pathLength="1" d="M40,40 H52 M48,36.5 L52,40 L48,43.5" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:1.5s"><g><circle cx="62" cy="40" r="10" fill="#ffb43a"/><path d="M64,33 L58,41 H63 L60,48 L67,39 H62" stroke="#0f1b2d" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<path class="d" style="animation-delay:2.2s" pathLength="1" d="M74,40 H86 M82,36.5 L86,40 L82,43.5" stroke="#ffb43a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.7s"><g><rect x="88" y="22" width="26" height="36" rx="5" fill="#1c2a3d" stroke="#5bb4ea" stroke-width="1.5"/><text x="101.0" y="44.0" text-anchor="middle" font-size="11" fill="#7cc6f0" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">BC</text></g></g>
<path class="d" style="animation-delay:3.1s" pathLength="1" d="M20,84 H100 M20,96 H84" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
