<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A brief builder that gathers cited research into a legal brief</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="6" y="24" width="26" height="32" rx="3" fill="#c9d3dd"/><rect x="10" y="28" width="18" height="7" rx="2" fill="#5bb4ea"/><path d="M10,38.4 H28 M10,43.2 H28 M10,48.0 H22.900000000000002" stroke="#0f1b2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:0.4s"><g><rect x="6" y="60" width="26" height="32" rx="3" fill="#c9d3dd"/><rect x="10" y="64" width="18" height="7" rx="2" fill="#ffb43a"/><path d="M10,74.4 H28 M10,79.2 H28 M10,84.0 H22.900000000000002" stroke="#0f1b2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<path class="d" style="animation-delay:1.2s" pathLength="1" d="M34,40 C46,40 46,60 58,60 M34,76 C46,76 46,60 58,60" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<g class="p" style="animation-delay:2.0s"><g><rect x="60" y="18" width="50" height="84" rx="5" fill="#1c2a3d" stroke="#ffb43a" stroke-width="1.5"/><path d="M68,34 H102 M68,46 H102 M68,58 H94 M68,70 H100" stroke="#c9d3dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="68" y="80" width="14" height="10" rx="2" fill="#2f9e4a"/></g></g>
</svg>
