<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>An auctioneer with a gavel and a spoken voice announcing Going, going, gone</title><style>@keyframes fade{0%{opacity:0}35%,100%{opacity:1}}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}35%,100%{opacity:1;transform:scale(1)}}
.f{animation:fade 3.5s ease-out both}
.d{stroke-dasharray:1;animation:dr 3.5s ease-out both}
.p{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="120" height="120" rx="22" fill="#0f1b2d"/>
<g class="p" style="animation-delay:0s"><g><rect x="12" y="50" width="34" height="14" rx="3" fill="#ffb43a" transform="rotate(-35 29 57)"/><path d="M26,58 L46,92" stroke="#c9d3dd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
<g class="p" style="animation-delay:0.6s"><rect x="22" y="94" width="34" height="6" rx="3" fill="#5bb4ea"/></g>
<g class="p" style="animation-delay:1.4s"><g><rect x="56" y="22" width="56" height="28" rx="6" fill="#2f9e4a"/><path d="M64,49 l-6,8 l10,-2 z" fill="#2f9e4a"/></g></g>
<g class="p" style="animation-delay:1.9s"><text x="84" y="41" text-anchor="middle" font-size="11" fill="#fff" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="600">GONE!</text></g>
<path class="d" style="animation-delay:2.5s" pathLength="1" d="M60,62 q6,6 0,12 M68,58 q10,10 0,20 M76,54 q14,14 0,28" stroke="#7cc6f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
