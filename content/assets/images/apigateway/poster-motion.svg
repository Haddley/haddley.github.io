<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>One request passing a gateway and fanning out to three microservices: an API gateway</title><style>@keyframes fade{0%{opacity:0}17.5%,50%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}17.5%,50%,100%{opacity:1;transform:scale(1)}}
