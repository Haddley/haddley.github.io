<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" aria-label="One training step, drawn like the five steps from Part 1. Steps 1 to 4 are the same as when the machine writes: letters to numbers, for 32 snippets of 128 letters; embeddings; the blocks; and chances, now a wheel for every position. Step 5 changes: instead of spinning the wheel, check the chance it gave the real next letter, the surprise score: 4.18 on average over 4,096 guesses at the first step. A new step 6 nudges every fixed number, all 826,433 of them in the token and position embeddings, every table of weights in the blocks, and lm_head, each by 0.0003 at the first step. Then repeat, 3,000 times." style="max-width:100%;height:auto"><rect width="720" height="330" fill="#fff"/><text x="40.0" y="26.0" font-size="14" fill="#111827" text-anchor="start" font-weight="600">One training step: the same five steps, with step 5 changed and a step 6 added</text><rect x="21.0" y="58" width="126" height="78" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><circle cx="84.0" cy="58" r="12" fill="#2563eb"/><text x="84.0" y="62.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="84.0" y="94.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Letters to numbers</text><text x="84.0" y="114.0" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="normal">32 snippets × 128</text><path d="M149.0 97 l6 0" stroke="#6b7280" stroke-width="2"/><path d="M159.0 97 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="159.0" y="58" width="126" height="78" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/><circle cx="222.0" cy="58" r="12" fill="#7c3aed"/><text x="222.0" y="62.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="222.0" y="94.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Embeddings</text><text x="222.0" y="114.0" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="normal">letter + position</text><path d="M287.0 97 l6 0" stroke="#6b7280" stroke-width="2"/><path d="M297.0 97 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="297.0" y="58" width="126" height="78" rx="12" fill="#fff" stroke="#d97706" stroke-width="2.5"/><circle cx="360.0" cy="58" r="12" fill="#d97706"/><text x="360.0" y="62.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="360.0" y="94.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">The blocks</text><text x="360.0" y="114.0" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="normal">attention, MLP × 4</text><path d="M425.0 97 l6 0" stroke="#6b7280" stroke-width="2"/><path d="M435.0 97 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="435.0" y="58" width="126" height="78" rx="12" fill="#fff" stroke="#059669" stroke-width="2.5"/><circle cx="498.0" cy="58" r="12" fill="#059669"/><text x="498.0" y="62.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="498.0" y="94.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Chances</text><text x="498.0" y="114.0" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="normal">a wheel per position</text><path d="M563.0 97 l6 0" stroke="#6b7280" stroke-width="2"/><path d="M573.0 97 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="573.0" y="58" width="126" height="78" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/><circle cx="636.0" cy="58" r="12" fill="#dc2626"/><text x="636.0" y="62.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="636.0" y="94.0" font-size="12" fill="#111827" text-anchor="middle" font-weight="700">Check the answer</text><text x="636.0" y="114.0" font-size="10.5" fill="#9ca3af" text-anchor="middle" font-weight="normal">surprise score</text><text x="636.0" y="156.0" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="600">4,096 guesses,</text><text x="636.0" y="170.0" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="normal">averaging 4.18</text><path d="M636.0 178 L636.0 218" stroke="#6b7280" stroke-width="2"/><path d="M636.0 222 l-4.5 -7 l9 0 Z" fill="#6b7280"/><rect x="21.0" y="222" width="678.0" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><circle cx="360.0" cy="222" r="12" fill="#16a34a"/><text x="360.0" y="226.5" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="360.0" y="252.0" font-size="12.5" fill="#111827" text-anchor="middle" font-weight="700">Nudge every fixed number, so the surprise would be a little smaller</text><text x="360.0" y="271.0" font-size="11" fill="#166534" text-anchor="middle" font-weight="normal">all 826,433 of them; at step 0, each one moved by 0.0003</text><path d="M222.0 220 L222.0 142" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/><path d="M222.0 138 l-4.5 7 l9 0 Z" fill="#16a34a"/><rect x="160.0" y="159" width="124" height="18" rx="9" fill="#fff"/><text x="222.0" y="172.0" font-size="10.5" fill="#166534" text-anchor="middle" font-weight="600">embeddings</text><path d="M360.0 220 L360.0 142" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/><path d="M360.0 138 l-4.5 7 l9 0 Z" fill="#16a34a"/><rect x="298.0" y="159" width="124" height="18" rx="9" fill="#fff"/><text x="360.0" y="172.0" font-size="10.5" fill="#166534" text-anchor="middle" font-weight="600">all the weights</text><path d="M498.0 220 L498.0 142" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/><path d="M498.0 138 l-4.5 7 l9 0 Z" fill="#16a34a"/><rect x="436.0" y="159" width="124" height="18" rx="9" fill="#fff"/><text x="498.0" y="172.0" font-size="10.5" fill="#166534" text-anchor="middle" font-weight="600">lm_head&#x27;s rows</text><text x="360.0" y="320.0" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="normal">Then repeat with 32 new snippets: 3,000 times in all.</text></svg>
