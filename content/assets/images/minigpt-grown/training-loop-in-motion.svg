<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="One training step, going round. Steps 1 to 4 are the same as when the machine writes: letters to numbers for 32 snippets of 128 letters, embeddings, the four blocks, and a wheel of chances for every position. Step 5 checks the chance given to the real next letter, the surprise score, 4.18 on average over 4,096 guesses at the first step, instead of spinning. Step 6 nudges all 826,433 fixed numbers, each by about 0.0003 at the first step. Then it repeats, 3,000 times."><rect width="720" height="400" fill="#fff"/><style>@media (prefers-reduced-motion: reduce){.a{animation:none!important}}.a{transform-box:fill-box}@keyframes k0{0%,3.33%{opacity:0}4.13%,15.00%{opacity:1}15.80%,100%{opacity:0}}.k0{animation:k0 12s ease-in-out infinite}@keyframes k1{0%,15.83%{opacity:0}16.63%,27.50%{opacity:1}28.30%,100%{opacity:0}}.k1{animation:k1 12s ease-in-out infinite}@keyframes k2{0%,28.33%{opacity:0}29.13%,40.00%{opacity:1}40.80%,100%{opacity:0}}.k2{animation:k2 12s ease-in-out infinite}@keyframes k3{0%,40.83%{opacity:0}41.63%,52.50%{opacity:1}53.30%,100%{opacity:0}}.k3{animation:k3 12s ease-in-out infinite}@keyframes k4{0%,53.33%{opacity:0}54.13%,65.00%{opacity:1}65.80%,100%{opacity:0}}.k4{animation:k4 12s ease-in-out infinite}@keyframes k5{0%,65.83%{opacity:0}66.63%,77.50%{opacity:1}78.30%,100%{opacity:0}}.k5{animation:k5 12s ease-in-out infinite}</style><text x="24" y="30" font-size="16" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >One training step, going round</text><text x="24" y="50" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Steps 1 to 4 are the machine writing; step 5 checks, and step 6 is new</text><rect x="30" y="88" width="200" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><rect class="a k0" opacity="0" x="30" y="88" width="200" height="98" rx="12" fill="none" stroke="#2563eb" stroke-width="6"/><circle cx="52" cy="114" r="13" fill="#2563eb"/><text x="52" y="119" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >1</text><text x="74" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Letters to numbers</text><text x="48" y="146" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >32 snippets</text><text x="48" y="164" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >of 128 letters each</text><rect x="260" y="88" width="200" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><rect class="a k1" opacity="0" x="260" y="88" width="200" height="98" rx="12" fill="none" stroke="#2563eb" stroke-width="6"/><circle cx="282" cy="114" r="13" fill="#2563eb"/><text x="282" y="119" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >2</text><text x="304" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Embeddings</text><text x="278" y="146" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >a vector for every</text><text x="278" y="164" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >letter and position</text><rect x="490" y="88" width="200" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><rect class="a k2" opacity="0" x="490" y="88" width="200" height="98" rx="12" fill="none" stroke="#2563eb" stroke-width="6"/><circle cx="512" cy="114" r="13" fill="#2563eb"/><text x="512" y="119" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >3</text><text x="534" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >The four blocks</text><text x="508" y="146" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >attention, then an MLP,</text><text x="508" y="164" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >four times over</text><rect x="490" y="232" width="200" height="98" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" /><rect class="a k3" opacity="0" x="490" y="232" width="200" height="98" rx="12" fill="none" stroke="#2563eb" stroke-width="6"/><circle cx="512" cy="258" r="13" fill="#2563eb"/><text x="512" y="263" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >4</text><text x="534" y="263" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Chances</text><text x="508" y="290" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >a wheel for every</text><text x="508" y="308" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >position</text><rect x="260" y="232" width="200" height="98" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" /><rect class="a k4" opacity="0" x="260" y="232" width="200" height="98" rx="12" fill="none" stroke="#d97706" stroke-width="6"/><circle cx="282" cy="258" r="13" fill="#d97706"/><text x="282" y="263" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >5</text><text x="304" y="263" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Check, do not spin</text><text x="278" y="290" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >surprise score: 4.18 on average</text><text x="278" y="308" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >over 4,096 guesses at step 1</text><rect x="30" y="232" width="200" height="98" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" /><rect class="a k5" opacity="0" x="30" y="232" width="200" height="98" rx="12" fill="none" stroke="#7c3aed" stroke-width="6"/><circle cx="52" cy="258" r="13" fill="#7c3aed"/><text x="52" y="263" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >6</text><text x="74" y="263" font-size="14" font-weight="700" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Nudge</text><text x="48" y="290" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >all 826,433 numbers move,</text><text x="48" y="308" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >about 0.0003 each at step 1</text><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><path d="M232 137 H256" stroke="#9ca3af" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M462 137 H486" stroke="#9ca3af" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M590.0 188 V228" stroke="#9ca3af" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M488 281 H464" stroke="#9ca3af" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M258 281 H234" stroke="#9ca3af" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M28 281 H12 V137 H26" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="34" y="372" font-size="13" font-weight="600" fill="#111827" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Then back to step 1 with the next 32 snippets: 3,000 steps in all.</text><text x="34" y="392" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" >Blue: the same as when the machine writes.  Amber: it checks the real answer instead of spinning.  Purple: new.</text></svg>