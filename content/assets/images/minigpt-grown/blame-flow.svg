<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto" aria-label="The trip forward and the trip back for the guess after good m, where the real next letter is y. Forward, left to right: token embeddings, four blocks, the final normalisation, the final hidden state, the rows of lm_head, the wheel, which gives y 40.81 percent, and the surprise score, 0.896. Back, right to left, the blame lights up one stop at a time: y's score gets a blame of minus 0.592, the y row's first number plus 0.640, the hidden state's first number minus 0.014; then the blame passes back through the final normalisation and through every addition in the four blocks, and reaches the token embeddings last."><rect width="720" height="330" fill="#fff"/><style>.b0{opacity:0;animation:bk0 13.0s infinite}@keyframes bk0{0%{opacity:0}0.0%{opacity:0}5.0%{opacity:1}88.0%{opacity:1}93.0%{opacity:0}100%{opacity:0}}.b1{opacity:0;animation:bk1 13.0s infinite}@keyframes bk1{0%{opacity:0}10.8%{opacity:0}15.8%{opacity:1}88.0%{opacity:1}93.0%{opacity:0}100%{opacity:0}}.b2{opacity:0;animation:bk2 13.0s infinite}@keyframes bk2{0%{opacity:0}21.5%{opacity:0}26.5%{opacity:1}88.0%{opacity:1}93.0%{opacity:0}100%{opacity:0}}.b3{opacity:0;animation:bk3 13.0s infinite}@keyframes bk3{0%{opacity:0}32.3%{opacity:0}37.3%{opacity:1}88.0%{opacity:1}93.0%{opacity:0}100%{opacity:0}}.b4{opacity:0;animation:bk4 13.0s infinite}@keyframes bk4{0%{opacity:0}43.1%{opacity:0}48.1%{opacity:1}88.0%{opacity:1}93.0%{opacity:0}100%{opacity:0}}.b5{opacity:0;animation:bk5 13.0s infinite}@keyframes bk5{0%{opacity:0}53.8%{opacity:0}58.8%{opacity:1}88.0%{opacity:1}93.0%{opacity:0}100%{opacity:0}}.b6{opacity:0;animation:bk6 13.0s infinite}@keyframes bk6{0%{opacity:0}64.6%{opacity:0}69.6%{opacity:1}88.0%{opacity:1}93.0%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){.b0{animation:none;opacity:1}.b1{animation: