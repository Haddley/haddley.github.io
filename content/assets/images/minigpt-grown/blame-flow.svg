t x="318" y="100" width="88" height="58" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="362.0" y="124.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">hidden state</text><text x="362.0" y="142.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">first: −1.081</text><path d="M407 129 l5 0" stroke="#6b7280" stroke-width="1.8"/><path d="M416 129 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="416" y="100" width="88" height="58" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="460.0" y="124.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">lm_head rows</text><text x="460.0" y="142.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">y row: −0.046</text><path d="M505 129 l5 0" stroke="#6b7280" stroke-width="1.8"/><path d="M514 129 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="514" y="100" width="88" height="58" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="558.0" y="124.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">wheel</text><text x="558.0" y="142.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">y: 40.81%</text><path d="M603 129 l5 0" stroke="#6b7280" stroke-width="1.8"/><path d="M612 129 l-5 -4 l0 8 Z" fill="#6b7280"/><rect x="612" y="100" width="88" height="58" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="656.0" y="124.0" font-size="11" fill="#111827" text-anchor="middle" font-weight="700">surprise</text><text x="656.0" y="142.0" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">0.896</text><text x="24.0" y="200.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600">back: one trip gives every number its slope</text><g class="b0"><rect x="612" y="96" width="88" height="66" rx="11" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect x="612" y="214" width="88" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="656.0" y="235.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">start</text><text x="656.0" y="250.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">here</text><path d="M611 239 l-5 0" stroke="#dc2626" stroke-width="1.8"/><path d="M602 239 l5 -4 l0 8 Z" fill="#dc2626"/></g><g class="b1"><rect x="514" y="96" width="88" height="66" rx="11" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect x="514" y="214" width="88" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="558.0" y="235.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">y's score:</text><text x="558.0" y="250.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">−0.592</text><path d="M513 239 l-5 0" stroke="#dc2626" stroke-width="1.8"/><path d="M504 239 l5 -4 l0 8 Z" fill="#dc2626"/></g><g class="b2"><rect x="416" y="96" width="88" height="66" rx="11" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect x="416" y="214" width="88" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="460.0" y="235.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">y row, first</text><text x="460.0" y="250.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">number: +0.640</text><path d="M415 239 l-5 0" stroke="#dc2626" stroke-width="1.8"/><path d="M406 239 l5 -4 l0 8 Z" fill="#dc2626"/></g><g class="b3"><rect x="318" y="96" width="88" height="66" rx="11" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect x="318" y="214" width="88" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="362.0" y="235.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">first number:</text><text x="362.0" y="250.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">−0.014</text><path d="M317 239 l-5 0" stroke="#dc2626" stroke-width="1.8"/><path d="M308 239 l5 -4 l0 8 Z" fill="#dc2626"/></g><g class="b4"><rect x="220" y="96" width="88" height="66" rx="11" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect x="220" y="214" width="88" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="264.0" y="235.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">passes</text><text x="264.0" y="250.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">back</text><path d="M219 239 l-5 0" stroke="#dc2626" stroke-width="1.8"/><path d="M210 239 l5 -4 l0 8 Z" fill="#dc2626"/></g><g class="b5"><rect x="122" y="96" width="88" height="66" rx="11" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect x="122" y="214" width="88" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="166.0" y="235.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">through each +</text><text x="166.0" y="250.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">unchanged</text><path d="M121 239 l-5 0" stroke="#dc2626" stroke-width="1.8"/><path d="M112 239 l5 -4 l0 8 Z" fill="#dc2626"/></g><g class="b6"><rect x="24" y="96" width="88" height="66" rx="11" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect x="24" y="214" width="88" height="50" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="68.0" y="235.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">nudged</text><text x="68.0" y="250.0" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="600">last</text></g><text x="24.0" y="300.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">Each stop uses one simple rule: for multiplying, the blame is scaled by the other number; for adding, it passes on unchanged.</text><text x="24.0" y="318.0" font-size="11" fill="#111827" text-anchor="start" font-weight="normal">Then step 6 turns every number a little against its slope: the y row's first number goes down, towards the hidden state.</text></svg>
