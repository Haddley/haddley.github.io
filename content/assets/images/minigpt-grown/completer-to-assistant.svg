<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="Four stages from a document completer to an assistant. Stage 1, pre-training: the guessing game on a huge pile of text, almost all computer effort. Stage 2, example conversations: people write model replies and the machine learns to copy them; another model can write them instead, which is distillation. Stage 3, a judge: people compare pairs of answers, and a second model learns to predict which they prefer. Stage 4, practice with the judge: the chatbot writes answers, the judge scores them, and the dials are nudged towards higher scores, with no people needed at this stage." font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:100%;height:auto"><rect width="720" height="470" fill="#ffffff"/><text x="40" y="30" font-size="16" fill="#111827" text-anchor="start" font-weight="600">From document completer to assistant</text><text x="40" y="50" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">MiniGPT only does stage 1. The bars are a rough picture of who does the work at each stage.</text><rect x="40" y="76" width="150" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="115.0" y="102" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">1. Pre-training</text><text x="115.0" y="128" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">the guessing game on a</text><text x="115.0" y="146" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">huge pile of text</text><text x="115.0" y="164" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">→ a document completer</text><path d="M193 136 l12 0" stroke="#6b7280" stroke-width="2"/><path d="M205 131 l5 5 l-5 5" fill="none" stroke="#6b7280" stroke-width="2"/><text x="40" y="226" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">computers</text><rect x="40" y="232" width="150" height="12" rx="3" fill="#e5e7eb"/><rect x="40" y="232" width="142" height="12" rx="3" fill="#2563eb"/><text x="40" y="264" font-size="11" fill="#d97706" text-anchor="start" font-weight="600">people</text><rect x="40" y="270" width="150" height="12" rx="3" fill="#e5e7eb"/><rect x="40" y="270" width="4" height="12" rx="3" fill="#d97706"/><rect x="210" y="76" width="150" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="285.0" y="102" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">2. Example chats</text><text x="285.0" y="128" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">people write good replies,</text><text x="285.0" y="146" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">the machine copies them</text><text x="285.0" y="164" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">→ follows instructions</text><path d="M363 136 l12 0" stroke="#6b7280" stroke-width="2"/><path d="M375 131 l5 5 l-5 5" fill="none" stroke="#6b7280" stroke-width="2"/><text x="210" y="226" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">computers</text><rect x="210" y="232" width="150" height="12" rx="3" fill="#e5e7eb"/><rect x="210" y="232" width="22" height="12" rx="3" fill="#2563eb"/><text x="210" y="264" font-size="11" fill="#d97706" text-anchor="start" font-weight="600">people</text><rect x="210" y="270" width="150" height="12" rx="3" fill="#e5e7eb"/><rect x="210" y="270" width="105" height="12" rx="3" fill="#d97706"/><rect x="210" y="296" width="150" height="58" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="4 3"/><text x="285.0" y="314" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Shortcut: distillation</text><text x="285.0" y="330" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="normal">an existing model writes</text><text x="285.0" y="344" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="normal">the replies instead</text><rect x="380" y="76" width="150" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="455.0" y="102" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">3. Train a judge</text><text x="455.0" y="128" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">people compare answers;</text><text x="455.0" y="146" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">a judge model learns</text><text x="455.0" y="164" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">what they prefer</text><path d="M533 136 l12 0" stroke="#6b7280" stroke-width="2"/><path d="M545 131 l5 5 l-5 5" fill="none" stroke="#6b7280" stroke-width="2"/><text x="380" y="226" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">computers</text><rect x="380" y="232" width="150" height="12" rx="3" fill="#e5e7eb"/><rect x="380" y="232" width="22" height="12" rx="3" fill="#2563eb"/><text x="380" y="264" font-size="11" fill="#d97706" text-anchor="start" font-weight="600">people</text><rect x="380" y="270" width="150" height="12" rx="3" fill="#e5e7eb"/><rect x="380" y="270" width="68" height="12" rx="3" fill="#d97706"/><rect x="380" y="296" width="150" height="58" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="4 3"/><text x="455.0" y="314" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Shortcut: AI feedback</text><text x="455.0" y="330" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="normal">another model does some</text><text x="455.0" y="344" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="normal">of the comparing</text><rect x="550" y="76" width="150" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db"/><text x="625.0" y="102" font-size="13" fill="#111827" text-anchor="middle" font-weight="700">4. Practise</text><text x="625.0" y="128" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">the chatbot answers,</text><text x="625.0" y="146" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">the judge scores it</text><text x="625.0" y="164" font-size="11" fill="#374151" text-anchor="middle" font-weight="normal">→ an assistant</text><text x="550" y="226" font-size="11" fill="#2563eb" text-anchor="start" font-weight="600">computers</text><rect x="550" y="232" width="150" height="12" rx="3" fill="#e5e7eb"/><rect x="550" y="232" width="68" height="12" rx="3" fill="#2563eb"/><text x="550" y="264" font-size="11" fill="#d97706" text-anchor="start" font-weight="600">people</text><rect x="550" y="270" width="150" height="12" rx="3" fill="#e5e7eb"/><text x="625.0" y="280" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal">none: the judge stands in</text><text x="40" y="410" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">Stage 1 is expensive for computers but needs almost no people: the text marks its own homework.</text><text x="40" y="430" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">Stages 2 and 3 need people for every example. The judge in stage 3 is how that human effort gets stretched:</text><text x="40" y="450" font-size="12" fill="#374151" text-anchor="start" font-weight="normal">people compare thousands of answers, and the judge then scores millions.</text></svg>
