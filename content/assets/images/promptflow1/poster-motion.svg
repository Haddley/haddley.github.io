<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img"><title>A flow of three connected nodes inside an editor window: setting up Prompt Flow in VS Code</title><style>@keyframes fade{0%{opacity:0}21.12%,60.34%,100%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}21.12%,60.34%,100%{opacity:1;transform:scale(1)}}
@keyframes dr{0%{stroke-dashoffset:1}36.21%,60.34%,100%{stroke-dashoffset:0}}
@keyframes gy{0%{transform:scaleY(0)}27.16%,60.34%,100%{transform:scaleY(1)}}
.f{animation:fade 5.8s ease-out both infinite alternate}
.p{transform-box:fill-box;transform-origin:center;animation:pop 5.8s ease-out both infinite alternate}
.d{stroke-dasharray:1;animation:dr 5.8s ease-out both infinite alternate}
.g{transform-box:fill-box;transform-origin:bottom;animation:gy 5.8s ease-out both infinite alternate}
