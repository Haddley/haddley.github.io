<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      background: #000;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <script type="module">
    import { GameEngine } from './src/engine.js';
    const canvas = document.getElementById('game');
    const engine = new GameEngine(canvas);
    engine.startLoop();
    window.__engine = engine; // test hook for headless verification
  </script>
</body>
</html>
